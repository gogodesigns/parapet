  {"t":"A charm on everyone under seventeen. While Harry has it, any magic near him would bring the Ministry, and the Ministry is no longer safe.","at":"dh4","v":1},
  {"t":"It breaks on his birthday.","at":"dh7","v":1}]},
 {"id":"beaded_bag","kind":"magic","name":"Hermione's beaded bag","appear":"dh8","tag":[{"t":"Bigger inside","at":"dh8"}],"rel":["hermione","phineas"],"group":"object","sub":"Enchanted bag","holders":[{"id":"hermione","at":"dh8"}],"facts":[
  {"t":"A tiny evening bag she will not let out of her sight at the wedding.","at":"dh8","v":1},
  {"t":"It has an Undetectable Extension Charm on it, and holds clothes, books, a tent, the Cloak, potions and, soon, a portrait. She has been packed for weeks.","at":"dh9","v":1}]},
 {"id":"potterwatch","kind":"magic","name":"Potterwatch","appear":"dh22","tag":[{"t":"The news the Prophet will not print","at":"dh22"}],"rel":["lee","kingsley","lupin","fred","order"],"group":"object","sub":"Radio program","facts":[
  {"t":"A secret wireless broadcast that needs a password to tune in. Lee Jordan hosts, with Kingsley, Lupin and Fred as guests under code names.","at":"dh22","v":1},
  {"t":"It reads out the names of the dead, and tells listeners to protect their Muggle neighbors.","at":"dh22","v":1}]},
 {"id":"dumbledores","kind":"group","name":"The Dumbledores","appear":"dh2","tag":[{"t":"Albus's family","at":"dh2"}],"rel":["dumbledore","aberforth","ariana","kendra","godrics","bathilda"],"group":"family","sub":"Family","holders":[{"id":"dumbledore","at":"dh2"},{"id":"aberforth","at":"dh2"},{"id":"ariana","at":"dh2"},{"id":"kendra","at":"dh2"}],"facts":[
  {"t":"The father, Percival, died in Azkaban for attacking three young Muggles. He never said why.","at":"dh2","v":1},
  {"t":"After that the mother moved the family to Godric's Hollow. Albus was the brilliant eldest, then Aberforth, then Ariana.","at":"dh2","v":1},
  {"t":"Rita Skeeter's book makes the most of every rumor.","at":"dh18","v":1},
  {"t":"Percival attacked the boys who had destroyed his daughter, and kept silent so she would not be taken away.","at":"dh28","v":1}]},
 {"id":"peverells","kind":"group","name":"The Peverells","appear":"dh16","tag":[{"t":"Three brothers, long ago","at":"dh16"}],"rel":["hallows","elder_wand","stone_res","cloak","godrics","potters","gaunts"],"relAt":{"cloak":"dh22","potters":"dh22","gaunts":"dh22"},"group":"family","sub":"Family","holders":[{"name":"Antioch Peverell","at":"dh21"},{"name":"Cadmus Peverell","at":"dh21"},{"name":"Ignotus Peverell","at":"dh21"}],"facts":[
  {"t":"Marvolo Gaunt claims their coat of arms on his ring.","at":"hb10","v":1},
  {"t":"One of them, Ignotus, is buried at Godric's Hollow under the triangular mark.","at":"dh16","v":1},
  {"t":"Antioch, Cadmus and Ignotus: thought to be the brothers of the tale, and gifted, dangerous wizards who made the Hallows themselves.","at":"dh22","v":1},
  {"t":"The Gaunts came down from the second brother, and the Potters from the third. The Cloak has passed from parent to child ever since.","at":"dh35","v":1}]},
 {"id":"snatchers","kind":"group","name":"Snatchers","appear":"dh20","tag":[{"t":"Paid by the head","at":"dh20"}],"rel":["greyback","scabior","ministry","taboo"],"group":"org","sub":"Gangs","holders":[{"id":"greyback","at":"dh23"},{"id":"scabior","at":"dh23"}],"facts":[
  {"t":"Gangs who round up Muggle-borns and blood traitors for the Ministry's gold. Some are worse than Death Eaters, and some are just stupid.","at":"dh20","v":1},
  {"t":"One gang catches the three and takes them to Malfoy Manor in the hope of a bigger reward.","at":"dh23","v":1}]},
 {"id":"commission","kind":"group","name":"Muggle-born Registration Commission","appear":"dh11","tag":[{"t":"Run by Dolores Umbridge","at":"dh11"}],"rel":["umbridge","yaxley","ministry","dementors"],"group":"org","sub":"Ministry","holders":[{"id":"umbridge","at":"dh11"},{"id":"yaxley","at":"dh13"}],"facts":[
  {"t":"Every Muggle-born must appear before it to prove where their magic came from. The official line is that they stole it.","at":"dh11","v":1},
  {"t":"It sits in the old courtrooms, with Dementors for guards.","at":"dh13","v":1}]},
 {"id":"malfoy_manor","kind":"place","name":"Malfoy Manor","appear":"dh1","tag":[{"t":"Voldemort's headquarters","at":"dh1"}],"rel":["malfoys","voldemort","bellatrix","lucius","draco"],"type":"wizard","facts":[
  {"t":"The Malfoys' house. Dark objects are kept under the drawing-room floor.","at":"cs12","v":1},
  {"t":"A handsome manor behind wrought-iron gates, with white peacocks on the hedge. Voldemort holds court at its table, and its owners look afraid.","at":"dh1","v":1},
  {"t":"Prisoners are kept in the cellar. Hermione is tortured in the drawing room, under the chandelier.","at":"dh23","v":1}]},
 {"id":"shell_cottage","kind":"place","name":"Shell Cottage","appear":"dh23","tag":[{"t":"Bill and Fleur's house","at":"dh23"}],"rel":["bill","fleur","dobby","griphook","ollivander"],"type":"wizard","facts":[
  {"t":"On the edge of a cliff by the sea. Where Dobby is told to take the prisoners.","at":"dh23","v":1},
  {"t":"Under a Fidelius Charm, with Bill as Secret-Keeper. Dobby is buried in the garden.","at":"dh24","v":1}]},
 {"id":"lovegood_house","kind":"place","name":"The Lovegoods' house","appear":"dh20","tag":[{"t":"A black tower on a hill","at":"dh20"}],"rel":["xeno","luna","burrow"],"type":"wizard","facts":[
  {"t":"Like a giant chess rook, near the Burrow. The round rooms are painted by Luna, and the printing press runs in the living room.","at":"dh20","v":1},
  {"t":"Luna has painted her friends' faces on her bedroom ceiling. Half the house is blown apart when a horn on the wall explodes.","at":"dh21","v":1}]},
 {"id":"forest_dean","kind":"place","name":"The Forest of Dean","appear":"dh19","tag":[{"t":"Where the tent is pitched at Christmas","at":"dh19"}],"rel":["sword","ron"],"type":"muggle","facts":[
  {"t":"Hermione camped here once with her parents. A silver doe walks out of its trees.","at":"dh19","v":1}]},
 {"id":"ravenclaw_tower","kind":"place","name":"Ravenclaw Tower","appear":"dh29","tag":[{"t":"Home of Ravenclaw house","at":"dh29"}],"rel":["ravenclaw","luna","diadem","rowena"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Its door has no password, only a bronze eagle knocker that asks a question. The common room is airy and domed, with a statue of the founder.","at":"dh29","v":1}]},
 {"id":"nurmengard","kind":"place","name":"Nurmengard","appear":"dh18","tag":[{"t":"Grindelwald's prison","at":"dh18"}],"rel":["grindelwald"],"type":"abroad","facts":[
  {"t":"Built by Grindelwald to hold his opponents. He ended up in its topmost cell himself.","at":"dh18","v":1},
  {"t":"Voldemort goes there.","at":"dh23","v":1}]}
];

const GLOSS=[
 {"t":"Muggle","d":[{"t":"A person with no magic. Most have no idea that wizards exist.","at":"ss1"},{"t":"Keeping it that way is the main business of the Ministry of Magic.","at":"ss5"}]},
 {"t":"You-Know-Who","d":[{"t":"What nearly everyone calls Voldemort, to avoid saying his name.","at":"ss1"},{"t":"Mr. Ollivander prefers He-Who-Must-Not-Be-Named.","at":"ss5"}]},
 {"t":"The Boy Who Lived","d":[{"t":"What the wizarding world calls Harry, after the night Voldemort could not kill him.","at":"ss1"}]},
 {"t":"Grunnings","d":[{"t":"The firm Mr. Dursley runs. It makes drills.","at":"ss1"}]},
 {"t":"Harry's letters","d":[{"t":"Written in green ink on heavy parchment, with a wax seal, and addressed down to the room he sleeps in.","at":"ss3"},{"t":"From Hogwarts. They offer a place at the school and list the books and equipment to buy. Term starts on the first of September.","at":"ss4"}]},
 {"t":"Harry Hunting","d":[{"t":"The favorite sport of Dudley and his gang.","at":"ss3"}]},
 {"t":"Witch and wizard","d":[{"t":"People born able to do magic. It can turn up in families that have never had any.","at":"ss4"}]},
 {"t":"The Dark side","d":[{"t":"Voldemort's side in the years he was gathering power.","at":"ss4"}]},
 {"t":"Keeper of Keys and Grounds","d":[{"t":"Hagrid's job at Hogwarts.","at":"ss4"},{"t":"In practice, the gamekeeper.","at":"ss8"}]},
 {"t":"Owl post","d":[{"t":"How wizards send letters.","at":"ss4"},{"t":"At Hogwarts it arrives at breakfast.","at":"ss8"}]},
 {"t":"Wizard money","d":[{"t":"Gold Galleons, silver Sickles and bronze Knuts. Seventeen Sickles make a Galleon and twenty-nine Knuts make a Sickle.","at":"ss5"}]},
 {"t":"Daily Prophet","d":[{"t":"The wizards' newspaper, delivered by owl.","at":"ss5"},{"t":"Reports the Gringotts break-in.","at":"ss8"}]},
 {"t":"Wand","d":[{"t":"What a wizard channels magic through. Each has its own wood, length and core, and it chooses its owner.","at":"ss5"}]},
 {"t":"Broomstick","d":[{"t":"How wizards fly. First years are not allowed their own.","at":"ss5"},{"t":"The school brooms are old and have quirks.","at":"ss9"}]},
 {"t":"First year","d":[{"t":"A student in their first of seven years at Hogwarts, usually eleven years old.","at":"ss5"}]},
 {"t":"House","d":[{"t":"Every Hogwarts student belongs to one of four houses.","at":"ss5"},{"t":"Gryffindor, Hufflepuff, Ravenclaw or Slytherin. Students share lessons, a dormitory and a common room with their house, which is meant to be like a family.","at":"ss7"}]},
 {"t":"Prefect","d":[{"t":"An older student given authority over the others in their house.","at":"ss6"},{"t":"Ron and Hermione are Gryffindor's new ones.","at":"op9"}]},
 {"t":"Head Boy and Head Girl","d":[{"t":"The top students of their year. Harry's parents held the posts.","at":"ss4"},{"t":"Bill Weasley was Head Boy.","at":"ss6"}]},
 {"t":"Chocolate Frogs","d":[{"t":"Sweets that come with a collectible card of a famous witch or wizard. The picture moves, and sometimes wanders off.","at":"ss6"}]},
 {"t":"Bertie Bott's Every Flavor Beans","d":[{"t":"Sweets that really do come in every flavor, including the ones nobody would choose.","at":"ss6"},{"t":"Dumbledore tries one and gets earwax.","at":"ss17"}]},
 {"t":"Alchemy","d":[{"t":"The old science of turning metals to gold and prolonging life. Dumbledore worked on it with Nicolas Flamel.","at":"ss6"},{"t":"Its great goal is the Sorcerer's Stone.","at":"ss13"}]},
 {"t":"The Sorting","d":[{"t":"The ceremony at the start of the year in which each new student tries on the Sorting Hat and is given a house.","at":"ss7"}]},
 {"t":"House points","d":[{"t":"Awarded for doing well and taken away for breaking rules. They are counted all year.","at":"ss7"},{"t":"Kept in giant hourglasses.","at":"ss15"}]},
 {"t":"House Cup","d":[{"t":"Won at the end of the year by the house with the most points.","at":"ss7"},{"t":"Slytherin had held it six years running before Gryffindor took it.","at":"ss17"}]},
 {"t":"Password","d":[{"t":"Needed to get into a house common room.","at":"ss7"},{"t":"It changes during the year.","at":"ss10"}]},
 {"t":"Out of bounds","d":[{"t":"Where students may not go: the forest, and this year a corridor on the third floor.","at":"ss7"}]},
 {"t":"Seeker","d":[{"t":"A position on a Quidditch team, and the one Harry is given. It suits someone light and fast.","at":"ss9"},{"t":"Chases the Golden Snitch.","at":"ss10"}]},
 {"t":"Wizard's duel","d":[{"t":"A formal fight with wands only, each side bringing a second to take over if they die.","at":"ss9"}]},
 {"t":"Quaffle","d":[{"t":"The red ball the Chasers score with.","at":"ss10"}]},
 {"t":"Bludgers","d":[{"t":"Two black balls that fly about trying to knock players off their brooms.","at":"ss10"}]},
 {"t":"Golden Snitch","d":[{"t":"A tiny gold ball with silver wings. Catching it ends the match and is worth a hundred and fifty points.","at":"ss10"}]},
 {"t":"Chaser, Beater, Keeper","d":[{"t":"Three Chasers score, two Beaters fend off the Bludgers and one Keeper guards the hoops.","at":"ss10"}]},
 {"t":"Countercurse","d":[{"t":"A spell said to undo another as it is being cast.","at":"ss11"}]},
 {"t":"Restricted Section","d":[{"t":"The part of the library that needs a teacher's signed permission.","at":"ss12"}]},
 {"t":"Erised","d":[{"t":"Read it backwards.","at":"ss12"}]},
 {"t":"Norwegian Ridgeback","d":[{"t":"A rare breed of dragon. Norbert is one.","at":"ss14"}]},
 {"t":"Detention","d":[{"t":"Punishment for serious rule-breaking. It can mean a night in the forest.","at":"ss15"}]},
 {"t":"Unicorn blood","d":[{"t":"Keeps the drinker alive at a terrible cost.","at":"ss15"}]},
 {"t":"End-of-year feast","d":[{"t":"The last meal of the school year, where the House Cup is awarded.","at":"ss17"}]},
 {"t":"Magic in the holidays","d":[{"t":"Students are not allowed to use it at home. The Dursleys do not know that.","at":"ss17"}]},
 {"t":"House-elf","d":[{"t":"A small magical servant bound to one family.","at":"cs2"},{"t":"Freed only by a gift of clothes.","at":"cs18"}]},
 {"t":"Hover Charm","d":[{"t":"The spell Dobby uses on the pudding.","at":"cs2"}]},
 {"t":"Underage magic","d":[{"t":"Wizards under seventeen may not do magic outside school. A second offense can mean expulsion.","at":"cs2"}]},
 {"t":"Misuse of Muggle Artifacts Office","d":[{"t":"Mr. Weasley's department at the Ministry.","at":"cs3"}]},
 {"t":"De-gnoming","d":[{"t":"Clearing a garden of gnomes by throwing them over the hedge.","at":"cs3"}]},
 {"t":"Chudley Cannons","d":[{"t":"Ron's Quidditch team. His whole bedroom is their shade of orange.","at":"cs3"}]},
 {"t":"Floo powder","d":[{"t":"Lets a wizard travel from fireplace to fireplace.","at":"cs4"}]},
 {"t":"Dark Arts","d":[{"t":"Magic meant to harm. Knockturn Alley trades in it.","at":"cs4"}]},
 {"t":"Second year","d":[{"t":"What Harry, Ron and Hermione are now.","at":"cs5"}]},

  const byKind=seen.filter(e=>S.df.kind==='all'||(S.df.kind==='gryphon')===isGryphon(e));
  const tally=fn=>{const m=new Map();byKind.forEach(e=>{const k=fn(e);if(k)m.set(k,(m.get(k)||0)+1)});return m};

}

/* ---------- PROGRESS SHEET ---------- */
let draft=S.pos,showNames=false,sheetBook=bookOf(S.pos).id,sheetView='parts';
function booksList(){

  return `<p class="eyebrow" style="margin-bottom:8px">Main series</p><ul class="booklist">${SERIES.map(s=>{
    if(s.status==='upcoming')return row(s.n,'up',`Book ${s.n}`,'Not released yet','');
    if(s.status==='soon')return row(s.n,'up',esc(s.name),'Not in the guide yet','');
    const b=BOOKS.find(x=>x.id===s.id),st=bookStatus(b),cls=st==='Read'?'done':S.pos>=b.start?'cur':'';
    return row(cls==='done'?`<svg viewBox="0 0 24 24" aria-hidden="true">${IC.check}</svg>`:s.n,cls,esc(b.name),st,`data-sbook="${b.id}"${b.id===sheetBook?' aria-current="true"':''}`)}).join('')}</ul>
   ${COMPANIONS.length?`<p class="eyebrow" style="margin:18px 0 8px">Companion books</p><ul class="booklist">${COMPANIONS.map(c=>row(S.td.size?'TD':'+',S.td.size?'cur':'',esc(c.name),`${esc(c.note)} · ${tdStatus()}`,'data-act="td"')).join('')}</ul>`:''}`;
}
/* Threshing Day: a read switch per story. Names stay hidden until the guide has introduced the person */
function tdList(){
  const rows=STORIES.map(x=>{const read=S.td.has(x.n),safe=S.pos>=x.line,name=storyName(x),dr=storyDragon(x),c=read?storyCounts(x.n):null;
    const meta=[x.kind==='essay'?'Essay':/^Story /.test(name)?'':`Story ${x.n}`,x.year?`${x.year} AU`:x.who,dr].filter(Boolean).join(' · ');
    const line=safe?`<span class="tdline ok">${ico('check')}Spoiler-free where you are</span>`:`<span class="tdline wait">${ico('lock')}Has spoilers until ${esc(lineText(x))}</span>`;
    const cnt=c?`<small class="muted">${c.open} entr${c.open===1?'y':'ies'} open${c.later?` · ${c.later} open later`:''}</small>`:'';
    return `<li><label class="story" for="td${x.n}"><span class="st"><strong>${esc(name)}</strong><small class="muted">${esc(meta)}</small>${line}${cnt}</span><input type="checkbox" id="td${x.n}" data-td="${x.n}" ${read?'checked':''}></label></li>`}).join('');
  return `<button class="bookpick" data-act="books" aria-label="Back to all books"><span class="num ${S.td.size?'cur':''}">TD</span><span class="bp-t"><span class="eyebrow">Companion</span><strong>Threshing Day</strong></span><span class="bp-c">All books${ico('chev')}</span></button>
   <p class="muted" style="margin:14px 0;font-size:.94rem">Switch on the stories you've read. Their entries join the guide once you reach the chapter where they stop giving anything away. Stories you haven't read stay out of the guide.</p>

function setTd(list){S.td=new Set(list);store.set('td',[...S.td].sort((a,b)=>a-b));refresh();renderSheet()}

function renderSheet(){
  const ahead=draft>S.pos,t=totalsAt(draft),now=totalsAt(S.pos);
  const bk=BOOKS.find(b=>b.id===sheetBook),bs=BEATS.filter(x=>x.b===sheetBook);
  const curN=beatOf(S.pos).n,dB=bookOf(draft).id===sheetBook?beatOf(draft):null;
  const known=b=>showNames||b.n<=curN,hintOk=b=>showNames||b.n<=curN+1,parts=sheetView!=='books';
  $('#psPanel').innerHTML=`<div class="panel-h"><div><span class="eyebrow">Reading progress</span><h3 id="psTitle">How far have you read?</h3></div><button class="x" data-close aria-label="Close">${ico('x')}</button></div>
   ${sheetView==='td'?tdList():sheetView==='books'?booksList():`<button class="bookpick" data-act="books" aria-label="Change book. Now showing ${esc(bk.name)}"><span class="num cur">${BOOKS.indexOf(bk)+1}</span><span class="bp-t"><span class="eyebrow">Book ${BOOKS.indexOf(bk)+1} of ${SERIES.length}</span><strong>${esc(bk.name)}</strong></span><span class="bp-c">Change book${ico('chev')}</span></button>`}
   ${parts&&sheetView!=='td'?`<p class="muted" style="margin:14px 0;font-size:.94rem">${bk.start>1?`Choosing a chapter in ${esc(bk.name)} opens everything in the books before it. `:''}Pick the part you're in, then the last chapter you finished.</p>
   <ul class="parts">${bs.map(b=>{const hid=!known(b),sel=dB&&dB.n===b.n;
     const chips=sel?`<div class="chpick" role="group" aria-label="Last chapter finished"><span class="lbl">Last chapter you finished</span>${CH.slice(b.from-1,b.to).map(c=>`<button class="chp" data-ch="${c.p}" aria-pressed="${c.p===draft}">${c.c===0?'Prologue':c.c}</button>`).join('')}</div>`:'';
     return `<li class="part${sel?' sel':''}${hid?' hidden-name':''}"><label for="b${b.n}"><input type="radio" name="beat" id="b${b.n}" value="${b.n}" ${sel?'checked':''}><span><span class="code">${esc(chRange(b))}</span><strong>${hid?'Later in the book':esc(b.t)}</strong>${hintOk(b)?`<small>${esc(b.hint)}</small>`:''}</span></label>${chips}</li>`}).join('')}</ul>
   <div class="textbtns">${bs.some(b=>!known(b))?`<button class="textbtn" data-act="names">Show later part names</button>`:''}<button class="textbtn" data-act="finished">I've finished ${esc(bk.name)}</button></div>
   <label class="toggle setting" for="tHints"><span><strong>Show sealed counts</strong><small class="muted">Cards say how many entries are still sealed. Turn this off if even a count feels like a spoiler.</small></span><input type="checkbox" id="tHints" ${S.hints?'checked':''}></label>`:''}
   <div class="sheet-foot">${sheetView==='td'?'<div class="row"><button class="btn" data-close>Done</button></div>':ahead?`<div class="confirm"><p>Moving to the end of ${esc(chName(draft))} opens <strong>${t.facts-now.facts}</strong> new entries and <strong>${t.ent-now.ent}</strong> new ${CFG.noun}.</p><div class="row"><button class="btn seal" data-act="save">Unlock through ${esc(code(draft))}</button><button class="btn ghost" data-close>Cancel</button></div></div>`
     :`<div class="row"><button class="btn" data-act="save" ${draft===S.pos?'disabled':''}>Save progress</button><button class="btn ghost" data-close>Cancel</button></div>`}</div>`;
}
function openSheet(target,book){draft=target||S.pos;sheetBook=book||bookOf(draft).id;showNames=false;sheetView='parts';renderSheet();$('#progressSheet').hidden=false;
  const b=beatOf(draft),r=b&&$('#b'+b.n);if(r){try{r.closest('li').scrollIntoView({block:'center'})}catch(e){}r.focus({preventScroll:true})}}

/* ---------- EVENTS ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function setTab(t,push){const changed=S.tab!==t;S.tab=t;$('#moreSheet').hidden=true;renderView();
  if(push){try{history.replaceState(null,'','#'+t)}catch(e){}
    if(changed){try{const v=$('#view');if(v.getBoundingClientRect().top<0)window.scrollTo({top:0})}catch(e){}}}}
function refresh(){renderRail();renderView();if(!$('#detail').hidden)openDetail($('#detail').dataset.id)}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-df],[data-tab],[data-open],[data-close],[data-act],[data-peek],[data-peek-yes],[data-peek-no],[data-beat],[data-book],[data-sbook],[data-ch]');
  if(ev.target.classList.contains('overlay')){closeAll();return}
  if(!el)return;
  if(el.dataset.df){const [k,v]=el.dataset.df.split(':');if(k==='clear')S.df={kind:'all',color:null,tail:null};else if(k==='kind')S.df.kind=v;else S.df[k]=S.df[k]===v?null:v;renderView();if(!$('#filterSheet').hidden)renderFilters();return}
  if(el.dataset.ch){draft=+el.dataset.ch;renderSheet();const k=$(`[data-ch="${draft}"]`);if(k)k.focus()}
  else if(el.dataset.beat){const x=BEATS[+el.dataset.beat-1];openSheet(S.pos>=x.from&&S.pos<=x.to?S.pos:x.to)}
  else if(el.dataset.book){const b=BOOKS.find(x=>x.id===el.dataset.book);openSheet(S.pos>=b.start&&S.pos<=b.end?S.pos:null,b.id)}
  else if(el.dataset.sbook){sheetBook=el.dataset.sbook;sheetView='parts';renderSheet()}
  else if(el.dataset.tab)setTab(el.dataset.tab,true);
  else if(el.dataset.open){pendingPeek=null;openDetail(el.dataset.open)}
  else if('close' in el.dataset)closeAll();
  else if(el.dataset.peek){pendingPeek=el.dataset.peek;openDetail($('#detail').dataset.id)}
  else if(el.dataset.peekYes){S.peeked.add(el.dataset.peekYes);pendingPeek=null;refresh()}
  else if('peekNo' in el.dataset){pendingPeek=null;openDetail($('#detail').dataset.id)}
  else{const a=el.dataset.act;
    if(homeAct(a,el)){}
    else if(a==='filters'){renderFilters();$('#filterSheet').hidden=false}
    else if(a==='books'){sheetView='books';renderSheet()}
    else if(a==='td'){if($('#progressSheet').hidden){draft=S.pos;sheetBook=bookOf(S.pos).id;showNames=false}$('#detail').hidden=true;$('#moreSheet').hidden=true;sheetView='td';renderSheet();$('#progressSheet').hidden=false}
    else if(a==='td-all')setTd(STORIES.map(x=>x.n));
    else if(a==='td-none')setTd([]);
    else if(a==='more'){renderMore();$('#moreSheet').hidden=false}
    else if(a==='names'){showNames=true;renderSheet()}
    else if(a==='finished'){draft=BOOKS.find(b=>b.id===sheetBook).end;showNames=true;renderSheet()}
    else if(a==='save'){const back=draft<S.pos;S.pos=draft;store.set('pos',chCode(S.pos));S.peeked.clear();closeAll();refresh();toast(back?`Moved back to ${chName(S.pos)}. Later entries are sealed again.`:`Unlocked through ${chName(S.pos)}.`)}
    else if(a==='editor-off'){S.editor=false;refresh()}}
});

function progOf(id){const D=GUIDE_DATA[id];if(!D)return null;const v=gstore.get(gkey('pos',id),null);if(typeof v!=='string')return null;

  if(!hit)return null;const ch=hit.c===0?'prologue':hit.b.epi===hit.c?'epilogue':'chapter '+hit.c;return {pos:hit.pos,max:n,label:`${hit.b.name}, ${ch}`,abbr:hit.b.abbr,ch}}

      !live?'<span class="pill">Coming soon</span>':pr?`<span class="pill live">Reading · ${Math.round(pr.pos/pr.max*100)}%</span>`:`<span class="pill live">${partial(x)?`Book ${GUIDE_DATA[x.id].BOOKS.length} of ${x.total} ready`:'Guide ready'}</span>`}</span></button>`};
  return `<div class="home-bar"><div><h1>Parapet</h1><p class="hb-sub">Spoiler-safe reading companions</p></div>${themeSw()}</div>
  <div class="hub-hero${first?' first':''}">${first?`<div class="ob-art">${SCENES.svg('book:night')}</div>`:''}
   <div><h2 class="h-display"><span class="nw">Look anything up.</span> <span class="nw">Spoil nothing.</span></h2>
   <p class="h-lede" style="margin-top:10px">Guides to long fantasy series that only show what you've already read. Pick a series, tell it your chapter, and everything past it stays sealed.</p></div>
   ${first?`<div><div class="h-sec"><h3>How it works</h3></div>${demoHtml()}<p class="note" style="margin-top:8px">Try it: move the chapter and watch what opens.</p></div>`:''}</div>
  ${on.length?`<section><div class="h-sec"><h3>Continue reading</h3></div><div class="nowlist">${on.map(nowCard).join('')}</div></section>`:''}
  <section><div class="h-sec"><h3>${on.length?'All series':'Choose a series'}</h3><span class="count">${LIVE.length} ready · ${GUIDES.length-LIVE.length} coming</span></div>
   <div class="bookgrid hub">${GUIDES.map(tile).join('')}</div>
   <p class="note" style="margin-top:12px">Each guide is written chapter by chapter from the books, so new ones take time.</p></section>
  ${homeFoot()}`;
}

/* ----- a series page: the pitch, and the way in ----- */
function seriesView(g){
  const live=g.live&&GUIDE_DATA[g.id],pr=live?progOf(g.id):null,bar=`<div class="home-bar wide"><button class="backbtn" data-act="library">${ico('back')}Library</button>${themeSw()}</div>`;
  const hero=`<div class="sp-hero wide">${cover(g)}<div style="display:grid;gap:8px"><span class="pill${live?' live':''}">${live?(partial(g)?`Book ${GUIDE_DATA[g.id].BOOKS.length} of ${g.total} ready`:'Guide ready'):'Coming soon'}</span><h2 class="h-display">${esc(g.name)}</h2><p class="meta">${esc(g.author)} · ${esc(g.count)}</p></div></div>`;
  if(!live)return `<div class="sp">${bar}${hero}
   <div style="display:grid;gap:16px"><p class="h-lede" style="font-family:var(--f-display);font-size:1.5rem;line-height:1.2">${esc(g.hook)}</p><div class="vibes">${g.vibes.map(v=>`<span>${esc(v)}</span>`).join('')}</div></div>
   <div class="infobox"><b>The guide isn't written yet</b><p class="note">When it's ready it will work like every Parapet guide: characters, places and powers, each sealed until the chapter that reveals it.</p><button class="btn ghost" data-act="library">Back to the library</button></div>
   ${homeFoot()}</div>`;
  const id=` data-id="${g.id}"`;
  const cta=pr?`<button class="btn seal" data-act="guide"${id}>Continue at ${esc(pr.abbr)} ${esc(pr.ch)}</button><button class="btn ghost" data-act="progress"${id}>Change my place</button>`
    :`<button class="btn seal" data-act="begin"${id}>Set my place</button><button class="btn ghost" data-act="start1"${id}>I'm starting chapter 1</button>`;
  return `<div class="sp">${bar}${hero}
   <div style="display:grid;gap:18px">
    <p class="h-lede" style="font-family:var(--f-display);font-size:clamp(1.4rem,4.6vw,1.8rem);line-height:1.2">${esc(g.hook)}</p>
    ${g.pitch.map(p=>`<p class="h-lede">${esc(p)}</p>`).join('')}
    <div class="vibes">${g.vibes.map(v=>`<span>${esc(v)}</span>`).join('')}</div>
    <div class="now-act">${cta}</div>
    <div><div class="h-sec" style="margin-top:8px"><h3>Why readers fall for it</h3></div>
     <ol class="why">${g.why.map(([a,b],i)=>`<li><span class="n">${i+1}</span><div><b>${esc(a)}</b><span>${esc(b)}</span></div></li>`).join('')}</ol></div>
   </div>
   <div style="display:grid;gap:12px">
    <div class="infobox"><b>Reading order</b><ol class="order">${g.order.map(([n,s])=>`<li><span>${esc(n)}${s?` <span class="muted">· ${esc(s)}</span>`:''}</span></li>`).join('')}${g.extra.map(([n,s])=>`<li class="xt"><span>${esc(n)} <span class="muted">· ${esc(s)}</span></span></li>`).join('')}</ol>
     ${partial(g)?`<p class="note">The guide covers ${GUIDE_DATA[g.id].BOOKS.length===1?'the first book':'the first '+GUIDE_DATA[g.id].BOOKS.length+' books'} so far. The rest are being added in order.</p>`:g.orderNote?`<p class="note">${esc(g.orderNote)}</p>`:''}</div>
    <div class="infobox"><b>How Parapet helps while you read</b><dl><div><dt>Set your chapter</dt><dd>The guide opens up to that point and no further.</dd></div><div><dt>Look people up</dt><dd>Forgot who someone is? Their page shows only what you've read about them.</dd></div><div><dt>Peek only if you choose</dt><dd>Sealed entries stay shut unless you tap one and confirm.</dd></div></dl></div>
    <p class="note">${esc(g.note)} This page gives away nothing past the opening premise.</p>
   </div>
   ${homeFoot()}</div>`;
}

/* ----- first run: what it is, pick a series, the pitch, where are you ----- */
const OB={step:0,ch:1,just:0,peek:null,where:null,guide:LIVE.some(g=>g.id===GID)?GID:LIVE[0].id,book:null,at:null,timer:null};
const DEMO=[[1,'codex','A character'],[3,'places','A place'],[6,'signets','A power'],[9,'bonds','A bond between two people']];
function demoHtml(){
  return `<div class="demo" aria-label="A demonstration of how entries unseal as you read"><div class="demo-h"><span>You've read to <b>chapter ${OB.ch}</b></span>
    <span class="stepper"><button data-act="demo-" aria-label="One chapter back" ${OB.ch<=1?'disabled':''}>−</button><button data-act="demo+" aria-label="One chapter on" ${OB.ch>=10?'disabled':''}>+</button></span></div>
   ${DEMO.map(([c,ic,l])=>c<=OB.ch?`<div class="drow${OB.just===c?' just':''}"><span class="dav">${ico(ic)}</span><span class="dt"><b>${l}</b><span class="bars"><i></i><i></i></span></span><span class="dc">CH ${c}</span></div>`
     :`<div class="drow shut"><span class="dav">${ico('lock')}</span><span class="dt"><b>Sealed until chapter ${c}</b></span><span class="dc">CH ${c}</span></div>`).join('')}</div>`;
}
function obBody(){
  const g=guideOf(OB.guide),D=GUIDE_DATA[g.id].BOOKS;
  const thumb=x=>`<span class="thumb" aria-hidden="true">${SCENES.svg(x.art[0])}</span>`;
  if(OB.step===2)return `<span class="eyebrow">${esc(g.name)} · ${esc(g.author)}</span><h2 class="h-display">${esc(g.hook)}</h2>
   ${g.pitch.map((p,i)=>`<div class="pitchcard"><div class="plate">${SCENES.svg(g.art[i%g.art.length])}</div><p>${esc(p)}</p></div>`).join('')}
   <div class="vibes">${g.vibes.map(v=>`<span>${esc(v)}</span>`).join('')}</div>
   <ol class="why">${g.why.slice(0,3).map(([a,b],i)=>`<li><span class="n">${i+1}</span><div><b>${esc(a)}</b><span>${esc(b)}</span></div></li>`).join('')}</ol>
   <p class="note">${esc(g.note)} Nothing here goes past the opening premise.</p>`;
  const bk=D.find(b=>b.id===OB.book)||D[0],opts=[];for(let c=bk.first;c<=bk.last;c++)opts.push(`<option value="${bk.id+c}" ${OB.at===bk.id+c?'selected':''}>${c===0?'Prologue':bk.epi===c?'Epilogue':'Chapter '+c}</option>`);
  const o=(k,t,s)=>`<button class="opt" role="radio" aria-checked="${OB.where===k}" data-act="ob-where" data-id="${k}"><span class="rd"></span><span><b>${t}</b><small>${s}</small></span></button>`;
  const part=partial(g),one=D.length===1;
  return `<div class="ob-art">${SCENES.svg('train:'+(g.id==='hp'?'day':'dusk'))}</div><span class="eyebrow">${esc(g.name)} · Last step</span><h2 class="h-display">Where are you in the series?</h2>
   <div class="pick" role="radiogroup" aria-label="Where are you in the series?">
    ${o('new',"I haven't started yet",`The guide opens at chapter 1 of ${esc(D[0].name)}, with only the opening cast.`)}
    ${o('mid',one?`I'm reading ${esc(D[0].name)}`:"I'm reading it","Pick the last chapter you finished.")}
    ${OB.where==='mid'?`<div class="where-sub">${one?'':`<label>Book</label><div class="bookseg">${D.map(b=>`<button data-act="ob-book" data-id="${b.id}" aria-pressed="${b.id===bk.id}">${esc(b.name)}</button>`).join('')}</div>`}
      <label for="obCh">Last chapter you finished</label><select id="obCh">${opts.join('')}</select></div>`:''}
    ${part?o('all',one?`I've finished ${esc(D[0].name)}, or I'm further on`:"I'm past the books in the guide",`The guide covers ${one?'the first book':'the first '+D.length+' books'} so far. All of it opens, and nothing from later books is in it.`)
      :o('all',"I've read everything so far",`All ${D.length} novels. Nothing is sealed.`)}</div>
   <p class="note">You can change this any time from Update progress.</p>`;
}
function onboardView(){
  const last=OB.step===3;
  return `<div class="ob"><div class="ob-top"><button class="backbtn" data-act="library">${ico('back')}Library</button><span class="ob-dots" aria-hidden="true">${[2,3].map(i=>`<i class="${i<=OB.step?'on':''}"></i>`).join('')}</span></div>
   <div class="ob-body">${obBody()}</div>
   <div class="ob-foot"><button class="btn ghost" data-act="ob-back">Back</button><button class="btn${last?' seal':''}" data-act="${last?'ob-done':'ob-next'}" ${last&&!OB.where?'disabled':''}>${last?'Open the guide':"I'm in"}</button></div></div>`;
}
function obRender(focus){$('#homeIn').innerHTML=onboardView();if(focus){$('#home').scrollTop=0;const h=$('#homeIn h2');if(h){h.tabIndex=-1;try{h.focus({preventScroll:true})}catch(e){}}}}
/* the demo plays once by itself: chapter 1, then 3, then 6. It waits for the splash to clear first */
function obDemoPlay(){clearInterval(OB.timer);const seq=[3,6];let i=0;const go=()=>{OB.timer=setInterval(()=>{if(!HOME||HOME.v!=='library'||i>=seq.length){clearInterval(OB.timer);return}OB.just=OB.ch=seq[i++];demoPaint()},1300)};
  const sp=document.getElementById('splash');const shown=sp&&!document.documentElement.classList.contains('no-splash');setTimeout(go,shown?1500:300)}
/* ----- first visit: three pages on what Parapet is, then the library ----- */
const INTRO=[
 ['lost','A reader in an armchair, surrounded by question marks','Lost track of who\'s who?','Long fantasy series pile up characters, places and powers. Looking one up online usually tells you how the story ends.'],
 ['place','A reader setting their chapter on a large phone screen','Tell it your chapter','Pick a series and say where you are. Every entry is tied to a chapter, and only the ones you have reached are opened.'],
 ['sealed','Two readers, one keeping the ending behind a lock','Nothing past your page','Everything further on stays sealed until you get there. Move your chapter forward as you read, and more unlocks.']];
const IN={i:0};
function introView(){const [k,label,t,d]=INTRO[IN.i],last=IN.i===INTRO.length-1;
  return `<div class="intro"><div class="ob-top"><span class="eyebrow">Parapet</span>${last?'<span></span>':'<button class="textbtn" data-act="in-skip">Skip</button>'}</div>
   <div class="intro-art">${LINEART.svg(k,label)}</div>
   <div class="intro-t"><h2 class="h-display">${esc(t)}</h2><p class="h-lede">${esc(d)}</p></div>
   <div class="intro-dots" role="group" aria-label="Page">${INTRO.map((x,j)=>`<button data-act="in-dot" data-id="${j}" aria-current="${j===IN.i}" aria-label="Page ${j+1} of ${INTRO.length}"></button>`).join('')}</div>
   <div class="intro-foot">${IN.i?'<button class="btn ghost" data-act="in-back">Back</button>':''}<button class="btn${last?' seal':''}" data-act="in-next">${last?'Get started':'Next'}</button></div></div>`}
function introGo(i){if(i>=INTRO.length){store.set('seen',true);showHome({v:'library'});try{history.replaceState({home:{v:'library'}},'')}catch(e){}return}IN.i=Math.max(0,i);$('#homeIn').innerHTML=introView();$('#home').scrollTop=0}
{let sx=null;document.addEventListener('touchstart',ev=>{sx=HOME&&HOME.v==='intro'?ev.touches[0].clientX:null},{passive:true});
 document.addEventListener('touchend',ev=>{if(sx==null||!HOME||HOME.v!=='intro')return;const dx=ev.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)introGo(Math.min(INTRO.length-1,IN.i+(dx<0?1:-1)))},{passive:true})}
function demoPaint(){const d=$('#homeIn .demo');if(d&&'outerHTML' in d)d.outerHTML=demoHtml()}
function startTour(id,step){clearInterval(OB.timer);OB.guide=id;OB.step=step||2;OB.where=null;OB.book=null;OB.at=null;showHome({v:'onboard'},true)}
function obFinish(skip){
  clearInterval(OB.timer);store.set('seen',true);
  const D=GUIDE_DATA[OB.guide].BOOKS,lastB=D[D.length-1];
  const el=$('#obCh'),code=skip||OB.where==='new'?null:OB.where==='all'?lastB.id+lastB.last:(el?el.value:OB.at)||D[0].id+D[0].first;
  if(!skip&&OB.guide!==GID){if(code)gstore.set(gkey('pos',OB.guide),code);switchGuide(OB.guide,'arrive');return}
  if(code){S.pos=P(code);store.set('pos',code)}else S.pos=DEFAULT_POS;
  S.peeked.clear();enterGuide();arriveToast(!code);
}
function arriveToast(fresh){toast(fresh?`Showing ${BOOKS[0].name}, chapter 1. Update your progress any time.`:S.pos===MAX?'Everything in the guide is open.':`Unlocked through ${chName(S.pos)}.`)}
function homeAct(a,el){
  const id=el&&el.dataset.id,other=id&&id!==GID&&GUIDE_DATA[id]&&['guide','progress','start1'].includes(a);
  if(a==='open'){const g=guideOf(id);if(!(g&&g.live&&GUIDE_DATA[id])){showHome({v:'series',id},true);return true}if(!progOf(id)){startTour(id,2);return true}if(id!==GID){switchGuide(id,'guide');return true}enterGuide(true);return true}
  if(a==='begin'){startTour(id||GID,HOME&&HOME.v==='series'?3:2);return true}
  if(other){if(a==='start1'){const b=GUIDE_DATA[id].BOOKS[0];gstore.set(gkey('pos',id),b.id+Math.max(1,b.first))}switchGuide(id,a);return true}
  if(a==='in-next'){introGo(IN.i+1);return true}
  if(a==='in-back'){introGo(IN.i-1);return true}
  if(a==='in-skip'){introGo(INTRO.length);return true}
  if(a==='in-dot'){introGo(+id);return true}
  if(a==='library'){showHome({v:'library'},true);return true}
  if(a==='series'){showHome({v:'series',id:id||GID},true);return true}
  if(a==='guide'){enterGuide(true);return true}
  if(a==='progress'){enterGuide(true);openSheet();return true}
  if(a==='start1'){S.pos=DEFAULT_POS;store.set('pos',chCode(S.pos));S.peeked.clear();enterGuide(true);toast(`Showing ${BOOKS[0].name}, chapter 1.`);return true}
  if(a==='demo+'||a==='demo-'){clearInterval(OB.timer);const before=OB.ch;OB.ch=Math.max(1,Math.min(10,OB.ch+(a==='demo+'?1:-1)));OB.just=DEMO.some(d=>d[0]===OB.ch)&&OB.ch>before?OB.ch:0;demoPaint();const b=$(`[data-act="${a}"]`);if(b&&!b.disabled)b.focus();return true}
  if(a==='ob-next'){OB.step=3;obRender(true);return true}
  if(a==='ob-back'){if(OB.step<=2||(HOME&&HOME.from==='series'))showHome({v:'library'},true);else{OB.step=2;obRender(true)}return true}
  if(a==='ob-peek'){OB.peek=id;obRender();return true}
  if(a==='ob-guide'){OB.guide=id;OB.peek=null;OB.book=null;OB.at=null;OB.where=null;obRender();const b=$(`[data-act="ob-guide"][data-id="${id}"]`);if(b)b.focus();return true}
  if(a==='ob-where'){const el2=$('#obCh');if(el2)OB.at=el2.value;OB.where=id;obRender();const b=$(`[data-act="ob-where"][data-id="${OB.where}"]`);if(b)b.focus();return true}
  if(a==='ob-book'){OB.book=id;OB.at=null;obRender();const b=$(`[data-act="ob-book"][data-id="${OB.book}"]`);if(b)b.focus();return true}
  if(a==='ob-done'){if(OB.where)obFinish(false);return true}
  if(a==='ob-skip'){obFinish(true);return true}
  return false;
}
function renderSideLinks(){const el=$('#sideLinks');if(el)el.innerHTML=`<button data-act="series" data-id="${GID}">${ico('info')}About the series</button>`}

/* splash: drop it from the page once it has faded; a tap skips it */
try{const sp=$('#splash');if(sp){const done=()=>{if(sp.parentNode)sp.remove()};
  sp.addEventListener('animationend',e=>{if(e.target===sp)done()});sp.addEventListener('click',()=>{sp.classList.add('gone')});setTimeout(done,3000)}}catch(e){}

/* ---------- BOOT ---------- */
const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;else if(h==='editor')S.editor=true;
if(!(S.pos>=1&&S.pos<=MAX))S.pos=DEFAULT_POS;
renderRail();renderView();renderSideLinks();
{const bs=$('#brandSub');if(bs)bs.textContent=CFG.sub;const fl=$('#footLead');if(fl)fl.textContent=CFG.foot}
/* arriving from another guide: finish what the reader asked for there */
let arriving=null;try{arriving=sessionStorage.getItem('parapet.go');sessionStorage.removeItem('parapet.go')}catch(e){}
/* the browser's back button always has the library underneath the guide */
if(!S.editor){try{history.replaceState({home:{v:'library'}},'');if(arriving||TABS.some(t=>t[0]===h))history.pushState({home:null},'')}catch(e){}}
if(arriving){if(arriving==='progress'||arriving==='begin')openSheet();else if(arriving==='start1')toast(`Showing ${BOOKS[0].name}, chapter 1.`);else if(arriving==='arrive')arriveToast(!started())}
/* the library is the front door. A link straight to a section, or the editor, opens the guide */
else if(!S.editor&&!TABS.some(t=>t[0]===h)){showHome(store.get('seen',false)?{v:'library'}:{v:'intro'})}
</script>

</body>
</html>
