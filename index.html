  {"t":"Tall and hooded, with rotting, scabbed hands, and a rattling breath that sucks the warmth out of the air.","at":"pa5","v":1},
  {"t":"They take no orders about who is innocent. Dumbledore will not let them inside the grounds.","at":"pa5","v":1},
  {"t":"They feed on happiness. Too near one, a person is left with only the worst memories of their life, and Harry's are worse than most people's.","at":"pa10","v":1},
  {"t":"Their last weapon is the Dementor's Kiss: they lower the hood and suck out the victim's soul, leaving the body alive and empty.","at":"pa12","v":1},
  {"t":"A hundred of them close on Harry, Hermione and Sirius at the lakeside.","at":"pa20","v":1},
  {"t":"Sent back to Azkaban after trying to Kiss a student.","at":"pa22","v":1},
  {"t":"One of them, brought by Fudge, administers the Kiss inside the school. Dumbledore says they will join Voldemort the moment he offers more than the Ministry does.","at":"gf36","v":1},
  {"t":"Two of them appear in a Muggle suburb.","at":"op1","v":1},
  {"t":"Azkaban's guards let ten prisoners walk out. The Ministry has lost control of them.","at":"op25","v":1},
  {"t":"The pair in Little Whinging were sent by Umbridge.","at":"op32","v":1},
  {"t":"Breeding. The cold mist over Britain in July is theirs.","at":"hb1","v":1},
  {"t":"Guard the Muggle-born hearings.","at":"dh13","v":1},
  {"t":"Swarm the grounds during the battle.","at":"dh32","v":1}]},
 {"id":"black_dog","kind":"creature","name":"The black dog","appear":"pa3","tag":[{"t":"Seen in the dark","at":"pa3"},{"t":"Sirius Black","at":"pa17"}],"rel":["harry","sirius","crookshanks"],"relAt":{"sirius":"pa17","crookshanks":"pa17"},"sub":"Dog","attrs":{"Kind":"Dog"},"facts":[
  {"t":"Something huge with gleaming eyes watches Harry from an alley just before the Knight Bus arrives.","at":"pa3","v":1},
  {"t":"Harry sees it again in the top row of the stands, moments before the Dementors come.","at":"pa9","v":1},
  {"t":"Pale-eyed and bear-sized. It knocks Harry down and drags Ron by the arm into a gap in the Whomping Willow's roots.","at":"pa17","v":1},
  {"t":"It is Sirius Black, an Animagus.","at":"pa17","v":1}]},
 {"id":"crookshanks","kind":"creature","name":"Crookshanks","appear":"pa4","tag":[{"t":"Hermione's cat","at":"pa4"}],"rel":["hermione","scabbers","black_dog","sirius"],"relAt":{"black_dog":"pa17","sirius":"pa19"},"sub":"Cat","owner":{"id":"hermione","at":"pa4"},"attrs":{"Kind":"Cat"},"facts":[
  {"t":"Large, ginger, bandy-legged and squash-faced. He had been in the shop for ages, and springs at Scabbers before Hermione has even paid.","at":"pa4","v":1},
  {"t":"Blamed by Ron when Scabbers disappears.","at":"pa12","v":1},
  {"t":"Darts under the Whomping Willow's branches and presses a knot on the trunk that freezes the tree.","at":"pa17","v":1},
  {"t":"Knew at once that the rat was no rat and the dog no dog. He stole the passwords for Sirius and has been trying to bring him Scabbers.","at":"pa19","v":1}]},
 {"id":"buckbeak","kind":"creature","name":"Buckbeak","appear":"pa6","tag":[{"t":"One of Hagrid's hippogriffs","at":"pa6"},{"t":"Sentenced to death","at":"pa14"},{"t":"Escaped with Sirius Black","at":"pa21","state":"away"}],"rel":["hagrid","hippogriffs","draco","committee","sirius","macnair","cave","grimmauld"],"relAt":{"sirius":"pa21"},"sub":"Hippogriff","owner":{"id":"hagrid","at":"pa6"},"attrs":{"Kind":"Hippogriff"},"facts":[
  {"t":"Stormy gray. Bows back to Harry and carries him once round the paddock.","at":"pa6","v":1},
  {"t":"Slashes Malfoy's arm when Malfoy calls him an ugly brute.","at":"pa6","v":1},
  {"t":"To be tried by a Ministry committee, thanks to Lucius Malfoy.","at":"pa11","v":1},
  {"t":"Hagrid loses the case, and the appeal is set for the day exams end.","at":"pa14","v":1},
  {"t":"The appeal fails. He is to be beheaded at sunset, tethered in Hagrid's pumpkin patch.","at":"pa16","v":1},
  {"t":"Untied by Harry and Hermione in the minute after the committee has seen him and before the executioner comes out.","at":"pa21","v":1},
  {"t":"Flies Harry and Hermione to a tower window, and carries Sirius away.","at":"pa21","v":1},
  {"t":"Hiding in the cave with Sirius.","at":"gf27","v":1},
  {"t":"Lives in an upstairs bedroom at Grimmauld Place.","at":"op4","v":1},
  {"t":"Injured by Kreacher on the day of the Ministry battle.","at":"op37","v":1},
  {"t":"Left to Harry. Back with Hagrid, under the name Witherwings.","at":"hb3","v":1},
  {"t":"Flies at Snape.","at":"hb28","v":1},
  {"t":"Attacks the giants in the battle.","at":"dh36","v":1}]},
 {"id":"hippogriffs","kind":"creature","name":"Hippogriffs","appear":"pa6","tag":[{"t":"Half eagle, half horse","at":"pa6"}],"rel":["buckbeak","hagrid","comc"],"sub":"Species","facts":[
  {"t":"Front legs, wings and head of a giant eagle, body of a horse. Proud and quick to take offense.","at":"pa6","v":1},
  {"t":"Walk up, bow, and wait. If it bows back, you may touch it. Never insult one.","at":"pa6","v":1}]},
 {"id":"boggarts","kind":"creature","name":"Boggarts","appear":"pa7","tag":[{"t":"Take the shape of what you fear","at":"pa7"}],"rel":["lupin","riddikulus","dementors"],"relAt":{"dementors":"pa12"},"sub":"Species","facts":[
  {"t":"A shape-shifter that lives in dark enclosed spaces. Nobody knows what one looks like alone, because it turns into whatever the nearest person fears most.","at":"pa7","v":1},
  {"t":"Best faced in company, which confuses it. What finishes it off is laughter.","at":"pa7","v":1},
  {"t":"Neville's becomes Professor Snape. Ron's is a giant spider, Parvati's a mummy, Lupin's a silvery white orb.","at":"pa7","v":1},
  {"t":"Harry's becomes a Dementor, which is why Lupin can use one for practice.","at":"pa12","v":1}]},
 {"id":"werewolves","kind":"creature","name":"Werewolves","appear":"pa9","tag":[{"t":"Human, except at the full moon","at":"pa9"}],"rel":["lupin","wolfsbane","greyback"],"relAt":{"lupin":"pa17","wolfsbane":"pa18"},"sub":"Species","facts":[
  {"t":"The subject of the essay Snape sets when he covers Lupin's class, chapters ahead of where they should be.","at":"pa9","v":1},
  {"t":"A person bitten by one transforms every full moon and loses their mind while it lasts. A werewolf is a danger only to humans.","at":"pa18","v":1},
  {"t":"Most wizards will not have one near their children.","at":"pa18","v":1},
  {"t":"Shunned by wizards, most have gone over to Voldemort.","at":"hb16","v":1}]},
 {"id":"ripper","kind":"creature","name":"Ripper","appear":"pa2","tag":[{"t":"Marge's favorite bulldog","at":"pa2"}],"rel":["marge"],"sub":"Dog","owner":{"id":"marge","at":"pa2"},"attrs":{"Kind":"Bulldog"},"facts":[
  {"t":"Old and bad-tempered. He once chased Harry up a tree and kept him there until midnight.","at":"pa2","v":1}]},
 {"id":"pig","kind":"creature","name":[{"t":"Ron's new owl","at":"pa22"},{"t":"Pigwidgeon","at":"gf5"}],"appear":"pa22","tag":[{"t":"A gift from Sirius","at":"pa22"}],"rel":["ron","sirius"],"relAt":{"sirius":"pa22"},"sub":"Owl","owner":{"id":"ron","at":"pa22"},"attrs":{"Kind":"Owl"},"facts":[
  {"t":"A tiny gray owl, small enough to sit in a hand, who delivers Sirius's letter and is far too excited about it. Sirius says Ron should keep him, as it is his fault Ron no longer has a rat.","at":"pa22","v":1},
  {"t":"Named by Ginny, and will now answer to nothing else. Ron calls him Pig.","at":"gf5","v":1}]},
 {"id":"patronus","kind":"magic","name":"The Patronus Charm","appear":"pa12","tag":[{"t":"The defense against Dementors","at":"pa12"}],"rel":["lupin","harry","dementors","james","snape"],"relAt":{"james":"pa21","snape":"dh33"},"group":"spell","sub":"Charm","holders":[{"id":"lupin","at":"pa5"},{"id":"harry","at":"pa12"}],"facts":[
  {"t":"Far beyond third-year level. The caster fixes on a single very happy memory and says Expecto Patronum.","at":"pa12","v":1},
  {"t":"Done properly it makes a Patronus, a guardian of pure good feeling that a Dementor cannot feed on. Harry manages a silver mist.","at":"pa12","v":1},
  {"t":"Harry fires a full one at three hooded figures on the Quidditch field without waiting to see that they are fakes.","at":"pa13","v":1},
  {"t":"By the lake his own gives out. A bright silver animal gallops across the water and scatters the Dementors, sent by someone on the far bank who looks strangely familiar.","at":"pa20","v":1},
  {"t":"It was Harry, three hours later. Having seen himself do it, he knew he could. His Patronus is a stag.","at":"pa21","v":1},
  {"t":"Dumbledore points out that the stag was his father's shape.","at":"pa22","v":1},
  {"t":"Harry uses it in the maze on what proves to be a Boggart.","at":"gf31","v":1},
  {"t":"Harry casts it in a Muggle alley to save himself and Dudley.","at":"op1","v":1},
  {"t":"The Wizengamot is impressed that he can do it at all.","at":"op8","v":1},
  {"t":"The D.A. reach it at their last meeting.","at":"op27","v":1},
  {"t":"The Order uses them to carry messages. A Patronus can change after a great shock.","at":"hb8","v":1},
  {"t":"A silver doe appears to Harry in the forest.","at":"dh19","v":1},
  {"t":"The doe is Snape's.","at":"dh33","v":1}]},
 {"id":"riddikulus","kind":"magic","name":"Riddikulus","appear":"pa7","tag":[{"t":"The charm against a Boggart","at":"pa7"}],"rel":["boggarts","lupin","neville"],"group":"spell","sub":"Charm","holders":[{"id":"neville","at":"pa7"}],"facts":[
  {"t":"Said while picturing the Boggart as something absurd, it forces it into that shape.","at":"pa7","v":1},
  {"t":"Neville puts his Boggart Snape into his grandmother's dress, vulture hat and handbag.","at":"pa7","v":1}]},
 {"id":"fidelius","kind":"magic","name":"The Fidelius Charm","appear":"pa10","tag":[{"t":"Hides a secret inside one person","at":"pa10"}],"rel":["james","lily","sirius","pettigrew"],"relAt":{"sirius":"pa10","pettigrew":"pa19"},"group":"spell","sub":"Charm","facts":[
  {"t":"An immensely complex spell that seals a secret in a chosen Secret-Keeper. Unless that person tells, the hidden cannot be found, even by someone pressing their nose to the window.","at":"pa10","v":1},
  {"t":"The Potters used it to hide from Voldemort. Everyone believes Sirius Black was their Secret-Keeper.","at":"pa10","v":1},
  {"t":"Sirius persuaded them to switch to Pettigrew at the last moment, as a bluff nobody would suspect.","at":"pa19","v":1},
  {"t":"With Dumbledore dead, everyone he told has become a Secret-Keeper for Grimmauld Place.","at":"dh9","v":1},
  {"t":"Protects Shell Cottage.","at":"dh24","v":1}]},
 {"id":"animagus","kind":"magic","name":"Animagi","appear":"pa6","tag":[{"t":"Wizards who can become animals","at":"pa6"}],"rel":["mcgonagall","sirius","james","pettigrew","marauders","skeeter"],"relAt":{"sirius":"pa17","james":"pa18","pettigrew":"pa18","marauders":"pa18","skeeter":"gf37"},"group":"lore","sub":"Transformation","holders":[{"id":"mcgonagall","at":"pa6"},{"id":"sirius","at":"pa17"},{"id":"james","at":"pa18"},{"id":"pettigrew","at":"pa18"},{"id":"skeeter","at":"gf37"}],"facts":[
  {"t":"A wizard who can turn into one particular animal at will. McGonagall, a tabby cat, is one.","at":"pa6","v":1},
  {"t":"It takes years to learn and can go badly wrong. The Ministry keeps a register of them, with seven names for this century.","at":"pa18","v":1},
  {"t":"James Potter, Sirius Black and Peter Pettigrew managed it in secret in their fifth year, and never registered.","at":"pa18","v":1},
  {"t":"Rita Skeeter is an unregistered one: a beetle.","at":"gf37","v":1}]},
 {"id":"divination","kind":"magic","name":"Divination","appear":"pa6","tag":[{"t":"Taught by Trelawney","at":"pa6"}],"rel":["trelawney","north_tower","hermione","firenze"],"group":"lore","sub":"Subject","relAt":{"firenze":"op27"},"facts":[
  {"t":"A new subject for third years: tea leaves, palms, crystal balls. Taught in a stifling, perfumed room at the top of the North Tower.","at":"pa6","v":1},
  {"t":"McGonagall calls it one of the most imprecise branches of magic. True Seers are very rare.","at":"pa6","v":1},
  {"t":"Hermione walks out and drops it.","at":"pa15","v":1},
  {"t":"Shared from now on between a centaur and, later, Trelawney.","at":"op27","v":1}]},
 {"id":"comc","kind":"magic","name":"Care of Magical Creatures","appear":"pa5","tag":[{"t":"Taught by Hagrid","at":"pa5"}],"rel":["hagrid","hippogriffs","monster_book","buckbeak","skrewts","nifflers","grubbly","thestrals"],"group":"lore","sub":"Subject","facts":[
  {"t":"The old teacher has retired to enjoy his remaining limbs. Hagrid takes over.","at":"pa5","v":1},
  {"t":"The first lesson is hippogriffs, and it ends with Malfoy in the hospital wing.","at":"pa6","v":1},
  {"t":"After that Hagrid loses his nerve, and the class spends months feeding lettuce to flobberworms.","at":"pa8","v":1}]},
 {"id":"map","kind":"magic","name":"The Marauder's Map","appear":"pa10","tag":[{"t":"Shows everyone in the castle","at":"pa10"}],"rel":["fred","george","harry","lupin","hogsmeade","marauders","snape"],"relAt":{"lupin":"pa14","marauders":"pa18","snape":"pa14"},"group":"object","sub":"Enchanted map","holders":[{"id":"fred","at":"pa10"},{"id":"george","at":"pa10"},{"id":"harry","at":"pa10"},{"id":"lupin","at":"pa14"},{"id":"harry","at":"pa22"},{"id":"moody","at":"gf25"}],"facts":[
  {"t":"A blank bit of old parchment until tapped with the right words. Then it draws Hogwarts and its grounds, with a moving, labelled dot for every person.","at":"pa10","v":1},
  {"t":"Shows seven secret passages out of school. The twins stole it from Filch's office in their first year and know it by heart.","at":"pa10","v":1},
  {"t":"Signed by four makers who call themselves Moony, Wormtail, Padfoot and Prongs.","at":"pa10","v":1},
  {"t":"When Snape orders it to give up its secrets, the four makers write him a string of insults. Lupin takes it for safekeeping.","at":"pa14","v":1},
  {"t":"It never lies. Lupin sees on it a man he believed dead.","at":"pa17","v":1},
  {"t":"Lupin gives it back, since he is no longer Harry's teacher.","at":"pa22","v":1},
  {"t":"Shows a Crouch in Snape's office in the middle of the night.","at":"gf25","v":1},
  {"t":"The map does not tell apart two people of the same name. The dot was the son.","at":"gf35","v":1},
  {"t":"Malfoy keeps vanishing off it, because the Room of Requirement does not show.","at":"hb21","v":1}]},
 {"id":"firebolt","kind":"magic","name":"The Firebolt","appear":"pa4","tag":[{"t":"The best broom in the world","at":"pa4"},{"t":"Harry's broom","at":"pa11"}],"rel":["harry","mcgonagall","sirius","horntail"],"relAt":{"mcgonagall":"pa11","sirius":"pa22"},"group":"object","sub":"Racing broom","holders":[{"id":"harry","at":"pa11"}],"facts":[
  {"t":"A new international-standard broom on display in Diagon Alley, price on request. Harry visits it daily.","at":"pa4","v":1},
  {"t":"One arrives for Harry at Christmas with no note. Hermione suspects who sent it, tells McGonagall, and it is taken away to be stripped down and checked for jinxes.","at":"pa11","v":1},
  {"t":"Returned with nothing found.","at":"pa12","v":1},
  {"t":"Sent by Sirius, as thirteen birthdays' worth of presents. Crookshanks took the order to the owl office.","at":"pa22","v":1},
  {"t":"Summoned from the castle for the first task.","at":"gf20","v":1},
  {"t":"Chained up in Umbridge's office.","at":"op19","v":1},
  {"t":"Falls from the sidecar and is lost.","at":"dh4","v":1}]},
 {"id":"time_turner","kind":"magic","name":"The Time-Turner","appear":"pa21","tag":[{"t":"Turns back the hours","at":"pa21"}],"rel":["hermione","mcgonagall","dumbledore"],"group":"object","sub":"Device","holders":[{"id":"hermione","at":"pa21"}],"facts":[
  {"t":"A tiny sparkling hourglass on a long gold chain. Each turn takes the wearer back one hour.","at":"pa21","v":1},
  {"t":"McGonagall got Hermione one from the Ministry so she could attend several lessons at once. That is how she has been doing her timetable.","at":"pa21","v":1},
  {"t":"The rule is not to be seen, least of all by yourself. Wizards have killed their past or future selves by mistake.","at":"pa21","v":1},
  {"t":"Hermione hands it back and drops a subject.","at":"pa22","v":1},
  {"t":"The Ministry's stock is smashed in the fight.","at":"op35","v":1}]},
 {"id":"wolfsbane","kind":"magic","name":[{"t":"Lupin's potion","at":"pa8"},{"t":"Wolfsbane Potion","at":"pa18"}],"appear":"pa8","tag":[{"t":"Brewed by Snape for Lupin","at":"pa8"}],"rel":["snape","lupin","werewolves"],"relAt":{"werewolves":"pa18"},"group":"potion","sub":"Potion","facts":[
  {"t":"A goblet of something that smokes and tastes disgusting. Snape brings it in person. Sugar spoils it.","at":"pa8","v":1},
  {"t":"A recent discovery. Taken in the week before the full moon, it lets a werewolf keep his own mind when he transforms, so that he can curl up and wait.","at":"pa18","v":1}]},
 {"id":"sneakoscope","kind":"magic","name":"Pocket Sneakoscope","appear":"pa1","tag":[{"t":"Spins when someone untrustworthy is near","at":"pa1"}],"rel":["ron","harry"],"group":"object","sub":"Device","holders":[{"id":"harry","at":"pa1"}],"facts":[
  {"t":"A glass spinning top Ron sends from Egypt. His brother says it is tourist rubbish, since it kept going off at dinner.","at":"pa1","v":1},
  {"t":"Whistles in Harry's trunk on the train.","at":"pa5","v":1}]},
 {"id":"monster_book","kind":"magic","name":"The Monster Book of Monsters","appear":"pa1","tag":[{"t":"A book that bites","at":"pa1"}],"rel":["hagrid","comc"],"group":"object","sub":"Textbook","facts":[
  {"t":"Hagrid's birthday present to Harry. It scuttles under the bed and has to be strapped shut with a belt.","at":"pa1","v":1},
  {"t":"It only opens quietly if you stroke the spine. Nobody had worked that out.","at":"pa6","v":1}]},
 {"id":"knight_bus","kind":"magic","name":"The Knight Bus","appear":"pa3","tag":[{"t":"Emergency transport for stranded wizards","at":"pa3"}],"rel":["stan","prang","leaky"],"group":"object","sub":"Vehicle","facts":[
  {"t":"A violently purple triple-decker that appears when a wizard sticks out a wand hand at the curb. Beds at night, and a driving style that sends them sliding.","at":"pa3","v":1},
  {"t":"Goes anywhere on land. Muggles never notice it.","at":"pa3","v":1}]},
 {"id":"marauders","kind":"group","name":[{"t":"The makers of the map","at":"pa10"},{"t":"The Marauders","at":"pa18"}],"appear":"pa10","tag":[{"t":"Moony, Wormtail, Padfoot and Prongs","at":"pa10"}],"rel":["map","lupin","sirius","james","pettigrew","shack"],"relAt":{"lupin":"pa18","sirius":"pa18","james":"pa18","pettigrew":"pa18","shack":"pa18"},"group":"org","sub":"Friends","holders":[{"id":"lupin","at":"pa18"},{"id":"pettigrew","at":"pa18"},{"id":"sirius","at":"pa18"},{"id":"james","at":"pa18"}],"facts":[
  {"t":"Four names signed on the Marauder's Map, which declares them aids to magical mischief-makers.","at":"pa10","v":1},
  {"t":"Remus Lupin, Peter Pettigrew, Sirius Black and James Potter, friends from their first year. Moony the werewolf, Wormtail the rat, Padfoot the dog, Prongs the stag.","at":"pa18","v":1},
  {"t":"The other three became Animagi so they could be with Lupin at the full moon. As animals they were safe from him, and big enough to keep him in check.","at":"pa18","v":1},
  {"t":"They roamed the grounds and the village every month, which is how they came to know enough to draw the map.","at":"pa18","v":1},
  {"t":"As fifth years they are the cleverest, loudest boys in the school.","at":"op28","v":1},
  {"t":"All four are dead. Three of them walk with Harry at the end.","at":"dh34","v":1}]},
 {"id":"committee","kind":"group","name":"Committee for the Disposal of Dangerous Creatures","appear":"pa11","tag":[{"t":"Decides Buckbeak's case","at":"pa11"}],"rel":["ministry","buckbeak","lucius","macnair"],"group":"org","sub":"Ministry","holders":[{"id":"macnair","at":"pa16"}],"facts":[
  {"t":"A Ministry body that hears complaints against magical creatures. Hagrid says it is in Lucius Malfoy's pocket.","at":"pa11","v":1},
  {"t":"Sends an old member and an executioner to the appeal, which tells Hagrid the result in advance.","at":"pa16","v":1}]},
 {"id":"hteam","kind":"group","name":"Hufflepuff Quidditch team","appear":"pa9","tag":[{"t":"Captained by Cedric Diggory","at":"pa9"}],"rel":["hufflepuff","cedric","quidditch"],"group":"team","sub":"Quidditch team","color":"#D4A017","holders":[{"id":"cedric","at":"pa9"}],"facts":[
  {"t":"Swapped into the first match of the year because the Slytherin Seeker's arm is supposedly still injured. Beats Gryffindor in a storm.","at":"pa9","v":1}]},
 {"id":"rteam","kind":"group","name":"Ravenclaw Quidditch team","appear":"pa13","tag":[{"t":"Cho Chang plays Seeker","at":"pa13"}],"rel":["ravenclaw","cho","quidditch"],"group":"team","sub":"Quidditch team","color":"#27457E","holders":[{"id":"cho","at":"pa13"}],"facts":[
  {"t":"Loses to Gryffindor and the Firebolt.","at":"pa13","v":1}]},
 {"id":"hogsmeade","kind":"place","name":"Hogsmeade","appear":"pa1","tag":[{"t":"The village near Hogwarts","at":"pa1"}],"rel":["honeydukes","broomsticks","shack","hogwarts","map","cave","hogs_head"],"type":"wizard","facts":[
  {"t":"The only all-wizard village in Britain. Third years may visit on certain weekends with a signed form, and Harry's is not signed.","at":"pa1","v":1},
  {"t":"Like a Christmas card under snow: thatched cottages, shops, a post office with hundreds of owls.","at":"pa10","v":1},
  {"t":"Under curfew, with an alarm that screams when anyone Apparates in.","at":"dh28","v":1}]},
 {"id":"honeydukes","kind":"place","name":"Honeydukes","appear":"pa8","tag":[{"t":"Sweet shop","at":"pa8"}],"rel":["hogsmeade","map"],"type":"wizard","parent":"hogsmeade","facts":[
  {"t":"Ron and Hermione bring back a bagful for Harry.","at":"pa8","v":1},
  {"t":"Shelves of every sweet imaginable. A trapdoor in its cellar is the end of a secret passage that starts behind a statue of a one-eyed witch at school.","at":"pa10","v":1}]},
 {"id":"broomsticks","kind":"place","name":"The Three Broomsticks","appear":"pa8","tag":[{"t":"The village inn","at":"pa8"}],"rel":["rosmerta","hogsmeade"],"type":"wizard","parent":"hogsmeade","facts":[
  {"t":"Where you go for hot butterbeer.","at":"pa8","v":1},
  {"t":"Harry sits under a table here and hears the story of Sirius Black and his parents.","at":"pa10","v":1},
  {"t":"Katie is handed the parcel in its bathroom.","at":"hb12","v":1}]},
 {"id":"shack","kind":"place","name":"The Shrieking Shack","appear":"pa8","tag":[{"t":"Said to be the most haunted building in Britain","at":"pa8"}],"rel":["hogsmeade","willow","lupin","marauders"],"relAt":{"willow":"pa17","lupin":"pa18","marauders":"pa18"},"type":"wizard","parent":"hogsmeade","facts":[
  {"t":"A boarded-up house on a hill above the village. Even the school ghosts avoid it.","at":"pa8","v":1},
  {"t":"A tunnel from under the Whomping Willow comes up inside it. Dusty, wrecked furniture, every window nailed shut.","at":"pa17","v":1},
  {"t":"Never haunted. It was built for Lupin to transform in, and the howls the villagers heard were his.","at":"pa18","v":1},
  {"t":"Voldemort directs the battle from it. Snape dies here.","at":"dh32","v":1}]},
 {"id":"north_tower","kind":"place","name":"The North Tower","appear":"pa6","tag":[{"t":"Where Divination is taught","at":"pa6"}],"rel":["trelawney","divination","cadogan"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"A long climb, ending in a silver ladder up through a trapdoor into a dim, hot room that looks like a cross between an attic and an old tea shop.","at":"pa6","v":1},
  {"t":"Trelawney stays in it, by Dumbledore's leave.","at":"op26","v":1}]},
 {"id":"egypt","kind":"place","name":"Egypt","appear":"pa1","tag":[{"t":"Where the Weasleys spend the summer","at":"pa1"}],"rel":["bill","weasleys"],"type":"abroad","facts":[
  {"t":"Mr. Weasley wins seven hundred Galleons in a newspaper draw and takes the family to visit Bill, who works there for Gringotts as a curse breaker.","at":"pa1","v":1}]},
 {"id":"bryce","kind":"person","g":"m","name":"Frank Bryce","appear":"gf1","tag":[{"t":"The Riddles' old gardener","at":"gf1"},{"t":"Killed by Voldemort","at":"gf1","state":"fallen"}],"rel":["hangleton","riddles","voldemort","nagini"],"facts":[
  {"t":"Came back from the war with a stiff leg and has tended the Riddle House garden ever since. The village always believed he killed the family, though he was released without charge.","at":"gf1","v":1},
  {"t":"Nearly seventy-seven. Climbs the stairs to chase off intruders, hears murder being planned, and is killed when a snake reports him at the door.","at":"gf1","v":1},
  {"t":"His echo comes out of Voldemort's wand and urges Harry to fight.","at":"gf34","v":1}]},
 {"id":"bertha","kind":"person","g":"f","name":"Bertha Jorkins","appear":"gf1","tag":[{"t":"A Ministry witch, murdered","at":"gf1","state":"fallen"}],"rel":["ministry","voldemort","bagman","pettigrew","crouch_jr","albania"],"relAt":{"pettigrew":"gf33","crouch_jr":"gf35","albania":"gf19"},"facts":[
  {"t":"Voldemort has questioned her and killed her. What she knew is the foundation of his plan.","at":"gf1","v":1},
  {"t":"Works in Ludo Bagman's department and has been missing for over a month. Bagman says she has no memory and no sense of direction, and is not looking.","at":"gf5","v":1},
  {"t":"Was at school with Sirius: nosy, and not bright. She vanished in Albania, where Voldemort was last rumored to be.","at":"gf19","v":1},
  {"t":"Ran into Wormtail at an inn there and was brought to Voldemort. She told him about the tournament and about a faithful Death Eater kept hidden.","at":"gf33","v":1},
  {"t":"Years ago she walked in on the Crouches' secret, and Mr. Crouch put a Memory Charm on her so strong it damaged her mind for good. Voldemort broke through it.","at":"gf35","v":1}]},
 {"id":"amos","kind":"person","g":"m","name":"Amos Diggory","appear":"gf6","tag":[{"t":"Cedric's father","at":"gf6"}],"rel":["cedric","ministry"],"facts":[
  {"t":"Ruddy and bearded, works with magical creatures at the Ministry. Cannot stop telling people his son beat Harry Potter at Quidditch.","at":"gf6","v":1},
  {"t":"Finds Winky under the Dark Mark with a wand in her hand, and accuses Harry until the others shame him out of it.","at":"gf9","v":1},
  {"t":"Blames Harry for a newspaper article that ignores Cedric.","at":"gf31","v":1},
  {"t":"Does not blame Harry for his son's death, and thanks him for bringing the body home.","at":"gf36","v":1}]},
 {"id":"bagman","kind":"person","g":"m","name":"Ludo Bagman","appear":"gf5","tag":[{"t":"Head of Magical Games and Sports","at":"gf5"},{"t":"On the run from goblins","at":"gf37","state":"away"}],"rel":["ministry","crouch","fred","george","bertha","tournament"],"facts":[
  {"t":"A former Beater for England gone to seed, round-faced and boyish in his old striped robes. Takes bets from everybody at the World Cup, the twins included.","at":"gf7","v":1},
  {"t":"One of the five judges of the tournament.","at":"gf16","v":1},
  {"t":"Offers Harry quiet advice before the first task, which Harry turns down.","at":"gf20","v":1},
  {"t":"Pursued round Hogsmeade by a group of goblins.","at":"gf24","v":1},
  {"t":"Tried years ago for passing information to a Death Eater, a family friend he thought was collecting it for our side. Acquitted, mostly for being popular.","at":"gf30","v":1},
  {"t":"Paid the twins in leprechaun gold, which vanishes. He owed the goblins a fortune, bet them Harry would win outright to clear it, and ran when they called it a draw.","at":"gf37","v":1}]},
 {"id":"crouch","kind":"person","g":"m","name":[{"t":"Mr. Crouch","at":"gf5"},{"t":"Barty Crouch","at":"gf7"}],"appear":"gf5","tag":[{"t":"Head of International Magical Cooperation","at":"gf5"},{"t":"Missing","at":"gf28"},{"t":"Murdered by his son","at":"gf35","state":"fallen"}],"rel":["ministry","percy","winky","bagman","tournament","crouch_jr","voldemort"],"relAt":{"crouch_jr":"gf27","voldemort":"gf35"},"facts":[
  {"t":"Percy's new boss, and Percy's hero.","at":"gf5","v":1},
  {"t":"Stiff, immaculate, with a toothbrush moustache and a ruler-straight parting. Speaks two hundred languages and cannot get Percy's name right.","at":"gf7","v":1},
  {"t":"When his elf is found with the wand that cast the Dark Mark, he sacks her on the spot.","at":"gf9","v":1},
  {"t":"One of the five judges. Says the Goblet's choice is a binding magical contract, so Harry must compete.","at":"gf16","v":1},
  {"t":"Stops coming to work, sending instructions to Percy by owl.","at":"gf23","v":1},
  {"t":"Once the ruthless head of law enforcement, tipped for Minister. He let Aurors kill, sent people to Azkaban without trial, and gave his own son a public trial and a life sentence.","at":"gf27","v":1},
  {"t":"Comes out of the forest at night in rags, talking to trees. In clear moments he begs for Dumbledore and says it is his fault: his son, a woman dead, the Dark Lord stronger.","at":"gf28","v":1},
  {"t":"Smuggled his dying wife into Azkaban in his son's place and kept the son hidden at home under the Imperius Curse for years.","at":"gf35","v":1},
  {"t":"Put under the Imperius Curse himself by Voldemort. He fought it off, got as far as the grounds, and was killed there by his son and buried as a bone in Hagrid's garden.","at":"gf35","v":1}]},
 {"id":"crouch_jr","kind":"person","g":"m","name":[{"t":"Mr. Crouch's son","at":"gf27"},{"t":"Barty Crouch Jr.","at":"gf35"}],"appear":"gf27","tag":[{"t":"Died in Azkaban","at":"gf27","state":"fallen"},{"t":"Alive, and at Hogwarts all year","at":"gf35"},{"t":"Kissed by a Dementor","at":"gf36","state":"fallen"}],"rel":["crouch","winky","lestranges","moody","voldemort","followers","polyjuice"],"relAt":{"winky":"gf35","lestranges":"gf30","moody":"gf35","voldemort":"gf35","followers":"gf35","polyjuice":"gf35"},"facts":[
  {"t":"Caught as a boy of about nineteen with a group of Death Eaters, and sent to Azkaban by his own father. Said to have died there within a year.","at":"gf27","v":1},
  {"t":"In Dumbledore's memory he is pale, straw-haired and freckled, screaming to his mother that he is innocent as the Dementors take him.","at":"gf30","v":1},
  {"t":"Never died. His mother took his place under Polyjuice Potion, and he lived at home for years under an Invisibility Cloak and his father's Imperius Curse, with Winky as keeper.","at":"gf35","v":1},
  {"t":"At the World Cup he was in the empty seat beside Winky. He stole Harry's wand and cast the Dark Mark, furious at the Death Eaters who had walked free.","at":"gf35","v":1},
  {"t":"Freed by Voldemort, he overpowered Mad-Eye Moody and spent the year as him. He put Harry's name in the Goblet, steered him through each task, and turned the Cup into a Portkey.","at":"gf35","v":1},
  {"t":"Fudge brings a Dementor to the room where he is held, and it Kisses him before he can repeat a word to anyone else.","at":"gf36","v":1}]},
 {"id":"winky","kind":"person","g":"f","name":"Winky","appear":"gf8","tag":[{"t":"Mr. Crouch's house-elf","at":"gf8"},{"t":"Dismissed","at":"gf9"},{"t":"Working at Hogwarts","at":"gf21"}],"rel":["crouch","dobby","house_elves","kitchens","crouch_jr"],"relAt":{"dobby":"gf21","kitchens":"gf21","crouch_jr":"gf35"},"sub":"House-elf","facts":[
  {"t":"Tiny, with a tomato nose and brown eyes. Sits high up in the Top Box, terrified of heights, keeping a seat for her master. Thinks Dobby's ideas about pay are shameful.","at":"gf8","v":1},
  {"t":"Found unconscious below the Dark Mark, holding Harry's wand. Mr. Crouch gives her clothes.","at":"gf9","v":1},
  {"t":"Dobby has brought her to the Hogwarts kitchens. She cries most of the day and will not hear a word against Mr. Crouch.","at":"gf21","v":1},
  {"t":"Has taken to drinking, and says she keeps her master's secrets.","at":"gf28","v":1},
  {"t":"She was the son's keeper. It was she who talked Mr. Crouch into letting him see the match.","at":"gf35","v":1}]},
 {"id":"krum","kind":"person","g":"m","name":"Viktor Krum","appear":"gf5","tag":[{"t":"Seeker for Bulgaria","at":"gf5"},{"t":"Durmstrang champion","at":"gf16"}],"rel":["durmstrang","champions","karkaroff","hermione","cedric"],"relAt":{"hermione":"gf23"},"facts":[
  {"t":"Eighteen and already called the best Seeker in the world.","at":"gf5","v":1},
  {"t":"Thin, sallow and beaky, round-shouldered on the ground and something else in the air. Catches the Snitch knowing his side will still lose, to end it on his own terms.","at":"gf8","v":1},
  {"t":"Still at school, it turns out. Arrives with the Durmstrang party.","at":"gf15","v":1},
  {"t":"The Goblet's first choice.","at":"gf16","v":1},
  {"t":"Faces a Chinese Fireball in the first task and ties with Harry for the lead.","at":"gf20","v":1},
  {"t":"Takes Hermione to the Yule Ball. He had been coming to the library every day to work up the nerve.","at":"gf23","v":1},
  {"t":"Half turns himself into a shark for the second task. Hermione is the one he has to rescue.","at":"gf26","v":1},
  {"t":"Asks Harry whether there is anything between him and Hermione. Stunned from behind while guarding Mr. Crouch.","at":"gf28","v":1},
  {"t":"Put under the Imperius Curse in the maze and made to torture Cedric.","at":"gf31","v":1},
  {"t":"Asks Hermione to write, and says goodbye to Harry and Ron as a friend.","at":"gf37","v":1},
  {"t":"A guest at the wedding. Grindelwald killed his grandfather.","at":"dh8","v":1}]},
 {"id":"fleur","kind":"person","g":"f","name":"Fleur Delacour","appear":"gf16","tag":[{"t":"Beauxbatons champion","at":"gf16"},{"t":"Engaged to Bill Weasley","at":"hb5"},{"t":"Married to Bill Weasley","at":"dh8"}],"rel":["beauxbatons","champions","maxime","gabrielle","veela","bill","burrow","shell_cottage"],"relAt":{"veela":"gf18","bill":"hb5","burrow":"hb5"},"facts":[
  {"t":"Silvery-blonde and startlingly beautiful, and unimpressed by everything at Hogwarts.","at":"gf16","v":1},
  {"t":"Her wand holds a hair from her grandmother, who was a veela.","at":"gf18","v":1},
  {"t":"Puts a Welsh Green to sleep in the first task and has her skirt set alight by its snore.","at":"gf20","v":1},
  {"t":"Driven back by grindylows in the lake. Harry brings up her little sister, and after that she cannot do enough for him.","at":"gf26","v":1},
  {"t":"Knocked out of the maze early.","at":"gf31","v":1},
  {"t":"Hopes to come back to Britain to improve her English.","at":"gf37","v":1},
  {"t":"Working at Gringotts, and seeing a lot of Bill.","at":"op4","v":1},
  {"t":"Staying at the Burrow to get to know the family, who call her Phlegm behind her back.","at":"hb5","v":1},
  {"t":"Asked whether she still wants to marry Bill, she is outraged: she is good-looking enough for both of them. Mrs. Weasley gives in.","at":"hb29","v":1},
  {"t":"One of the six decoys.","at":"dh4","v":1},
  {"t":"Marries Bill.","at":"dh8","v":1},
  {"t":"Nurses the rescued prisoners.","at":"dh24","v":1}]},
 {"id":"gabrielle","kind":"person","g":"f","name":"Gabrielle Delacour","appear":"gf26","tag":[{"t":"Fleur's little sister","at":"gf26"}],"rel":["fleur"],"facts":[
  {"t":"About eight. The hostage Fleur could not reach. Harry brings her to the surface.","at":"gf26","v":1}]},
 {"id":"maxime","kind":"person","g":"f","name":"Madame Maxime","appear":"gf15","tag":[{"t":"Headmistress of Beauxbatons","at":"gf15"}],"rel":["beauxbatons","hagrid","fleur","giants"],"relAt":{"hagrid":"gf19","giants":"gf23"},"facts":[
  {"t":"As tall as Hagrid, handsome and olive-skinned, in black satin and opals.","at":"gf15","v":1},
  {"t":"Hagrid, smitten, shows her the dragons.","at":"gf19","v":1},
  {"t":"When Hagrid tells her he is half giant and asks which side it is on in her case, she is deeply offended and says she merely has big bones.","at":"gf23","v":1},
  {"t":"Agrees to go with Hagrid on a mission for Dumbledore.","at":"gf36","v":1},
  {"t":"Went to the giants with Hagrid, and was quicker with a wand than he expected.","at":"op20","v":1}]},
 {"id":"karkaroff","kind":"person","g":"m","name":[{"t":"Professor Karkaroff","at":"gf15"},{"t":"Igor Karkaroff","at":"gf23"}],"appear":"gf15","tag":[{"t":"Headmaster of Durmstrang","at":"gf15"},{"t":"Fled","at":"gf37","state":"away"},{"t":"Killed by Death Eaters","at":"hb6","state":"fallen"}],"rel":["durmstrang","krum","snape","followers","moody"],"relAt":{"snape":"gf23","followers":"gf19","moody":"gf19"},"facts":[
  {"t":"Thin, with a silver goatee and a smile that stops short of his eyes. Fusses over Krum and ignores his other students.","at":"gf15","v":1},
  {"t":"A Death Eater. Moody caught him, and he got out of Azkaban by handing the Ministry other names.","at":"gf19","v":1},
  {"t":"Tells Snape that something has been growing clearer for months and that he is seriously worried. Snape tells him to flee if he likes.","at":"gf23","v":1},
  {"t":"Shows Snape something on his left forearm.","at":"gf27","v":1},
  {"t":"In the Pensieve he names a list of Death Eaters to the court, Snape among them.","at":"gf30","v":1},
  {"t":"Felt the Mark burn on the night of the third task and ran.","at":"gf37","v":1},
  {"t":"Found dead in a shack in the north, with the Dark Mark over it. He lasted a year.","at":"hb6","v":1}]},
 {"id":"moody","kind":"person","g":"m","name":[{"t":"Mad-Eye Moody","at":"gf11"},{"t":"Alastor Moody","at":"gf17"}],"appear":"gf11","tag":[{"t":"A retired Auror","at":"gf11"},{"t":"Defense Against the Dark Arts teacher","at":"gf12"},{"t":"Held prisoner all year","at":"gf35"},{"t":"Recovering","at":"gf37"},{"t":"Killed","at":"dh5","state":"fallen"}],"rel":["aurors","staff","dada","unforgivable","karkaroff","dumbledore","crouch_jr","map","order","tonks"],"relAt":{"karkaroff":"gf19","crouch_jr":"gf35","map":"gf25"},"facts":[
  {"t":"Once the Ministry's best Dark wizard catcher, now retired and so jumpy that he attacks his own dustbins. Half the cells in Azkaban are full because of him.","at":"gf11","v":1},
  {"t":"Grizzled and scarred, with a chunk out of his nose, a wooden leg, and one electric-blue eye that swivels on its own and sees through doors, cloaks and the back of his head.","at":"gf12","v":1},
  {"t":"Drinks only from his own hip flask.","at":"gf12","v":1},
  {"t":"Turns Malfoy into a white ferret for attacking Harry from behind, and bounces him up and down the hall.","at":"gf13","v":1},
  {"t":"Shows the fourth years the three Unforgivable Curses on spiders, then puts each of them under the Imperius Curse to teach them to fight it.","at":"gf14","v":1},
  {"t":"Says the Goblet must have been tricked by a powerful wizard, and that the idea was for Harry to die in the tournament.","at":"gf17","v":1},
  {"t":"Finds Harry stuck in a trick step under his Cloak, covers for him with Snape, and borrows the Marauder's Map.","at":"gf25","v":1},
  {"t":"The man teaching all year was an impostor. The real Moody was kept alive at the bottom of his own seven-locked trunk, for his hair and his knowledge.","at":"gf35","v":1},
  {"t":"Back, and twice as twitchy.","at":"gf37","v":1},
  {"t":"Runs the flight to London like a military operation.","at":"op3","v":1},
  {"t":"Shows Harry a photograph of the first Order.","at":"op9","v":1},
  {"t":"Fights at the Ministry.","at":"op35","v":1},
  {"t":"Plans the move from Privet Drive.","at":"dh4","v":1},
  {"t":"Killed by Voldemort in the air. His body is not found.","at":"dh5","v":1},
  {"t":"Harry takes his eye from Umbridge's door and buries it under a tree.","at":"dh13","v":1}]},
 {"id":"skeeter","kind":"person","g":"f","name":"Rita Skeeter","appear":"gf10","tag":[{"t":"Reporter for the Daily Prophet","at":"gf10"},{"t":"Caught by Hermione","at":"gf37"}],"rel":["hermione","hagrid","harry","animagus","bathilda","dumbledores"],"relAt":{"hermione":"gf24","hagrid":"gf24","animagus":"gf37"},"facts":[
  {"t":"Writes up the World Cup riot as a Ministry disgrace.","at":"gf10","v":1},
  {"t":"Curled blonde hair, jeweled glasses, crimson talons. Interviews Harry in a broom cupboard while her Quick-Quotes Quill writes something else entirely.","at":"gf18","v":1},
  {"t":"Her article makes Harry a tragic orphan who cries at night.","at":"gf19","v":1},
  {"t":"Banned from the grounds by Dumbledore. Prints that Hagrid is half giant and dangerous anyway.","at":"gf24","v":1},
  {"t":"Turns on Hermione, as a schemer toying with famous boys' hearts.","at":"gf27","v":1},
  {"t":"Reports, on the day of the third task, that Harry is disturbed and possibly dangerous.","at":"gf31","v":1},
  {"t":"An unregistered Animagus: a beetle. She has been perching on windowsills and in people's hair all year. Hermione catches her in a jar and lets her out on condition she writes nothing for a year.","at":"gf37","v":1},
  {"t":"Has written a biography of Dumbledore in four weeks.","at":"dh2","v":1},
  {"t":"Her book prints a letter from the young Dumbledore to Grindelwald.","at":"dh18","v":1}]},
 {"id":"narcissa","kind":"person","g":"f","name":"Narcissa Malfoy","appear":"gf8","tag":[{"t":"Draco's mother","at":"gf8"}],"rel":["lucius","draco","malfoys","blacks","bellatrix","kreacher","vow","snape","spinners_end","malfoy_manor"],"relAt":{"blacks":"op6","bellatrix":"op6","kreacher":"op37","snape":"hb2"},"facts":[
  {"t":"Blonde, tall and slim, and would be good-looking if she did not look as though there were a bad smell under her nose.","at":"gf8","v":1},
  {"t":"Born a Black: Sirius's cousin and Bellatrix's sister.","at":"op6","v":1},
  {"t":"Kreacher went to her at Christmas.","at":"op37","v":1},
  {"t":"Goes to Snape against Voldemort's orders and her sister's advice, and on her knees asks him to save her only son.","at":"hb2","v":1},
  {"t":"Fitted for robes beside Harry, and tells him he will not always have Dumbledore.","at":"hb6","v":1},
  {"t":"Sent to check whether Harry is dead. Feels his heartbeat, asks under her breath whether Draco is alive, and tells Voldemort that Harry is dead. She only wants to get into the castle to find her son.","at":"dh36","v":1}]},
 {"id":"roberts","kind":"person","g":"m","name":"Mr. Roberts","appear":"gf7","tag":[{"t":"The Muggle campsite manager","at":"gf7"}],"rel":["worldcup"],"facts":[
  {"t":"Keeps noticing odd things about his campers, and keeps having his memory wiped.","at":"gf7","v":1},
  {"t":"Floated in the air with his wife and children by a masked crowd.","at":"gf9","v":1}]},
 {"id":"dennis","kind":"person","g":"m","name":"Dennis Creevey","appear":"gf12","tag":[{"t":"First-year Gryffindor","at":"gf12"}],"rel":["colin","gryffindor"],"facts":[
  {"t":"Colin's little brother. Falls in the lake on the way to the Sorting and is delighted about it.","at":"gf12","v":1}]},
 {"id":"padma","kind":"person","g":"f","name":"Padma Patil","appear":"gf22","tag":[{"t":"Fourth-year Ravenclaw","at":"gf22"}],"rel":["parvati","ravenclaw","ron"],"facts":[
  {"t":"Parvati's twin. Goes to the Yule Ball with Ron, who ignores her all evening.","at":"gf22","v":1}]},
 {"id":"grubbly","kind":"person","g":"f","name":"Professor Grubbly-Plank","appear":"gf24","tag":[{"t":"Substitute teacher","at":"gf24"}],"rel":["comc","hagrid"],"facts":[
  {"t":"An elderly witch with cropped gray hair who takes Hagrid's lessons while he hides. The girls like her unicorns.","at":"gf24","v":1},
  {"t":"Covers Hagrid's lessons until he returns.","at":"op11","v":1}]},
 {"id":"longbottoms","kind":"person","name":[{"t":"Frank Longbottom and his wife","at":"gf30"},{"t":"Frank and Alice Longbottom","at":"op9"}],"appear":"gf30","tag":[{"t":"Neville's parents","at":"gf30"}],"rel":["neville","aurors","lestranges","crouch_jr","mungos","gran","order","bellatrix"],"relAt":{"crouch_jr":"gf30","bellatrix":"op25"},"facts":[
  {"t":"Aurors, and very popular. After Voldemort fell they were tortured with the Cruciatus Curse for news of him, until they lost their minds.","at":"gf30","v":1},
  {"t":"They live in St. Mungo's Hospital and do not recognise their son.","at":"gf30","v":1},
  {"t":"On the closed ward. Alice is thin and white-haired and drifts over to give her son something from her pocket.","at":"op23","v":1}]},
 {"id":"mundungus","kind":"person","g":"m","name":"Mundungus Fletcher","appear":"gf10","tag":[{"t":"A petty crook","at":"gf10"},{"t":"A member of the Order","at":"op1"},{"t":"Fled","at":"dh5"}],"rel":["arthur","order","figg","locket"],"relAt":{"figg":"op2","locket":"dh10"},"facts":[
  {"t":"Puts in a claim for a twelve-bedroomed tent after the World Cup riot. Mr. Weasley knows he was sleeping under a cloak on sticks.","at":"gf10","v":1},
  {"t":"One of the old crowd Dumbledore asks Sirius to alert.","at":"gf36","v":1},
  {"t":"Ginger, squat and unshaven. Slips away from guard duty over a deal in stolen cauldrons on the evening of the attack.","at":"op1","v":1},
  {"t":"Knows every crook in London, which is his use to the Order.","at":"op5","v":1},
  {"t":"In the Hog's Head under a veil, keeping an eye on Harry.","at":"op16","v":1},
  {"t":"Caught in Hogsmeade selling silver stolen from Grimmauld Place.","at":"hb12","v":1},
  {"t":"Sent to Azkaban for impersonating an Inferius during a burglary.","at":"hb21","v":1},
  {"t":"One of the six decoys, unwillingly.","at":"dh4","v":1},
  {"t":"Disapparates the moment Voldemort appears, leaving Moody exposed.","at":"dh5","v":1},
  {"t":"Admits he took the locket from Grimmauld Place and lost it to a Ministry witch.","at":"dh11","v":1},
  {"t":"The decoy plan was put into his head by Snape, on Dumbledore's orders.","at":"dh33","v":1}]},
 {"id":"nagini","kind":"creature","name":"Nagini","appear":"gf1","tag":[{"t":"Voldemort's snake","at":"gf1"},{"t":"Killed by Neville","at":"dh36","state":"fallen"}],"rel":["voldemort","pettigrew","hangleton","horcruxes","bathilda","neville"],"sub":"Snake","owner":{"id":"voldemort","at":"gf1"},"attrs":{"Kind":"Snake"},"relAt":{"horcruxes":"hb23","neville":"dh36"},"facts":[
  {"t":"A giant snake, twelve feet long. Voldemort speaks to her, and is kept alive on a potion made with her venom.","at":"gf1","v":1},
  {"t":"Circles the grave in the churchyard while the potion is made.","at":"gf32","v":1},
  {"t":"The snake that attacks Mr. Weasley. Harry sees it from behind her eyes.","at":"op21","v":1},
  {"t":"Dumbledore suspects Voldemort has made her a Horcrux. He keeps her close and has unusual control over her.","at":"hb23","v":1},
  {"t":"Hidden in Bathilda Bagshot's body.","at":"dh17","v":1},
  {"t":"Kept beside Voldemort from now on.","at":"dh27","v":1},
  {"t":"Kills Snape.","at":"dh32","v":1},
  {"t":"Beheaded with the sword of Gryffindor. The last Horcrux.","at":"dh36","v":1}]},
 {"id":"horntail","kind":"creature","name":"The Hungarian Horntail","appear":"gf19","tag":[{"t":"Harry's dragon in the first task","at":"gf19"}],"rel":["dragons","harry","charlie","firebolt"],"sub":"Dragon","attrs":{"Kind":"Hungarian Horntail"},"facts":[
  {"t":"Black and lizard-like, with bronze horns and a spiked tail. Charlie Weasley calls it the worst of the four.","at":"gf19","v":1},
  {"t":"Harry lures it off its eggs by flying, takes a gash in the shoulder from its tail, and gets the golden egg faster than anyone.","at":"gf20","v":1}]},
 {"id":"skrewts","kind":"creature","name":"Blast-Ended Skrewts","appear":"gf13","tag":[{"t":"Hagrid's new project","at":"gf13"}],"rel":["hagrid","comc","maze"],"relAt":{"maze":"gf31"},"sub":"Species","facts":[
  {"t":"Pale, slimy, shell-less things that smell of rotting fish. Some sting, some suck blood, and all of them shoot sparks from one end.","at":"gf13","v":1},
  {"t":"They grow to six feet, armored, and kill each other until few are left.","at":"gf21","v":1},
  {"t":"One of the last is loose in the maze.","at":"gf31","v":1}]},
 {"id":"veela","kind":"creature","name":"Veela","appear":"gf8","tag":[{"t":"Bulgaria's mascots","at":"gf8"}],"rel":["fleur"],"sub":"Species","facts":[
  {"t":"Women of unearthly beauty whose dancing makes men forget themselves. Angered, they sprout beaks and scaly wings and throw fire.","at":"gf8","v":1}]},
 {"id":"leprechauns","kind":"creature","name":"Leprechauns","appear":"gf8","tag":[{"t":"Ireland's mascots","at":"gf8"}],"rel":["bagman"],"sub":"Species","facts":[
  {"t":"Tiny bearded men who shower the crowd with gold coins.","at":"gf8","v":1},
  {"t":"Their gold vanishes after a few hours.","at":"gf28","v":1}]},
 {"id":"merpeople","kind":"creature","name":"Merpeople","appear":"gf25","tag":[{"t":"Live at the bottom of the lake","at":"gf25"}],"rel":["lake","egg","dumbledore"],"relAt":{"dumbledore":"gf26"},"sub":"Species","facts":[
  {"t":"Their voices are a screech above water and a song beneath it.","at":"gf25","v":1},
  {"t":"Gray-skinned and green-haired, with spears and broken yellow teeth. Their village of stone huts is where the hostages are tied. Dumbledore speaks their language.","at":"gf26","v":1}]},
 {"id":"giants","kind":"creature","name":"Giants","appear":"gf23","tag":[{"t":"Feared, and nearly gone from Britain","at":"gf23"}],"rel":["hagrid","maxime","grawp"],"sub":"Species","facts":[
  {"t":"Huge, violent, and on Voldemort's side last time. Aurors killed many, and the rest live abroad in the mountains.","at":"gf23","v":1},
  {"t":"Dumbledore wants envoys sent to them before Voldemort gets there.","at":"gf36","v":1},
  {"t":"About eighty are left, in the mountains far to the east. Their chief took Dumbledore's gifts, and was killed the next night by a rival who preferred the Death Eaters.","at":"op20","v":1},
  {"t":"A hurricane in the West Country was their work.","at":"hb1","v":1}]},
 {"id":"nifflers","kind":"creature","name":"Nifflers","appear":"gf28","tag":[{"t":"Treasure hunters","at":"gf28"}],"rel":["hagrid","comc"],"sub":"Species","facts":[
  {"t":"Fluffy and black with long snouts. They dig for anything shiny, and for once a lesson of Hagrid's is a success.","at":"gf28","v":1}]},
 {"id":"unforgivable","kind":"magic","name":"The Unforgivable Curses","appear":"gf14","tag":[{"t":"Three curses that mean a life in Azkaban","at":"gf14"}],"rel":["imperius","cruciatus","killing_curse","moody"],"group":"lore","sub":"Law","facts":[
  {"t":"The Imperius, Cruciatus and Killing Curses. Using any one of them on a human being carries a life sentence.","at":"gf14","v":1},
  {"t":"In the last days of the war, Mr. Crouch gave Aurors leave to use them.","at":"gf27","v":1}]},
 {"id":"imperius","kind":"magic","name":"The Imperius Curse","appear":"gf14","tag":[{"t":"Total control","at":"gf14"}],"rel":["unforgivable","moody","harry","crouch_jr","crouch"],"relAt":{"harry":"gf15","crouch_jr":"gf35","crouch":"gf35"},"group":"spell","sub":"Curse","facts":[
  {"t":"The victim does whatever the caster wishes, and feels wonderful about it. After Voldemort fell, many claimed to have been under it.","at":"gf14","v":1},
  {"t":"It can be thrown off, with real strength of mind. Harry manages it in class after a few tries.","at":"gf15","v":1},
  {"t":"Voldemort tries it on Harry in front of the Death Eaters, and Harry refuses.","at":"gf34","v":1},
  {"t":"Used on Ministry workers to send them after the prophecy.","at":"op26","v":1},
  {"t":"Madam Rosmerta spent most of a year under it.","at":"hb27","v":1},
  {"t":"Harry uses it on a goblin and a Death Eater in Gringotts.","at":"dh26","v":1}]},
 {"id":"cruciatus","kind":"magic","name":"The Cruciatus Curse","appear":"gf14","tag":[{"t":"Pain","at":"gf14"}],"rel":["unforgivable","moody","neville","longbottoms"],"relAt":{"longbottoms":"gf30"},"group":"spell","sub":"Curse","facts":[
  {"t":"Torture, with nothing else to it. Neville cannot bear to watch it done to a spider.","at":"gf14","v":1},
  {"t":"It is what was done to Neville's parents.","at":"gf30","v":1},
  {"t":"Voldemort uses it on Harry, and on his own followers.","at":"gf33","v":1},
  {"t":"Harry tries it on Bellatrix in rage. It knocks her down and no more.","at":"op36","v":1},
  {"t":"Taught at Hogwarts.","at":"dh29","v":1},
  {"t":"Harry uses it once.","at":"dh30","v":1}]},
 {"id":"killing_curse","kind":"magic","name":"The Killing Curse","appear":"gf14","tag":[{"t":"Avada Kedavra","at":"gf14"}],"rel":["unforgivable","harry","voldemort","scar"],"group":"spell","sub":"Curse","facts":[
  {"t":"A flash of green light and a rushing sound, and the victim is dead without a mark. There is no countercurse and no blocking it.","at":"gf14","v":1},
  {"t":"Only one person is known to have survived it. This is how Harry's parents died, and what the green light in his memory is.","at":"gf14","v":1},
  {"t":"Wormtail uses it on Cedric.","at":"gf32","v":1},
  {"t":"Snape uses it on Dumbledore.","at":"hb27","v":1},
  {"t":"Harry takes it without defending himself.","at":"dh34","v":1},
  {"t":"It rebounds on Voldemort a second time.","at":"dh36","v":1}]},
 {"id":"accio","kind":"magic","name":"The Summoning Charm","appear":"gf6","tag":[{"t":"Accio","at":"gf6"}],"rel":["mrs_weasley","harry","hermione","firebolt"],"group":"spell","sub":"Charm","holders":[{"id":"mrs_weasley","at":"gf6"},{"id":"harry","at":"gf20"}],"facts":[
  {"t":"Mrs. Weasley uses it to pull hidden joke sweets out of the twins' pockets.","at":"gf6","v":1},
  {"t":"Harry cannot do it until the night before the first task. Then he calls his Firebolt to him from the castle.","at":"gf20","v":1},
  {"t":"He uses it in the graveyard to bring the Cup to his hand.","at":"gf34","v":1}]},
 {"id":"dark_mark","kind":"magic","name":"The Dark Mark","appear":"gf9","tag":[{"t":"Voldemort's sign","at":"gf9"}],"rel":["voldemort","followers","winky","crouch_jr","snape"],"relAt":{"crouch_jr":"gf35","snape":"gf36"},"group":"lore","sub":"Sign","facts":[
  {"t":"A vast green skull with a snake for a tongue, shot into the sky. Voldemort's followers set it over any house where they had killed. It has not been seen for thirteen years.","at":"gf9","v":1},
  {"t":"The spell is known only to Death Eaters. The masked marchers flee when they see it.","at":"gf9","v":1},
  {"t":"It is also branded on every Death Eater's left forearm. Touching one summons the rest.","at":"gf33","v":1},
  {"t":"Snape shows Fudge the Mark on his own arm, burned black. It has been coming back all year.","at":"gf36","v":1},
  {"t":"Set over the Astronomy Tower to bring Dumbledore back.","at":"hb27","v":1}]},
 {"id":"portkey","kind":"magic","name":"Portkeys","appear":"gf6","tag":[{"t":"An object that takes you somewhere","at":"gf6"}],"rel":["worldcup","cup"],"group":"object","sub":"Travel","facts":[
  {"t":"Anything, usually a piece of rubbish Muggles will not pick up, bewitched to carry whoever touches it to a set place at a set time.","at":"gf6","v":1},
  {"t":"The Triwizard Cup has been made into one.","at":"gf32","v":1},
  {"t":"Dumbledore makes one from a kettle to send the Weasleys to London.","at":"op22","v":1}]},
 {"id":"goblet","kind":"magic","name":"The Goblet of Fire","appear":"gf16","tag":[{"t":"Chooses the champions","at":"gf16"}],"rel":["tournament","champions","moody","crouch_jr"],"relAt":{"moody":"gf17","crouch_jr":"gf35"},"group":"object","sub":"Judge","facts":[
  {"t":"A roughly cut wooden cup full of blue-white flames. Students drop in their names, and on Halloween it throws out one for each school.","at":"gf16","v":1},
  {"t":"Dumbledore draws an Age Line round it to keep out the under-age. The twins try an Aging Potion and end up with long white beards.","at":"gf16","v":1},
  {"t":"It gives a fourth name. Whoever entered Harry must have confused it into thinking there was a fourth school.","at":"gf17","v":1}]},
 {"id":"tournament","kind":"magic","name":"The Triwizard Tournament","appear":"gf12","tag":[{"t":"Three schools, three tasks","at":"gf12"}],"rel":["goblet","champions","beauxbatons","durmstrang","bagman","crouch","cup","egg","maze"],"group":"lore","sub":"Contest","facts":[
  {"t":"A contest begun seven hundred years ago between Hogwarts, Beauxbatons and Durmstrang, and dropped because the death toll got too high. Revived this year, with a thousand Galleons for the winner.","at":"gf12","v":1},
  {"t":"The first task: take a golden egg from a nesting dragon.","at":"gf20","v":1},
  {"t":"The second: recover a hostage from the bottom of the lake within an hour.","at":"gf26","v":1},
  {"t":"The third: a maze full of obstacles, with the Cup at the center.","at":"gf31","v":1},
  {"t":"Harry is given the prize money, without ceremony. He does not want it.","at":"gf36","v":1}]},
 {"id":"egg","kind":"magic","name":"The golden egg","appear":"gf20","tag":[{"t":"The prize of the first task","at":"gf20"}],"rel":["tournament","cedric","myrtle","merpeople"],"relAt":{"cedric":"gf23","myrtle":"gf25"},"group":"object","sub":"Clue","facts":[
  {"t":"Hinged, and hollow. Opened in the air it only screeches.","at":"gf20","v":1},
  {"t":"Opened under water, it sings: the merpeople will take what the champion would miss most, and there is one hour to get it back.","at":"gf25","v":1}]},
 {"id":"cup","kind":"magic","name":"The Triwizard Cup","appear":"gf31","tag":[{"t":"At the heart of the maze","at":"gf31"}],"rel":["tournament","maze","portkey","crouch_jr"],"relAt":{"crouch_jr":"gf35"},"group":"object","sub":"Trophy","facts":[
  {"t":"Harry and Cedric each insist the other should take it, and settle on taking it together.","at":"gf31","v":1},
  {"t":"A Portkey. It carries them both to a graveyard.","at":"gf32","v":1},
  {"t":"It takes Harry back, with Cedric's body.","at":"gf34","v":1}]},
 {"id":"gillyweed","kind":"magic","name":"Gillyweed","appear":"gf26","tag":[{"t":"Lets you breathe underwater","at":"gf26"}],"rel":["dobby","harry","snape"],"group":"potion","sub":"Plant","facts":[
  {"t":"A ball of slimy gray-green rat tails. Swallowed, it gives the eater gills and webbed hands and feet for about an hour.","at":"gf26","v":1},
  {"t":"Dobby steals it from Snape's office, having overheard two teachers discuss it.","at":"gf26","v":1},
  {"t":"That conversation was staged for Dobby to hear.","at":"gf35","v":1}]},
 {"id":"veritaserum","kind":"magic","name":"Veritaserum","appear":"gf27","tag":[{"t":"A truth potion","at":"gf27"}],"rel":["snape","crouch_jr"],"relAt":{"crouch_jr":"gf35"},"group":"potion","sub":"Potion","facts":[
  {"t":"Clear as water. Three drops and the drinker tells everything. Snape threatens to slip it into Harry's pumpkin juice.","at":"gf27","v":1},
  {"t":"Used on the impostor, who tells the whole story.","at":"gf35","v":1}]},
 {"id":"pensieve","kind":"magic","name":"The Pensieve","appear":"gf30","tag":[{"t":"Holds memories","at":"gf30"}],"rel":["dumbledore","office","snape"],"group":"object","sub":"Basin","holders":[{"id":"dumbledore","at":"gf30"}],"relAt":{"snape":"op28"},"facts":[
  {"t":"A shallow stone basin with runes round the rim, filled with something silver that is neither liquid nor gas.","at":"gf30","v":1},
  {"t":"Dumbledore draws thoughts out of his head with his wand and stores them there, to look at patterns later. Anyone who leans in falls into the memory.","at":"gf30","v":1},
  {"t":"Snape puts certain memories into it before each lesson.","at":"op24","v":1},
  {"t":"Dumbledore uses it to show Harry the prophecy being made.","at":"op37","v":1},
  {"t":"Used for Dumbledore's lessons.","at":"hb10","v":1},
  {"t":"Harry pours Snape's memories into it.","at":"dh33","v":1}]},
 {"id":"priori","kind":"magic","name":"Priori Incantatem","appear":"gf34","tag":[{"t":"When brother wands meet","at":"gf34"}],"rel":["wand_harry","voldemort","harry","fawkes"],"group":"lore","sub":"Effect","facts":[
  {"t":"Harry's spell and Voldemort's meet, and a thread of gold light joins the two wands. Voldemort's wand begins to give back its last spells in reverse.","at":"gf34","v":1},
  {"t":"Shadows of the people it has killed climb out of it, most recent first.","at":"gf34","v":1},
  {"t":"Wands that share a core will not fight each other properly. The feather in both came from Fawkes.","at":"gf36","v":1}]},
 {"id":"moody_eye","kind":"magic","name":"Moody's eye and trunk","appear":"gf12","tag":[{"t":"A magical eye, and a trunk with seven locks","at":"gf12"}],"rel":["moody","crouch_jr"],"relAt":{"crouch_jr":"gf35"},"group":"object","sub":"Auror's kit","holders":[{"id":"moody","at":"gf12"}],"facts":[
  {"t":"The eye sees through solid things, Invisibility Cloaks included.","at":"gf12","v":1},
  {"t":"Each lock of the trunk opens on a different inside. The seventh is a pit ten feet deep.","at":"gf35","v":1}]},
 {"id":"quill","kind":"magic","name":"Quick-Quotes Quill","appear":"gf18","tag":[{"t":"Writes what Rita wants","at":"gf18"}],"rel":["skeeter"],"group":"object","sub":"Quill","holders":[{"id":"skeeter","at":"gf18"}],"facts":[
  {"t":"An acid-green quill that takes down an interview by itself, improving it as it goes.","at":"gf18","v":1}]},
 {"id":"champions","kind":"group","name":"The Triwizard champions","appear":"gf16","tag":[{"t":"One from each school, and Harry","at":"gf16"}],"rel":["tournament","goblet"],"group":"team","sub":"Champions","holders":[{"id":"krum","at":"gf16"},{"id":"fleur","at":"gf16"},{"id":"cedric","at":"gf16"},{"id":"harry","at":"gf16"}],"facts":[
  {"t":"Viktor Krum for Durmstrang, Fleur Delacour for Beauxbatons, Cedric Diggory for Hogwarts.","at":"gf16","v":1},
  {"t":"And Harry, the fourth, three years under age.","at":"gf16","v":1},
  {"t":"After two tasks, Harry and Cedric are tied for first.","at":"gf26","v":1}]},
 {"id":"beauxbatons","kind":"group","name":"Beauxbatons","appear":"gf9","tag":[{"t":"A school of magic abroad","at":"gf9"},{"t":"The French school of magic","at":"gf16"}],"rel":["maxime","fleur","tournament"],"group":"org","sub":"School","holders":[{"id":"maxime","at":"gf15"},{"id":"fleur","at":"gf16"},{"id":"gabrielle","at":"gf26"}],"facts":[
  {"t":"A wizarding school abroad. Some of its students are at the World Cup.","at":"gf9","v":1},
  {"t":"Arrives in a powder-blue carriage the size of a house, pulled by a dozen winged horses.","at":"gf15","v":1},
  {"t":"Its students sit with Ravenclaw and find the castle cold.","at":"gf16","v":1}]},
 {"id":"durmstrang","kind":"group","name":"Durmstrang","appear":"gf11","tag":[{"t":"A northern school of magic","at":"gf11"}],"rel":["karkaroff","krum","tournament"],"group":"org","sub":"School","holders":[{"id":"karkaroff","at":"gf15"},{"id":"krum","at":"gf15"}],"facts":[
  {"t":"Takes no Muggle-borns and teaches the Dark Arts, not only the defense. Draco's father considered it for him.","at":"gf11","v":1},
  {"t":"Arrives in a ship that rises out of the lake. Its students wear furs.","at":"gf15","v":1},
  {"t":"Grindelwald was a student.","at":"dh8","v":1}]},
 {"id":"aurors","kind":"group","name":"Aurors","appear":"gf11","tag":[{"t":"Dark wizard catchers","at":"gf11"}],"rel":["ministry","moody","longbottoms"],"group":"org","sub":"Ministry","holders":[{"id":"moody","at":"gf11"},{"id":"longbottoms","at":"gf30"},{"id":"tonks","at":"op3"},{"id":"kingsley","at":"op3"},{"id":"dawlish","at":"op27"},{"id":"scrimgeour","at":"hb1"}],"facts":[
  {"t":"The Ministry's elite. Mad-Eye Moody was the best of them.","at":"gf11","v":1},
  {"t":"Frank Longbottom and his wife were Aurors.","at":"gf30","v":1},
  {"t":"It takes top grades in five subjects and three more years of training to become one.","at":"op29","v":1}]},
 {"id":"wheezes","kind":"group","name":"Weasleys' Wizard Wheezes","appear":"gf5","tag":[{"t":"Fred and George's joke shop, on paper","at":"gf5"}],"rel":["fred","george","mrs_weasley","bagman","ears","amortentia","arnold"],"relAt":{"bagman":"gf29"},"group":"org","sub":"Business","holders":[{"id":"fred","at":"gf5"},{"id":"george","at":"gf5"}],"facts":[
  {"t":"Order forms and price lists for trick sweets and fake wands, invented in the twins' bedroom. Their mother burns the lot.","at":"gf5","v":1},
  {"t":"The twins are writing to someone who owes them money, to fund it.","at":"gf29","v":1},
  {"t":"Harry gives them the thousand Galleons, on condition they buy Ron some new dress robes.","at":"gf37","v":1},
  {"t":"Skiving Snackboxes: sweets that make you ill enough to leave a lesson, with an antidote in the other half.","at":"op12","v":1},
  {"t":"A crate of enchanted fireworks keeps Umbridge running all afternoon.","at":"op28","v":1},
  {"t":"Premises at number ninety-three, Diagon Alley.","at":"op29","v":1},
  {"t":"A dazzling shop, the only bright thing in the street. Love potions, Shield Hats that the Ministry buys by the hundred, darkness powder, Pygmy Puffs.","at":"hb6","v":1}]},
 {"id":"spew","kind":"group","name":"S.P.E.W.","appear":"gf14","tag":[{"t":"For the promotion of elfish welfare","at":"gf14"}],"rel":["hermione","house_elves","winky","dobby","kitchens"],"group":"org","sub":"Society","holders":[{"id":"hermione","at":"gf14"},{"id":"ron","at":"gf14"},{"id":"harry","at":"gf14"}],"facts":[
  {"t":"Founded by Hermione after she learns that a hundred house-elves cook and clean at Hogwarts for nothing. Two Sickles to join. Harry is secretary and Ron treasurer, not by choice.","at":"gf14","v":1},
  {"t":"The Hogwarts elves want nothing to do with it and politely push her out of the kitchens.","at":"gf21","v":1},
  {"t":"Hermione takes to leaving knitted hats for the elves to pick up by accident.","at":"op13","v":1}]},
 {"id":"lestranges","kind":"group","name":"The Lestranges","appear":"gf27","tag":[{"t":"Death Eaters in Azkaban","at":"gf27"}],"rel":["followers","azkaban","longbottoms","crouch_jr","bellatrix","blacks","hcup"],"relAt":{"crouch_jr":"gf30","hcup":"dh26"},"group":"family","sub":"Family","holders":[{"id":"bellatrix","at":"op6"},{"name":"Rodolphus Lestrange","at":"op6"},{"name":"Rabastan Lestrange","at":"op35"}],"facts":[
  {"t":"A married couple from Snape's old Slytherin crowd, both in Azkaban.","at":"gf27","v":1},
  {"t":"Tried with Crouch's son for torturing the Longbottoms. The woman sits in the chained chair like a throne and says the Dark Lord will return and reward them.","at":"gf30","v":1},
  {"t":"Voldemort names them as the most loyal of all, and means to free them.","at":"gf33","v":1},
  {"t":"Their vault is among the oldest and deepest.","at":"dh26","v":1}]},
 {"id":"riddles","kind":"group","name":"The Riddles","appear":"gf1","tag":[{"t":"The family at the big house","at":"gf1"}],"rel":["hangleton","bryce","voldemort","riddle"],"relAt":{"voldemort":"gf33","riddle":"gf33"},"group":"family","sub":"Family","holders":[],"facts":[
  {"t":"Rich, snobbish and disliked. Fifty years ago Mr. and Mrs. Riddle and their grown son Tom were found dead in their drawing room, unmarked, with looks of terror on their faces.","at":"gf1","v":1},
  {"t":"The son was Voldemort's father, a Muggle who left his witch wife before the child was born. Voldemort killed all three.","at":"gf33","v":1}]},
 {"id":"hangleton","kind":"place","name":"Little Hangleton","appear":"gf1","tag":[{"t":"A village with an empty manor","at":"gf1"}],"rel":["riddles","bryce","voldemort","nagini","gaunt_house"],"type":"muggle","facts":[
  {"t":"The Riddle House stands on a hill above it, boarded up and falling apart.","at":"gf1","v":1},
  {"t":"The Cup lands in its overgrown churchyard, beside the grave of Tom Riddle.","at":"gf32","v":1}]},
 {"id":"worldcup","kind":"place","name":"The World Cup campsite","appear":"gf6","tag":[{"t":"Ireland against Bulgaria","at":"gf6"}],"rel":["bagman","krum","roberts","dark_mark","portkey"],"type":"wizard","facts":[
  {"t":"A hundred thousand wizards camped on a moor, trying and failing to look like Muggles. The Weasleys' tent has three rooms inside.","at":"gf7","v":1},
  {"t":"The stadium is gold, with a Top Box for the ministers. Ireland win, and Krum catches the Snitch.","at":"gf8","v":1},
  {"t":"That night it is overrun by a masked mob, and the Dark Mark goes up over the wood.","at":"gf9","v":1}]},
 {"id":"kitchens","kind":"place","name":"The Hogwarts kitchens","appear":"gf12","tag":[{"t":"Under the Great Hall","at":"gf12"}],"rel":["house_elves","dobby","winky","spew"],"relAt":{"dobby":"gf21","winky":"gf21"},"type":"castle","parent":"hogwarts","facts":[
  {"t":"Staffed by over a hundred house-elves, who also clean the castle and light the fires without ever being seen.","at":"gf12","v":1},
  {"t":"Reached by tickling the pear in a painting of a bowl of fruit. As big as the Hall above, with matching tables. The elves press food on any visitor.","at":"gf21","v":1}]},
 {"id":"prefects_bath","kind":"place","name":"The prefects' bathroom","appear":"gf23","tag":[{"t":"On the fifth floor","at":"gf23"}],"rel":["cedric","myrtle","egg"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Cedric tells Harry to take the egg there, and gives him the password.","at":"gf23","v":1},
  {"t":"White marble, a bath the size of a swimming pool with a hundred taps, and a painting of a mermaid asleep on a rock.","at":"gf25","v":1}]},
 {"id":"maze","kind":"place","name":"The maze","appear":"gf28","tag":[{"t":"The third task","at":"gf28"}],"rel":["tournament","cup","skrewts","bagman"],"type":"grounds","parent":"pitch","facts":[
  {"t":"Hedges planted across the Quidditch field, to be twenty feet tall by June.","at":"gf28","v":1},
  {"t":"Dark paths, a mist that turns the world upside down, a sphinx with a riddle, a giant spider.","at":"gf31","v":1}]},
 {"id":"cave","kind":"place","name":"Sirius's cave","appear":"gf27","tag":[{"t":"In the hills above Hogsmeade","at":"gf27"}],"rel":["sirius","buckbeak"],"type":"wizard","parent":"hogsmeade","facts":[
  {"t":"Sirius hides here with Buckbeak, living on rats, to be near Harry. He asks to be called Snuffles in public.","at":"gf27","v":1}]},
 {"id":"mungos","kind":"place","name":"St. Mungo's Hospital","appear":"gf30","tag":[{"t":"For magical maladies and injuries","at":"gf30"}],"rel":["longbottoms","neville","bode","lockhart"],"type":"wizard","relAt":{"lockhart":"op23"},"facts":[
  {"t":"Where Neville's parents have lived since he was a baby. He visits in the holidays with his grandmother.","at":"gf30","v":1},
  {"t":"Hidden behind a derelict department store in London. Healers wear lime green.","at":"op22","v":1},
  {"t":"The closed ward, for permanent spell damage, is on the fourth floor.","at":"op23","v":1},
  {"t":"Katie Bell spends months here.","at":"hb12","v":1}]},
 {"id":"albania","kind":"place","name":"Albania","appear":"cs18","tag":[{"t":"Where Voldemort was hiding","at":"cs18"}],"rel":["voldemort","bertha","quirrell","diadem"],"type":"abroad","facts":[
  {"t":"Dumbledore's sources say Voldemort is hiding in its forests.","at":"cs18","v":1},
  {"t":"Bertha Jorkins was last seen there.","at":"gf19","v":1},
  {"t":"Voldemort lived there as less than a ghost, possessing animals, until a servant came to find him.","at":"gf33","v":1}]},
 {"id":"umbridge","kind":"person","g":"f","name":"Dolores Umbridge","appear":"op8","tag":[{"t":"Senior Undersecretary to the Minister","at":"op8"},{"t":"Defense Against the Dark Arts teacher","at":"op11"},{"t":"Hogwarts High Inquisitor","at":"op15"},{"t":"Headmistress of Hogwarts","at":"op28"},{"t":"Removed from Hogwarts","at":"op38","state":"away"},{"t":"Head of the Muggle-born Registration Commission","at":"dh11"}],"rel":["fudge","ministry","staff","dada","decrees","squad","blood_quill","harry","dementors","centaurs","commission","locket"],"relAt":{"dementors":"op32","centaurs":"op33","locket":"dh11"},"facts":[
  {"t":"Squat, with a wide slack mouth and a girlish voice. Sits at Fudge's side and votes to convict.","at":"op8","v":1},
  {"t":"Interrupts Dumbledore's welcome with a speech that, under the sugar, says the Ministry is taking a hand in the school.","at":"op11","v":1},
  {"t":"Teaches from a textbook, with wands put away, on the grounds that there is nothing out there to defend against.","at":"op12","v":1},
  {"t":"Punishes Harry with a quill that writes in his own blood. Her office is pink and lined with plates of kittens.","at":"op13","v":1},
  {"t":"Loathes part-humans. Wrote the law that makes it nearly impossible for a werewolf to find work.","at":"op14","v":1},
  {"t":"As High Inquisitor she sits in on lessons with a clipboard. Trelawney and Hagrid are put on probation.","at":"op15","v":1},
  {"t":"Bans Harry and both twins from Quidditch for life.","at":"op19","v":1},
  {"t":"Sacks Trelawney and tries to throw her out of the castle. Dumbledore reminds her that she may dismiss teachers, not banish them.","at":"op26","v":1},
  {"t":"Has been reading the school's owl post and watching its fires. Catches the D.A.","at":"op27","v":1},
  {"t":"Made head by decree. The headmaster's office seals itself against her.","at":"op28","v":1},
  {"t":"Leads four Aurors to arrest Hagrid at midnight. They Stun McGonagall when she protests.","at":"op31","v":1},
  {"t":"Ready to use the Cruciatus Curse on Harry. Admits it was she who sent the Dementors to Little Whinging, to silence him.","at":"op32","v":1},
  {"t":"Insults a herd of centaurs to their faces and is carried off into the forest.","at":"op33","v":1},
  {"t":"Fetched out by Dumbledore, alone, and shaken. Leaves the school with Peeves chasing her.","at":"op38","v":1},
  {"t":"Took the locket from Mundungus as a bribe.","at":"dh11","v":1},
  {"t":"Wears it at the hearings and claims it as proof of her own pure blood. Has Moody's eye set in her office door. Harry Stuns her.","at":"dh13","v":1}]},
 {"id":"tonks","kind":"person","g":"f","name":[{"t":"Nymphadora Tonks","at":"op3"}],"appear":"op3","tag":[{"t":"An Auror, and a member of the Order","at":"op3"},{"t":"Killed in the battle","at":"dh33","state":"fallen"}],"rel":["order","aurors","moody","lupin","blacks","kingsley","teddy","ted","andromeda"],"relAt":{"blacks":"op6","lupin":"hb29"},"facts":[
  {"t":"Young, with a heart-shaped face and violet hair, and clumsy. Hates her first name.","at":"op3","v":1},
  {"t":"A Metamorphmagus: she can change her appearance at will, which made the disguise part of Auror training easy.","at":"op3","v":1},
  {"t":"Her mother Andromeda is Sirius's favorite cousin, struck off the family tree for marrying a Muggle-born.","at":"op6","v":1},
  {"t":"Duels Bellatrix Lestrange at the Ministry and is knocked down a flight of stone steps.","at":"op35","v":1},
  {"t":"On the platform at the end of the year, bubble-gum pink again.","at":"op38","v":1},
  {"t":"Mousy-haired and miserable. Everyone assumes it is about Sirius.","at":"hb5","v":1},
  {"t":"Stationed in Hogsmeade to guard the school. Her Patronus has changed into something large and four-legged.","at":"hb8","v":1},
  {"t":"In love with Lupin. He says he is too old, too poor and too dangerous, and she tells him in front of everyone that she does not care.","at":"hb29","v":1},
  {"t":"Married to Lupin.","at":"dh1","v":1},
  {"t":"One of the escorts.","at":"dh4","v":1},
  {"t":"Expecting a child.","at":"dh11","v":1},
  {"t":"Leaves the baby with her mother to find Lupin in the fighting.","at":"dh32","v":1}]},
 {"id":"kingsley","kind":"person","g":"m","name":"Kingsley Shacklebolt","appear":"op3","tag":[{"t":"An Auror, and a member of the Order","at":"op3"},{"t":"Acting Minister of Magic","at":"dh36"}],"rel":["order","aurors","ministry","tonks","sirius","potterwatch"],"facts":[
  {"t":"Tall, bald, with a deep slow voice and a gold earring.","at":"op3","v":1},
  {"t":"In charge of the Ministry's hunt for Sirius Black, and feeding it false sightings in Tibet.","at":"op5","v":1},
  {"t":"In the room when Dumbledore is to be arrested. Quietly alters a witness's memory, and is knocked out with the rest so that nobody suspects him.","at":"op27","v":1},
  {"t":"Fights at the Ministry, and takes on Bellatrix after Sirius falls.","at":"op35","v":1},
  {"t":"One of the escorts.","at":"dh4","v":1},
  {"t":"His lynx Patronus warns the wedding.","at":"dh8","v":1},
  {"t":"Named Minister for the time being.","at":"dh36","v":1}]},
 {"id":"bones","kind":"person","g":"f","name":"Amelia Bones","appear":"op8","tag":[{"t":"Head of Magical Law Enforcement","at":"op8"},{"t":"Murdered","at":"hb1","state":"fallen"}],"rel":["ministry","wizengamot","susan"],"facts":[
  {"t":"Square-jawed, with a monocle. Questions Harry fairly and is impressed that he can produce a full Patronus.","at":"op8","v":1},
  {"t":"Susan Bones's aunt.","at":"op16","v":1},
  {"t":"Killed in a room locked from the inside, probably by Voldemort himself.","at":"hb1","v":1}]},
 {"id":"luna","kind":"person","g":"f","name":"Luna Lovegood","appear":"op10","tag":[{"t":"Fourth-year Ravenclaw","at":"op10"},{"t":"Taken prisoner","at":"dh21"},{"t":"Free","at":"dh23"}],"rel":["ravenclaw","da","ginny","neville","harry","thestrals","quibbler","xeno","lovegood_house"],"facts":[
  {"t":"Dirty-blonde hair to her waist, protuberant eyes, a necklace of bottle corks and her wand behind her ear. Reads a magazine upside down.","at":"op10","v":1},
  {"t":"Her father edits The Quibbler. She believes in a good many creatures nobody else has seen.","at":"op10","v":1},
  {"t":"Can see the creatures pulling the carriages, and tells Harry he is as sane as she is.","at":"op10","v":1},
  {"t":"Saw her mother die when she was nine, in an experiment with a spell.","at":"op21","v":1},
  {"t":"Gets Harry's interview into her father's magazine.","at":"op25","v":1},
  {"t":"Suggests how to get to London, and comes.","at":"op33","v":1},
  {"t":"People hide her belongings every year, and she puts up notices asking for them back. Tells Harry she heard the voices behind the veil too, and expects to see her mother again.","at":"op38","v":1},
  {"t":"Goes to Slughorn's party with Harry, as friends, and is thrilled to be asked.","at":"hb15","v":1},
  {"t":"Commentates on a Quidditch match, mostly about the clouds.","at":"hb19","v":1},
  {"t":"One of the few to answer the D.A. coin and fight.","at":"hb27","v":1},
  {"t":"Taken off the Hogwarts Express at Christmas to silence her father.","at":"dh21","v":1},
  {"t":"In the cellar at Malfoy Manor with Mr. Ollivander.","at":"dh23","v":1},
  {"t":"Takes Harry to see the diadem's statue.","at":"dh29","v":1},
  {"t":"Sees that Harry needs to be left alone, and distracts the hall.","at":"dh36","v":1}]},
 {"id":"bellatrix","kind":"person","g":"f","name":"Bellatrix Lestrange","appear":"op6","tag":[{"t":"A Death Eater in Azkaban","at":"op6"},{"t":"Escaped from Azkaban","at":"op25"},{"t":"Killed by Molly Weasley","at":"dh36","state":"fallen"}],"rel":["lestranges","blacks","followers","sirius","narcissa","voldemort","longbottoms","neville","vow","spinners_end","draco","sword","hcup","dobby","mrs_weasley","malfoy_manor"],"relAt":{"longbottoms":"op25","neville":"op35","draco":"hb15","sword":"dh23","hcup":"dh26","dobby":"dh23","mrs_weasley":"dh36"},"facts":[
  {"t":"Sirius's cousin and Narcissa Malfoy's sister, married to Rodolphus Lestrange.","at":"op6","v":1},
  {"t":"One of ten who break out of Azkaban. Tall, heavy-lidded, with the remains of great good looks. She is the woman from the Pensieve trial who tortured Neville's parents.","at":"op25","v":1},
  {"t":"Mocks Harry in a baby voice in the Hall of Prophecy, and tortures Neville for a moment to make a point.","at":"op35","v":1},
  {"t":"Kills Sirius. Her spell hits him in the chest and he falls back through the veil.","at":"op35","v":1},
  {"t":"Harry tries the Cruciatus Curse on her and it barely works. She explains that he would have to mean it.","at":"op36","v":1},
  {"t":"Voldemort takes her with him when he flees.","at":"op36","v":1},
  {"t":"Does not trust Snape, and lists the reasons. Would be proud to give a son to the cause.","at":"hb2","v":1},
  {"t":"Has been teaching Draco to close his mind.","at":"hb15","v":1},
  {"t":"Mocked by Voldemort for her niece's marriage to a werewolf.","at":"dh1","v":1},
  {"t":"Panics at the sight of the sword, which should be in her vault, and tortures Hermione to learn what else was taken. Throws the knife that kills Dobby.","at":"dh23","v":1},
  {"t":"Her vault at Gringotts holds one of the Horcruxes.","at":"dh26","v":1},
  {"t":"Duelling three girls at once when Molly Weasley takes over, and kills her.","at":"dh36","v":1}]},
