  {"t":"Piers, Dennis, Malcolm and Gordon. Their favorite game is hunting Harry.","at":"ss3","v":1}]},
 {"id":"hogwarts","kind":"place","name":"Hogwarts","appear":"ss4","tag":[{"t":"School of Witchcraft and Wizardry","at":"ss4"}],"rel":["dumbledore","staff","gryffindor","slytherin","hufflepuff","ravenclaw","hall","forest","express","founders","chamber","governors","kitchens","tournament","ror","ravenclaw_tower"],"type":"school","facts":[
  {"t":"The school for young witches and wizards in Britain. Harry's name has been down since he was born.","at":"ss4","v":1},
  {"t":"Hagrid calls it about the only place safer than Gringotts.","at":"ss5","v":1},
  {"t":"A huge castle of towers and turrets on a cliff above a black lake. First years arrive by boat.","at":"ss6","v":1},
  {"t":"Students are sorted into four houses. They earn and lose points for their house all year, and the house with the most wins the House Cup.","at":"ss7","v":1},
  {"t":"A hundred and forty-two staircases, some of which move, doors that have to be asked politely, and portraits that visit one another.","at":"ss8","v":1},
  {"t":"Founded over a thousand years ago by four witches and wizards.","at":"cs9","v":1},
  {"t":"Comes within a day of being closed.","at":"cs16","v":1},
  {"t":"End-of-year exams are cancelled as a treat.","at":"cs18","v":1},
  {"t":"Protected so that Muggles see only a dangerous ruin, and nobody can appear by magic inside the grounds.","at":"gf11","v":1},
  {"t":"Hosts the Triwizard Tournament.","at":"gf12","v":1},
  {"t":"Run for a term by the Ministry.","at":"op28","v":1},
  {"t":"Attendance is compulsory, and blood status is checked.","at":"dh12","v":1},
  {"t":"Badly damaged, and still standing.","at":"dh36","v":1}]},
 {"id":"hall","kind":"place","name":"The Great Hall","appear":"ss7","tag":[{"t":"Where the school eats","at":"ss7"}],"rel":["hat","staff","hogwarts"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Lit by thousands of floating candles above four long house tables, with the teachers at a table across the top.","at":"ss7","v":1},
  {"t":"The ceiling is bewitched to look like the sky outside.","at":"ss7","v":1},
  {"t":"At Halloween, live bats and carved pumpkins.","at":"ss10","v":1},
  {"t":"Hung with Slytherin green and silver for the end-of-year feast, until the final points change the banners to Gryffindor's.","at":"ss17","v":1},
  {"t":"The whole school sleeps here in sleeping bags the night Black gets in.","at":"pa9","v":1},
  {"t":"Turned to silver and frost for the Yule Ball, with small tables in place of the long ones.","at":"gf23","v":1},
  {"t":"The dead are laid out here.","at":"dh33","v":1},
  {"t":"Where it ends.","at":"dh36","v":1}]},
 {"id":"tower","kind":"place","name":"Gryffindor Tower","appear":"ss7","tag":[{"t":"Home of Gryffindor house","at":"ss7"}],"rel":["gryffindor","fatlady","cadogan"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Reached through a round hole behind a portrait of a very large woman in pink. A cozy common room with armchairs, and dormitories up spiral stairs with four-poster beds hung in red velvet.","at":"ss7","v":1},
  {"t":"The entrance is left unguarded when the Fat Lady flees.","at":"pa8","v":1},
  {"t":"Black gets as far as the third-year boys' dormitory.","at":"pa13","v":1}]},
 {"id":"corridor","kind":"place","name":"The third-floor corridor","appear":"ss7","tag":[{"t":"Out of bounds","at":"ss7"}],"rel":["fluffy","trapdoor","dumbledore","stone"],"relAt":{"stone":"ss9"},"type":"castle","parent":"hogwarts","facts":[
  {"t":"On the right-hand side of the third floor. Dumbledore puts it out of bounds to anyone who does not want a very painful death, and gives no reason.","at":"ss7","v":1},
  {"t":"Its locked door hides a three-headed dog standing on a trapdoor.","at":"ss9","v":1},
  {"t":"The door is already ajar on the night the three go through.","at":"ss16","v":1}]},
 {"id":"dungeons","kind":"place","name":"The dungeons","appear":"ss8","tag":[{"t":"Where Potions is taught","at":"ss8"}],"rel":["snape","potions","troll","slyth_room"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Colder than the rest of the castle. Snape's classroom is down here.","at":"ss8","v":1},
  {"t":"Where the troll is first reported.","at":"ss10","v":1},
  {"t":"Nick's deathday party is held in one of the larger ones.","at":"cs8","v":1}]},
 {"id":"trophy","kind":"place","name":"The trophy room","appear":"ss9","tag":[{"t":"On the third floor","at":"ss9"}],"rel":["draco","filch"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Always unlocked, with cups and shields in glass cases. Where Malfoy says the midnight duel will be, and where Filch is waiting in his place.","at":"ss9","v":1}]},
 {"id":"bathroom","kind":"place","name":"The girls' bathroom","appear":"ss10","tag":[{"t":"Where the troll is knocked out","at":"ss10"}],"rel":["troll","hermione"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Hermione spends Halloween afternoon crying in here. Harry and Ron lock the troll in with her by mistake.","at":"ss10","v":1}]},
 {"id":"hospital","kind":"place","name":"The hospital wing","appear":"ss8","tag":[{"t":"Madam Pomfrey's domain","at":"ss8"}],"rel":["pomfrey"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Where Neville is sent after the first Potions lesson.","at":"ss8","v":1},
  {"t":"Ron spends days here with a dragon bite.","at":"ss14","v":1},
  {"t":"Harry wakes up here after the trapdoor, beside a table piled with sweets from well-wishers.","at":"ss17","v":1},
  {"t":"Harry regrows his arm bones here overnight.","at":"cs10","v":1},
  {"t":"The Petrified lie here in a row behind screens.","at":"cs14","v":1},
  {"t":"Dumbledore locks Harry and Hermione in, and they are back before he has finished turning the key.","at":"pa21","v":1},
  {"t":"Where the Minister and the headmaster part company.","at":"gf36","v":1},
  {"t":"Ron, Hermione, Ginny and Neville recover here after the Ministry.","at":"op38","v":1},
  {"t":"Bill is brought here.","at":"hb29","v":1}]},
 {"id":"library","kind":"place","name":"The library","appear":"ss9","tag":[{"t":"Tens of thousands of books","at":"ss9"}],"rel":["pince","flamel","cloak"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Hermione takes out a book on flying before the first lesson.","at":"ss9","v":1},
  {"t":"The three search it for weeks for any mention of Nicolas Flamel.","at":"ss12","v":1},
  {"t":"The Restricted Section at the back holds books of powerful Dark magic. Students need a signed note from a teacher to use it.","at":"ss12","v":1},
  {"t":"One of its books starts screaming when Harry opens it at night.","at":"ss12","v":1},
  {"t":"Hagrid is caught in the dragon section.","at":"ss14","v":1},
  {"t":"Every copy of the school's history is out, and there is a waiting list.","at":"cs9","v":1},
  {"t":"Hermione is attacked just outside it.","at":"cs14","v":1}]},
 {"id":"tower_ast","kind":"place","name":[{"t":"The tallest tower","at":"ss14"},{"t":"The Astronomy Tower","at":"hb27"}],"appear":"ss14","tag":[{"t":"Where Norbert is handed over","at":"ss14"}],"rel":["norbert","astronomy","cloak","dumbledore"],"type":"castle","parent":"hogwarts","relAt":{"dumbledore":"hb27"},"facts":[
  {"t":"Up a steep spiral stair. Charlie's friends land here at midnight to collect the dragon.","at":"ss14","v":1},
  {"t":"The astronomy tower. Harry and Hermione were seen coming down from it at one in the morning.","at":"ss15","v":1},
  {"t":"The Dark Mark hangs above it. Dumbledore dies here.","at":"hb27","v":1}]},
 {"id":"trapdoor","kind":"place","name":"The trapdoor","appear":"ss9","tag":[{"t":"Under the three-headed dog","at":"ss9"}],"rel":["fluffy","chambers","stone"],"type":"castle","parent":"corridor","facts":[
  {"t":"Hermione is the only one who notices it, under the dog's paws.","at":"ss9","v":1},
  {"t":"Opens on a long drop into the dark.","at":"ss16","v":1}]},
 {"id":"chambers","kind":"place","name":"The chambers under the trapdoor","appear":"ss16","tag":[{"t":"The Stone's defenses","at":"ss16"}],"rel":["snare","keys","chess","trolls","bottles","mirror","stone","quirrell"],"type":"castle","parent":"trapdoor","facts":[
  {"t":"A stone passage miles under the school, sloping down through one room after another.","at":"ss16","v":1},
  {"t":"In order: Devil's Snare, a room of winged keys, a giant chessboard, a troll, and a table of seven bottles between two fires.","at":"ss16","v":1},
  {"t":"The last chamber holds the Mirror of Erised.","at":"ss17","v":1}]},
 {"id":"forest","kind":"place","name":"The forbidden forest","appear":"ss7","tag":[{"t":"Out of bounds to all students","at":"ss7"}],"rel":["hagrid","centaurs","unicorns","firenze","hut","aragog","anglia","grawp"],"type":"grounds","parent":"hogwarts","facts":[
  {"t":"Dumbledore reminds the school each year that the forest in the grounds is forbidden.","at":"ss7","v":1},
  {"t":"Snape meets Quirrell at its edge, where no one should overhear.","at":"ss13","v":1},
  {"t":"Where Harry, Hermione, Neville and Malfoy serve their detention, at night. Centaurs and unicorns live in it, and that night something worse.","at":"ss15","v":1},
  {"t":"A colony of giant spiders lives in a hollow at its heart, and an old car has gone wild in it.","at":"cs15","v":1},
  {"t":"The dragons are kept in a clearing at its edge.","at":"gf19","v":1},
  {"t":"Mr. Crouch comes out of it, mad, and disappears back into it.","at":"gf28","v":1},
  {"t":"Hagrid is no longer welcome in it.","at":"op30","v":1},
  {"t":"Voldemort waits in the spiders' old hollow.","at":"dh34","v":1}]},
 {"id":"hut","kind":"place","name":"Hagrid's hut","appear":"ss8","tag":[{"t":"At the edge of the forest","at":"ss8"}],"rel":["hagrid","fang","norbert"],"type":"grounds","parent":"hogwarts","facts":[
  {"t":"One room, with hams and pheasants hanging from the ceiling, a huge bed and a copper kettle on the fire.","at":"ss8","v":1},
  {"t":"Stiflingly hot with the curtains drawn while a dragon egg sits in the fire.","at":"ss14","v":1},
  {"t":"Ron recovers from the slugs here, with a basin.","at":"cs7","v":1},
  {"t":"Fudge and Lucius Malfoy both come knocking on the same night.","at":"cs14","v":1},
  {"t":"Buckbeak is tied in the pumpkin patch behind it.","at":"pa16","v":1},
  {"t":"Mr. Crouch lies buried in its garden.","at":"gf35","v":1},
  {"t":"Stormed at midnight.","at":"op31","v":1},
  {"t":"Burned.","at":"hb28","v":1}]},
 {"id":"lake","kind":"place","name":"The lake","appear":"ss6","tag":[{"t":"Below the castle","at":"ss6"}],"rel":["squid","hogwarts","merpeople","tomb"],"type":"grounds","parent":"hogwarts","facts":[
  {"t":"Wide and black. The first years cross it in a fleet of little boats and land in an underground harbor.","at":"ss6","v":1},
  {"t":"The Dementors catch Harry, Hermione and Sirius on its shore.","at":"pa20","v":1},
  {"t":"The Durmstrang ship moors on it.","at":"gf15","v":1},
  {"t":"The second task takes place at its bottom.","at":"gf26","v":1}]},
 {"id":"greenhouses","kind":"place","name":"The greenhouses","appear":"ss8","tag":[{"t":"Where Herbology is taught","at":"ss8"}],"rel":["sprout","herbology"],"type":"grounds","parent":"hogwarts","facts":[
  {"t":"Behind the castle.","at":"ss8","v":1},
  {"t":"Greenhouse three is where the Mandrakes are kept.","at":"cs6","v":1}]},
 {"id":"pitch","kind":"place","name":"The Quidditch field","appear":"ss10","tag":[{"t":"Three hoops at each end","at":"ss10"}],"rel":["quidditch","gteam","steam","hooch","maze"],"type":"grounds","parent":"hogwarts","facts":[
  {"t":"Ringed by raised stands so that the crowd can see what happens in the air. At each end are three golden poles with hoops on top, fifty feet up.","at":"ss10","v":1},
  {"t":"About a hundred Dementors drift onto it in the middle of a match.","at":"pa9","v":1},
  {"t":"Planted with hedges for the third task.","at":"gf28","v":1}]},
 {"id":"godrics","kind":"place","name":"Godric's Hollow","appear":"ss1","tag":[{"t":"Where the Potters lived","at":"ss1"}],"rel":["james","lily","harry","voldemort","bathilda","dumbledores","peverells"],"type":"wizard","facts":[
  {"t":"The village where Voldemort found the Potters. Their house was left in ruins.","at":"ss1","v":1},
  {"t":"A village with a church and a war memorial that, for wizards, becomes a statue of the Potters. Their cottage has been left as it fell.","at":"dh16","v":1},
  {"t":"The Dumbledores are buried in its churchyard, and so are Harry's parents.","at":"dh16","v":1}]},
 {"id":"leaky","kind":"place","name":"The Leaky Cauldron","appear":"ss5","tag":[{"t":"The way into Diagon Alley","at":"ss5"}],"rel":["tom","diagon","quirrell"],"type":"wizard","parent":"london","facts":[
  {"t":"A tiny, grubby pub in London that Muggles' eyes slide straight past.","at":"ss5","v":1},
  {"t":"In the walled yard behind it, tapping the right brick opens an archway onto Diagon Alley.","at":"ss5","v":1},
  {"t":"Harry lives here for the last weeks of the summer.","at":"pa3","v":1}]},
 {"id":"diagon","kind":"place","name":"Diagon Alley","appear":"ss5","tag":[{"t":"The wizards' shopping street","at":"ss5"}],"rel":["leaky","gringotts","ollivanders","malkins","eeylops","flourish"],"type":"wizard","parent":"london","facts":[
  {"t":"A twisting cobbled street of shops selling cauldrons, owls, broomsticks, robes and spellbooks. Where Harry buys everything on his school list.","at":"ss5","v":1},
  {"t":"Harry has the run of it, on the Minister's orders not to stray into Muggle London.","at":"pa4","v":1},
  {"t":"Boarded-up windows, Ministry posters and stalls selling amulets.","at":"hb6","v":1}]},
 {"id":"gringotts","kind":"place","name":"Gringotts","appear":"ss5","tag":[{"t":"The wizards' bank","at":"ss5"}],"rel":["goblins","griphook","vault713","dragons","bill","gringotts_dragon","hcup"],"type":"wizard","parent":"diagon","relAt":{"hcup":"dh26"},"facts":[
  {"t":"A tall white building run by goblins, with a warning to thieves engraved on its inner doors.","at":"ss5","v":1},
  {"t":"The vaults lie hundreds of miles under London and are reached by rattling carts on rails. Hagrid says you would be mad to try robbing it.","at":"ss5","v":1},
  {"t":"Someone has tried: there has been a break-in, and whoever it was got away.","at":"ss6","v":1},
  {"t":"The break-in was on Harry's birthday. Nothing was taken, because the vault that was searched had been emptied that day.","at":"ss8","v":1},
  {"t":"Harry is uncomfortable taking gold out of his own full vault in front of the Weasleys.","at":"cs4","v":1},
  {"t":"Robbed by three teenagers and a goblin.","at":"dh26","v":1}]},
 {"id":"vault713","kind":"place","name":"Vault 713","appear":"ss5","tag":[{"t":"A high-security vault","at":"ss5"}],"rel":["stone","hagrid","griphook"],"type":"wizard","parent":"gringotts","facts":[
  {"t":"No keyhole. A goblin opens it with a stroke of the finger, and anyone else who tried would be sucked in and trapped.","at":"ss5","v":1},
  {"t":"Empty apart from one small parcel, which Hagrid takes.","at":"ss5","v":1},
  {"t":"The vault that was broken into hours later.","at":"ss8","v":1}]},
 {"id":"ollivanders","kind":"place","name":"Ollivanders","appear":"ss5","tag":[{"t":"Wand shop","at":"ss5"}],"rel":["ollivander","wand_harry"],"type":"wizard","parent":"diagon","facts":[
  {"t":"Narrow and shabby, with thousands of long thin boxes stacked to the ceiling. The sign says it has been making wands since 382 BC.","at":"ss5","v":1},
  {"t":"Every wand has a core of unicorn hair, phoenix feather or dragon heartstring, and no two are alike.","at":"ss5","v":1}]},
 {"id":"malkins","kind":"place","name":"Madam Malkin's","appear":"ss5","tag":[{"t":"Robe shop","at":"ss5"}],"rel":["malkin","draco"],"type":"wizard","parent":"diagon","facts":[
  {"t":"Where Harry is fitted for his uniform and has his first conversation with another wizard his own age. It does not go well.","at":"ss5","v":1}]},
 {"id":"eeylops","kind":"place","name":"Eeylops Owl Emporium","appear":"ss5","tag":[{"t":"Owl shop","at":"ss5"}],"rel":["hedwig","owls"],"type":"wizard","parent":"diagon","facts":[
  {"t":"Dark and full of rustling and bright eyes. Where Hagrid buys Harry's owl.","at":"ss5","v":1}]},
 {"id":"flourish","kind":"place","name":"Flourish and Blotts","appear":"ss5","tag":[{"t":"Bookshop","at":"ss5"}],"rel":["diagon"],"type":"wizard","parent":"diagon","facts":[
  {"t":"Shelves to the ceiling. Hagrid has to drag Harry away from a book of curses.","at":"ss5","v":1},
  {"t":"Mobbed for Lockhart's book signing.","at":"cs4","v":1}]},
 {"id":"platform","kind":"place","name":"Platform nine and three-quarters","appear":"ss6","tag":[{"t":"Where the school train leaves","at":"ss6"}],"rel":["express","mrs_weasley"],"type":"wizard","parent":"kingscross","facts":[
  {"t":"Reached by walking straight at the barrier between platforms nine and ten. Best done at a bit of a run.","at":"ss6","v":1},
  {"t":"The barrier turns solid when Harry and Ron run at it, and they miss the train.","at":"cs5","v":1}]},
 {"id":"express","kind":"place","name":"The Hogwarts Express","appear":"ss6","tag":[{"t":"The school train","at":"ss6"}],"rel":["platform","hogwarts"],"type":"wizard","facts":[
  {"t":"A scarlet steam engine that leaves at eleven o'clock on the first of September. A witch comes round with a cart of sweets.","at":"ss6","v":1},
  {"t":"Takes everyone home at the end of the year.","at":"ss17","v":1}]},
 {"id":"privet","kind":"place","name":"Number four, Privet Drive","appear":"ss1","tag":[{"t":"The Dursleys' house","at":"ss1"}],"rel":["vernon","petunia","dudley","harry","cupboard","dursleys"],"type":"muggle","parent":"whinging","facts":[
  {"t":"A tidy house on a tidy street. Dumbledore leaves baby Harry on its doorstep in the middle of the night.","at":"ss1","v":1},
  {"t":"Its living room is full of photographs of Dudley and shows no sign that another boy lives there.","at":"ss2","v":1},
  {"t":"Harry comes back here for the summer.","at":"ss17","v":1},
  {"t":"Bars on Harry's window, a cat flap in his door.","at":"cs2","v":1},
  {"t":"Harry walks out of it in the middle of the night.","at":"pa2","v":1},
  {"t":"Its living room is wrecked by the Weasleys' arrival.","at":"gf4","v":1},
  {"t":"Protected as long as Harry can call it home.","at":"op37","v":1},
  {"t":"Dumbledore visits, and says Harry need return only once more.","at":"hb3","v":1},
  {"t":"Harry leaves it for the last time.","at":"dh4","v":1}]},
 {"id":"cupboard","kind":"place","name":"The cupboard under the stairs","appear":"ss2","tag":[{"t":"Where Harry sleeps","at":"ss2"}],"rel":["harry"],"type":"muggle","parent":"privet","facts":[
  {"t":"Dark and full of spiders. Harry's bedroom for ten years.","at":"ss2","v":1},
  {"t":"The first letter is addressed to it. The Dursleys move Harry upstairs the same day.","at":"ss3","v":1}]},
 {"id":"whinging","kind":"place","name":"Little Whinging","appear":"ss3","tag":[{"t":"The Dursleys' town","at":"ss3"}],"rel":["privet"],"type":"muggle","facts":[
  {"t":"In Surrey. It appears in the address on Harry's letters.","at":"ss3","v":1},
  {"t":"Dementors come to it.","at":"op1","v":1}]},
 {"id":"zoo","kind":"place","name":"The zoo","appear":"ss2","tag":[{"t":"Dudley's birthday outing","at":"ss2"}],"rel":["boa","dudley","piers"],"type":"muggle","facts":[
  {"t":"Harry gets to go because nobody can be found to mind him. The day ends in the reptile house.","at":"ss2","v":1}]},
 {"id":"rock","kind":"place","name":"The hut on the rock","appear":"ss3","tag":[{"t":"Where the Dursleys run to","at":"ss3"}],"rel":["vernon","hagrid","harry"],"type":"muggle","facts":[
  {"t":"A miserable shack on a rock out at sea, reached by rowing boat in a storm. Vernon is sure no post can reach it.","at":"ss3","v":1},
  {"t":"Hagrid knocks the door down at midnight.","at":"ss4","v":1}]},
 {"id":"london","kind":"place","name":"London","appear":"ss5","tag":[{"t":"The nearest city","at":"ss5"}],"rel":["leaky","diagon","kingscross","ministry"],"type":"muggle","facts":[
  {"t":"Hagrid and Harry go up by train and Underground. The way into Diagon Alley is here.","at":"ss5","v":1}]},
 {"id":"kingscross","kind":"place","name":"King's Cross station","appear":"ss6","tag":[{"t":"Where the school train leaves","at":"ss6"}],"rel":["platform","vernon"],"type":"muggle","parent":"london","facts":[
  {"t":"Harry's ticket says platform nine and three-quarters, and the Muggle guards have never heard of it.","at":"ss6","v":1},
  {"t":"The Order meets Harry here to have a word with the Dursleys.","at":"op38","v":1},
  {"t":"What the place between looks like to Harry: bright, clean and empty.","at":"dh35","v":1},
  {"t":"Nineteen years later, on the first of September.","at":"dh37","v":1}]},
 {"id":"smeltings","kind":"place","name":"Smeltings","appear":"ss3","tag":[{"t":"Dudley's new school","at":"ss3"}],"rel":["dudley","vernon","piers"],"type":"muggle","facts":[
  {"t":"A private school, and Vernon's old one. The uniform is a maroon tailcoat, orange knickerbockers, a straw hat and a stick for hitting people.","at":"ss3","v":1},
  {"t":"Harry is down for Stonewall High, the local school, in Dudley's old clothes dyed gray.","at":"ss3","v":1}]},
 {"id":"romania","kind":"place","name":"Romania","appear":"ss6","tag":[{"t":"Where Charlie Weasley works","at":"ss6"}],"rel":["charlie","dragons","norbert","quirrell"],"relAt":{"quirrell":"ss8"},"type":"abroad","facts":[
  {"t":"Charlie studies dragons there.","at":"ss6","v":1},
  {"t":"Quirrell is said to have met a vampire there.","at":"ss8","v":1},
  {"t":"Where Norbert is sent.","at":"ss14","v":1}]},
 {"id":"dobby","kind":"person","g":"m","name":"Dobby","appear":"cs2","tag":[{"t":"A house-elf with a warning","at":"cs2"},{"t":"A free elf","at":"cs18"},{"t":"A free elf, working at Hogwarts","at":"gf21"},{"t":"Killed","at":"dh23","state":"fallen"}],"rel":["harry","house_elves","lucius","malfoys","winky","kitchens","gillyweed","ror","shell_cottage","aberforth"],"relAt":{"lucius":"cs18","malfoys":"cs18","aberforth":"dh28"},"sub":"House-elf","facts":[
  {"t":"A small creature with bat-like ears and huge green eyes, dressed in an old pillowcase. He turns up in Harry's bedroom to beg him not to go back to school.","at":"cs2","v":1},
  {"t":"Bound to serve one family for life and forbidden to speak ill of them. When he comes close, he punishes himself.","at":"cs2","v":1},
  {"t":"Has been intercepting Harry's letters all summer so that Harry would think his friends had forgotten him.","at":"cs2","v":1},
  {"t":"Drops Aunt Petunia's pudding with a Hover Charm, and lets Harry take the blame.","at":"cs2","v":1},
  {"t":"Sealed the barrier at King's Cross and bewitched the Bludger, both to get Harry sent home, injured if need be.","at":"cs10","v":1},
  {"t":"Lets slip that the Chamber has been opened before.","at":"cs10","v":1},
  {"t":"The Malfoys' elf. Harry tricks Lucius Malfoy into handing him a sock, and an elf given clothes is free.","at":"cs18","v":1},
  {"t":"Blasts his old master down the stairs when he goes for Harry.","at":"cs18","v":1},
  {"t":"Took two years to find work, because he wants paying. Dumbledore gives him a Galleon a week and a day off a month, beaten down from more.","at":"gf21","v":1},
  {"t":"Wears a tea cozy and odd socks.","at":"gf21","v":1},
  {"t":"Wakes Harry ten minutes before the second task with a handful of gillyweed.","at":"gf26","v":1},
  {"t":"Has been taking all Hermione's hats and cleaning Gryffindor Tower alone. Tells Harry about the Room of Requirement.","at":"op18","v":1},
  {"t":"Ordered not to warn the D.A., and warns them.","at":"op27","v":1},
  {"t":"Volunteers to follow Malfoy, and goes without sleep for a week to do it.","at":"hb19","v":1},
  {"t":"Reports where Malfoy is going.","at":"hb21","v":1},
  {"t":"Appears in the cellar at Malfoy Manor and takes the prisoners out two by two. Drops a chandelier on Bellatrix.","at":"dh23","v":1},
  {"t":"Her knife is in his chest when they arrive.","at":"dh23","v":1},
  {"t":"Buried at Shell Cottage, with a stone that says he was a free elf.","at":"dh24","v":1}]},
 {"id":"arthur","kind":"person","g":"m","name":[{"t":"Arthur Weasley","at":"cs3"}],"appear":"cs3","tag":[{"t":"Works at the Ministry of Magic","at":"cs3"}],"rel":["mrs_weasley","ron","ministry","anglia","lucius","weasleys","burrow","order","nagini"],"relAt":{"nagini":"op21"},"facts":[
  {"t":"Ron's father: thin, balding, red-haired. Works in the Misuse of Muggle Artifacts Office, which deals with ordinary objects that have been bewitched.","at":"cs3","v":1},
  {"t":"Fascinated by everything Muggle. He enchanted the family car to fly, and wrote the law with a loophole that lets him.","at":"cs3","v":1},
  {"t":"Would like a law to protect Muggles. Gets into a fist fight with Lucius Malfoy in the bookshop.","at":"cs4","v":1},
  {"t":"Faces an inquiry at work after the flying car is seen by Muggles.","at":"cs5","v":1},
  {"t":"Fined fifty Galleons over the car.","at":"cs12","v":1},
  {"t":"Tells Ginny never to trust anything that can think for itself if she cannot see where it keeps its brain.","at":"cs18","v":1},
  {"t":"Wins the Daily Prophet's annual draw.","at":"pa1","v":1},
  {"t":"Thinks Harry has a right to know about Black. His wife disagrees.","at":"pa4","v":1},
  {"t":"Makes Harry promise not to go looking for Black, whatever he hears.","at":"pa5","v":1},
  {"t":"Blasts his way out of the Dursleys' boarded-up fireplace.","at":"gf4","v":1},
  {"t":"Explains the Dark Mark and what the Death Eaters did.","at":"gf9","v":1},
  {"t":"Works day and night after the riot.","at":"gf10","v":1},
  {"t":"Takes Harry to the hearing. Works in a cramped office beside a broom cupboard.","at":"op7","v":1},
  {"t":"Bitten by a giant snake while on guard for the Order outside the Department of Mysteries.","at":"op21","v":1},
  {"t":"Recovering at St. Mungo's, where he lets a trainee try Muggle stitches.","at":"op22","v":1},
  {"t":"Promoted to head a new office that seizes fake protective charms and counterfeit spells.","at":"hb5","v":1},
  {"t":"One of the escorts.","at":"dh4","v":1},
  {"t":"Being watched at work.","at":"dh13","v":1}]},
 {"id":"lucius","kind":"person","g":"m","name":"Lucius Malfoy","appear":"cs3","tag":[{"t":"Draco's father","at":"cs3"},{"t":"A governor of Hogwarts","at":"cs14"},{"t":"No longer a governor","at":"cs18"},{"t":"In Azkaban","at":"op36","state":"away"},{"t":"Freed from Azkaban, and out of favor","at":"dh1"}],"rel":["draco","arthur","borgin","malfoys","governors","dobby","diary","committee","macnair","narcissa","voldemort","prophecy","malfoy_manor"],"relAt":{"dobby":"cs18","diary":"cs18","voldemort":"gf33","prophecy":"op34"},"facts":[
  {"t":"Mr. Weasley has been hoping to search his house for Dark objects.","at":"cs3","v":1},
  {"t":"Pale and pointed like his son, with cold gray eyes. Sells a list of things to Mr. Borgin before the Ministry's raids reach him.","at":"cs4","v":1},
  {"t":"Sneers at the Weasleys in the bookshop and picks up Ginny's secondhand Transfiguration book to do it.","at":"cs4","v":1},
  {"t":"Buys the whole Slytherin team new brooms.","at":"cs7","v":1},
  {"t":"Told Draco to keep his head down and let the heir get on with it. Was at school after the Chamber's first opening and knows the story.","at":"cs12","v":1},
  {"t":"Arrives at Hagrid's hut with an order signed by all twelve governors suspending Dumbledore.","at":"cs14","v":1},
  {"t":"Got the others' signatures by threatening their families, and is removed as a governor.","at":"cs18","v":1},
  {"t":"Slipped the diary in among Ginny's books that day in the bookshop.","at":"cs18","v":1},
  {"t":"Complains to the governors and the Ministry about his son's arm.","at":"pa6","v":1},
  {"t":"Frightens the committee into the verdict he wants.","at":"pa14","v":1},
  {"t":"In the Top Box as the Minister's guest, having given generously to St. Mungo's.","at":"gf8","v":1},
  {"t":"Comes when the Mark burns. Voldemort asks why he never looked for him.","at":"gf33","v":1},
  {"t":"Named by Harry as a Death Eater. Fudge will not hear it.","at":"gf36","v":1},
  {"t":"Seen in the Ministry corridor with Fudge, clinking gold.","at":"op9","v":1},
  {"t":"Leads the Death Eaters who close in among the shelves, and demands the sphere.","at":"op34","v":1},
  {"t":"Captured, and sent to Azkaban.","at":"op36","v":1},
  {"t":"In Azkaban, and out of favor. The task given to his son is how Voldemort means to repay the failure over the prophecy.","at":"hb2","v":1},
  {"t":"Has to hand over his wand.","at":"dh1","v":1},
  {"t":"The wand is destroyed.","at":"dh4","v":1},
  {"t":"Runs through the battle looking for his son.","at":"dh36","v":1}]},
 {"id":"lockhart","kind":"person","g":"m","name":"Gilderoy Lockhart","appear":"cs3","tag":[{"t":"A famous author","at":"cs3"},{"t":"Defense Against the Dark Arts teacher","at":"cs4"},{"t":"Has lost his memory","at":"cs18","state":"away"}],"rel":["harry","staff","dada","pixies","memory_charm","hermione","mungos"],"relAt":{"mungos":"op23"},"facts":[
  {"t":"Author of a guide to household pests that Mrs. Weasley swears by.","at":"cs3","v":1},
  {"t":"Handsome, with wavy blond hair and a great many teeth. Signing copies of his autobiography when he drags Harry into the photograph.","at":"cs4","v":1},
  {"t":"His whole set of books is on the second-year list, because he has taken the teaching job himself.","at":"cs4","v":1},
  {"t":"Opens his first lesson with a quiz about his own likes and ambitions, then looses a cage of pixies and runs for it.","at":"cs6","v":1},
  {"t":"Order of Merlin, Third Class, and five times winner of a magazine prize for the most charming smile.","at":"cs6","v":1},
  {"t":"Has Harry address his fan mail as a detention.","at":"cs7","v":1},
  {"t":"Tries to mend Harry's broken arm and takes out all the bones.","at":"cs10","v":1},
  {"t":"Starts a duelling club and is knocked flat by Snape in the first demonstration.","at":"cs11","v":1},
  {"t":"Marks Valentine's Day with pink decorations and dwarfs delivering messages.","at":"cs13","v":1},
  {"t":"Told by the other teachers to deal with the monster himself, he starts packing.","at":"cs16","v":1},
  {"t":"A fraud: other witches and wizards did everything in his books. He tracked them down, took their stories, and wiped their memories.","at":"cs16","v":1},
  {"t":"Tries a Memory Charm on Harry and Ron with Ron's broken wand. It backfires and takes his own.","at":"cs16","v":1},
  {"t":"Leaves the school, cheerful and with no idea who he is.","at":"cs18","v":1},
  {"t":"On the closed ward at St. Mungo's, signing photographs in joined-up writing and wondering why.","at":"op23","v":1}]},
 {"id":"colin","kind":"person","g":"m","name":"Colin Creevey","appear":"cs6","tag":[{"t":"First-year Gryffindor","at":"cs6"},{"t":"Petrified","at":"cs10","state":"away"},{"t":"Revived","at":"cs18"}],"rel":["harry","gryffindor","dennis"],"facts":[
  {"t":"Small and mousy-haired, never without his camera. A milkman's son who had no idea he was a wizard, and Harry's most persistent fan.","at":"cs6","v":1},
  {"t":"Found Petrified on his way to visit Harry in the hospital wing. The inside of his camera has melted.","at":"cs10","v":1},
  {"t":"He saw the monster only through the camera lens.","at":"cs16","v":1}]},
 {"id":"myrtle","kind":"person","g":"f","name":"Moaning Myrtle","appear":"cs8","tag":[{"t":"Haunts a girls' bathroom","at":"cs8"}],"rel":["myrtle_bath","ghosts","basilisk","chamber","prefects_bath","draco"],"relAt":{"basilisk":"cs16","chamber":"cs16","draco":"hb21"},"sub":"Ghost","facts":[
  {"t":"The ghost of a squat girl with lank hair and thick glasses, who lives in a toilet and takes offense at everything.","at":"cs8","v":1},
  {"t":"Floods her bathroom when upset, which is why nobody uses it.","at":"cs9","v":1},
  {"t":"Someone throws a book at her, and it goes straight through.","at":"cs13","v":1},
  {"t":"Died in that bathroom fifty years ago. She came out of a cubicle to tell a boy to go away, saw a pair of great yellow eyes by the sinks, and that was all.","at":"cs16","v":1},
  {"t":"Spies on the prefects' bathroom. Tells Harry to put the egg under the water.","at":"gf25","v":1},
  {"t":"Points Harry toward the merpeople's village.","at":"gf26","v":1},
  {"t":"Has a new friend, a boy who cries in her bathroom and is afraid.","at":"hb21","v":1},
  {"t":"Screams the castle down when Malfoy is cut.","at":"hb24","v":1}]},
 {"id":"riddle","kind":"person","g":"m","name":[{"t":"Tom Riddle","at":"cs13"}],"appear":"cs13","tag":[{"t":"A Hogwarts student fifty years ago","at":"cs13"},{"t":"The boy who became Voldemort","at":"cs17"}],"rel":["diary","dippet","hagrid","aragog","voldemort","ginny","basilisk","chamber","slytherin","gaunts","merope","riddle_sr","orphanage","mrs_cole","slughorn","ring","hepzibah","borgin_burkes","horcruxes"],"relAt":{"hagrid":"cs13","aragog":"cs13","voldemort":"cs17","ginny":"cs17","basilisk":"cs17","chamber":"cs17","slytherin":"cs17","gaunts":"hb10","merope":"hb10","riddle_sr":"hb10","orphanage":"hb13","mrs_cole":"hb13","slughorn":"hb17","ring":"hb17","hepzibah":"hb20","borgin_burkes":"hb20","horcruxes":"hb23"},"facts":[
  {"t":"His name is on a blank diary fifty years old, and on a school award for special services.","at":"cs13","v":1},
  {"t":"In the diary's memory he is a tall, black-haired prefect of sixteen, an orphan who does not want to be sent back to a Muggle orphanage if the school closes.","at":"cs13","v":1},
  {"t":"Caught Hagrid with a monster in a cupboard and turned him in.","at":"cs13","v":1},
  {"t":"A memory, kept in the diary for fifty years, and growing stronger as Ginny grows weaker.","at":"cs17","v":1},
  {"t":"Rearrange the letters of his full name, Tom Marvolo Riddle, and they spell out the name he chose for himself: he is Voldemort at sixteen.","at":"cs17","v":1},
  {"t":"Son of a witch and a Muggle father who abandoned her. The heir of Slytherin through his mother, and the one who opened the Chamber the first time and framed Hagrid for it.","at":"cs17","v":1},
  {"t":"Notices how alike he and Harry are: both half-blood, orphans, raised by Muggles, both Parselmouths.","at":"cs17","v":1},
  {"t":"Destroyed when Harry drives a basilisk fang through the diary.","at":"cs17","v":1},
  {"t":"Grandson of Marvolo Gaunt. His mother named him for his Muggle father and for hers.","at":"hb10","v":1},
  {"t":"At eleven, in the orphanage: tall for his age, pale and handsome. Already knows he is different, and has taught himself to move things, control animals and hurt people who annoy him.","at":"hb13","v":1},
  {"t":"Believes Dumbledore at once, and wants proof on the spot. Does not want help, friends or company. Keeps trophies.","at":"hb13","v":1},
  {"t":"At sixteen he found his mother's family, stole his uncle's ring, murdered his father and grandparents, and left his uncle to take the blame.","at":"hb17","v":1},
  {"t":"The teachers adored him. He already had a gang, and had started using the other name among them.","at":"hb17","v":1},
  {"t":"After school he turned down every offer and took a job at Borgin and Burkes, persuading people to part with treasures. He vanished after Hepzibah Smith's death with two of hers.","at":"hb20","v":1},
  {"t":"Asks Slughorn, with the ring on his finger, whether a soul could be split more than once.","at":"hb23","v":1}]},
 {"id":"dippet","kind":"person","g":"m","name":[{"t":"Professor Dippet","at":"cs13"},{"t":"Armando Dippet","at":"cs17"}],"appear":"cs13","tag":[{"t":"Headmaster fifty years ago","at":"cs13"}],"rel":["riddle","dumbledore"],"facts":[
  {"t":"A frail, nearly bald old wizard. Tells Riddle the school may have to close after a girl's death.","at":"cs13","v":1}]},
 {"id":"ernie","kind":"person","g":"m","name":"Ernie Macmillan","appear":"cs11","tag":[{"t":"Second-year Hufflepuff","at":"cs11"}],"rel":["justin","hannah","hufflepuff"],"facts":[
  {"t":"A stout boy who tells the other Hufflepuffs that Harry is the heir, and says so to his face.","at":"cs11","v":1},
  {"t":"Apologises once Hermione is attacked, and promptly suspects Malfoy.","at":"cs15","v":1}]},
 {"id":"penelope","kind":"person","g":"f","name":"Penelope Clearwater","appear":"cs14","tag":[{"t":"A Ravenclaw prefect, Petrified","at":"cs14","state":"away"},{"t":"Revived","at":"cs18"}],"rel":["percy","ravenclaw","hermione"],"relAt":{"percy":"cs18"},"facts":[
  {"t":"Found Petrified beside Hermione near the library.","at":"cs14","v":1},
  {"t":"Percy's girlfriend. He had been writing to her all summer and meeting her in empty classrooms.","at":"cs18","v":1}]},
 {"id":"borgin","kind":"person","g":"m","name":"Mr. Borgin","appear":"cs4","tag":[{"t":"Shopkeeper in Knockturn Alley","at":"cs4"}],"rel":["borgin_burkes","lucius"],"facts":[
  {"t":"A stooping, oily man who flatters Lucius Malfoy to his face and mutters about him once he has gone.","at":"cs4","v":1}]},
 {"id":"hopkirk","kind":"person","g":"f","name":"Mafalda Hopkirk","appear":"cs2","tag":[{"t":"Works at the Ministry of Magic","at":"cs2"}],"rel":["ministry"],"facts":[
  {"t":"Signs the official warning sent to Harry after a Hover Charm is used at Privet Drive.","at":"cs2","v":1}]},
 {"id":"masons","kind":"person","name":"Mr. and Mrs. Mason","appear":"cs1","tag":[{"t":"The Dursleys' dinner guests","at":"cs1"}],"rel":["vernon"],"facts":[
  {"t":"A rich builder and his wife. Vernon hopes to win a big order for drills from them.","at":"cs1","v":1},
  {"t":"Leave in a hurry when an owl swoops in. Mrs. Mason is terrified of birds.","at":"cs2","v":1}]},
 {"id":"grangers","kind":"person","name":"Mr. and Mrs. Granger","appear":"cs4","tag":[{"t":"Hermione's parents","at":"cs4"}],"rel":["hermione"],"facts":[
  {"t":"Muggles, and nervous in Gringotts. Mr. Weasley is delighted to meet them.","at":"cs4","v":1}]},
 {"id":"godric","kind":"person","g":"m","name":"Godric Gryffindor","appear":"cs9","tag":[{"t":"A founder of Hogwarts","at":"cs9"}],"rel":["founders","gryffindor","salazar","sword"],"relAt":{"sword":"cs17"},"facts":[
  {"t":"One of the four who founded the school over a thousand years ago.","at":"cs9","v":1},
  {"t":"His name is engraved on the sword Harry pulls from the Sorting Hat.","at":"cs17","v":1}]},
 {"id":"salazar","kind":"person","g":"m","name":"Salazar Slytherin","appear":"cs9","tag":[{"t":"A founder of Hogwarts","at":"cs9"}],"rel":["founders","slytherin","godric","chamber","parseltongue"],"facts":[
  {"t":"Wanted the school to take only children of all-magic families. Fell out with the others, Gryffindor above all, and left.","at":"cs9","v":1},
  {"t":"Legend says he built a hidden chamber before he went and sealed a monster in it for his true heir to release.","at":"cs9","v":1},
  {"t":"Famous for being able to talk to snakes, which is why his house's symbol is a serpent.","at":"cs11","v":1},
  {"t":"A towering statue of him, ancient and monkey-faced with a long thin beard, stands at the end of the Chamber.","at":"cs16","v":1}]},
 {"id":"rowena","kind":"person","g":"f","name":"Rowena Ravenclaw","appear":"cs9","tag":[{"t":"A founder of Hogwarts","at":"cs9"}],"rel":["founders","ravenclaw"],"facts":[
  {"t":"One of the four who founded the school over a thousand years ago.","at":"cs9","v":1}]},
 {"id":"helga","kind":"person","g":"f","name":"Helga Hufflepuff","appear":"cs9","tag":[{"t":"A founder of Hogwarts","at":"cs9"}],"rel":["founders","hufflepuff"],"facts":[
  {"t":"One of the four who founded the school over a thousand years ago.","at":"cs9","v":1}]},
 {"id":"patrick","kind":"person","g":"m","name":"Sir Patrick Delaney-Podmore","appear":"cs8","tag":[{"t":"Leads the Headless Hunt","at":"cs8"}],"rel":["nick","ghosts"],"sub":"Ghost","facts":[
  {"t":"Turns down Nearly Headless Nick's application to join the Hunt, because his head is not properly off.","at":"cs8","v":1},
  {"t":"Arrives at Nick's deathday party on a ghost horse and steals the show.","at":"cs8","v":1}]},
 {"id":"house_elves","kind":"creature","name":"House-elves","appear":"cs2","tag":[{"t":"Servants bound to wizard families","at":"cs2"}],"rel":["dobby","winky","spew","kitchens","kreacher"],"sub":"Species","facts":[
  {"t":"An elf serves one house until it dies and has powerful magic of its own, which it may not use without leave.","at":"cs2","v":1},
  {"t":"Found in big old manors and castles, with rich wizarding families.","at":"cs3","v":1},
  {"t":"An elf is freed only when its master gives it clothes.","at":"cs18","v":1},
  {"t":"A dismissed elf is disgraced.","at":"gf9","v":1},
  {"t":"Hogwarts has the largest number in any one dwelling in Britain.","at":"gf12","v":1},
  {"t":"Nearly all of them are proud to be unpaid and are horrified by Dobby.","at":"gf21","v":1},
  {"t":"An elf must obey a direct order from its family, but can twist one.","at":"op6","v":1},
  {"t":"They can Apparate where wizards cannot, which Voldemort never thought to consider.","at":"dh10","v":1},
  {"t":"The Hogwarts elves pour out of the kitchens with knives.","at":"dh36","v":1}]},
 {"id":"gnomes","kind":"creature","name":"Garden gnomes","appear":"cs3","tag":[{"t":"A garden pest","at":"cs3"}],"rel":["burrow"],"sub":"Species","facts":[
  {"t":"Small and leathery, with heads like potatoes. The cure is to swing them round until dizzy and throw them over the hedge. They come back.","at":"cs3","v":1}]},
 {"id":"ghoul","kind":"creature","name":"The ghoul in the attic","appear":"cs3","tag":[{"t":"Lives above Ron's room","at":"cs3"}],"rel":["burrow","ron"],"sub":"Ghoul","facts":[
  {"t":"Bangs on the pipes and groans whenever it thinks the house is too quiet.","at":"cs3","v":1},
  {"t":"Standing in for Ron, in pajamas, with painted spots.","at":"dh6","v":1}]},
 {"id":"errol","kind":"creature","name":"Errol","appear":"cs3","tag":[{"t":"The Weasley family owl","at":"cs3"}],"rel":["burrow","weasleys"],"sub":"Owl","attrs":{"Kind":"Owl"},"facts":[
  {"t":"Ancient and feather-duster gray. Tends to collapse on delivery.","at":"cs3","v":1},
  {"t":"Brings Ron his Howler and passes out in the milk.","at":"cs6","v":1}]},
 {"id":"hermes","kind":"creature","name":"Hermes","appear":"cs3","tag":[{"t":"Percy's owl","at":"cs3"}],"rel":["percy"],"sub":"Owl","owner":{"id":"percy","at":"cs3"},"attrs":{"Kind":"Screech owl"},"facts":[
  {"t":"A present to Percy for being made prefect. He will not lend him out.","at":"cs3","v":1}]},
 {"id":"pixies","kind":"creature","name":"Cornish pixies","appear":"cs6","tag":[{"t":"Lockhart's first lesson","at":"cs6"}],"rel":["lockhart"],"sub":"Species","facts":[
  {"t":"Electric blue, eight inches high and shrill. Let out of their cage they wreck the classroom and hang Neville from the chandelier.","at":"cs6","v":1},
  {"t":"Hermione stops them with a Freezing Charm.","at":"cs6","v":1}]},
 {"id":"fawkes","kind":"creature","name":"Fawkes","appear":"cs12","tag":[{"t":"Dumbledore's phoenix","at":"cs12"}],"rel":["dumbledore","office","sword","basilisk","wand_harry","priori"],"relAt":{"sword":"cs17","basilisk":"cs17","wand_harry":"gf36"},"sub":"Phoenix","owner":{"id":"dumbledore","at":"cs12"},"attrs":{"Kind":"Phoenix"},"facts":[
  {"t":"Bursts into flame in front of Harry on a Burning Day, and is reborn from the ashes as a chick.","at":"cs12","v":1},
  {"t":"Swan-sized, scarlet and gold when in full feather. Phoenixes can carry very heavy loads, their tears heal, and they are extremely faithful pets.","at":"cs12","v":1},
  {"t":"Comes to Harry in the Chamber with the Sorting Hat, because Harry showed loyalty to Dumbledore.","at":"cs17","v":1},
  {"t":"Puts out the basilisk's eyes, heals the fang wound in Harry's arm with tears, and carries all four of them out by his tail feathers.","at":"cs17","v":1},
  {"t":"The feathers in Harry's and Voldemort's wands are his. Heals the spider bite on Harry's leg.","at":"gf36","v":1},
  {"t":"Sings a lament over the grounds, and then leaves Hogwarts for good.","at":"hb29","v":1}]},
 {"id":"aragog","kind":"creature","name":[{"t":"The creature in the cupboard","at":"cs13"},{"t":"Aragog","at":"cs15"}],"appear":"cs13","tag":[{"t":"The creature Hagrid was expelled over","at":"cs13"},{"t":"Lives deep in the forest","at":"cs15"},{"t":"Dead","at":"hb22","state":"fallen"}],"rel":["hagrid","forest","riddle"],"relAt":{"hagrid":"cs15","riddle":"cs15"},"sub":"Giant spider","attrs":{"Kind":"Giant spider"},"facts":[
  {"t":"In Riddle's memory, something large and many-legged scuttles out of a cupboard where Hagrid has been keeping it.","at":"cs13","v":1},
  {"t":"A spider the size of a small elephant, gray with age and blind. Hagrid hatched him from an egg in a cupboard and fed him on scraps.","at":"cs15","v":1},
  {"t":"Never left the cupboard and never hurt anyone. When he was blamed, Hagrid got him away into the forest and later found him a mate.","at":"cs15","v":1},
  {"t":"Says the thing in the castle is an ancient creature spiders fear above all others, and will not speak its name.","at":"cs15","v":1},
  {"t":"Will not harm Hagrid. He sees no reason to deny his children fresh meat when it wanders in.","at":"cs15","v":1},
  {"t":"Dies of old age. His children would have eaten Hagrid had he gone to them. Slughorn takes some venom for his trouble.","at":"hb22","v":1}]},
 {"id":"basilisk","kind":"creature","name":[{"t":"Slytherin's monster","at":"cs9"},{"t":"The basilisk","at":"cs16"}],"appear":"cs9","tag":[{"t":"Sealed in the Chamber of Secrets","at":"cs9"},{"t":"Killed by Harry","at":"cs17","state":"fallen"}],"rel":["chamber","salazar","riddle","myrtle","fawkes","sword"],"relAt":{"riddle":"cs17","myrtle":"cs16","fawkes":"cs17","sword":"cs17"},"sub":"Serpent","attrs":{"Kind":"Basilisk"},"facts":[
  {"t":"The legend says only Slytherin's heir can control it, and that it will be used against students from Muggle families.","at":"cs9","v":1},
  {"t":"A giant serpent, the King of Serpents, that can live for centuries. Its stare kills, spiders flee before it, and the crowing of a rooster is fatal to it.","at":"cs16","v":1},
  {"t":"It has been travelling through the plumbing, which is why Harry, a Parselmouth, heard a voice in the walls.","at":"cs16","v":1},
  {"t":"Nobody this year looked straight at it. They saw it in a puddle, through a camera, through a ghost, in a mirror, so they were Petrified and not killed.","at":"cs16","v":1},
  {"t":"Bright green and thick as an oak trunk. Fawkes blinds it, and Harry drives a sword up through the roof of its mouth.","at":"cs17","v":1},
  {"t":"One of its fangs is what destroys the diary.","at":"cs17","v":1}]},
 {"id":"anglia","kind":"magic","name":[{"t":"Mr. Weasley's flying car","at":"cs3"},{"t":"The flying Ford Anglia","at":"cs5"}],"appear":"cs3","tag":[{"t":"Mr. Weasley's car","at":"cs3"},{"t":"Gone wild in the forest","at":"cs5"}],"rel":["arthur","ron","fred","george","willow","forest"],"group":"object","sub":"Vehicle","holders":[{"id":"arthur","at":"cs3"}],"facts":[
  {"t":"An old turquoise car enchanted to fly, turn invisible, and hold far more than it should. Mrs. Weasley was not told.","at":"cs3","v":1},
  {"t":"Fred, George and Ron use it to pull the bars off Harry's window.","at":"cs3","v":1},
  {"t":"Harry and Ron fly it to Hogwarts. The invisibility fails, Muggles see it, and it gives out over the grounds.","at":"cs5","v":1},
  {"t":"After the crash it throws them and their luggage out and drives itself off into the forest.","at":"cs5","v":1},
  {"t":"Turns up in the forest, scratched and muddy, and carries Harry and Ron out through the spiders.","at":"cs15","v":1}]},
 {"id":"floo","kind":"magic","name":"Floo powder","appear":"cs4","tag":[{"t":"Travel by fireplace","at":"cs4"}],"rel":["burrow","knockturn"],"group":"object","sub":"Travel","facts":[
  {"t":"Thrown into a fire, it turns the flames green. Step in, say clearly where you are going, and keep your elbows in.","at":"cs4","v":1},
  {"t":"Harry swallows ash, garbles the words and comes out one grate too far.","at":"cs4","v":1},
  {"t":"The Dursleys' fireplace is blocked by an electric fire, and four Weasleys get stuck behind it.","at":"gf4","v":1},
  {"t":"A wizard can also put just his head in the fire to talk.","at":"gf19","v":1},
  {"t":"Every fire at Hogwarts is being watched except Umbridge's own.","at":"op17","v":1}]},
 {"id":"howler","kind":"magic","name":"Howler","appear":"cs6","tag":[{"t":"A letter that shouts","at":"cs6"}],"rel":["ron","mrs_weasley"],"group":"object","sub":"Letter","facts":[
  {"t":"A red envelope that smokes at the corners. Opened, it bellows the sender's message at a hundred times normal volume. Left unopened, it explodes.","at":"cs6","v":1},
  {"t":"Ron gets one from his mother about the car, in front of the whole school.","at":"cs6","v":1},
  {"t":"One arrives for Aunt Petunia.","at":"op2","v":1}]},
 {"id":"rons_wand","kind":"magic","name":"Ron's broken wand","appear":"cs5","tag":[{"t":"Snapped in the crash","at":"cs5"}],"rel":["ron","willow","lockhart"],"relAt":{"lockhart":"cs16"},"group":"object","sub":"Wand","holders":[{"id":"ron","at":"cs5"}],"facts":[
  {"t":"Snapped nearly in two when the car hits the Whomping Willow.","at":"cs5","v":1},
  {"t":"Patched up with Spellotape, which does not help.","at":"cs6","v":1},
  {"t":"A curse meant for Malfoy shoots out of the wrong end, and Ron spends the afternoon bringing up slugs.","at":"cs7","v":1},
  {"t":"Lockhart borrows it for a Memory Charm, with results he does not remember.","at":"cs16","v":1}]},
 {"id":"nimbus2001","kind":"magic","name":"Nimbus Two Thousand and One","appear":"cs7","tag":[{"t":"Faster than Harry's","at":"cs7"}],"rel":["lucius","steam","draco"],"group":"object","sub":"Racing broom","facts":[
  {"t":"Seven of them, a gift from Lucius Malfoy to the Slytherin team in the year his son becomes Seeker.","at":"cs7","v":1}]},
 {"id":"hand_glory","kind":"magic","name":"The Hand of Glory","appear":"cs4","tag":[{"t":"For sale at Borgin and Burkes","at":"cs4"}],"rel":["borgin_burkes","draco"],"group":"object","sub":"Dark object","facts":[
  {"t":"A withered hand on a cushion. Put a candle in it and it gives light only to the one holding it. Draco wants it, and his father refuses.","at":"cs4","v":1},
  {"t":"Draco uses it to lead the Death Eaters through the darkness powder.","at":"hb27","v":1}]},
 {"id":"diary","kind":"magic","name":"Riddle's diary","appear":"cs13","tag":[{"t":"A blank diary that answers","at":"cs13"},{"t":"Destroyed","at":"cs17"},{"t":"A Horcrux, destroyed","at":"hb23"}],"rel":["riddle","myrtle_bath","ginny","lucius","basilisk","horcruxes"],"relAt":{"ginny":"cs17","lucius":"cs18","basilisk":"cs17","horcruxes":"hb23"},"group":"object","sub":"Enchanted book","facts":[
  {"t":"A small, shabby black book, fifty years old and bought in a Muggle shop. Harry finds it soaked in Myrtle's bathroom, and every page is blank.","at":"cs13","v":1},
  {"t":"Ink written in it sinks into the page, and a reply appears in a different hand. It can pull the reader into a memory.","at":"cs13","v":1},
  {"t":"Stolen from Harry's trunk by someone who tears the dormitory apart looking for it. Only a Gryffindor could have got in.","at":"cs14","v":1},
  {"t":"Ginny wrote in it for months. It answered kindly, took her over, and had her open the Chamber and write the messages without knowing.","at":"cs17","v":1},
  {"t":"She tried to get rid of it in the bathroom, then took it back in a panic when she saw Harry with it.","at":"cs17","v":1},
  {"t":"Stabbed with a basilisk fang, it bleeds ink and the memory in it dies.","at":"cs17","v":1},
  {"t":"It came from Lucius Malfoy. Dumbledore says it was a clever plan: had Ginny been blamed, her father's Muggle protection law would have been finished too.","at":"cs18","v":1},
  {"t":"A Horcrux, and the first one made. It was built to be used as a weapon as well as a safeguard, which told Dumbledore that Voldemort must have made others.","at":"hb23","v":1},
  {"t":"Destroyed by basilisk venom, though nobody knew then why that worked.","at":"dh6","v":1}]},
 {"id":"sword","kind":"magic","name":"The sword of Gryffindor","appear":"cs17","tag":[{"t":"Drawn from the Sorting Hat","at":"cs17"},{"t":"In Harry's hands","at":"dh19"},{"t":"Taken by Griphook","at":"dh26"},{"t":"Drawn by Neville","at":"dh36"}],"rel":["godric","hat","harry","basilisk","office","forest_dean","snape","griphook","neville"],"group":"object","sub":"Sword","relAt":{"forest_dean":"dh19","snape":"dh33","griphook":"dh15","neville":"dh36"},"facts":[
  {"t":"A silver sword with rubies the size of eggs in the hilt. It falls out of the Sorting Hat onto Harry's head when he asks for help.","at":"cs17","v":1},
  {"t":"Dumbledore says only a true Gryffindor could have pulled it out of the Hat. It is kept in his office.","at":"cs18","v":1},
  {"t":"The one known relic of Gryffindor. It is safe.","at":"hb23","v":1},
  {"t":"Left to Harry in Dumbledore's will. The Ministry says it was not his to leave.","at":"dh7","v":1},
  {"t":"Goblin-made, it takes in whatever makes it stronger. Since the Chamber it has been steeped in basilisk venom, so it can destroy Horcruxes. The one sent to Gringotts was a copy.","at":"dh15","v":1},
  {"t":"At the bottom of a frozen pool in the Forest of Dean. It has to be taken in need and with valor.","at":"dh19","v":1},
  {"t":"Snape put it there.","at":"dh33","v":1},
  {"t":"Comes to Neville out of the Hat.","at":"dh36","v":1}]},
 {"id":"polyjuice","kind":"magic","name":"Polyjuice Potion","appear":"cs9","tag":[{"t":"Turns you into someone else for an hour","at":"cs9"}],"rel":["hermione","snape","myrtle_bath","crabbe","goyle","millicent"],"relAt":{"crabbe":"cs12","goyle":"cs12","millicent":"cs12"},"group":"potion","sub":"Potion","holders":[{"id":"hermione","at":"cs12"}],"facts":[
  {"t":"The recipe is in a book in the Restricted Section. It takes a month to brew and needs a bit of the person to be copied.","at":"cs9","v":1},
  {"t":"Two ingredients have to be stolen from Snape's private stores. Harry sets off a firework in Potions to give Hermione the chance.","at":"cs11","v":1},
  {"t":"Looks like thick dark mud. With a hair added it changes color, and drinking it hurts. Harry and Ron pass as Crabbe and Goyle for exactly an hour.","at":"cs12","v":1},
  {"t":"It is not meant for animal transformations. The hair Hermione took from Millicent Bulstrode's robes belonged to a cat, and she spends weeks in the hospital wing with fur and a tail.","at":"cs12","v":1},
  {"t":"How one man passed as another for a whole school year, drinking a dose from a hip flask every hour.","at":"gf35","v":1},
  {"t":"Malfoy's lookouts use it.","at":"hb21","v":1},
  {"t":"Makes six false Harrys.","at":"dh4","v":1},
  {"t":"Gets the three into the Ministry.","at":"dh12","v":1},
  {"t":"And into Gringotts.","at":"dh26","v":1}]},
 {"id":"skelegro","kind":"magic","name":"Skele-Gro","appear":"cs10","tag":[{"t":"Regrows bones","at":"cs10"}],"rel":["pomfrey","harry"],"group":"potion","sub":"Potion","facts":[
  {"t":"Burns going down and works overnight, painfully. Madam Pomfrey uses it to regrow thirty-three bones in Harry's arm.","at":"cs10","v":1}]},
 {"id":"mandrakes","kind":"magic","name":"Mandrakes","appear":"cs6","tag":[{"t":"The cure for the Petrified","at":"cs6"}],"rel":["sprout","greenhouses","herbology"],"group":"potion","sub":"Plant","facts":[
  {"t":"A plant whose root is an ugly, bawling baby. The cry of a grown one kills, and even a seedling's will knock you out, so the class wears earmuffs to repot them.","at":"cs6","v":1},
  {"t":"The main ingredient of the draught that revives people who have been Petrified. Professor Sprout's crop has to mature first.","at":"cs9","v":1},
  {"t":"Turning moody and secretive, which means they are leaving childhood.","at":"cs13","v":1},
  {"t":"Ready at last. Everyone Petrified is revived in time for the feast.","at":"cs18","v":1}]},
 {"id":"willow","kind":"magic","name":"The Whomping Willow","appear":"cs5","tag":[{"t":"A tree that hits back","at":"cs5"}],"rel":["anglia","sprout","rons_wand","shack","lupin"],"group":"potion","sub":"Tree","relAt":{"shack":"pa17","lupin":"pa18"},"facts":[
  {"t":"A valuable old tree in the grounds that lashes out with its branches at anything in reach. It batters the car and breaks Ron's wand.","at":"cs5","v":1},
  {"t":"Professor Sprout has to put several of its branches in slings.","at":"cs6","v":1},
  {"t":"Smashes Harry's broom to splinters after it blows into its branches.","at":"pa9","v":1},
  {"t":"A knot on its trunk, when pressed, stops it moving and opens the way to a tunnel between the roots.","at":"pa17","v":1},
  {"t":"Planted the year Lupin came to school, to guard that tunnel.","at":"pa18","v":1}]},
 {"id":"expelliarmus","kind":"magic","name":"Expelliarmus","appear":"cs11","tag":[{"t":"The Disarming Charm","at":"cs11"}],"rel":["snape","harry","lockhart","draco"],"group":"spell","sub":"Charm","holders":[{"id":"snape","at":"cs11"},{"id":"harry","at":"cs16"}],"relAt":{"draco":"hb27"},"facts":[
  {"t":"Knocks the wand out of an opponent's hand. Snape uses it on Lockhart at the duelling club, hard enough to throw him across the room.","at":"cs11","v":1},
  {"t":"Harry uses it to take Lockhart's wand before he can run.","at":"cs16","v":1},
  {"t":"Harry, Ron and Hermione all cast it at Snape in the same instant.","at":"pa19","v":1},
  {"t":"What Harry casts against Voldemort's Killing Curse.","at":"gf34","v":1},
  {"t":"Draco disarms Dumbledore with it on the tower.","at":"hb27","v":1},
  {"t":"Harry's habit of using it gives him away.","at":"dh4","v":1},
  {"t":"His last spell against Voldemort.","at":"dh36","v":1}]},
 {"id":"memory_charm","kind":"magic","name":"Memory Charm","appear":"cs16","tag":[{"t":"Wipes memories","at":"cs16"}],"rel":["lockhart","rons_wand"],"group":"spell","sub":"Charm","holders":[{"id":"lockhart","at":"cs16"}],"facts":[
  {"t":"The one piece of magic Lockhart is truly good at. He has used it on everyone whose deeds he wrote up as his own.","at":"cs16","v":1}]},
 {"id":"parseltongue","kind":"magic","name":"Parseltongue","appear":"cs11","tag":[{"t":"The language of snakes","at":"cs11"}],"rel":["harry","salazar","riddle","voldemort","boa","basilisk"],"relAt":{"riddle":"cs17","voldemort":"cs18","boa":"cs11","basilisk":"cs16"},"group":"lore","sub":"Language","holders":[{"id":"harry","at":"cs11"},{"id":"salazar","at":"cs11"},{"id":"riddle","at":"cs17"}],"facts":[
  {"t":"Harry tells a conjured snake at the duelling club to leave a boy alone. To everyone else it sounds like hissing, and like egging it on.","at":"cs11","v":1},
  {"t":"A very rare gift, thought of as a mark of a Dark wizard. Salazar Slytherin had it.","at":"cs11","v":1},
  {"t":"Harry had used it once before without knowing, on a snake at the zoo.","at":"cs11","v":1},
  {"t":"It is why only Harry could hear the voice in the walls, and it is how the Chamber is opened.","at":"cs16","v":1},
  {"t":"Dumbledore thinks Voldemort passed some of his own powers to Harry on the night he gave him the scar, without meaning to.","at":"cs18","v":1}]},
 {"id":"founders","kind":"group","name":"The founders of Hogwarts","appear":"cs9","tag":[{"t":"Four witches and wizards, a thousand years ago","at":"cs9"}],"rel":["hogwarts","godric","salazar","rowena","helga"],"group":"org","sub":"Founders","holders":[{"id":"godric","at":"cs9"},{"id":"helga","at":"cs9"},{"id":"rowena","at":"cs9"},{"id":"salazar","at":"cs9"}],"facts":[
  {"t":"They built the castle far from Muggle eyes, at a time when magic was feared and its users persecuted.","at":"cs9","v":1},
  {"t":"Each gave a name to one of the four houses. They worked together for some years before Slytherin broke with the rest.","at":"cs9","v":1}]},
 {"id":"malfoys","kind":"group","name":"The Malfoys","appear":"cs4","tag":[{"t":"An old, rich wizarding family","at":"cs4"}],"rel":["draco","lucius","dobby","blacks","malfoy_manor"],"group":"family","sub":"Family","holders":[{"id":"lucius","at":"cs4"},{"id":"draco","at":"cs4"},{"id":"narcissa","at":"gf8"}],"facts":[
  {"t":"Proud of being pure-blood, and contemptuous of anyone who is not.","at":"cs4","v":1},
  {"t":"They live in a manor, with a hiding place for Dark objects under the drawing-room floor.","at":"cs12","v":1},
  {"t":"Hosts to Voldemort, and prisoners in all but name.","at":"dh1","v":1},
  {"t":"Sit together in the Great Hall afterwards, unsure whether they should be there.","at":"dh36","v":1}]},
 {"id":"governors","kind":"group","name":"The school governors","appear":"cs12","tag":[{"t":"Twelve of them","at":"cs12"}],"rel":["lucius","dumbledore","hogwarts"],"group":"org","sub":"Board","holders":[{"id":"lucius","at":"cs12"}],"facts":[
  {"t":"Lucius Malfoy is one, which is how Draco hears things.","at":"cs12","v":1},
  {"t":"They can appoint and suspend the headmaster. All twelve sign the order suspending Dumbledore.","at":"cs14","v":1},
  {"t":"Eleven of them ask Dumbledore back, saying they were threatened into signing.","at":"cs18","v":1}]},
 {"id":"burrow","kind":"place","name":"The Burrow","appear":"cs3","tag":[{"t":"The Weasleys' house","at":"cs3"}],"rel":["weasleys","arthur","mrs_weasley","gnomes","ghoul","anglia","lovegood_house"],"type":"wizard","facts":[
  {"t":"Looks like a stone pigpen that has had rooms added until it is several stories high and crooked, held up by magic. Just outside a village called Ottery St. Catchpole.","at":"cs3","v":1},
  {"t":"The kitchen clock tells you what you should be doing, not the time. Harry thinks it the best house he has ever been in.","at":"cs3","v":1},
  {"t":"Full to bursting, with Bill and Charlie home.","at":"gf5","v":1},
  {"t":"Guarded, and crowded.","at":"hb5","v":1},
  {"t":"The wedding is held in its orchard, and broken up by Death Eaters.","at":"dh8","v":1}]},
 {"id":"knockturn","kind":"place","name":"Knockturn Alley","appear":"cs4","tag":[{"t":"The dark side street","at":"cs4"}],"rel":["borgin_burkes","diagon"],"type":"wizard","parent":"diagon","facts":[
  {"t":"A dingy alley off Diagon Alley given over to the Dark Arts. Hagrid, there for slug repellent, pulls Harry out of it.","at":"cs4","v":1}]},
 {"id":"borgin_burkes","kind":"place","name":"Borgin and Burkes","appear":"cs4","tag":[{"t":"A shop for Dark objects","at":"cs4"}],"rel":["borgin","lucius","hand_glory","burke","necklace"],"type":"wizard","parent":"knockturn","facts":[
  {"t":"The biggest shop in Knockturn Alley. Harry hides in a cabinet there while the Malfoys do business.","at":"cs4","v":1},
  {"t":"Its stock includes a withered hand and an opal necklace labelled as cursed.","at":"cs4","v":1},
  {"t":"Draco threatens Mr. Borgin there.","at":"hb6","v":1},
  {"t":"Tom Riddle worked here after school.","at":"hb20","v":1},
  {"t":"It holds the twin of the school's Vanishing Cabinet.","at":"hb27","v":1}]},
 {"id":"chamber","kind":"place","name":[{"t":"The Chamber of Secrets","at":"cs8"}],"appear":"cs8","tag":[{"t":"Opened, according to the writing on the wall","at":"cs8"},{"t":"Under the school, through Myrtle's bathroom","at":"cs16"}],"rel":["salazar","basilisk","myrtle_bath","riddle","ginny"],"relAt":{"myrtle_bath":"cs16","riddle":"cs17","ginny":"cs17"},"type":"castle","parent":"hogwarts","facts":[
  {"t":"A message daubed on a corridor wall says it has been opened and warns the enemies of the heir.","at":"cs8","v":1},
  {"t":"A legend: Slytherin's hidden room, which only his heir can unseal. The school has been searched many times and nothing found.","at":"cs9","v":1},
  {"t":"Opened once before, fifty years ago. A student died, and whoever was blamed was expelled.","at":"cs12","v":1},
  {"t":"The entrance is a sink with a tiny snake scratched on the tap. Told to open in Parseltongue, it sinks away and uncovers a pipe.","at":"cs16","v":1},
  {"t":"A long, dim hall far below the lake, lined with pillars carved as serpents, with a giant statue of Slytherin at the end.","at":"cs16","v":1},
  {"t":"The basilisk comes out of the statue's mouth.","at":"cs17","v":1},
  {"t":"Ron and Hermione go down for fangs.","at":"dh31","v":1}]},
 {"id":"myrtle_bath","kind":"place","name":"Moaning Myrtle's bathroom","appear":"cs8","tag":[{"t":"Out of order","at":"cs8"}],"rel":["myrtle","polyjuice","diary","chamber"],"relAt":{"chamber":"cs16"},"type":"castle","parent":"hogwarts","facts":[
  {"t":"A gloomy girls' bathroom on the second floor that nobody uses, close to where the writing appears.","at":"cs8","v":1},
  {"t":"A safe place to brew a forbidden potion.","at":"cs9","v":1},
  {"t":"Where Harry finds the diary, after someone tries to flush it away.","at":"cs13","v":1}]},
 {"id":"office","kind":"place","name":"Dumbledore's office","appear":"cs11","tag":[{"t":"Behind a stone gargoyle","at":"cs11"}],"rel":["dumbledore","fawkes","hat","sword","pensieve","phineas"],"type":"castle","parent":"hogwarts","facts":[
  {"t":"Reached by a moving spiral stair behind a gargoyle that wants a password.","at":"cs11","v":1},
  {"t":"A round room full of whirring silver instruments, with portraits of past headmasters dozing on the walls. The Sorting Hat sits on a shelf.","at":"cs12","v":1},
  {"t":"The Pensieve is kept in a cabinet here.","at":"gf30","v":1},
  {"t":"Where Fudge tries to arrest Dumbledore.","at":"op27","v":1},
  {"t":"Locks itself against Umbridge.","at":"op28","v":1},
  {"t":"Harry smashes a good deal of it.","at":"op37","v":1},
  {"t":"Dumbledore's portrait hangs among the others.","at":"hb29","v":1},
  {"t":"Harry uses the Pensieve here.","at":"dh33","v":1},
  {"t":"The portraits give Harry a standing ovation.","at":"dh36","v":1}]},
 {"id":"slyth_room","kind":"place","name":"The Slytherin common room","appear":"cs12","tag":[{"t":"Behind a bare stone wall","at":"cs12"}],"rel":["slytherin","draco"],"type":"castle","parent":"dungeons","facts":[
  {"t":"A long, low dungeon room with greenish lamps and carved chairs, entered through a stretch of wall that slides open to the password.","at":"cs12","v":1}]},
 {"id":"azkaban","kind":"place","name":"Azkaban","appear":"cs12","tag":[{"t":"The wizard prison","at":"cs12"}],"rel":["hagrid","fudge","ministry","dementors","sirius","lestranges"],"type":"wizard","relAt":{"sirius":"pa3"},"facts":[
  {"t":"Malfoy says his father reckons the last person to open the Chamber is still locked up there.","at":"cs12","v":1},
  {"t":"Hagrid is sent there as a precaution.","at":"cs14","v":1},
  {"t":"Hagrid comes back from it shaken.","at":"cs18","v":1},
  {"t":"An island fortress. Nobody had ever escaped.","at":"pa3","v":1},
  {"t":"Guarded by Dementors.","at":"pa5","v":1},
  {"t":"Most prisoners go mad within weeks.","at":"pa10","v":1},
  {"t":"Sirius watched Crouch's son brought in, and heard him screaming for his mother.","at":"gf27","v":1},
  {"t":"Ten prisoners escape from the top-security wing.","at":"op25","v":1}]},
 {"id":"lupin","kind":"person","g":"m","name":[{"t":"Professor Lupin","at":"pa5"},{"t":"Remus Lupin","at":"pa18"}],"appear":"pa5","tag":[{"t":"Defense Against the Dark Arts teacher","at":"pa5"},{"t":"Resigned","at":"pa22","state":"away"},{"t":"Killed in the battle","at":"dh33","state":"fallen"}],"rel":["harry","staff","dada","patronus","boggarts","snape","wolfsbane","sirius","marauders","werewolves","shack","james","pettigrew","order","tonks","greyback","teddy","potterwatch"],"relAt":{"sirius":"pa17","marauders":"pa18","werewolves":"pa17","shack":"pa18","james":"pa18","pettigrew":"pa19","greyback":"hb16","tonks":"hb29"},"facts":[
  {"t":"Asleep in the last empty compartment in patched robes, young but tired and graying. Drives a Dementor off the train with something silvery and hands out chocolate.","at":"pa5","v":1},
  {"t":"Teaches by doing. His first lesson is a Boggart in the staffroom wardrobe, and he steps in before Harry can face it.","at":"pa7","v":1},
  {"t":"Admits he thought Harry's Boggart would be Voldemort. Drinks a foul smoking potion that Snape makes for him, saying he has been feeling off-color.","at":"pa8","v":1},
  {"t":"Ill, so Snape takes his class and sets an essay on werewolves.","at":"pa9","v":1},
  {"t":"Knew Harry's father at school.","at":"pa10","v":1},
  {"t":"Gives Harry private lessons against Dementors, using a Boggart as a stand-in.","at":"pa12","v":1},
  {"t":"Knows what the Marauder's Map is, gets Harry out of Snape's office, and confiscates it.","at":"pa14","v":1},
  {"t":"Sees a name on the map that should not be there, follows it to the Shrieking Shack, and embraces Sirius Black.","at":"pa17","v":1},
  {"t":"A werewolf. Hermione has known for months.","at":"pa17","v":1},
  {"t":"Bitten as a small boy. Dumbledore let him come to school, with a tunnel and an empty house to transform in each month.","at":"pa18","v":1},
  {"t":"One of the four who made the map. His friends called him Moony.","at":"pa18","v":1},
  {"t":"Forgot his potion that night. The moon comes out and he changes.","at":"pa20","v":1},
  {"t":"Resigns once Snape has let the school know what he is. Gives Harry back the map and the Cloak.","at":"pa22","v":1},
  {"t":"Sirius is to lie low at his house.","at":"gf36","v":1},
  {"t":"Leads the party that collects Harry.","at":"op3","v":1},
  {"t":"Says he never had the courage to tell his friends they were out of order.","at":"op29","v":1},
  {"t":"Holds Harry back from the veil.","at":"op35","v":1},
  {"t":"Living underground among the werewolves as Dumbledore's spy, with little success: they think Voldemort offers them more.","at":"hb16","v":1},
  {"t":"Trusts Snape because Dumbledore does.","at":"hb16","v":1},
  {"t":"Shattered by Dumbledore's death.","at":"hb29","v":1},
  {"t":"Holding Tonks's hand at the funeral.","at":"hb30","v":1},
  {"t":"Has married Tonks.","at":"dh1","v":1},
  {"t":"Offers to come with the three. Harry tells him a father should stay with his child, and worse.","at":"dh11","v":1},
  {"t":"Bursts in to say he has a son.","at":"dh25","v":1},
  {"t":"Lies dead beside his wife in the Great Hall.","at":"dh33","v":1},
  {"t":"Walks with Harry into the forest.","at":"dh34","v":1}]},
 {"id":"trelawney","kind":"person","g":"f","name":"Sybill Trelawney","appear":"pa6","tag":[{"t":"Divination teacher","at":"pa6"},{"t":"Sacked, but still living at Hogwarts","at":"op26"}],"rel":["divination","staff","north_tower","harry","prophecy","hogs_head","snape"],"relAt":{"prophecy":"op37","hogs_head":"op37","snape":"hb25"},"facts":[
  {"t":"Thin, draped in shawls and beads, with glasses that make her eyes enormous. Rarely comes down from her tower.","at":"pa6","v":1},
  {"t":"Sees the Grim in Harry's teacup. McGonagall says she has predicted the death of one student a year since she arrived, and none has died yet.","at":"pa6","v":1},
  {"t":"Will not sit down to Christmas dinner as the thirteenth at table.","at":"pa11","v":1},
  {"t":"At the end of Harry's exam her voice turns harsh and she says the Dark Lord's servant will break free and rejoin his master before midnight. Afterwards she remembers none of it.","at":"pa16","v":1},
  {"t":"Dumbledore counts that as her second real prediction.","at":"pa22","v":1},
  {"t":"Put on probation after failing to predict anything on demand.","at":"op15","v":1},
  {"t":"Sacked. Dumbledore lets her keep her rooms.","at":"op26","v":1},
  {"t":"Great-great-granddaughter of a famous Seer. She made the prophecy about Harry and Voldemort at her job interview, and has no idea. Dumbledore hired her to keep her safe.","at":"op37","v":1},
  {"t":"Thrown out of the Room of Requirement by someone she heard cheering inside it.","at":"hb25","v":1},
  {"t":"Remembers her interview being interrupted: the barman had caught Severus Snape listening at the door.","at":"hb25","v":1},
  {"t":"Drops crystal balls on Death Eaters from a balcony.","at":"dh36","v":1}]},
 {"id":"pettigrew","kind":"person","g":"m","name":"Peter Pettigrew","appear":"pa10","tag":[{"t":"Believed killed by Sirius Black","at":"pa10","state":"fallen"},{"t":"Alive, and the real traitor","at":"pa19"},{"t":"Escaped","at":"pa20","state":"away"},{"t":"Killed by his own silver hand","at":"dh23","state":"fallen"}],"rel":["sirius","james","marauders","scabbers","followers","lupin","nagini","bertha","cedric","spinners_end"],"relAt":{"sirius":"pa10","james":"pa10","marauders":"pa18","scabbers":"pa19","followers":"pa19","lupin":"pa19","cedric":"gf32"},"facts":[
  {"t":"A small, plump boy who tagged along after James Potter and Sirius Black at school.","at":"pa10","v":1},
  {"t":"Said to have cornered Black after the Potters died and been blown apart with a street full of Muggles. The largest piece found was a finger. Given the Order of Merlin, First Class.","at":"pa10","v":1},
  {"t":"One of the four who made the map. An Animagus who turns into a rat, known as Wormtail.","at":"pa18","v":1},
  {"t":"Alive. He was the Potters' Secret-Keeper, not Sirius, and sold them to Voldemort. He cut off his own finger, blew up the street and vanished down a sewer as a rat.","at":"pa19","v":1},
  {"t":"Has lived as Scabbers with the Weasleys for twelve years, listening for news of his master.","at":"pa19","v":1},
  {"t":"Harry will not let his father's friends become killers for him, and says he should go to the Dementors.","at":"pa19","v":1},
  {"t":"Changes back into a rat when Lupin transforms, and gets away.","at":"pa20","v":1},
  {"t":"Dumbledore says he now owes Harry his life, and that such a debt is a deep kind of magic.","at":"pa22","v":1},
  {"t":"Found his master and nurses him, fearfully. Voldemort keeps reminding him that he came back out of cowardice, not loyalty.","at":"gf1","v":1},
  {"t":"Kills Cedric. Cuts off his own right hand for the potion.","at":"gf32","v":1},
  {"t":"Rewarded with a hand of moving silver.","at":"gf33","v":1},
  {"t":"Assigned to Snape as a servant, and listens at doors.","at":"hb2","v":1},
  {"t":"Guarding the cellar at Malfoy Manor. Reminded that he owes Harry his life, he hesitates, and the hand Voldemort gave him turns on his throat.","at":"dh23","v":1}]},
 {"id":"stan","kind":"person","g":"m","name":"Stan Shunpike","appear":"pa3","tag":[{"t":"Conductor of the Knight Bus","at":"pa3"},{"t":"In Azkaban","at":"hb11","state":"away"}],"rel":["knight_bus","prang"],"facts":[
  {"t":"A pimply youth of eighteen or so who reads the Daily Prophet aloud and fills Harry in on Sirius Black.","at":"pa3","v":1},
  {"t":"Arrested on suspicion of Death Eater activity after bragging in a pub. Nobody who knows him believes it.","at":"hb11","v":1},
  {"t":"Among the attackers, blank-faced and plainly bewitched.","at":"dh4","v":1}]},
 {"id":"prang","kind":"person","g":"m","name":"Ernie Prang","appear":"pa3","tag":[{"t":"Driver of the Knight Bus","at":"pa3"}],"rel":["knight_bus","stan"],"facts":[
  {"t":"An elderly wizard in very thick glasses. Things in the road jump out of his way.","at":"pa3","v":1}]},
 {"id":"cedric","kind":"person","g":"m","name":"Cedric Diggory","appear":"pa9","tag":[{"t":"Hufflepuff captain and Seeker","at":"pa9"},{"t":"Hogwarts champion","at":"gf16"},{"t":"Killed in the graveyard","at":"gf32","state":"fallen"}],"rel":["hufflepuff","hteam","harry","amos","champions","cho","tournament"],"relAt":{"cho":"gf22"},"facts":[
  {"t":"A tall, handsome fifth year. Catches the Snitch as Harry falls, then asks for a rematch when he sees what happened.","at":"pa9","v":1},
  {"t":"Seventeen, quiet, embarrassed by his father's boasting.","at":"gf6","v":1},
  {"t":"The Hogwarts champion. Hufflepuff, which rarely gets any glory, is overjoyed.","at":"gf16","v":1},
  {"t":"Warned about the dragons by Harry. Turns a rock into a dog to distract his, and is burned.","at":"gf20","v":1},
  {"t":"Takes Cho Chang to the ball.","at":"gf22","v":1},
  {"t":"Repays Harry with a hint: take the egg into a bath.","at":"gf23","v":1},
  {"t":"Reaches the hostages second, under a Bubble-Head Charm. Cho is the person he would miss most.","at":"gf26","v":1},
  {"t":"Saved by Harry from a bewitched Krum and from a giant spider. Agrees to take the Cup together.","at":"gf31","v":1},
  {"t":"Killed by Wormtail on Voldemort's order within seconds of landing, for being in the way.","at":"gf32","v":1},
  {"t":"His echo asks Harry to take his body back to his parents.","at":"gf34","v":1},
  {"t":"Dumbledore tells the whole school how he died, and asks them to remember him as good, kind and brave.","at":"gf37","v":1}]},
 {"id":"cho","kind":"person","g":"f","name":"Cho Chang","appear":"pa13","tag":[{"t":"Ravenclaw Seeker","at":"pa13"},{"t":"Fifth-year Ravenclaw, Seeker","at":"gf22"}],"rel":["ravenclaw","rteam","harry","cedric","da","marietta"],"relAt":{"cedric":"gf22","da":"op16"},"facts":[
  {"t":"A fourth year, and the only girl on her team. Very pretty, Harry cannot help noticing, and she marks him closely all match.","at":"pa13","v":1},
  {"t":"Turns Harry down kindly: she has already said yes to Cedric.","at":"gf22","v":1},
  {"t":"Cedric's hostage in the lake.","at":"gf26","v":1},
  {"t":"In tears at the Leaving Feast.","at":"gf37","v":1},
  {"t":"Kisses Harry, crying, after the last D.A. meeting before Christmas.","at":"op21","v":1},
  {"t":"Their one date ends in a row.","at":"op25","v":1},
  {"t":"Defends Marietta, and that is that.","at":"op27","v":1},
  {"t":"Comes back to fight.","at":"dh29","v":1}]},
 {"id":"rosmerta","kind":"person","g":"f","name":"Madam Rosmerta","appear":"pa10","tag":[{"t":"Landlady of the Three Broomsticks","at":"pa10"},{"t":"Was under the Imperius Curse","at":"hb27"}],"rel":["broomsticks","hogsmeade","draco","necklace"],"relAt":{"draco":"hb27","necklace":"hb27"},"facts":[
  {"t":"Remembers James Potter and Sirius Black as boys, never apart and always laughing. Hears the full story from Fudge and the teachers.","at":"pa10","v":1},
  {"t":"Sold Slughorn the bottle of mead he meant to give Dumbledore.","at":"hb18","v":1},
  {"t":"Under the Imperius Curse for most of the year. She passed on the necklace, poisoned the mead, and sent word when Dumbledore left the school.","at":"hb27","v":1}]},
 {"id":"fortescue","kind":"person","g":"m","name":"Florean Fortescue","appear":"pa4","tag":[{"t":"Runs an ice cream parlor in Diagon Alley","at":"pa4"},{"t":"Missing","at":"hb6","state":"away"}],"rel":["diagon"],"facts":[
  {"t":"Knows a great deal about medieval witch burnings, helps Harry with his essay, and gives him free sundaes.","at":"pa4","v":1},
  {"t":"Dragged off, by the look of his shop.","at":"hb6","v":1}]},
 {"id":"cadogan","kind":"person","g":"m","name":"Sir Cadogan","appear":"pa6","tag":[{"t":"A knight in a painting","at":"pa6"}],"rel":["fatlady","tower"],"sub":"Portrait","facts":[
  {"t":"A squat little knight with a fat gray pony, forever challenging people to duels. Leads the three to the North Tower.","at":"pa6","v":1},
  {"t":"Takes over guarding Gryffindor Tower when no other portrait will. Changes the password twice a day.","at":"pa9","v":1},
  {"t":"Lets Sirius Black in, because he had the week's passwords on a piece of paper. Sacked.","at":"pa14","v":1}]},
 {"id":"macnair","kind":"person","g":"m","name":"Macnair","appear":"pa16","tag":[{"t":"The Ministry's executioner","at":"pa16"}],"rel":["committee","buckbeak","lucius","followers"],"relAt":{"lucius":"pa16","followers":"gf33"},"facts":[
  {"t":"A broad man with a thin black moustache, fingering his axe. An old friend of Lucius Malfoy.","at":"pa16","v":1},
  {"t":"Swings the axe into Hagrid's fence in a temper when the hippogriff is gone.","at":"pa21","v":1},
  {"t":"In the circle of Death Eaters. Voldemort promises him better victims than animals.","at":"gf33","v":1},
  {"t":"One of the Death Eaters who won over the new chief of the giants.","at":"op20","v":1}]},
 {"id":"dementors","kind":"creature","name":[{"t":"The Azkaban guards","at":"pa4"},{"t":"Dementors","at":"pa5"}],"appear":"pa4","tag":[{"t":"The guards of Azkaban","at":"pa4"}],"rel":["azkaban","patronus","sirius","harry","lupin","umbridge","commission"],"sub":"Species","facts":[
  {"t":"The Azkaban guards. Even the Minister's driver will not say much about them, and they are to be posted round Hogwarts.","at":"pa4","v":1},
