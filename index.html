 {"id":"violet","kind":"person","g":"f","name":"Violet Sorrengail","appear":"fw1","tag":[{"t":"Candidate for the Riders Quadrant","at":"fw1"},{"t":"First-year rider cadet","at":"fw3"},{"t":"Second-year rider cadet","at":"if3"},{"t":"Second-year cadet in Aretia","at":"if36"},{"t":"Second-year cadet on a task force","at":"os3"},{"t":"Leads the quest to the isles","at":"os20"},{"t":"Married, twelve hours missing","at":"os66"}],"rel":["tairn","andarna","xaden","dain","rhiannon","liam","mira","brennan","lilith","basgiath","archives"],"facts":[
  {"t":"Twenty years old. Raised by her father, a scribe, to enter the Scribe Quadrant.","at":"fw1","v":1},
  {"t":"Her mother, General Lilith Sorrengail, orders her into the Riders Quadrant instead.","at":"fw1","v":1},
  {"t":"Small and fragile: her joints slip out of place and her bones break easily. Her hair fades from brown to silver at the ends.","at":"fw1","v":1},
  {"t":"Gives Rhiannon tips for the parapet and swaps boots with her. Crosses with a dagger in hand and finishes by holding it on Jack Barlowe.","at":"fw2","v":1},
  {"t":"Lands in Second Squad, Flame Section, Fourth Wing, under Xaden Riorson.","at":"fw3","v":1},
  {"t":"Throws daggers with real accuracy, and knows poisons as well as any scribe.","at":"fw7","v":1},
  {"t":"Wins her early challenges by slipping mild poisons into her opponents' breakfast.","at":"fw8","v":1},
  {"t":"Climbs the last stage of the Gauntlet using a rope and her own dagger, and argues the Codex allows it.","at":"fw11","v":1},
  {"t":"Defends the golden feathertail at the Threshing and is chosen by two dragons, Tairn and Andarna. No rider has bonded two before.","at":"fw15","v":1},
  {"t":"Because Tairn is mated to Sgaeyl, her life is now tied to Xaden's.","at":"fw16","v":1},
  {"t":"Her grounding place, for holding back her dragon's power, is the Archives.","at":"fw22","v":1},
  {"t":"Her signet manifests during War Games: lightning.","at":"fw28","v":1},
  {"t":"Learns to speak into Xaden's mind.","at":"fw28","v":1},
  {"t":"Tells Xaden she loves him on the parapet, on the anniversary of the Battle of Aretia.","at":"fw32","v":1},
  {"t":"Learns venin are real, that Xaden has been arming Poromish fliers, and that Dain read her memories without asking.","at":"fw35","v":1},
  {"t":"Kills a venin hand to hand on Tairn's back, then brings down a venin rider with lightning while Andarna holds time still.","at":"fw37","v":1},
  {"t":"Stabbed with a poisoned blade at Resson; wakes three days later in Aretia with only a thin scar.","at":"fw39","v":1},
  {"t":"Agrees to fight with the rebellion, but tells Xaden she can't trust him with her heart again.","at":"fw39","v":1},
  {"t":"Wakes in Aretia after Resson, now 21. Brennan mended her while she slept.","at":"if1","v":1},
  {"t":"Backs a cover story at Basgiath: gryphons attacked at a lake, and the dead were burned there.","at":"if4","v":1},
  {"t":"Starts secretly researching in the Archives how wards are made, hoping to protect Aretia.","at":"if7","v":1},
  {"t":"Kills a hulking first-year sent to assassinate her.","at":"if10","v":1},
  {"t":"Varrish and Carr punish her by making her strike lightning on a peak until she nearly burns out.","at":"if13","v":1},
  {"t":"Strikes a deal with Sloane: one of Liam's letters each week, if Sloane trains with Imogen.","at":"if16","v":1},
  {"t":"Dain tells her that her mother carved the scars on Xaden's back.","at":"if21","v":1},
  {"t":"Tells Rhiannon, Ridoc and Sawyer most of the truth. The four promise to make it to graduation together.","at":"if30","v":1},
  {"t":"Survives a second assassination attempt on a turret. Eya dies, and Jack Barlowe pulls Violet up.","at":"if31","v":1},
  {"t":"Helps steal the journals of Warrick and Lyra, two of the First Six, from the royal vault.","at":"if33","v":1},
  {"t":"Drugged by Nolon, cut off from Tairn, and captured by Varrish.","at":"if34","v":1},
  {"t":"Tortured for days. Nolon mends her between sessions so it can go on.","at":"if35","v":1},
  {"t":"Kills Varrish with Xaden's hand over hers, and tells Xaden she loves him.","at":"if36","v":1},
  {"t":"Learns her mother put her in the Riders Quadrant to keep her alive, and flies to Aretia with the deserters.","at":"if36","v":1},
  {"t":"Her first attempt to wake Aretia's wardstone, with the blood of six riders, fails.","at":"if39","v":1},
  {"t":"Felix starts training her control and gives her a conduit to bleed off power.","at":"if40","v":1},
  {"t":"Kills a captive venin in Tecarus's arena by striking lightning into the flooded field.","at":"if42","v":1},
  {"t":"Dislocates her shoulder trying to save a falling flier, then kills four wyvern by striking down into a cloud.","at":"if44","v":1},
  {"t":"Nearly strangles Cat in a challenge after Cat uses her gift on her.","at":"if47","v":1},
  {"t":"Works out that the journal's word for blood really means breath: the wardstone needs dragonfire.","at":"if51","v":1},
  {"t":"With Rhiannon, warns the fliers that the wards will cut off their power.","at":"if52","v":1},
  {"t":"Raises Aretia's wards with the fire of six dragons, and learns Xaden's second signet.","at":"if56","v":1},
  {"t":"Receives Lyra's journal from her mother, with a warning that Aretia's wards will fail.","at":"if57","v":1},
  {"t":"Realizes the real target is Basgiath, not Samara, and decides to go back and fight.","at":"if58","v":1},
  {"t":"Fights the horde at Basgiath, drawing lightning from her mother's storm.","at":"if61","v":1},
  {"t":"Leaps from Tairn to reach Sawyer and falls with him until Tairn catches them both.","at":"if62","v":1},
  {"t":"Learns Andarna is a seventh breed, and nearly burns out imbuing Basgiath's wardstone.","at":"if64","v":1},
  {"t":"Watches her mother give her life to power the wardstone.","at":"if64","v":1},
  {"t":"Sees a faint red ring around Xaden's eyes.","at":"if65","v":1},
  {"t":"Hides the red rings in Xaden's eyes and vows to find a cure.","at":"os0","v":1},
  {"t":"Lost her conduit in the battle, and keeps her mother's journals.","at":"os1","v":1},
  {"t":"Kills disguised venin in the healers' tunnels with thrown daggers.","at":"os2","v":1},
  {"t":"Assigned by the Senarium to a task force to find and recruit the seventh breed.","at":"os3","v":1},
  {"t":"Pins a wingleader's glove to the dais with a thrown dagger to stop fire aimed at Dain.","at":"os5","v":1},
  {"t":"Gives a speech asking Navarrian and Aretian riders to stand together.","at":"os6","v":1},
  {"t":"Helps change Basgiath's wardstone at midnight so fliers can wield inside it, and is charged with treason.","at":"os7","v":1},
  {"t":"Confesses to the Senarium. The pardons signed that morning cover her.","at":"os8","v":1},
  {"t":"Dreams someone else's memory of a burning room.","at":"os9","v":1},
  {"t":"Dislocates her knee when a tornado throws Tairn into a mountain.","at":"os10","v":1},
  {"t":"Learns to pick out Xaden's own shadows through their bond, since she's the only one who could kill him.","at":"os16","v":1},
  {"t":"Opens her father's book with the name of her mother's dragon.","at":"os18","v":1},
  {"t":"Tears up orders handing the quest to others and chooses her own squad.","at":"os20","v":1},
  {"t":"Answers Narelle's three questions and receives six books her father wrote for her.","at":"os24","v":1},
  {"t":"Buys Deverelli's alliance with Andarna's eggshell, and gets Halden banished from the isle.","at":"os27","v":1},
  {"t":"Wins a knife duel on Unnbriel. Lightning strikes the arena though the isle has no magic.","at":"os32","v":1},
  {"t":"Saves the squad on Hedotis by poisoning the rulers' tea first and trading antidotes.","at":"os36","v":1},
  {"t":"Her gift on Zehyllna is a broken compass.","at":"os38","v":1},
  {"t":"The irids say she was the real test, and she failed it by using a juvenile's power for war.","at":"os41","v":1},
  {"t":"Tells Ridoc everything and names a line: if Xaden crosses it, she'll let him go.","at":"os43","v":1},
  {"t":"Gives Xaden an onyx cuff made from a piece of Riorson House's turret for his birthday.","at":"os45","v":1},
  {"t":"Learns she walks in other people's dreams, a second signet from Andarna.","at":"os50","v":1},
  {"t":"Leaves the wall to protect Dunne's temple outside Aretia, as Aaric asked.","at":"os51","v":1},
  {"t":"Tells Andarna she wants her to be happy, even without her. Andarna breaks their bond, and Tairn holds Violet to life.","at":"os53","v":1},
  {"t":"Learns her parents once tried to dedicate her to Dunne as a toddler.","at":"os54","v":1},
  {"t":"Chooses a single objective at Draithus: kill Theophanie.","at":"os57","v":1},
  {"t":"Sees through Tairn's eyes and brings down dozens of wyvern with volleys of lightning.","at":"os62","v":1},
  {"t":"Breaks her left arm when Tairn is netted. Kills Theophanie with a stone dagger, then burns out.","at":"os64","v":1},
  {"t":"Wakes in Aretia twelve hours later with a ring on her finger and a temple blessing of her marriage to Xaden, and no memory of either.","at":"os66","v":1}]},
 {"id":"xaden","kind":"person","g":"m","name":"Xaden Riorson","appear":"fw1","tag":[{"t":"Third-year, wingleader of Fourth Wing","at":"fw1"},{"t":"Lieutenant at Samara","at":"if6"},{"t":"Leading the revolution from Aretia","at":"if36"},{"t":"Duke of Tyrrendor","at":"os6"},{"t":"Duke, and professor of Signet Sparring","at":"os13"},{"t":"Duke of Tyrrendor","at":"os46"},{"t":"Says he is venin","at":"os54","state":"venin"},{"t":"Missing","at":"os66","state":"away"}],"rel":["sgaeyl","violet","liam","garrick","bodhi","fen","tyrrendor","aretia","samara"],"facts":[
  {"t":"Third-year and wingleader of Fourth Wing. Son of Fen Riorson, who led the Tyrrish rebellion.","at":"fw1","v":1},
  {"t":"Carries a rebellion relic from his wrist to his jaw.","at":"fw1","v":1},
  {"t":"Moves Dain's squad into Fourth Wing, which puts Violet under his command.","at":"fw3","v":1},
  {"t":"Bonded to Sgaeyl, who most other dragons avoid.","at":"fw4","v":1},
  {"t":"Wields shadows, a rare signet he lets Violet see.","at":"fw7","v":1},
  {"t":"Leads the first ten marked ones into the Threshing in 631, sending them in pairs because other cadets are as dangerous as the dragons.","at":"fw7","td":3,"v":1},
  {"t":"Sgaeyl gives him the scar through his left eyebrow, flicking him with her tail when he doesn't move fast enough.","at":"fw7","td":3,"v":1},
  {"t":"Tells Sgaeyl that once his mission is done, he'd like to burn Basgiath to the ground. She bonds him anyway.","at":"fw7","td":3,"v":1},
  {"t":"Sgaeyl tells him which dragons are coming for marked ones. He suspects dragons who side with the rebels seek out relic-bearers.","at":"fw7","td":6,"v":1},
  {"t":"Teaches Violet to fight and nicknames her Violence. He knows she is poisoning opponents and keeps quiet.","at":"fw9","v":1},
  {"t":"Kills Oren and the other cadets who attacked Violet in her room.","at":"fw19","v":1},
  {"t":"Moves Liam into Violet's squad to guard her, and publicly accuses Amber Mavis of the attack.","at":"fw20","v":1},
  {"t":"Grew up partly at Tirvainne, fostered with Liam after both their families were executed.","at":"fw21","v":1},
  {"t":"Checks the willing dragons every year for any whose riders died in the rebellion.","at":"fw21","td":11,"v":1},
  {"t":"Teaches Violet to shield. His own grounding place is a hillside near the ruins of Aretia.","at":"fw22","v":1},
  {"t":"Liam teases him about the way he watches Violet.","at":"fw24","td":11,"v":1},
  {"t":"Twenty-three, born in March. Favorite food: chocolate cake.","at":"fw28","v":1},
  {"t":"Works out a saddle with Tairn so Violet can keep her seat in battle.","at":"fw28","v":1},
  {"t":"The silver scars across his back are a count of the 107 marked ones. He promised their loyalty with his own life so they could try for the quadrant instead of being executed.","at":"fw30","v":1},
  {"t":"Has been sneaking beyond the wards to supply Poromish fliers with weapons that can kill venin.","at":"fw35","v":1},
  {"t":"Because of his relic, General Melgren can't foresee battles he's part of.","at":"fw36","v":1},
  {"t":"Holds back a horde of wyvern with a wall of shadow at Resson.","at":"fw36","v":1},
  {"t":"Takes Violet to Aretia, which he and the marked ones have been quietly rebuilding. The city is still technically his.","at":"fw39","v":1},
  {"t":"Tells Violet he fell for her, and vows to earn back her trust.","at":"fw39","v":1},
  {"t":"Grew up believing Maxim Riorson was his great-uncle. Sgaeyl calls him Maxim's grandson.","at":"fw39","td":3,"v":1},
  {"t":"Sits on the Assembly, the council that runs the revolution in Aretia.","at":"if1","v":1},
  {"t":"Says he'll answer anything about himself, but will always keep some of the revolution's secrets.","at":"if3","v":1},
  {"t":"Posted as a lieutenant to Samara, the easternmost outpost of the Southern Wing.","at":"if6","v":1},
  {"t":"Writes Violet letters about his past, as a way to let her in.","at":"if10","v":1},
  {"t":"Explains the daggers' alloy: it stores power, and caches of it at outposts strengthen the wards.","at":"if12","v":1},
  {"t":"Badly wounded when fliers attack Samara; a mender saves his arm.","at":"if27","v":1},
  {"t":"Delivers daggers to a drift beyond the border.","at":"if28","v":1},
  {"t":"His ex, Catriona, flies with that drift.","at":"if29","v":1},
  {"t":"Kills Prince Alic at his Threshing after Alic holds a dagger to Garrick's throat. Sgaeyl burns the bodies.","at":"if32","td":3,"v":1},
  {"t":"Deserts his post and drops wyvern carcasses at the border outposts to pull Navarre's leaders away.","at":"if35","v":1},
  {"t":"Breaks into the brig, tells Violet he's loved her since snow fell in her hair, and leads half the quadrant to Aretia.","at":"if36","v":1},
  {"t":"Lilith carved his 107 scars. The favor he owed her was keeping Violet alive in her first year.","at":"if36","v":1},
  {"t":"His chest scar marks that he took responsibility for Violet after Resson. He holds the Assembly's seventh seat.","at":"if37","v":1},
  {"t":"By birth he's the Duke of Aretia, and the great chair in the Assembly chamber was Tyrrendor's throne.","at":"if48","v":1},
  {"t":"Was betrothed to Cat under an alliance with Tecarus, and ended it.","at":"if48","v":1},
  {"t":"At his Threshing he's about eight months from a betrothal to Cat that his father arranged. He calls it business.","at":"if48","td":3,"v":1},
  {"t":"Sgaeyl bonded his grandfather, which made a second signet possible.","at":"if55","v":1},
  {"t":"His second signet: he can read intentions, a kind of inntinnsic. Only Sgaeyl knew.","at":"if56","v":1},
  {"t":"Agrees with Violet to keep no more secrets. His mother left once he turned ten.","at":"if58","v":1},
  {"t":"Tells Violet to ward Basgiath, not Aretia, and goes to face the horde's leader.","at":"if64","v":1},
  {"t":"Kills the venin leader at the edge of a ravine.","at":"if65","v":1},
  {"t":"Drew power from the ground to survive that fight. A red ring now edges his eyes.","at":"if66","v":1},
  {"t":"Faint red rings edge his irises after Basgiath. If anyone noticed, he'd be executed.","at":"os0","v":1},
  {"t":"Can sense venin nearby, and they can sense him.","at":"os2","v":1},
  {"t":"Learned to fight from Dukes Lindell and Lewellen, alongside Garrick.","at":"os3","td":3,"v":1},
  {"t":"Draws a little power from a wooden headboard without meaning to, and pulls back from Violet to keep control.","at":"os4","v":1},
  {"t":"Restored to his title and Senarium seat as Duke of Tyrrendor.","at":"os6","v":1},
  {"t":"Declares Maren's young brothers citizens of Tyrrendor.","at":"os11","v":1},
  {"t":"Made professor of Signet Sparring, which puts Violet off-limits under the Codex.","at":"os13","v":1},
  {"t":"Channeled at Fervan without noticing, until Sgaeyl finally yelled at him.","at":"os14","v":1},
  {"t":"Hears a thought Violet didn't send. His inntinnsic may be growing.","at":"os21","v":1},
  {"t":"Calm on Deverelli, where there's no magic to tempt him.","at":"os25","v":1},
  {"t":"Introduces Violet as his consort at King Courtlyn's court.","at":"os26","v":1},
  {"t":"Draws on the alloy in Violet's conduit and kills a dozen guards in an instant. His eyes ring red.","at":"os27","v":1},
  {"t":"The flecks in his eyes stay amber after Deverelli.","at":"os28","v":1},
  {"t":"Learns his mother is alive and married on Hedotis.","at":"os33","v":1},
  {"t":"Tells Hedotis's rulers he'll only sign a lifetime marriage contract, and only with Violet.","at":"os35","v":1},
  {"t":"Tells Violet there is no cure for him.","at":"os39","v":1},
  {"t":"The irids call him an abomination.","at":"os42","v":1},
  {"t":"Opens Tyrrendor's border to Poromish refugees on the Medaro Pass. Aetos makes him resign as professor.","at":"os46","v":1},
  {"t":"Reaches 73 days without channeling, aiming for 76.","at":"os48","v":1},
  {"t":"Realizes Violet has been walking into his recurring nightmare.","at":"os50","v":1},
  {"t":"Takes command of Aretia's defense when a horde attacks.","at":"os51","v":1},
  {"t":"Tells Mira that her family's prophecy is about him, because he is venin.","at":"os54","v":1},
  {"t":"Halts talladium shipments to Navarre until the king confirms the alliance.","at":"os55","v":1},
  {"t":"To save Sgaeyl, channels fully from the earth and kills every wyvern over Draithus. Red veins now branch from his eyes.","at":"os65","v":1},
  {"t":"Gone. He leaves Violet a note telling her not to look for him, and riders, dragons and eggs go missing the same night.","at":"os66","v":1}]},
 {"id":"dain","kind":"person","g":"m","name":"Dain Aetos","appear":"fw1","tag":[{"t":"Second-year, squad leader","at":"fw1"},{"t":"Wingleader, Fourth Wing","at":"if6"},{"t":"Rider in Aretia","at":"if36"},{"t":"Wingleader, Fourth Wing","at":"os7"}],"rel":["cath","violet","aetos","sloane"],"facts":[
  {"t":"Violet's closest friend since they were five or six. His father is one of General Sorrengail's most trusted officers.","at":"fw1","v":1},
  {"t":"Squad leader of Second Squad, Flame Section. Wants Violet out of the quadrant and safe.","at":"fw3","v":1},
  {"t":"Bonded to Cath. His signet lets him see someone's recent memories by touching their face.","at":"fw4","v":1},
  {"t":"Bonds Cath at his Threshing in 632. His father had pushed for a green, but Dain jumps for the red.","at":"fw4","td":5,"v":1},
  {"t":"His mother left during the Tyrrish rebellion, and stopped writing once he volunteered for the Riders Quadrant.","at":"fw4","td":5,"v":1},
  {"t":"Catches a second-year, Joelle Tadita, when she falls out of a tree during his Threshing.","at":"fw4","td":5,"v":1},
  {"t":"Hopes that once Violet finishes in the Scribe Quadrant, they might be more than friends.","at":"fw4","td":5,"v":1},
  {"t":"Asks Colonel Markham to take Violet into the Scribe Quadrant mid-year.","at":"fw9","v":1},
  {"t":"Kisses Violet after the Threshing. She feels nothing.","at":"fw16","v":1},
  {"t":"Tries to read Violet's memory of the night attack. She refuses.","at":"fw20","v":1},
  {"t":"Realizes Violet and Xaden are together and begs her not to go to Athebyne.","at":"fw33","v":1},
  {"t":"Read Violet's memories without asking, after Xaden told her about Athebyne, and passed what he saw to his father.","at":"fw35","v":1},
  {"t":"His father asks him to report any marked one who breaks the Codex. Dain argues for the chain of command, but agrees to keep watch.","at":"fw35","td":5,"v":1},
  {"t":"Goes pale when Xaden says the word Athebyne to him in public.","at":"if4","v":1},
  {"t":"Becomes wingleader of Fourth Wing.","at":"if6","v":1},
  {"t":"Challenges Violet, admits he told his father Xaden had gone to Athebyne, and tells her who carved Xaden's scars.","at":"if21","v":1},
  {"t":"Refuses Varrish's order to dig through Violet's memories.","at":"if24","v":1},
  {"t":"As wingleader, knocks Sloane out of an orange's fire at her Threshing, then goes to report himself for interfering.","at":"if30","td":12,"v":1},
  {"t":"Sees Resson in Violet's memories, stabs Varrish, and frees her.","at":"if35","v":1},
  {"t":"Calls a formation to tell the quadrant the truth, and leaves for Aretia.","at":"if36","v":1},
  {"t":"Resets Violet's dislocated shoulder on the cliff path.","at":"if44","v":1},
  {"t":"Helps Violet translate Warrick's journal and imbue Aretia's wardstone, and apologizes for Liam.","at":"if49","v":1},
  {"t":"Reads Jack's memories and learns about the lures and the horde. Jack drains him, leaving gray handprints on his arms.","at":"if60","v":1},
  {"t":"Steps in when the senior wingleader forces a challenge.","at":"os5","v":1},
  {"t":"Keeps Fourth Wing when the wingleaders are named.","at":"os7","v":1},
  {"t":"His father disowns him in public.","at":"os8","v":1},
  {"t":"Smuggles Violet's father's book out of the commanding general's quarters.","at":"os17","v":1},
  {"t":"Joins the quest for his Krovlish.","at":"os20","v":1},
  {"t":"Knocked out in Unnbriel's trial by combat.","at":"os32","v":1},
  {"t":"His gift on Zehyllna is a slap.","at":"os38","v":1},
  {"t":"Follows Sloane to Draithus against orders. She siphons his power to save Mira.","at":"os59","v":1},
  {"t":"Kills a venin after Imogen turns his shield to stone.","at":"os63","v":1}]},
 {"id":"rhiannon","kind":"person","g":"f","name":"Rhiannon Matthias","appear":"fw1","tag":[{"t":"Candidate","at":"fw1"},{"t":"First-year rider cadet","at":"fw3"},{"t":"Squad leader","at":"if6"}],"rel":["feirge","violet"],"facts":[
  {"t":"A candidate Violet meets on the stairs up to the parapet. Violet trades boots with her.","at":"fw1","v":1},
  {"t":"Becomes Violet's closest friend in the squad.","at":"fw3","v":1},
  {"t":"Grew up in a village near the Cygnisen border. Her twin sister is expecting a baby.","at":"fw12","v":1},
  {"t":"Bonds Feirge, a Green Daggertail.","at":"fw16","v":1},
  {"t":"Wakes on Threshing day hearing a dragon call her, and stays to protect a burned squadmate, Visia, from an orange until Feirge arrives.","at":"fw16","td":8,"v":1},
  {"t":"Her twin, Raegan, is due with her first baby around the winter solstice.","at":"fw16","td":8,"v":1},
  {"t":"Her signet is summoning: she can pull objects to her hand.","at":"fw23","v":1},
  {"t":"Summons the map out of General Sorrengail's office to win the Squad Battle.","at":"fw25","v":1},
  {"t":"Meets her baby nephew on a side trip from Montserrat.","at":"fw26","v":1},
  {"t":"Becomes Second Squad's leader. Her first order: live.","at":"if6","v":1},
  {"t":"Summons a dagger through a wall for the first time, hiding it from Varrish.","at":"if29","v":1},
  {"t":"Learns most of the truth and holds the squad together around it.","at":"if30","v":1},
  {"t":"Her family moves to Aretia, near the market square.","at":"if45","v":1},
  {"t":"The first person Violet tells about the wards, so the fliers can be warned.","at":"if51","v":1},
  {"t":"Gets Second Squad assigned to guard the sky over Basgiath's wardstone.","at":"if60","v":1},
  {"t":"Leaps from Feirge onto Tairn to fight a venin attacking Violet.","at":"if61","v":1},
  {"t":"Her answer to who you send when it matters: Sorrengail.","at":"os44","v":1},
  {"t":"Summons a wyvern's wingspur out of Tairn's leg, the biggest thing she's ever pulled.","at":"os52","v":1},
  {"t":"Holds the mouth of the Medaro Pass against seventeen wyvern. She has a twin sister, Raegan.","at":"os61","v":1}]},
 {"id":"ridoc","kind":"person","g":"m","name":[{"t":"Ridoc","at":"fw4"},{"t":"Ridoc Gamlyn","at":"if39"}],"appear":"fw4","tag":[{"t":"First-year rider cadet","at":"fw4"},{"t":"Second-year rider cadet","at":"if3"}],"rel":["aotrom","violet"],"facts":[
  {"t":"A squadmate who jokes his way through everything.","at":"fw4","v":1},
  {"t":"Bonds Aotrom, a Brown Swordtail.","at":"fw16","v":1},
  {"t":"Throws up before his Threshing, then tries to turn Aotrom down for being too much like himself.","at":"fw16","td":10,"v":1},
  {"t":"Learned to joke to cut the tension between parents who argued constantly.","at":"fw16","td":10,"v":1},
  {"t":"Gets into Aotrom's seat by hooking his belt over the dragon's swordtail and getting flung into a tree.","at":"fw16","td":10,"v":1},
  {"t":"His signet is ice wielding.","at":"fw23","v":1},
  {"t":"Admits in interrogation training that he's terrified of snakes.","at":"if23","v":1},
  {"t":"Remembers a classified ledger listing the journals of Warrick and Lyra.","at":"if30","v":1},
  {"t":"Hammers a sword into the cliff so others can swing past a trap, and takes two arrows. Brennan mends him.","at":"if44","v":1},
  {"t":"Throws up a wall of ice against Baide's fire and burns his hands.","at":"if59","v":1},
  {"t":"Freezes the venin in the healers' tunnels.","at":"os2","v":1},
  {"t":"Can draw water from the air and freeze the water inside things.","at":"os20","v":1},
  {"t":"The cook on Hedotis throws a knife at him, but it only cuts his jacket.","at":"os37","v":1},
  {"t":"His gift on Zehyllna is two kisses.","at":"os38","v":1},
  {"t":"Sees Xaden's red eyes and demands the truth.","at":"os42","v":1},
  {"t":"Makes Violet name a line Xaden can't cross, and tell the rest of the squad.","at":"os43","v":1},
  {"t":"Freezes a wyvern from the inside with a touch.","at":"os61","v":1}]},
 {"id":"liam","kind":"person","g":"m","name":"Liam Mairi","appear":"fw7","tag":[{"t":"First-year, marked one","at":"fw7"},{"t":"Fallen at Resson","at":"fw36","state":"fallen"}],"rel":["deigh","xaden","violet","sloane","resson"],"facts":[
  {"t":"A first-year marked one. Climbs the Gauntlet faster than anyone in his year.","at":"fw12","v":1},
  {"t":"The strongest first-year: unbeaten on the mat.","at":"fw20","v":1},
  {"t":"Xaden moves him into Violet's squad, and the room next to hers, to keep her alive.","at":"fw20","v":1},
  {"t":"Bonded to Deigh, a Red Daggertail.","at":"fw21","v":1},
  {"t":"Son of Colonel Isaac Mairi. Both his parents were executed after the rebellion, and he was fostered with Xaden at Tirvainne.","at":"fw21","v":1},
  {"t":"Carves small wooden figures, including dragons for Violet.","at":"fw21","v":1},
  {"t":"Spends his Threshing under a tree like the ones at home, carving a figure of Deigh with his father's penknife.","at":"fw21","td":11,"v":1},
  {"t":"Watched both his parents die within twelve hours.","at":"fw21","td":11,"v":1},
  {"t":"His father was killed in secret, in the courtyard of the family home.","at":"fw21","td":4,"v":1},
  {"t":"His signet is farsight: he can pick out a single tree miles away.","at":"fw23","v":1},
  {"t":"Jack runs him through with a sword during War Games. He survives.","at":"fw28","v":1},
  {"t":"Dies at Resson after Deigh is killed protecting Tairn. He asks Violet to look after his sister.","at":"fw36","v":1},
  {"t":"Left a stack of letters to Sloane under his mattress. Violet takes them.","at":"if3","v":1},
  {"t":"Violet imagines him at her side through her torture.","at":"if35","v":1},
  {"t":"His mother, Celadine, was a master of runes. The family estate, Mairghdelle, now belongs to a Navarrian noble.","at":"if45","td":11,"v":1}]},
 {"id":"sawyer","kind":"person","g":"m","name":[{"t":"Sawyer","at":"fw4"},{"t":"Sawyer Henrick","at":"if10"}],"appear":"fw4","tag":[{"t":"First-year rider cadet","at":"fw4"},{"t":"Second-year rider cadet","at":"if3"},{"t":"Second-year, executive officer","at":"if8"},{"t":"Second-year rider cadet","at":"if52"}],"rel":["sliseag","violet"],"facts":[
  {"t":"A squadmate repeating his first year after failing to bond the year before.","at":"fw4","v":1},
  {"t":"Bonds Sliseag, a Red Swordtail.","at":"fw16","v":1},
  {"t":"Dain had to agree to take him into his squad as a repeat.","at":"fw16","td":8,"v":1},
  {"t":"At his first Threshing a green swatted him aside with its tail, and he spent two weeks in the infirmary.","at":"fw16","td":9,"v":1},
  {"t":"Bonds Sliseag on his second try. The red tells him he was never unworthy; Sliseag just wasn't ready the year before.","at":"fw16","td":9,"v":1},
  {"t":"The first in the squad to manifest a signet: metallurgy, bending metal.","at":"fw18","v":1},
  {"t":"Becomes Rhiannon's executive officer.","at":"if8","v":1},
  {"t":"Finds a passage showing more than one wardstone was made.","at":"if30","v":1},
  {"t":"Asks Violet to teach him to sign, so he can talk with Jesinia.","at":"if45","v":1},
  {"t":"Gives up the executive officer's post when a drift joins the squad.","at":"if52","v":1},
  {"t":"A wyvern takes his leg below the knee. Violet keeps him alive until the fliers carry him to the healers.","at":"if62","v":1},
  {"t":"Lost his lower leg at Basgiath and is on crutches.","at":"os1","v":1},
  {"t":"Reshapes the iron of one rune line on Basgiath's wardstone.","at":"os7","v":1},
  {"t":"Learning to sign for Jesinia.","at":"os13","v":1},
  {"t":"Rides Sliseag again, using a hook he built into his prosthetic.","at":"os47","v":1}]},
 {"id":"garrick","kind":"person","g":"m","name":[{"t":"Garrick","at":"fw7"},{"t":"Garrick Tavis","at":"fw20"}],"appear":"fw7","tag":[{"t":"Third-year, Flame Section leader","at":"fw7"},{"t":"Missing","at":"os66","state":"away"}],"rel":["xaden","chradh","imogen"],"facts":[
  {"t":"A big third-year marked one and Xaden's closest friend. Leads Flame Section in Fourth Wing.","at":"fw7","v":1},
  {"t":"A prince in his year beats him in his sleep, then ambushes him again at the Threshing.","at":"fw7","td":3,"v":1},
  {"t":"Bonds Chradh at the 631 Threshing, the last of the ten marked ones to land.","at":"fw7","td":4,"v":1},
  {"t":"One of the best fighters in the quadrant. Carries two swords.","at":"fw11","v":1},
  {"t":"Got his mother out of Aretia before Navarre came for the rebels' families.","at":"fw21","td":4,"v":1},
  {"t":"Has loved Imogen since they were children.","at":"fw32","td":4,"v":1},
  {"t":"Asks Xaden to assign him to Imogen so he has a reason to talk to her.","at":"fw32","td":7,"v":1},
  {"t":"Helped start smuggling weapons beyond the wards after their first-year Threshing.","at":"fw36","v":1},
  {"t":"Bonded to Chradh, a Brown Scorpiontail with a knack for sensing runes. Chradh finds an iron box in the ruins at Resson.","at":"fw39","v":1},
  {"t":"His father was Fen Riorson's aide.","at":"if11","v":1},
  {"t":"Before the Battle of Aretia, his father told him Xaden had to live, for Tyrrendor's sake.","at":"if11","td":4,"v":1},
  {"t":"Kills one of Alic's friends at the Threshing.","at":"if32","td":3,"v":1},
  {"t":"Comes with Xaden to break Violet out of the brig.","at":"if36","v":1},
  {"t":"Tells Violet that Xaden killed a venin outside Draithus.","at":"if52","v":1},
  {"t":"Guards Xaden the night after Basgiath.","at":"os0","v":1},
  {"t":"Arrives at Newhall impossibly fast.","at":"os10","v":1},
  {"t":"His hidden second signet: he can cross hundreds of miles in minutes.","at":"os11","v":1},
  {"t":"A wind wielder. Serves as the squad's sparring target.","at":"os17","v":1},
  {"t":"Eats a poisoned dessert on Hedotis and stops breathing.","at":"os35","v":1},
  {"t":"A fig slurry brings him back.","at":"os37","v":1},
  {"t":"Theophanie tears him and Chradh out of the sky. He brings her ransom demand to Aretia.","at":"os56","v":1},
  {"t":"Carries Jack to Draithus, sedated, inside a runed chest.","at":"os58","v":1},
  {"t":"Walks Imogen and Quinn's body to the armory, too spent to go on.","at":"os63","v":1},
  {"t":"Among the riders missing after Draithus.","at":"os66","v":1}]},
 {"id":"bodhi","kind":"person","g":"m","name":[{"t":"Bodhi","at":"fw7"},{"t":"Bodhi Durran","at":"fw20"}],"appear":"fw7","tag":[{"t":"Second-year, marked one","at":"fw7"},{"t":"Xaden's heir","at":"os51"}],"rel":["xaden"],"facts":[
  {"t":"A second-year marked one and Xaden's cousin.","at":"fw7","v":1},
  {"t":"Bonds Cuir at the 632 Threshing.","at":"fw7","td":6,"v":1},
  {"t":"Promised Xaden he'd look after the marked ones in his year, though he never wanted to lead.","at":"fw7","td":6,"v":1},
  {"t":"His parents died in the rebellion. His father taught him to always keep his word.","at":"fw7","td":6,"v":1},
  {"t":"Runs at a scarred blue that isn't on the bonding list. Cuir snatches him out of its fire.","at":"fw7","td":6,"v":1},
  {"t":"Executive officer of Tail Section.","at":"fw20","v":1},
  {"t":"Fights at Resson; a venin breaks his arm in four places.","at":"fw39","v":1},
  {"t":"Moves to Flame Section as its leader, under orders to keep Violet away from the supply runs.","at":"if9","v":1},
  {"t":"Bonded to Cuir, a green.","at":"if13","v":1},
  {"t":"His signet shows at the desertion: he counters other riders' signets.","at":"if36","v":1},
  {"t":"One of the six riders whose blood fails to wake Aretia's wardstone.","at":"if39","v":1},
  {"t":"Begs Xaden to break his betrothal to Cat, and offers to back him with the council.","at":"if48","td":6,"v":1},
  {"t":"Guards Xaden the night after Basgiath.","at":"os0","v":1},
  {"t":"Xaden's only living blood relative.","at":"os20","v":1},
  {"t":"Has no second signet. Gives Violet a bond-blocking serum and its antidote, in case.","at":"os28","v":1},
  {"t":"Ordered to stay behind the walls as Xaden's heir.","at":"os51","v":1},
  {"t":"Wants to leave school to fight. Xaden trains him to take over.","at":"os55","v":1},
  {"t":"His countering doesn't work on venin magic. Cuir carries him out of the fight.","at":"os60","v":1}]},
 {"id":"imogen","kind":"person","g":"f","name":[{"t":"Imogen","at":"fw5"},{"t":"Imogen Cardulo","at":"if35"}],"appear":"fw5","tag":[{"t":"Second-year, marked one","at":"fw5"}],"rel":["violet","xaden","garrick"],"facts":[
  {"t":"A pink-haired second-year marked one in Violet's squad. Breaks Violet's arm on the mat.","at":"fw5","v":1},
  {"t":"Bonds Glane at the 632 Threshing.","at":"fw5","td":7,"v":1},
  {"t":"Her mother and sister were executed after the rebellion.","at":"fw7","v":1},
  {"t":"Grew up at Hardincourt, the third generation of riders in her family. Her mother and her sister, Katrina, taught her to ground.","at":"fw7","td":7,"v":1},
  {"t":"Glane marks her with a relic the night after Presentation, and starts channeling before they've flown. Imogen grounds herself in her childhood home.","at":"fw7","td":7,"v":1},
  {"t":"On Xaden's orders, trains Violet's strength in the gym.","at":"fw17","v":1},
  {"t":"Fast, and can wipe someone's recent memories. Leads the squad through the Squad Battle.","at":"fw25","v":1},
  {"t":"Has feelings for Garrick.","at":"fw32","v":1},
  {"t":"Wants Garrick but keeps him away, convinced that everyone she gets close to dies.","at":"fw32","td":7,"v":1},
  {"t":"Was fostered alone, by loyalists at Ivyndelle. Sloane and a girl named Julianne were the only other marked ones placed alone.","at":"fw36","td":7,"v":1},
  {"t":"Runs with Violet every morning so they can outrun a venin draining the ground.","at":"if9","v":1},
  {"t":"Bonded to Glane, an orange daggertail.","at":"if13","v":1},
  {"t":"Trains Sloane daily as part of Violet's deal.","at":"if16","v":1},
  {"t":"Kept the carving of Deigh that Liam had on him when he died, and gives it to Sloane at her Threshing.","at":"if30","td":12,"v":1},
  {"t":"Exposes Cat's cheating in the challenge.","at":"if47","v":1},
  {"t":"Wipes Jack's memory of Violet's bargain with him.","at":"os12","v":1},
  {"t":"Her mother and sister died defending Aretia.","at":"os63","v":1},
  {"t":"Shows a second signet: she turns Dain's shield to stone to stop venin fire.","at":"os63","v":1},
  {"t":"Holds Quinn as she dies.","at":"os63","v":1},
  {"t":"Admits she altered Violet's memory, as Violet asked.","at":"os66","v":1}]},
 {"id":"quinn","kind":"person","g":"f","name":"Quinn","appear":"fw11","tag":[{"t":"Second-year rider cadet","at":"fw11"},{"t":"Killed at Draithus","at":"os63","state":"fallen"}],"rel":["imogen"],"facts":[
  {"t":"A second-year in Violet's squad with blond curls.","at":"fw11","v":1},
  {"t":"Bonds Cruth at the 632 Threshing.","at":"fw11","td":7,"v":1},
  {"t":"Decided she and Imogen were friends the moment she saw Imogen's relic. Calls her Gen.","at":"fw11","td":7,"v":1},
  {"t":"Her signet is astral projection.","at":"fw25","v":1},
  {"t":"Projects herself as Violet and Rhiannon to give them alibis. Her dragon Cruth once belonged to her great-aunt, which strengthens her signet.","at":"if34","v":1},
  {"t":"Fights with a double-bladed battle-ax.","at":"if62","v":1},
  {"t":"Her girlfriend, Jax, is stationed in Aretia.","at":"os55","v":1},
  {"t":"Holds a tower at Draithus with her projections so civilians can flee. A venin stabs her, and she dies.","at":"os63","v":1}]},
 {"id":"heaton","kind":"person","g":"n","name":"Heaton","appear":"fw11","tag":[{"t":"Third-year rider cadet","at":"fw11"}],"rel":[],"facts":[
  {"t":"A third-year in Violet's squad with flame-dyed hair. Uses they/them.","at":"fw11","v":1},
  {"t":"Can breathe underwater.","at":"fw25","v":1},
  {"t":"Graduates.","at":"if4","v":1},
  {"t":"Badly hurt when Pavis falls.","at":"if50","v":1}]},
 {"id":"emery","kind":"person","g":"m","name":"Emery","appear":"fw17","tag":[{"t":"Third-year rider cadet","at":"fw17"}],"rel":[],"facts":[
  {"t":"A third-year in the squad who controls wind.","at":"fw17","v":1},
  {"t":"Knocks out a guard with a gust during the Squad Battle.","at":"fw25","v":1},
  {"t":"Graduates.","at":"if4","v":1},
  {"t":"His leg is shattered when Pavis falls.","at":"if50","v":1}]},
 {"id":"nadine","kind":"person","g":"f","name":"Nadine","appear":"fw20","tag":[{"t":"First-year rider cadet","at":"fw20"},{"t":"Killed by a first-year","at":"if9","state":"fallen"}],"rel":[],"facts":[
  {"t":"Joins the squad when it's merged with another. Distrusts marked ones at first.","at":"fw20","v":1},
  {"t":"From a village on the Deaconshire–Tyrrendor border. Her signet unweaves wards.","at":"fw25","v":1},
  {"t":"Jokingly claims to be Violet when a first-year asks for her, and he snaps her neck.","at":"if9","v":1}]},
 {"id":"cianna","kind":"person","g":"f","name":"Cianna","appear":"fw5","tag":[{"t":"Executive officer, Second Squad","at":"fw5"}],"rel":["dain"],"facts":[
  {"t":"Dain's executive officer in Second Squad.","at":"fw5","v":1},
  {"t":"The squadmate Dain gets along with best in his first year.","at":"fw5","td":5,"v":1},
  {"t":"Pushes the clouds off the cliff path with her wind signet so the dragons can see.","at":"if44","v":1}]},
 {"id":"soleil","kind":"person","g":"f","name":[{"t":"Soleil","at":"fw7","td":3},{"t":"Soleil","at":"fw35"},{"t":"Soleil Telery","at":"if4"}],"appear":"fw35","tag":[{"t":"Third-year, marked one","at":"fw35"},{"t":"Fallen at Resson","at":"fw36","state":"fallen"}],"rel":["fuil","xaden"],"via":[{"td":3,"at":"fw7"}],"facts":[
  {"t":"One of the first ten marked ones to enter the quadrant, in 631.","at":"fw7","td":3,"v":1},
  {"t":"Flies out of the 631 Threshing on a Brown Clubtail.","at":"fw7","td":4,"v":1},
  {"t":"A third-year marked one in Xaden's headquarters squad.","at":"fw35","v":1},
  {"t":"Holds back a rockslide so civilians can reach a mine, then is drained to death by a venin along with her dragon, Fuil.","at":"fw36","v":1}]},
 {"id":"jesinia","kind":"person","g":"f","name":"Jesinia Neilwart","appear":"fw18","tag":[{"t":"First-year scribe cadet","at":"fw18"},{"t":"Scribe in Aretia","at":"if36"}],"rel":["violet","archives"],"facts":[
  {"t":"A first-year scribe and Violet's friend in the Archives. They talk in sign language, since scribes keep quiet there.","at":"fw18","v":1},
  {"t":"Liam flirts with her on Archives runs.","at":"fw21","v":1},
  {"t":"First in her year, likely on the adept path toward Curator. Brings Violet tomes on Basgiath's founding.","at":"if7","v":1},
  {"t":"Concludes the Archives are incomplete, by ignorance or design, and lends Violet books off the record.","at":"if16","v":1},
  {"t":"Finds that the journals of Warrick and Lyra sit in the royal vault, which only the king's bloodline can open.","at":"if31","v":1},
  {"t":"Leaves Basgiath for Aretia with two other scribes.","at":"if36","v":1},
  {"t":"Takes on Lyra's journal, written in Morrainian.","at":"if57","v":1},
  {"t":"Finds the one difference between the journals: Lyra's says seven where Warrick's says six.","at":"if63","v":1},
  {"t":"Stripped from the scribes' adept path and assigned to research for the quest.","at":"os13","v":1}]},
 {"id":"jack","kind":"person","g":"m","name":"Jack Barlowe","appear":"fw2","tag":[{"t":"Candidate","at":"fw2"},{"t":"First-year rider cadet","at":"fw3"},{"t":"Presumed dead","at":"fw28","state":"fallen"},{"t":"Back at Basgiath","at":"if25"},{"t":"Killed his dragon","at":"if59"},{"t":"Venin","at":"if60","state":"venin"},{"t":"Prisoner at Basgiath","at":"os0","state":"venin"}],"rel":["baide","violet"],"facts":[
  {"t":"Throws another candidate off the parapet and vows to kill Violet after she pulls a dagger on him.","at":"fw2","v":1},
  {"t":"Breaks a first-year's neck while sparring.","at":"fw5","v":1},
  {"t":"Hunts the golden feathertail at the Threshing. Violet's dagger to his shoulder sends him running.","at":"fw14","v":1},
  {"t":"Bonds Baide, an Orange Scorpiontail who has had four riders before him.","at":"fw16","v":1},
  {"t":"In a challenge, pours searing power into Violet through his hands. Red rings his eyes. She stops him with a vial of orange, which he is allergic to.","at":"fw23","v":1},
  {"t":"Runs Liam through in midair during War Games and is caught in the tower Violet's lightning brings down.","at":"fw28","v":1},
  {"t":"Alive: Nolon spent months mending him bone by bone. He comes back oddly kind.","at":"if25","v":1},
  {"t":"Kills the last assassin on the turret and pulls Violet up. Says they're even.","at":"if31","v":1},
  {"t":"Rides Baide into Basgiath's ward chamber and kills her, breaking the wardstone.","at":"if59","v":1},
  {"t":"Has been venin since before his first-year challenge against Violet; Nolon was trying to mend him. He survives his dragon's death.","at":"if60","v":1},
  {"t":"Planted lures around Basgiath to lead the horde in.","at":"if60","v":1},
  {"t":"Held in the interrogation cell. Tells Xaden there is no cure.","at":"if66","v":1},
  {"t":"Taunts that the venin want Violet, and that Xaden will turn.","at":"os0","v":1},
  {"t":"Venin try to break him out. He's draining the stones of his warded cell.","at":"os2","v":1},
  {"t":"Trades answers for power: there's no cure, and venin don't want one.","at":"os12","v":1},
  {"t":"Carried to Draithus sedated in a runed chest. He's Berwyn's initiate.","at":"os58","v":1},
  {"t":"Theophanie throws a dagger at him for talking too much.","at":"os59","v":1}]},
 {"id":"oren","kind":"person","g":"m","name":"Oren Seifert","appear":"fw8","tag":[{"t":"First-year rider cadet","at":"fw8"},{"t":"Killed by Xaden","at":"fw19","state":"fallen"}],"rel":["jack"],"facts":[
  {"t":"A first-year Violet beats with a poisoned breakfast.","at":"fw8","v":1},
  {"t":"Helps Jack hunt the feathertail. Violet spares him while he's unconscious.","at":"fw14","v":1},
  {"t":"Fails to bond, then leads a group of unbonded cadets into Violet's room at night. Xaden kills him and the others.","at":"fw19","v":1}]},
 {"id":"tynan","kind":"person","g":"m","name":"Tynan","appear":"fw5","tag":[{"t":"First-year rider cadet","at":"fw5"},{"t":"Killed at the Threshing","at":"fw14","state":"fallen"}],"rel":["jack"],"facts":[
  {"t":"A first-year in Violet's squad who resents her.","at":"fw5","v":1},
  {"t":"Cuts Violet's arm while hunting the feathertail. Tairn burns him.","at":"fw14","v":1}]},
 {"id":"aurelie","kind":"person","g":"f","name":"Aurelie","appear":"fw5","tag":[{"t":"First-year rider cadet","at":"fw5"},{"t":"Died on the Gauntlet","at":"fw10","state":"fallen"}],"rel":[],"facts":[
  {"t":"A strong fighter from a family of riders.","at":"fw5","v":1},
  {"t":"Falls to her death on the Gauntlet's spinning posts during practice. Her parents don't collect her things.","at":"fw10","v":1}]},
 {"id":"amber","kind":"person","g":"f","name":"Amber Mavis","appear":"fw4","tag":[{"t":"Third-year, wingleader of Third Wing","at":"fw4"},{"t":"Executed","at":"fw20","state":"fallen"}],"rel":["claidh"],"facts":[
  {"t":"Wingleader of Third Wing.","at":"fw4","v":1},
  {"t":"Calls Violet's Gauntlet climb cheating. Xaden overrules her.","at":"fw11","v":1},
  {"t":"From a Tyrrish family that stayed loyal during the rebellion.","at":"fw20","v":1},
  {"t":"Found guilty of arranging the attack on Violet after Tairn shows the dragons his memory. Tairn burns her.","at":"fw20","v":1}]},
 {"id":"mira","kind":"person","g":"f","name":"Mira Sorrengail","appear":"fw1","tag":[{"t":"Lieutenant, Violet's sister","at":"fw1"},{"t":"Captive at Draithus","at":"os56","state":"away"},{"t":"Recovering in Aretia","at":"os59"}],"rel":["teine","violet","brennan","montserrat"],"facts":[
  {"t":"Violet's older sister, twenty-six, a decorated rider.","at":"fw1","v":1},
  {"t":"Gives Violet a vest with Teine's shed scales sewn in, which turns blades.","at":"fw1","v":1},
  {"t":"Leaves Violet Brennan's journal, written for Mira when she entered the quadrant.","at":"fw6","v":1},
  {"t":"Bonds Teine at her Threshing in 627, the green clubtail she picked out at Presentation.","at":"fw6","td":2,"v":1},
  {"t":"Teine cuts her thigh with a talon to test her. She holds her ground, as Kaori taught for greens, and tells him she won't break.","at":"fw6","td":2,"v":1},
  {"t":"Feels she's no one's favorite: Brennan is their mother's, Violet their father's.","at":"fw6","td":2,"v":1},
  {"t":"Her signet lets her throw a ward over herself and those around her.","at":"fw23","v":1},
  {"t":"Posted at Montserrat. A gryphon gave her a scar from ear to collarbone during an attack at Cranston no one heard about.","at":"fw26","v":1},
  {"t":"Thought she saw a riot of dragons across the border during that attack.","at":"fw26","v":1},
  {"t":"Reassigned to Athebyne. Her letters arrive heavily redacted.","at":"if11","v":1},
  {"t":"Moves to Samara. Explains how the wards stretch from the outposts, and that her signet carries them with her.","at":"if20","v":1},
  {"t":"Brings forty riders to Aretia, finds Brennan alive, and punches him.","at":"if38","v":1},
  {"t":"Flies to Cordyn with Violet and Brennan, and shields them from a venin far from any ward.","at":"if42","v":1},
  {"t":"Orders the retreat from Pavis.","at":"if50","v":1},
  {"t":"Cuts a rune-marked stone out of a dead wyvern.","at":"if57","v":1},
  {"t":"Asks to guard her mother in the battle, and gets Xaden put in Violet's squad.","at":"if60","v":1},
  {"t":"Returns early with a new conduit for Violet and a way to change one rune in a wardstone.","at":"os4","v":1},
  {"t":"Blames Brennan for their mother's death.","at":"os4","v":1},
  {"t":"Helps change Basgiath's wardstone.","at":"os7","v":1},
  {"t":"Joins the quest as its shield.","at":"os14","v":1},
  {"t":"Splits a falling bridge with her shield in Anca, and finds the citrine.","at":"os19","v":1},
  {"t":"Visits their estranged grandmother, Niara, on leave.","at":"os29","v":1},
  {"t":"Posted to Draithus.","at":"os44","v":1},
  {"t":"Learns from their mother's journals that their parents tried to dedicate Violet to Dunne. Draws a blade when Xaden says he's venin.","at":"os54","v":1},
  {"t":"Taken by Theophanie at Draithus.","at":"os56","v":1},
  {"t":"Theophanie cuts her throat.","at":"os58","v":1},
  {"t":"Lives, with a scar, after Brennan mends her with siphoned power.","at":"os59","v":1}]},
 {"id":"brennan","kind":"person","g":"m","name":"Brennan Sorrengail","appear":"fw1","tag":[{"t":"Presumed dead","at":"fw1"},{"t":"Alive, in Aretia","at":"fw39","state":"alive"},{"t":"Lt. Colonel Aisereigh, in Aretia","at":"if1"}],"rel":["violet","mira","aretia","tairn"],"facts":[
  {"t":"Violet's older brother, said to have died with his dragon in the Tyrrish rebellion.","at":"fw1","v":1},
  {"t":"Was a mender.","at":"fw6","v":1},
  {"t":"Bonds Marbh, an orange, at his Threshing in 624. He'd hoped for a green or a brown, and least wanted an orange.","at":"fw6","td":1,"v":1},
  {"t":"His father, a scribe, sneaks into the Threshing valley to see him off and gives him the bead bracelet he always wore.","at":"fw6","td":1,"v":1},
  {"t":"Plans to write down everything he learns in the quadrant so Mira won't have to work it out alone.","at":"fw6","td":1,"v":1},
  {"t":"Graduates and goes straight to the front of the Tyrrish rebellion as a mender, under his mother's command.","at":"fw6","td":2,"v":1},
  {"t":"The last rider of the black dragon at the Threshing, Naolin, burned out trying to save him.","at":"fw8","v":1},
  {"t":"Reports said Fen Riorson shot him with an arrow.","at":"fw23","v":1},
  {"t":"Is alive. He mends Violet's poison wound in Aretia and welcomes her to the revolution.","at":"fw39","v":1},
  {"t":"Goes by Lieutenant Colonel Aisereigh and sits on the Assembly.","at":"if1","v":1},
  {"t":"Naolin died saving him. He woke on a cliffside near Aretia; his dragon Marbh lived.","at":"if2","v":1},
  {"t":"Aisereigh is Tyrrish for resurrected.","at":"if38","v":1},
  {"t":"Accepts Tecarus's deal: the luminary, in exchange for training a hundred flier cadets.","at":"if42","v":1},
  {"t":"Mends Ridoc on the cliff.","at":"if44","v":1},
  {"t":"Reveals himself to his mother and turns down Melgren for the Assembly.","at":"if57","v":1},
  {"t":"Comes to Basgiath after all and mends the broken wardstone into one piece.","at":"if62","v":1},
  {"t":"Mends Violet as she burns out.","at":"if64","v":1},
  {"t":"Still goes by Aisereigh on his name tag.","at":"os4","v":1},
  {"t":"Mends Violet's knee. His name tag reads Sorrengail again.","at":"os11","v":1},
  {"t":"Knows Xaden is turning. He has tried to mend him every day.","at":"os47","v":1},
  {"t":"As tactician, makes Violet choose one objective.","at":"os57","v":1},
  {"t":"Mends Mira's throat, running dry until Sloane siphons power to him.","at":"os59","v":1},
  {"t":"Finds Violet in Riorson House's courtyard at three in the morning.","at":"os66","v":1}]},
 {"id":"lilith","kind":"person","g":"f","name":"Lilith Sorrengail","appear":"fw1","tag":[{"t":"Commanding General, Basgiath","at":"fw1"},{"t":"Died at Basgiath","at":"if64","state":"fallen"}],"rel":["aimsir","violet","mira","brennan","basgiath"],"facts":[
  {"t":"Commanding general of Basgiath. Captured Fen Riorson and oversaw his execution.","at":"fw1","v":1},
  {"t":"Overrides Violet's plans and sends her into the Riders Quadrant.","at":"fw1","v":1},
  {"t":"Wields storms through her dragon, Aimsir.","at":"fw1","v":1},
  {"t":"Her family name carries so much weight among riders that her husband, a scribe, took it when they married.","at":"fw6","td":1,"v":1},
  {"t":"Is newly made a colonel and commands the Riders Quadrant when Brennan enters. She holds the post three years.","at":"fw6","td":1,"v":1},
  {"t":"Wants Andarna studied. Barely acknowledges Violet when they meet.","at":"fw24","v":1},
  {"t":"Keeps a dagger with a Tyrrish rune and an alloy-set hilt on her desk.","at":"fw25","v":1},
  {"t":"The dagger on her desk tells Violet her mother knows about the venin.","at":"fw36","v":1},
  {"t":"Rebukes Colonel Aetos over the orders that sent the squad to Athebyne.","at":"if4","v":1},
  {"t":"Says she put Violet in the Riders Quadrant to keep her alive, and that she carved Xaden's scars.","at":"if36","v":1},
  {"t":"The favor Xaden owed her for the marked ones was Violet's life.","at":"if36","v":1},
  {"t":"Learns Brennan is alive. Gives Violet Lyra's journal and warns that Aretia's wards will fail.","at":"if57","v":1},
  {"t":"Brings a storm over Basgiath so Violet can draw lightning from it.","at":"if61","v":1},
  {"t":"Has Sloane siphon her power and Aimsir's into the wardstone. She dies, and the wards rise.","at":"if64","v":1}]},
 {"id":"aetos","kind":"person","g":"m","name":"Colonel Aetos","appear":"fw3","tag":[{"t":"Colonel, Dain's father","at":"fw3"},{"t":"Commanding general, Basgiath","at":"os8"}],"rel":["dain","lilith"],"facts":[
  {"t":"Dain's father and one of General Sorrengail's closest advisers.","at":"fw3","v":1},
  {"t":"Led Second Wing as a cadet. His dragon is Foirn.","at":"fw4","td":5,"v":1},
  {"t":"Helped General Sorrengail hunt down Fen Riorson.","at":"fw4","td":5,"v":1},
  {"t":"Asks Violet about her late father's notes on feathertails.","at":"fw24","v":1},
  {"t":"Reads out the final War Games scenario and posts Xaden's headquarters to Athebyne.","at":"fw33","v":1},
  {"t":"His sealed orders at Athebyne say the squad's mission is to survive if they can.","at":"fw35","v":1},
  {"t":"Tells Dain the marked ones were never meant to survive their first year, and asks him to report on them.","at":"fw35","td":5,"v":1},
  {"t":"Lilith rebukes him over the Athebyne orders, and he is reportedly sent to a coastal outpost.","at":"if5","v":1},
  {"t":"Warns that secrets die with the people who keep them. An assassin repeats the words.","at":"if10","v":1},
  {"t":"Charges Violet with high treason.","at":"os7","v":1},
  {"t":"Disowns Dain, takes command of Basgiath, and sends Violet's squad to Samara as punishment.","at":"os8","v":1},
  {"t":"Bars officers from the quadrant.","at":"os11","v":1},
  {"t":"Makes Xaden resign as professor.","at":"os46","v":1}]},
 {"id":"melgren","kind":"person","g":"m","name":"General Melgren","appear":"fw1","tag":[{"t":"Commanding general of Navarre's forces","at":"fw1"}],"rel":["codagh","xaden"],"facts":[
  {"t":"His dragon gave the rebellion's children their relics when he executed their parents.","at":"fw1","v":1},
  {"t":"Commands all of Navarre's forces. His signet shows him how a battle will end before it starts.","at":"fw3","v":1},
  {"t":"Rides Codagh, the eldest black dragon.","at":"fw8","v":1},
  {"t":"Checks on Xaden once a year in person.","at":"fw31","v":1},
  {"t":"Can't see outcomes when more than three marked ones are together.","at":"fw39","v":1},
  {"t":"Has foreseen the venin overrunning Samara on solstice. Offers Aretia independence if its riders fight there.","at":"if57","v":1},
  {"t":"Couldn't foresee the battle at Basgiath because Xaden was in it.","at":"if63","v":1},
  {"t":"Asks the deserters to come back.","at":"if65","v":1},
  {"t":"Sits on the Senarium.","at":"os3","v":1},
  {"t":"Warns Xaden not to fly into battle.","at":"os55","v":1},
  {"t":"Has already written Draithus off as a defeat.","at":"os57","v":1}]},
 {"id":"fen","kind":"person","g":"m","name":"Fen Riorson","appear":"fw1","tag":[{"t":"Executed rebel leader","at":"fw1","state":"fallen"}],"rel":["xaden","aretia"],"facts":[
  {"t":"Xaden's father, called the Great Betrayer in Navarre. Led the Tyrrish rebellion and was executed.","at":"fw1","v":1},
  {"t":"As Navarre tells it, his grievances were talladium mining quotas and how heavily Tyrrendor was conscripted.","at":"fw6","td":2,"v":1},
  {"t":"Left Aretia to declare Tyrrendor's secession over six years before the story.","at":"fw28","v":1},
  {"t":"Used to say venin were waiting in the Barrens.","at":"fw31","v":1},
  {"t":"Navarre's history says he accused the king of a vast conspiracy and called him a madman. His last words were struck from the record.","at":"fw35","v":1},
  {"t":"Hoped Xaden would join the infantry, as he had.","at":"if16","v":1},
  {"t":"His first act of rebellion was seeking Viscount Tecarus as an ally.","at":"if40","v":1}]},
 {"id":"nolon","kind":"person","g":"m","name":"Nolon","appear":"fw6","tag":[{"t":"Mender","at":"fw6"}],"rel":["violet"],"facts":[
  {"t":"An elderly rider and mender who has mended Violet's injuries for years. Married to Winifred, Basgiath's best healer.","at":"fw6","v":1},
  {"t":"Mends Violet's broken arm, just this once.","at":"fw6","v":1},
  {"t":"Says he's been mending a soul for months.","at":"if18","v":1},
  {"t":"Mends Violet so Varrish can keep going, then leaves a window unlatched for her squad.","at":"if24","v":1},
  {"t":"Drugs Violet's drink to cut her off from Tairn.","at":"if34","v":1},
  {"t":"Has been trying to mend Jack's turning since May, and keeps him dosed with serum.","at":"if60","v":1},
  {"t":"Writes to Lilith that there is no cure, only control.","at":"if66","v":1}]},
 {"id":"kaori","kind":"person","g":"m","name":[{"t":"Professor Kaori","at":"fw3"},{"t":"Colonel Valin Kaori","at":"fw8","td":1}],"appear":"fw3","tag":[{"t":"Dragon studies professor","at":"fw3"}],"rel":["smachd"],"facts":[
  {"t":"Teaches the first-years about dragons, and can project the images in his mind.","at":"fw8","v":1},
  {"t":"Keeps the Compendium of Dragonkind, the illustrated guide to every active dragon, up to date.","at":"fw8","td":1,"v":1},
  {"t":"He and Devera are the only professors who treat the marked ones fairly.","at":"fw8","td":3,"v":1},
  {"t":"Before each Threshing he gives the first-years a last talk, then leaves them at the edge of the forest.","at":"fw8","td":5,"v":1},
  {"t":"His dragon is Smachd.","at":"fw17","v":1},
  {"t":"Stops Varrish from searching Violet's things.","at":"if29","v":1},
  {"t":"Stays at Basgiath; his place is with the Empyrean.","at":"if38","v":1},
  {"t":"Projects a map of Basgiath for the battle plan.","at":"if60","v":1}]},
 {"id":"carr","kind":"person","g":"m","name":"Professor Carr","appear":"fw18","tag":[{"t":"Wielding professor","at":"fw18"}],"rel":["violet"],"facts":[
  {"t":"Teaches signet wielding. Snaps the neck of a first-year who manifests as a mind reader.","at":"fw18","v":1},
  {"t":"Trains Violet on a mountaintop and warns that she and Xaden together could look like a threat to command.","at":"fw30","v":1},
  {"t":"Makes Violet strike again and again on a peak as punishment.","at":"if13","v":1},
  {"t":"Attacks the deserters with fire; Bodhi counters him.","at":"if36","v":1},
  {"t":"Kills a cadet who channels on the sparring mat.","at":"os28","v":1}]},
 {"id":"devera","kind":"person","g":"f","name":"Professor Devera","appear":"fw5","tag":[{"t":"Battle Brief professor","at":"fw5"}],"rel":[],"facts":[
  {"t":"A captain who teaches Battle Brief.","at":"fw5","v":1},
  {"t":"Escorts the squad to Montserrat.","at":"fw26","v":1},
  {"t":"Wounded in a flier attack on Athebyne.","at":"if9","v":1},
  {"t":"Leaked the Zolya leaflets. Leaves for Aretia.","at":"if36","v":1},
  {"t":"Promoted to major. Merges the drifts into squads.","at":"if46","v":1}]},
 {"id":"markham","kind":"person","g":"m","name":"Colonel Markham","appear":"fw5","tag":[{"t":"Scribe, Battle Brief","at":"fw5"}],"rel":["archives"],"facts":[
  {"t":"A scribe colonel who co-teaches Battle Brief. He had wanted Violet as his star pupil.","at":"fw5","v":1},
  {"t":"Teaches an ancient battle on the day reports of the Sumerton attack arrive.","at":"fw21","v":1},
  {"t":"Tells Battle Brief that the reports of burned Poromish cities are propaganda.","at":"if17","v":1},
  {"t":"Presents Jack Barlowe alive.","at":"if25","v":1},
  {"t":"Strips Jesinia from the adept path.","at":"os13","v":1}]},
 {"id":"tauri","kind":"person","g":"m","name":"King Tauri","appear":"fw3","tag":[{"t":"King of Navarre","at":"fw3"}],"rel":["navarre"],"facts":[
  {"t":"Navarre's king. His second son died at a Threshing.","at":"fw3","v":1},
  {"t":"Has three sons. The eldest went into the Infantry Quadrant as heir.","at":"fw7","td":3,"v":1},
  {"t":"Visits Basgiath on Reunification Day and meets Violet and Liam.","at":"fw31","v":1},
  {"t":"His third son enrolls in the quadrant under a false name.","at":"if8","v":1},
  {"t":"Forbids any punishment for the quest, since Aaric came home.","at":"os44","v":1}]},
 {"id":"sloane","kind":"person","g":"f","name":"Sloane Mairi","appear":"fw36","tag":[{"t":"Liam's sister","at":"fw36"},{"t":"First-year rider cadet","at":"if8"}],"rel":["liam","violet","dain"],"facts":[
  {"t":"Liam's younger sister. Dying, Liam asks Violet to look after her when she comes to the parapet.","at":"fw36","v":1},
  {"t":"Crosses the parapet and tells Violet to go to hell for getting Liam killed.","at":"if8","v":1},
  {"t":"Gets one of Liam's letters a week as long as she trains with Imogen.","at":"if16","v":1},
  {"t":"Bonds a red daggertail, as her brother did.","at":"if30","v":1},
  {"t":"Goes into the Threshing refusing to bond and nearly lets an orange's fire reach her. Dain pulls her clear.","at":"if30","td":12,"v":1},
  {"t":"Bonds Thoirt, Deigh's sister, who promises not to channel until Sloane is ready.","at":"if30","td":12,"v":1},
  {"t":"Says it's hard to hate Violet when Liam didn't.","at":"if43","v":1},
  {"t":"Drags Violet out of a cave and drains her power by accident: she's a siphon.","at":"if54","v":1},
  {"t":"Thoirt tells her that she, not Liam, inherited their mother's gift.","at":"if54","td":12,"v":1},
  {"t":"Lilith forces her to siphon Lilith's power into the wardstone, telling her she executed Sloane's mother.","at":"if64","v":1},
  {"t":"Apologizes for her part in her mother's death.","at":"os17","v":1},
  {"t":"Refuses to train her siphoning.","at":"os28","v":1},
  {"t":"Brings Violet a sealed package from Aaric, and siphons Dain's power into Brennan to save Mira.","at":"os59","v":1}]},
 {"id":"aaric","kind":"person","g":"m","name":"Aaric","appear":"if8","tag":[{"t":"First-year, under a false name","at":"if8"},{"t":"Royal envoy on the quest","at":"os29"}],"rel":["molvic","halden"],"facts":[
  {"t":"King Tauri's third son, enrolled as Aaric Graycastle.","at":"if8","v":1},
  {"t":"Learned about the venin when his guards started carrying alloy daggers.","at":"if21","v":1},
  {"t":"Bonds a blue clubtail.","at":"if30","v":1},
  {"t":"Hunts Molvic through the valley for hours and bonds him at sunset.","at":"if30","td":13,"v":1},
  {"t":"His late mother taught him that power without limits corrupts. He speaks nine languages.","at":"if30","td":13,"v":1},
  {"t":"Hates Xaden, who killed his brother Alic at the Threshing, but helps because it hurts his father.","at":"if32","v":1},
  {"t":"His family was never told how Alic died.","at":"if32","td":13,"v":1},
  {"t":"His royal blood gets the squad through the vault's wards; reaching for the journals burns his hands.","at":"if33","v":1},
  {"t":"Tells Molvic he'll fly for dragonkind but not for the Empyrean that let the truth stay hidden, and that he means to tear the kingdom apart.","at":"if36","td":13,"v":1},
  {"t":"Holds Violet back while her mother uses Sloane at the wardstone.","at":"if64","v":1},
  {"t":"Goes by Graycastle in the quadrant.","at":"os15","v":1},
  {"t":"Reveals himself to Halden and replaces him as Navarre's royal on the quest.","at":"os29","v":1},
  {"t":"Speaks fluent Unnbrish.","at":"os31","v":1},
  {"t":"Wins Zehyllna's alliance.","at":"os39","v":1},
  {"t":"Sides with Xaden against his brother over the refugees.","at":"os46","v":1},
  {"t":"Begs Violet to protect Dunne's temple: it's how she saves Tyrrendor.","at":"os51","v":1},
  {"t":"Brings Zehyllna's advance party to Draithus on Molvic.","at":"os62","v":1},
  {"t":"Violet realizes he's a true precog. His gift, a marble dagger, kills Theophanie.","at":"os64","v":1},
  {"t":"His full name is Camlaen Aaric Baran.","at":"os64","td":13,"v":1}]},
 {"id":"varrish","kind":"person","g":"m","name":"Major Burton Varrish","appear":"if5","tag":[{"t":"Vice commandant","at":"if5"},{"t":"Killed in the brig","at":"if36","state":"fallen"}],"rel":["violet"],"facts":[
  {"t":"Arrives as vice commandant. An earlier posting asked for him to be moved after prisoners died in his interrogations.","at":"if5","v":1},
  {"t":"His dragon, Solas, burns runners on Conscription Day, and half a squad with them.","at":"if8","v":1},
  {"t":"Searches Violet's things again and again, and punishes her for Andarna missing formation.","at":"if11","v":1},
  {"t":"Kneels to apologize to Violet when Tairn seizes Solas by the throat.","at":"if19","v":1},
  {"t":"His signet shows him people's weaknesses. Tortures Violet for days.","at":"if35","v":1},
  {"t":"Killed by Violet, with Xaden's hand over hers.","at":"if36","v":1}]},
 {"id":"cat","kind":"person","g":"f","name":[{"t":"Catriona","at":"if28"},{"t":"Catriona Cordella","at":"if41"}],"appear":"if28","tag":[{"t":"Gryphon flier","at":"if28"},{"t":"Flier in Second Squad","at":"if49"}],"rel":["xaden","syrena","tecarus","maren"],"facts":[
  {"t":"A flier in a drift Xaden supplies.","at":"if28","v":1},
  {"t":"Xaden's former partner.","at":"if29","v":1},
  {"t":"Tecarus's niece and Syrena's sister. Her gift heightens the feelings of people near her.","at":"if41","v":1},
  {"t":"Comes to Aretia with the flier cadets and blames Violet for Luella's fall.","at":"if44","v":1},
  {"t":"Uses her gift in a challenge against Violet. She wants the crown that came with her betrothal to Xaden.","at":"if47","v":1},
  {"t":"Third in line to Poromiel's throne. Stays in the cave to shoot Solas.","at":"if54","v":1},
  {"t":"The best in her year at runes.","at":"if58","v":1},
  {"t":"Gives Violet a dagger and stays to face a venin beside her.","at":"if62","v":1},
  {"t":"Third in line to Poromiel's throne. Joins the quest.","at":"os20","v":1},
  {"t":"Flies the gryphon Kiralair.","at":"os21","v":1},
  {"t":"Together with Trager.","at":"os34","v":1},
  {"t":"Her gift on Zehyllna is a ruby necklace.","at":"os38","v":1}]},
 {"id":"tecarus","kind":"person","g":"m","name":"Viscount Tecarus","appear":"if1","tag":[{"t":"Poromish noble","at":"if1"},{"t":"Heir to Poromiel's queen","at":"if41"},{"t":"King of Poromiel","at":"os43"}],"rel":["cat","syrena","cordyn"],"facts":[
  {"t":"A Poromish viscount whose luminary Aretia's forge needs.","at":"if1","v":1},
  {"t":"His price: weapons, an army of his own, and the chance to see Violet wield.","at":"if29","v":1},
  {"t":"Queen Maraya named him her heir. Keeps a white-marble palace in Cordyn.","at":"if41","v":1},
  {"t":"Tests Violet against a venin he keeps in a runed chest, then gives up the luminary.","at":"if42","v":1},
  {"t":"First in line to Poromiel's throne.","at":"os17","v":1},
  {"t":"Warns that King Courtlyn takes rare things, and never to make a deal you can't keep.","at":"os21","v":1},
  {"t":"Becomes king when Queen Maraya dies.","at":"os43","v":1}]},
 {"id":"theophanie","kind":"person","g":"f","name":"Theophanie","appear":"os10","tag":[{"t":"Venin","at":"os10","state":"venin"},{"t":"Killed by Violet","at":"os64","state":"fallen"}],"rel":["violet"],"facts":[
  {"t":"The silver-haired venin who watched Violet at Basgiath. Names herself at Newhall.","at":"os10","v":1},
  {"t":"Throws Tairn into a mountain with a tornado. Killed Maren's parents to lure Violet.","at":"os10","v":1},
  {"t":"Names Andarna an irid, and asks Violet to choose her, not Berwyn, as a teacher.","at":"os11","v":1},
  {"t":"Leaves a note in Anca: she knew they'd come.","at":"os19","v":1},
  {"t":"Writes that she has what Violet wants most.","at":"os43","v":1},
  {"t":"Leads the raid that burns Suniva.","at":"os44","v":1},
  {"t":"Attacks Dunne's temple outside Aretia. The priestess calls her a heretic.","at":"os52","v":1},
  {"t":"Holds Mira at Draithus.","at":"os56","v":1},
  {"t":"Cuts Mira's throat.","at":"os58","v":1},
  {"t":"A storm wielder, not a lightning wielder.","at":"os60","v":1},
  {"t":"Was a high priestess of Dunne who can never return to temple. Violet kills her with a dagger of temple stone.","at":"os64","v":1}]},
 {"id":"halden","kind":"person","g":"m","name":"Halden Tauri","appear":"if33","tag":[{"t":"Crown prince of Navarre","at":"if33"}],"rel":["aaric","violet"],"facts":[
  {"t":"Knows about the venin and won't help, Aaric says.","at":"if33","v":1},
  {"t":"Arrives with a Western Guard company to speak for Navarre on the quest.","at":"os6","v":1},
  {"t":"Dated Violet for about seven months, years ago, and cheated on her.","at":"os17","v":1},
  {"t":"Names a new commander for the quest, then lets Violet choose the squad.","at":"os20","v":1},
  {"t":"Offers Courtlyn an heirloom of Xaden's house. His guard is caught stealing from the treasury.","at":"os26","v":1},
  {"t":"Banished from Deverelli for life.","at":"os27","v":1},
  {"t":"Replaced by Aaric.","at":"os29","v":1},
  {"t":"Threatens to march troops into Tyrrendor.","at":"os46","v":1}]},
 {"id":"berwyn","kind":"person","g":"m","name":"Berwyn","appear":"os11","tag":[{"t":"Venin","at":"os11","state":"venin"}],"rel":["xaden"],"facts":[
  {"t":"Theophanie urges Violet to choose her as teacher, not him.","at":"os11","v":1},
  {"t":"Jack's Sage. The demand for a brother was his.","at":"os58","v":1},
  {"t":"Revealed as the Sage Xaden threw into the ravine at Basgiath, scarred but alive. Kills a dragon with an alloy dagger.","at":"os65","v":1}]},
 {"id":"naolin","kind":"person","g":"m","name":"Naolin","appear":"fw8","tag":[{"t":"A black dragon's last rider","at":"fw8","state":"fallen"},{"t":"Tairn's last rider","at":"fw14","state":"fallen"}],"rel":["tairn","brennan"],"facts":[
  {"t":"The last rider of an unbonded black dragon. A siphon, he burned out and died trying to bring Brennan back.","at":"fw8","v":1},
  {"t":"The black is Tairn, who chooses Violet.","at":"fw14","v":1},
  {"t":"Violet thinks of him when she pushes past her limits at Resson.","at":"fw37","v":1},
  {"t":"Died saving Brennan.","at":"if2","v":1}]},
 {"id":"felix","kind":"person","g":"m","name":[{"t":"Felix","at":"if1"},{"t":"Colonel Felix Gerault","at":"if40"}],"appear":"if1","tag":[{"t":"Assembly member","at":"if1"}],"rel":["violet"],"facts":[
  {"t":"A silver-bearded Assembly member. Says they have a year to arm the drifts.","at":"if1","v":1},
  {"t":"Takes over Violet's training and gives her a conduit.","at":"if40","v":1},
  {"t":"Teaches her to hold a steady thread of lightning.","at":"if50","v":1},
  {"t":"Makes conduits holding maorsite so fliers keep some power inside the wards.","at":"if52","v":1},
  {"t":"Reports that wyvern are getting through Aretia's wards.","at":"os45","v":1},
  {"t":"Drills Violet daily on the peaks.","at":"os46","v":1},
  {"t":"Tells Violet she split a bolt in two.","at":"os55","v":1}]},
 {"id":"suri","kind":"person","g":"f","name":"Suri","appear":"if1","tag":[{"t":"Assembly member","at":"if1"}],"rel":["violet"],"facts":[
  {"t":"An Assembly member who wants Violet confined.","at":"if1","v":1},
  {"t":"Commands the revolution's army with Ulices.","at":"if51","v":1},
  {"t":"Her brown clubtail is one of the six dragons that fire Aretia's wardstone.","at":"if56","v":1}]},
 {"id":"ulices","kind":"person","g":"m","name":"Ulices","appear":"if37","tag":[{"t":"Assembly member","at":"if37"}],"rel":["fann"],"facts":[
  {"t":"A one-eyed Assembly member who wants Violet questioned.","at":"if37","v":1},
  {"t":"Teaches physics in Aretia.","at":"if38","v":1},
  {"t":"Turns down Melgren's offer at Athebyne.","at":"if57","v":1}]},

  {"t":"Hadn't bonded since his last rider, Naolin, burned out trying to save Brennan.","at":"fw8","v":1},
  {"t":"Burns Tynan at the Threshing and chooses Violet. His full name is Tairneanach, of the Dubhmadinn line.","at":"fw14","v":1},
  {"t":"Mated to Sgaeyl. They're the strongest bonded pair in centuries.","at":"fw16","v":1},
  {"t":"Shows every dragon his memory of the attack on Violet, which convicts Amber Mavis.","at":"fw20","v":1},
  {"t":"Lost his last rider in the rebellion, which makes Xaden wonder how Tairn feels about him.","at":"fw23","td":3,"v":1},
  {"t":"Leads the dragons at Resson, relaying orders even to the gryphons.","at":"fw36","v":1},
  {"t":"Took Solas's eye in an earlier fight.","at":"if8","v":1},
  {"t":"Seizes Solas by the throat on the flight field and makes Varrish kneel.","at":"if19","v":1},
  {"t":"Shows every dragon and rider his memory of Resson.","at":"if36","v":1},
  {"t":"One of the six dragons that fire Aretia's wardstone.","at":"if56","v":1},
  {"t":"Catches Violet and Sawyer in his claw in midair.","at":"if62","v":1},
  {"t":"Tells Violet he chose her as his last rider, and will follow her if she falls.","at":"if64","v":1},
  {"t":"His parents were Murtcuideam and Fiaclanfuil.","at":"os26","v":1},
  {"t":"Recites his line back to Thareux, the first black to bond.","at":"os29","v":1},
  {"t":"A wingspur pierces his leg. He won't lose Violet as he lost his last rider.","at":"os52","v":1},
  {"t":"Keeps their bond wide open while Violet grieves.","at":"os54","v":1},
  {"t":"Netted with Violet and sent sliding down a mountainside.","at":"os64","v":1},
  {"t":"Needs a long rest to recover.","at":"os66","v":1}]},
 {"id":"sgaeyl","kind":"dragon","name":"Sgaeyl","appear":"fw4","color":"#22305F","attrs":{"Color":"Navy blue","Tail":"Daggertail"},"rider":"xaden","tag":[{"t":"Bonded to Xaden","at":"fw4"}],"rel":["xaden","tairn"],"comp":{"td":3,"at":"fw7","sex":"Female","line":"Gormfaileas","age":64,"riders":3,"note":"Flagged as a dragon cadets must never approach."},"facts":[
  {"t":"A navy Blue Daggertail, vicious enough that other dragons give her space.","at":"fw4","v":1},
  {"t":"Rumored to have left her first rider to die for cowardice and to have killed her second.","at":"fw7","td":3,"v":1},
  {"t":"Chooses Xaden at the 631 Threshing, and demands complete honesty from him, even with himself.","at":"fw7","td":3,"v":1},
  {"t":"The most powerful of the blues. Breaking custom, she bonded a relative of one of her earlier riders.","at":"fw8","v":1},
  {"t":"Mated to Tairn. If one of their riders dies, the other may not survive it.","at":"fw16","v":1},
  {"t":"Expects she'll one day have to live with Tairn's choice of rider, as he must live with hers.","at":"fw16","td":3,"v":1},
  {"t":"Skips Presentation entirely the year she bonds Xaden.","at":"fw21","td":11,"v":1},
  {"t":"Her last rider died almost fifty years ago.","at":"fw23","v":1},
  {"t":"Tears a wyvern apart in midair to protect Tairn at Resson.","at":"fw36","v":1},
  {"t":"Chose Xaden for his scars, and because he's the grandson of her second rider.","at":"fw39","v":1},
  {"t":"Burns Alic's body and those of his two friends so no one finds them.","at":"if32","td":3,"v":1},
  {"t":"Bonded Xaden's grandfather before Xaden.","at":"if55","v":1},
  {"t":"Kept Xaden's second signet secret, even from her mate.","at":"if56","v":1},
  {"t":"Still not speaking to Xaden.","at":"os2","v":1},
  {"t":"Finally yells at Xaden at Fervan and snaps him out of channeling.","at":"os14","v":1},
  {"t":"Caught in a weighted net and bitten by a wyvern.","at":"os64","v":1},
  {"t":"Freed by Xaden's shadows. Flies off with him.","at":"os65","v":1}]},
 {"id":"andarna","kind":"dragon","name":"Andarna","appear":"fw12","color":[{"t":"#C9A23A","at":"fw12"},{"t":"#1B1920","at":"if2"},{"t":"#3A2C4D","at":"if64"}],"attrs":{"Color":[{"t":"Gold","at":"fw12"},{"t":"Black","at":"if2"},{"t":"Shifting, usually black","at":"if64"}],"Tail":[{"t":"Feathertail","at":"fw12"},{"t":"Barbed, like a scorpiontail","at":"if38"},{"t":"Scorpiontail","at":"os11"}],"Age":[{"t":"Unknown","at":"fw12"},{"t":"Two years","at":"fw19"},{"t":"Hatched after 650 years in the egg","at":"if64"}],"Breed":[{"t":"Unknown","at":"fw12"},{"t":"Seventh breed","at":"if64"},{"t":"Irid","at":"os11"}]},"rider":"violet","tag":[{"t":"Unbonded feathertail","at":"fw12"},{"t":"Bonded to Violet","at":"fw15"},{"t":"Changed after Resson","at":"fw39"},{"t":"Adolescent, black-scaled","at":"if2"},{"t":"In the Dreamless Sleep","at":"if7"},{"t":"Awake, can't carry a rider","at":"if37"},{"t":"Breathes fire","at":"if63"},{"t":"Gone with the irids","at":"os53","state":"away"},{"t":"Back with Violet","at":"os64"}],"rel":["violet","tairn","leothan"],"facts":[
  {"t":"A small golden feathertail that turns up unexpectedly at Presentation. The class mocks her.","at":"fw12","v":1},
  {"t":"Has paws instead of claws and doesn't breathe fire.","at":"fw14","v":1},
  {"t":"Tells Violet her name, Andarnaurram, and bonds her alongside Tairn.","at":"fw15","v":1},
  {"t":"Stops time so Violet can escape a blade in the night attack.","at":"fw18","v":1},
  {"t":"Only two years old: a feathertail is a young dragon, not a breed. She used an old right to join the Threshing anyway.","at":"fw19","v":1},
  {"t":"Fireproof. Rolls in mud to hide her gold during War Games.","at":"fw28","v":1},
  {"t":"Catches Violet as she falls at Resson, holding time still with the last of her strength.","at":"fw38","v":1},
  {"t":"Much larger after Resson, and her gift is gone.","at":"fw39","v":1},
  {"t":"Nearly twice her old size, with black scales. As an adolescent she needs the Dreamless Sleep to finish growing.","at":"if2","v":1},
  {"t":"Sleeps far longer than most adolescents, guarded by the elders.","at":"if29","v":1},
  {"t":"Wakes in Aretia. Her left wing lacks a set of muscles: she'll fly, but never carry a rider.","at":"if38","v":1},
  {"t":"Kills Solas with the poisoned barb on her tail.","at":"if54","v":1},
  {"t":"The elders rule the killing justified, but slaying a dragon marks the soul.","at":"if56","v":1},
  {"t":"Hides in the cliff by taking on the color of the rock.","at":"if62","v":1},
  {"t":"Breathes fire for the first time.","at":"if63","v":1},
  {"t":"Not truly black: she's a seventh breed, head of her own den, who waited 650 years to hatch and chose Violet.","at":"if64","v":1},
  {"t":"Her fire completes Basgiath's wards.","at":"if64","v":1},
  {"t":"Her scales shifted in battle and she breathed fire on a venin, which she'd never done.","at":"os0","v":1},
  {"t":"Learns her kind are called irids.","at":"os11","v":1},
  {"t":"She and Tairn can still speak to Violet on Deverelli.","at":"os22","v":1},
  {"t":"Her eggshell buys Deverelli's alliance.","at":"os27","v":1},
  {"t":"Waits outside the room of Faris's sons as leverage.","at":"os37","v":1},
  {"t":"Chose her own tail, as an irid may. The irids say she was left behind as a test of humans.","at":"os41","v":1},
  {"t":"Barred from the irids' isle.","at":"os42","v":1},
  {"t":"The source of Violet's dream-walking.","at":"os50","v":1},
  {"t":"Guards Dunne's temple outside Aretia.","at":"os51","v":1},
  {"t":"Breaks her bond with Violet and leaves with Leothan.","at":"os53","v":1},
  {"t":"Returns at Draithus, where Theophanie reaches for her.","at":"os64","v":1},
  {"t":"Vows not to let anyone burn Violet.","at":"os66","v":1}]},

 {"id":"aotrom","kind":"dragon","name":"Aotrom","appear":"fw16","color":"#6B4A2E","attrs":{"Color":"Brown","Tail":"Swordtail"},"rider":"ridoc","tag":[{"t":"Bonded to Ridoc","at":"fw16"}],"rel":["ridoc"],"comp":{"td":10,"at":"fw16","sex":"Male","line":"Aldayrmar","age":21,"riders":0},"facts":[

 {"id":"sliseag","kind":"dragon","name":"Sliseag","appear":"fw16","color":"#8A2A22","attrs":{"Color":"Red","Tail":"Swordtail"},"rider":"sawyer","tag":[{"t":"Bonded to Sawyer","at":"fw16"}],"rel":["sawyer"],"comp":{"td":9,"at":"fw16","sex":"Male","line":"Berradhdyr","age":73,"riders":2},"facts":[

 {"id":"continent","kind":"place","type":"continent","name":"The Continent","appear":"fw2","tag":[{"t":"Where the story takes place","at":"fw2"}],"rel":["navarre","poromiel","barrens"],"facts":[
  {"t":"Shared by two kingdoms that have been at war for about four hundred years.","at":"fw2","v":1},
