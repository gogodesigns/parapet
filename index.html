  {"t":"A year old when Voldemort kills his parents and then fails to kill him. Nobody can say why the curse did not work.","at":"ss1","v":1},
  {"t":"Left with a scar on his forehead shaped like a bolt of lightning.","at":"ss1","v":1},
  {"t":"Dumbledore leaves him on the Dursleys' doorstep with a letter, so he can grow up away from his own fame.","at":"ss1","v":1},
  {"t":"Almost eleven now. Sleeps in the cupboard under the stairs, small and skinny, with untidy black hair, green eyes and glasses held together with tape.","at":"ss2","v":1},
  {"t":"Strange things happen around him when he is scared or angry: a bad haircut grows out overnight, and he once ended up on the school roof.","at":"ss2","v":1},
  {"t":"At the zoo a boa constrictor seems to understand him, and the glass of its tank vanishes.","at":"ss2","v":1},
  {"t":"Has been told his parents died in a car crash. All he remembers is a flash of green light.","at":"ss2","v":1},
  {"t":"Letters addressed to him start arriving, first one, then hundreds. His uncle will not let him read any of them.","at":"ss3","v":1},
  {"t":"Given Dudley's second bedroom after the first letter arrives.","at":"ss3","v":1},
  {"t":"Turns eleven in a hut on a rock out at sea. Hagrid tells him he is a wizard with a place at Hogwarts, and how his parents really died.","at":"ss4","v":1},
  {"t":"His parents left him a vault of gold at the wizards' bank.","at":"ss5","v":1},
  {"t":"Famous in the wizarding world: strangers queue to shake his hand.","at":"ss5","v":1},
  {"t":"His wand is holly with a phoenix feather, eleven inches. The same phoenix gave one other feather, and it is in the wand that scarred him.","at":"ss5","v":1},
  {"t":"Shares a compartment and a pile of sweets with Ron on the train, and turns down Draco Malfoy's offer of friendship.","at":"ss6","v":1},
  {"t":"The Sorting Hat thinks he would do well in Slytherin. He asks for anything else and is put in Gryffindor.","at":"ss7","v":1},
  {"t":"At the first feast his scar hurts for a moment while he is looking at Snape and Quirrell at the staff table.","at":"ss7","v":1},
  {"t":"Picked on by Snape from the first Potions lesson.","at":"ss8","v":1},
  {"t":"Has never ridden a broom, and flies as if he always has. He dives to catch Neville's Remembrall and is made Gryffindor's Seeker, the youngest house player in about a century.","at":"ss9","v":1},
  {"t":"Sent a Nimbus Two Thousand racing broom. First years are not normally allowed one.","at":"ss10","v":1},
  {"t":"Jumps on a mountain troll's back to save Hermione.","at":"ss10","v":1},
  {"t":"His broom tries to throw him off in his first match. He wins it anyway by nearly swallowing the Snitch.","at":"ss11","v":1},
  {"t":"Given an Invisibility Cloak for Christmas by someone who will not sign the note. It was his father's.","at":"ss12","v":1},
  {"t":"Sees his parents and a crowd of relatives in the Mirror of Erised, and goes back to it three nights running.","at":"ss12","v":1},
  {"t":"Catches the Snitch about five minutes into the Hufflepuff match.","at":"ss13","v":1},
  {"t":"Caught out of bed after getting Norbert away, having left the Cloak at the top of the tower.","at":"ss14","v":1},
  {"t":"Loses Gryffindor fifty points and becomes the most disliked student in the school overnight.","at":"ss15","v":1},
  {"t":"In the forest a hooded figure drinking unicorn blood comes for him. His scar burns worse than it ever has, and the centaur Firenze carries him out.","at":"ss15","v":1},
  {"t":"Decides to go through the trapdoor himself rather than let the Stone be taken.","at":"ss16","v":1},
  {"t":"Finds Quirrell waiting in the last chamber, not Snape. The Mirror gives him the Stone because he wants to find it, not use it.","at":"ss17","v":1},
  {"t":"Quirrell cannot bear to touch him. His mother died to save him, and that left a protection in his skin.","at":"ss17","v":1},
  {"t":"Wakes in the hospital wing. Dumbledore awards him sixty points at the feast, and he goes back to the Dursleys for the summer.","at":"ss17","v":1},
  {"t":"Twelve this summer. The Dursleys have locked away his wand, books and broom, and he has had no word from anyone.","at":"cs1","v":1},
  {"t":"Gets an official warning for magic he did not do. The Dursleys learn he is not allowed to use it outside school and put bars on his window.","at":"cs2","v":1},
  {"t":"Rescued by three Weasleys in a flying car, and spends the rest of the summer at the Burrow.","at":"cs3","v":1},
  {"t":"Arrives at school by crashing into a tree.","at":"cs5","v":1},
  {"t":"Starts hearing a murderous voice that seems to come from inside the walls.","at":"cs7","v":1},
  {"t":"Has every bone removed from his right arm by Lockhart after a Bludger breaks it.","at":"cs10","v":1},
  {"t":"Turns out to be a Parselmouth, in front of half the school. Many decide he must be Slytherin's heir.","at":"cs11","v":1},
  {"t":"Asks the Sorting Hat whether it put him in the right house. It still says he would have done well in Slytherin.","at":"cs12","v":1},
  {"t":"Finds Riddle's diary and is shown a memory in which Hagrid is caught.","at":"cs13","v":1},
  {"t":"Opens the Chamber by speaking to a carved snake.","at":"cs16","v":1},
  {"t":"Kills the basilisk with Gryffindor's sword, is bitten, and is healed by Fawkes. Destroys the diary with the fang.","at":"cs17","v":1},
  {"t":"Dumbledore tells him the Hat put him in Gryffindor because he asked not to be in Slytherin: choices show what a person is, more than abilities.","at":"cs18","v":1},
  {"t":"Frees Dobby with one of his own socks.","at":"cs18","v":1},
  {"t":"Thirteen. Does his holiday homework under the bedclothes by flashlight.","at":"pa1","v":1},
  {"t":"Blows up Aunt Marge by accident and walks out with his trunk.","at":"pa2","v":1},
  {"t":"Expects to be expelled for it. The Minister of Magic meets him at the Leaky Cauldron and waves it away.","at":"pa3","v":1},
  {"t":"Faints when the Dementor comes into the compartment. He is the only one who does.","at":"pa5","v":1},
  {"t":"Falls fifty feet from his broom when the Dementors come onto the field, and loses a match for the first time.","at":"pa9","v":1},
  {"t":"What he hears when they come close is his mother, pleading for his life, in the moments before she died.","at":"pa10","v":1},
  {"t":"Learns that the man who betrayed his parents was their best friend and is his own godfather.","at":"pa10","v":1},
  {"t":"Half wants to keep hearing his parents' voices, which makes the Patronus harder to learn.","at":"pa12","v":1},
  {"t":"Wins the Quidditch Cup.","at":"pa15","v":1},
  {"t":"Stops Sirius and Lupin from killing Pettigrew.","at":"pa19","v":1},
  {"t":"Thinks he has seen his father across the lake. It was himself, and the full Patronus was his own.","at":"pa21","v":1},
  {"t":"Has a godfather who would give him a home, if he were not on the run. Lets the Dursleys go on thinking Sirius is a murderer.","at":"pa22","v":1},
  {"t":"Wakes in the night with his scar hurting, having dreamed of Voldemort and Wormtail killing an old man.","at":"gf2","v":1},
  {"t":"Loses his wand in the crush at the World Cup. It is the wand that casts the Dark Mark.","at":"gf9","v":1},
  {"t":"One of the few who can shake off the Imperius Curse.","at":"gf15","v":1},
  {"t":"Named fourth champion by the Goblet. He did not put his name in.","at":"gf16","v":1},
  {"t":"Gets past his dragon on his Firebolt.","at":"gf20","v":1},
  {"t":"Asks Cho Chang to the ball too late.","at":"gf22","v":1},
  {"t":"Reaches the hostages first and stays until all four are safe, taking the song at its word. Finishes outside the hour and is marked up for moral fiber.","at":"gf26","v":1},
  {"t":"Dreams of Voldemort punishing Wormtail and receiving good news by owl.","at":"gf29","v":1},
  {"t":"Tied to a headstone and cut. His blood is the last ingredient in Voldemort's return.","at":"gf32","v":1},
  {"t":"Duels Voldemort, sees his parents' echoes, and gets back with Cedric's body.","at":"gf34","v":1},
  {"t":"Tells Dumbledore and Sirius everything that night. The Minister does not believe him.","at":"gf36","v":1},
  {"t":"Gives his winnings to Fred and George.","at":"gf37","v":1},
  {"t":"Fifteen, angry, and kept in the dark all summer. Saves Dudley from Dementors with a Patronus.","at":"op1","v":1},
  {"t":"Tried by the full Wizengamot for under-age magic and cleared.","at":"op8","v":1},
  {"t":"Not made prefect, which he minds more than he expected to.","at":"op9","v":1},
  {"t":"Can now see the skeletal horses that pull the school carriages.","at":"op10","v":1},
  {"t":"Finds half the school, and one of his own dormitory, believes the newspaper and not him.","at":"op11","v":1},
  {"t":"Does a week of detentions with Umbridge's quill and tells nobody.","at":"op13","v":1},
  {"t":"Teaches the D.A., and is good at it.","at":"op18","v":1},
  {"t":"Banned from Quidditch for life.","at":"op19","v":1},
  {"t":"They are Thestrals, visible to him because he watched Cedric die.","at":"op21","v":1},
  {"t":"Kissed by Cho. Dreams the attack on Mr. Weasley from inside the snake.","at":"op21","v":1},
  {"t":"For an instant, looking at Dumbledore, feels a hatred that is not his own.","at":"op22","v":1},
  {"t":"Tells his story to The Quibbler.","at":"op26","v":1},
  {"t":"Sees his father at fifteen in Snape's memory, and does not like him.","at":"op28","v":1},
  {"t":"Collapses in an exam with a vision of Sirius under torture.","at":"op31","v":1},
  {"t":"Leads five friends into the Department of Mysteries and takes the prophecy from its shelf.","at":"op34","v":1},
  {"t":"Possessed by Voldemort for a few seconds in the Atrium. What drives Voldemort out is Harry's grief for Sirius.","at":"op36","v":1},
  {"t":"Told the prophecy. He or Voldemort must kill the other.","at":"op37","v":1},
  {"t":"Must go back to Privet Drive once a year: while he can call his mother's sister's house home, her sacrifice shields him there.","at":"op37","v":1},
  {"t":"Nearly sixteen. Inherits everything Sirius had.","at":"hb3","v":1},
  {"t":"The papers have started calling him the Chosen One.","at":"hb3","v":1},
  {"t":"Made Quidditch captain. His exam results are good enough for everything an Auror needs except, he thinks, Potions.","at":"hb5","v":1},
  {"t":"Sure that Draco Malfoy has taken his father's place among the Death Eaters. Nobody else is.","at":"hb7","v":1},
  {"t":"Top of Potions overnight, thanks to someone else's notes.","at":"hb9","v":1},
  {"t":"Tells the Minister he is Dumbledore's man through and through.","at":"hb16","v":1},
  {"t":"Saves Ron's life with a bezoar.","at":"hb18","v":1},
  {"t":"Nearly kills Malfoy with a spell he did not understand.","at":"hb24","v":1},
  {"t":"Kisses Ginny Weasley in front of the whole common room.","at":"hb24","v":1},
  {"t":"Feeds Dumbledore the potion in the cave, as ordered, and brings him home.","at":"hb26","v":1},
  {"t":"Immobilised under his Cloak by Dumbledore, and made to watch him die.","at":"hb27","v":1},
  {"t":"Ends it with Ginny so that Voldemort cannot use her. Will not return to school. Means to find and destroy the Horcruxes, and then Voldemort.","at":"hb30","v":1},
  {"t":"Says goodbye to the Dursleys for good.","at":"dh3","v":1},
  {"t":"Disarms an attacker he knows to be bewitched, when he could have Stunned him. The Death Eaters recognise him by it.","at":"dh4","v":1},
  {"t":"Seventeen, and of age.","at":"dh7","v":1},
  {"t":"Reads the first page of a letter his mother wrote to Sirius.","at":"dh10","v":1},
  {"t":"Stands at his parents' grave for the first time.","at":"dh16","v":1},
  {"t":"His wand is snapped.","at":"dh17","v":1},
  {"t":"Opens the locket with a word of Parseltongue so that Ron can stab it.","at":"dh19","v":1},
  {"t":"Digs Dobby's grave without magic. Decides against chasing the wand.","at":"dh24","v":1},
  {"t":"Uses an Unforgivable Curse on a Death Eater who spits at McGonagall.","at":"dh30","v":1},
  {"t":"Learns that when Voldemort's curse rebounded, a fragment of Voldemort's soul lodged in him. While he lives, Voldemort cannot die. Dumbledore always knew.","at":"dh33","v":1},
  {"t":"Walks into the forest alone and does not raise his wand.","at":"dh34","v":1},
  {"t":"Not killed. Voldemort had taken Harry's blood, and with it Lily's protection, so Harry stayed tied to life. The curse destroyed only the piece of Voldemort.","at":"dh35","v":1},
  {"t":"His willingness to die protects everyone in the castle the way his mother's protected him. Faces Voldemort before them all, explains the wand, and casts a Disarming Charm.","at":"dh36","v":1},
  {"t":"True master of all three Hallows for a moment. Keeps only the Cloak.","at":"dh36","v":1},
  {"t":"Married to Ginny, with three children: James, Albus and Lily.","at":"dh37","v":1}]},
 {"id":"vernon","kind":"person","g":"m","name":[{"t":"Mr. Dursley","at":"ss1"},{"t":"Vernon Dursley","at":"ss2"}],"appear":"ss1","tag":[{"t":"Harry's uncle","at":"ss1"}],"rel":["harry","petunia","dudley","privet","dursleys"],"facts":[
  {"t":"Director of a drill company called Grunnings. Big, with almost no neck and a large moustache.","at":"ss1","v":1},
  {"t":"Wants above all to be thought normal, and to keep his wife's sister's family a secret.","at":"ss1","v":1},
  {"t":"Punishes Harry for anything out of the ordinary, even a dream about a flying motorcycle.","at":"ss2","v":1},
  {"t":"Burns Harry's letters, nails up the mail slot, and finally drives the family to a hut on a rock to escape them.","at":"ss3","v":1},
  {"t":"Had sworn to stamp the magic out of Harry, and refuses to pay for him to go to Hogwarts.","at":"ss4","v":1},
  {"t":"Drives Harry to King's Cross and leaves him there, laughing at the platform number on his ticket.","at":"ss6","v":1},
  {"t":"Rehearses the family for a dinner party at which Harry is to stay upstairs and pretend not to exist.","at":"cs1","v":1},
  {"t":"Locks Harry in and fits a cat flap for meals.","at":"cs2","v":1},
  {"t":"Hangs onto Harry's ankle as the car pulls away, and falls into a flowerbed.","at":"cs3","v":1},
  {"t":"Agrees to sign the Hogsmeade form if Harry behaves all week. He does not sign it.","at":"pa2","v":1},
  {"t":"Told at the station that Harry's godfather is an escaped murderer who likes to keep in touch.","at":"pa22","v":1},
  {"t":"Lets Harry go to the World Cup once reminded that Harry's godfather will want to hear how he is treated.","at":"gf3","v":1},
  {"t":"Tries to throw Harry out, and is overruled by his wife for once.","at":"op2","v":1},
  {"t":"Warned at King's Cross by Moody, Lupin, Tonks and Mr. Weasley that they will hear of it if Harry is mistreated.","at":"op38","v":1},
  {"t":"Packs and unpacks the car for a month before agreeing to go.","at":"dh3","v":1}]},
 {"id":"petunia","kind":"person","g":"f","name":"Petunia Dursley","appear":"ss1","tag":[{"t":"Harry's aunt","at":"ss1"}],"rel":["harry","vernon","dudley","lily","privet","dursleys","snape"],"relAt":{"snape":"dh33"},"facts":[
  {"t":"Thin and blonde, with a long neck that she uses for spying on the neighbors.","at":"ss1","v":1},
  {"t":"Sister of Harry's mother. She pretends not to have a sister.","at":"ss1","v":1},
  {"t":"Dotes on Dudley and makes Harry cook breakfast.","at":"ss2","v":1},
  {"t":"Always knew her sister was a witch, and resented how proud their parents were of it.","at":"ss4","v":1},
  {"t":"Her masterpiece of a pudding ends up on the kitchen floor.","at":"cs2","v":1},
  {"t":"Knows what Dementors are and where they guard, which astonishes her husband. Receives a Howler, turns white, and says the boy stays.","at":"op2","v":1},
  {"t":"Took Harry in grudgingly, and by doing so sealed the charm that protects him. The Howler was Dumbledore reminding her.","at":"op37","v":1},
  {"t":"Hesitates at the door as if to say something, and does not.","at":"dh3","v":1},
  {"t":"As a girl she wrote to Dumbledore asking to come to Hogwarts too. Snape and Lily found the reply.","at":"dh33","v":1}]},
 {"id":"dudley","kind":"person","g":"m","name":"Dudley Dursley","appear":"ss1","tag":[{"t":"Harry's cousin","at":"ss1"}],"rel":["harry","vernon","petunia","piers","privet","dursleys","dudleys_gang","dementors"],"relAt":{"dementors":"op1"},"facts":[
  {"t":"The Dursleys' only child, a baby when Harry arrives.","at":"ss1","v":1},
  {"t":"Spoiled and heavy. Counts his birthday presents and throws a tantrum when there are fewer than last year.","at":"ss2","v":1},
  {"t":"Uses Harry as a punching bag, with his gang to help.","at":"ss2","v":1},
  {"t":"Going to Smeltings, his father's old school, which issues its pupils knobbly sticks.","at":"ss3","v":1},
  {"t":"Hagrid gives him a pig's tail for eating Harry's birthday cake.","at":"ss4","v":1},
  {"t":"Has the tail removed at a private hospital in London.","at":"ss6","v":1},
  {"t":"Frightened of Harry muttering nonsense words, since he does not know Harry cannot use magic at home.","at":"cs1","v":1},
  {"t":"On a strict diet, by order of the school nurse.","at":"gf3","v":1},
  {"t":"Eats a dropped sweet, and his tongue grows four feet long.","at":"gf4","v":1},
  {"t":"A junior boxing champion who spends his evenings beating up younger children.","at":"op1","v":1},
  {"t":"Attacked by a Dementor he cannot see. Harry half carries him home.","at":"op1","v":1},
  {"t":"Does not understand why Harry is not coming with them. Says he does not think Harry is a waste of space, and shakes his hand.","at":"dh3","v":1}]},
 {"id":"marge","kind":"person","g":"f","name":[{"t":"Marge Dursley","at":"ss2"},{"t":"Aunt Marge","at":"pa2"}],"appear":"ss2","tag":[{"t":"Vernon's sister","at":"ss2"}],"rel":["vernon","dudley","ripper"],"facts":[
  {"t":"Dudley's aunt, who sends him birthday presents.","at":"ss2","v":1},
  {"t":"Vernon's sister. Sends a postcard from a seaside holiday.","at":"ss3","v":1},
  {"t":"Large, red-faced and moustached. Breeds bulldogs, and has been told Harry goes to a school for incurably criminal boys.","at":"pa2","v":1},
  {"t":"Says over brandy that Harry's father was a drunk and a wastrel. Her glass shatters, and then she swells and floats to the ceiling.","at":"pa2","v":1},
  {"t":"Punctured and has her memory modified by the Ministry.","at":"pa3","v":1}]},
 {"id":"figg","kind":"person","g":"f","name":[{"t":"Mrs. Figg","at":"ss2"},{"t":"Arabella Figg","at":"gf36"}],"appear":"ss2","tag":[{"t":"A neighbor of the Dursleys","at":"ss2"}],"rel":["harry","privet","order","mundungus"],"relAt":{"mundungus":"op2"},"facts":[
  {"t":"An old woman two streets away who minds Harry when the Dursleys go out. Her house smells of cabbage and she shows him photographs of her cats.","at":"ss2","v":1},
  {"t":"Breaks her leg just before Dudley's birthday, which is why Harry gets to go to the zoo.","at":"ss2","v":1},
  {"t":"Dumbledore names her among the old crowd to be alerted.","at":"gf36","v":1},
  {"t":"A Squib. She has lived near Privet Drive all these years to keep an eye on Harry for Dumbledore.","at":"op2","v":1},
  {"t":"Gives evidence at the hearing that there were Dementors.","at":"op8","v":1}]},
 {"id":"piers","kind":"person","g":"m","name":"Piers Polkiss","appear":"ss2","tag":[{"t":"Dudley's best friend","at":"ss2"}],"rel":["dudley","dudleys_gang"],"facts":[
  {"t":"A scrawny boy who holds people's arms back while Dudley hits them. Comes to the zoo for Dudley's birthday.","at":"ss2","v":1},
  {"t":"Going to Smeltings with Dudley.","at":"ss3","v":1}]},
 {"id":"james","kind":"person","g":"m","name":"James Potter","appear":"ss1","tag":[{"t":"Killed by Voldemort","at":"ss1","state":"fallen"}],"rel":["harry","lily","voldemort","sirius","snape","cloak","godrics","marauders","lupin","pettigrew"],"relAt":{"snape":"op28","sirius":"pa10","marauders":"pa18","lupin":"pa18","pettigrew":"pa10"},"facts":[
  {"t":"Harry's father. Killed by Voldemort.","at":"ss1","v":1},
  {"t":"A wizard, and Head Boy at Hogwarts in his day.","at":"ss4","v":1},
  {"t":"His wand was mahogany, eleven inches, good for Transfiguration.","at":"ss5","v":1},
  {"t":"An excellent Quidditch player, according to McGonagall.","at":"ss9","v":1},
  {"t":"Left his Invisibility Cloak with someone before he died.","at":"ss12","v":1},
  {"t":"Tall and thin, with glasses and black hair that sticks up at the back the way Harry's does.","at":"ss12","v":1},
  {"t":"Tried to fight Voldemort off while his wife and son got away.","at":"ss17","v":1},
  {"t":"At school he and Snape loathed each other, and he once saved Snape's life.","at":"ss17","v":1},
  {"t":"Sirius Black's inseparable friend, and trusted him over Dumbledore's offer to be Secret-Keeper himself.","at":"pa10","v":1},
  {"t":"Harry hears him shouting to Lily to take the baby and run.","at":"pa12","v":1},
  {"t":"Prongs. An Animagus who turned into a stag.","at":"pa18","v":1},
  {"t":"Went down the tunnel after Snape and pulled him back, at great risk to himself.","at":"pa18","v":1},
  {"t":"At fifteen: clever, popular, showing off with a stolen Snitch, and hexing Snape because he was bored. Lily calls him an arrogant bully.","at":"op28","v":1},
  {"t":"Lupin and Sirius say he improved. Lily started going out with him in their seventh year, once his head had deflated.","at":"op29","v":1},
  {"t":"Dumbledore had borrowed his Cloak shortly before he died.","at":"dh10","v":1},
  {"t":"Walks with Harry into the forest.","at":"dh34","v":1}]},
 {"id":"lily","kind":"person","g":"f","name":[{"t":"Lily Potter","at":"ss1"},{"t":"Lily Potter, born Evans","at":"op28"}],"appear":"ss1","tag":[{"t":"Killed by Voldemort","at":"ss1","state":"fallen"}],"rel":["harry","james","petunia","voldemort","godrics","snape"],"relAt":{"snape":"dh33"},"facts":[
  {"t":"Harry's mother, and Petunia Dursley's sister. Killed by Voldemort.","at":"ss1","v":1},
  {"t":"A witch from a non-magic family, and Head Girl at Hogwarts in her day.","at":"ss4","v":1},
  {"t":"Her wand was willow, ten and a quarter inches, good for charm work.","at":"ss5","v":1},
  {"t":"Harry has her green eyes.","at":"ss12","v":1},
  {"t":"Voldemort would have let her live. She died shielding Harry, and that is what protects him.","at":"ss17","v":1},
  {"t":"Harry hears her begging Voldemort to kill her and spare her son.","at":"pa10","v":1},
  {"t":"At fifteen, dark red hair and Harry's eyes. The only one who tells James to leave Snape alone.","at":"op28","v":1},
  {"t":"Her blood runs in her sister. That is why Dumbledore left Harry on that doorstep.","at":"op37","v":1},
  {"t":"Her letter to Sirius is full of baby Harry on a toy broom.","at":"dh10","v":1},
  {"t":"Grew up near Snape and was his friend until their fifth year.","at":"dh33","v":1},
  {"t":"Walks with Harry into the forest.","at":"dh34","v":1}]},
 {"id":"sirius","kind":"person","g":"m","name":"Sirius Black","appear":"ss1","tag":[{"t":"Lent Hagrid a motorcycle","at":"ss1"},{"t":"An escaped convict","at":"pa2"},{"t":"Escaped from Azkaban","at":"pa3"},{"t":"Believed to have betrayed the Potters","at":"pa10"},{"t":"Innocent","at":"pa19"},{"t":"Free, and in hiding","at":"pa21","state":"away"},{"t":"Confined to Grimmauld Place","at":"op4"},{"t":"Killed at the Ministry","at":"op35","state":"fallen"}],"rel":["hagrid","motorcycle","azkaban","dementors","james","pettigrew","harry","black_dog","lupin","marauders","buckbeak","crookshanks","firebolt","cave","snape","grimmauld","order","kreacher","blacks","regulus","bellatrix","mirror2","veil"],"relAt":{"azkaban":"pa3","james":"pa10","pettigrew":"pa10","harry":"pa10","black_dog":"pa17","lupin":"pa17","marauders":"pa18","buckbeak":"pa21","crookshanks":"pa19","firebolt":"pa22","snape":"gf36","bellatrix":"op6","veil":"op35"},"facts":[
  {"t":"The owner of the flying motorcycle Hagrid uses to bring Harry to Privet Drive.","at":"ss1","v":1},
  {"t":"On the Muggle news as an armed and dangerous escaped prisoner, gaunt, with matted hair to his elbows.","at":"pa2","v":1},
  {"t":"The first person ever to break out of Azkaban. Sent there twelve years ago for killing thirteen people with a single curse, and said to have laughed.","at":"pa3","v":1},
  {"t":"The guards heard him muttering in his sleep that someone is at Hogwarts. The Ministry believes he means Harry.","at":"pa4","v":1},
  {"t":"Slashes the Fat Lady's portrait when she will not let him into Gryffindor Tower.","at":"pa8","v":1},
  {"t":"James Potter's best friend, best man at his wedding, and Harry's godfather.","at":"pa10","v":1},
  {"t":"Believed to have been the Potters' Secret-Keeper and to have handed them to Voldemort, then murdered Peter Pettigrew and twelve Muggles.","at":"pa10","v":1},
  {"t":"Gets into the dormitory with a knife, and attacks Ron's bed, not Harry's.","at":"pa13","v":1},
  {"t":"An Animagus: the black dog.","at":"pa17","v":1},
  {"t":"Padfoot. As a schoolboy he told Snape how to get past the Whomping Willow at the full moon, as a joke that could have killed him.","at":"pa18","v":1},
  {"t":"Innocent of all of it. He was never sent to trial. Blames himself anyway, because the switch of Secret-Keeper was his idea.","at":"pa19","v":1},
  {"t":"Kept his mind in Azkaban because knowing he was innocent was not a happy thought the Dementors could take. As a dog he was thin enough to slip the bars.","at":"pa19","v":1},
  {"t":"Escaped when he recognised the rat on Ron's shoulder in a newspaper photograph of the Weasleys.","at":"pa19","v":1},
  {"t":"Offers Harry a home once his name is cleared.","at":"pa20","v":1},
  {"t":"Recaptured and locked in a tower office to await the Dementor's Kiss. Flies off on Buckbeak with minutes to spare.","at":"pa21","v":1},
  {"t":"Writes to Harry from hiding, signs his Hogsmeade form and admits to the Firebolt.","at":"pa22","v":1},
  {"t":"Harry writes to him about the scar. He comes north at once.","at":"gf2","v":1},
  {"t":"Talks to Harry from the common room fire, and warns him about Karkaroff.","at":"gf19","v":1},
  {"t":"Living in a cave above Hogsmeade. Tells the three what he knows about Crouch and about Snape's old Slytherin gang.","at":"gf27","v":1},
  {"t":"Shows himself in the hospital wing. Dumbledore makes him and Snape shake hands, and sends him to rouse the old crowd.","at":"gf36","v":1},
  {"t":"Cannot leave the house: the Ministry is still hunting him, and Voldemort knows about the dog. He is back in the home he ran away from.","at":"op4","v":1},
  {"t":"Ran away at sixteen to the Potters. An uncle left him gold, which is why he is not penniless.","at":"op6","v":1},
  {"t":"Had been hoping, without admitting it, that Harry would be expelled and come to live with him.","at":"op9","v":1},
  {"t":"Sees Harry off at the station as a dog, against advice, and is recognised.","at":"op10","v":1},
  {"t":"Talks to Harry by fire. Snaps that Harry is less like his father than he thought when Harry will not take a risk.","at":"op14","v":1},
  {"t":"Glad of the company at Christmas, and low when it ends.","at":"op22","v":1},
  {"t":"Tells Harry his father grew out of it. They were all idiots at fifteen.","at":"op29","v":1},
  {"t":"Comes to the Ministry with the Order. Is laughing at his cousin when her spell hits him, and falls through the veil.","at":"op35","v":1},
  {"t":"Dumbledore says he was not cruel, and that he should have been kinder to Kreacher.","at":"op37","v":1},
  {"t":"Will not come back as a ghost. He went on.","at":"op38","v":1},
  {"t":"Walks with Harry into the forest, and says dying is quicker than falling asleep.","at":"dh34","v":1}]},
 {"id":"dumbledore","kind":"person","g":"m","name":"Albus Dumbledore","appear":"ss1","tag":[{"t":"Decides where Harry will grow up","at":"ss1"},{"t":"Headmaster of Hogwarts","at":"ss4"},{"t":"Suspended as headmaster","at":"cs14","state":"away"},{"t":"Headmaster of Hogwarts","at":"cs18"},{"t":"On the run from the Ministry","at":"op27","state":"away"},{"t":"Headmaster of Hogwarts","at":"op36"},{"t":"Killed on the Astronomy Tower","at":"hb27","state":"fallen"}],"rel":["harry","mcgonagall","hagrid","flamel","voldemort","grindelwald","putouter","mirror","stone","staff","fawkes","office","governors","riddle","lupin","time_turner","pensieve","moody","snape","order","aberforth","prophecy","occlumency","wizengamot","phineas","slughorn","ring","horcruxes","sea_cave","draco","tomb","scrimgeour","dumbledores","ariana","elder_wand","hallows","snitch"],"relAt":{"riddle":"cs13","time_turner":"pa21","snape":"dh33","prophecy":"op37","occlumency":"op37","ring":"hb4","horcruxes":"hb23","sea_cave":"hb26","draco":"hb27","scrimgeour":"hb30","grindelwald":"dh18","elder_wand":"dh24","hallows":"dh35"},"facts":[
  {"t":"Tall, thin and very old, with a silver beard long enough to tuck into his belt and half-moon glasses.","at":"ss1","v":1},
  {"t":"Decides that Harry should grow up with his Muggle relatives, and leaves him there himself.","at":"ss1","v":1},
  {"t":"One of the few who says Voldemort's name. McGonagall says he is the only one Voldemort was ever afraid of.","at":"ss1","v":1},
  {"t":"Headmaster of Hogwarts. Let Hagrid stay on as gamekeeper after he was expelled.","at":"ss4","v":1},
  {"t":"Was wanted for Minister of Magic and would not leave the school.","at":"ss5","v":1},
  {"t":"His Chocolate Frog card credits him with defeating the Dark wizard Grindelwald in 1945, finding the twelve uses of dragon's blood, and work on alchemy with Nicolas Flamel.","at":"ss6","v":1},
  {"t":"Opens the year with a few nonsense words, and warns the school off the forest and one third-floor corridor.","at":"ss7","v":1},
  {"t":"Finds Harry at the Mirror of Erised, explains what it does and has it moved. Says that what he sees in it is socks.","at":"ss12","v":1},
  {"t":"Tells Harry after the Hufflepuff match that he is glad he has kept busy.","at":"ss13","v":1},
  {"t":"Called away to London by an urgent owl on the night the Stone is in danger.","at":"ss16","v":1},
  {"t":"Realises the message was a trick and gets back in time to pull Quirrell off Harry.","at":"ss17","v":1},
  {"t":"Sent Harry the Cloak. Agrees with Flamel to destroy the Stone.","at":"ss17","v":1},
  {"t":"Will not yet tell Harry why Voldemort wanted to kill him as a baby.","at":"ss17","v":1},
  {"t":"Hands out enough last-minute points at the feast to give Gryffindor the House Cup.","at":"ss17","v":1},
  {"t":"Does not expel Harry and Ron over the car, and warns them he will if it happens again.","at":"cs5","v":1},
  {"t":"Says Mrs. Norris is Petrified, not dead, and that it would take Dark magic of the most advanced kind.","at":"cs9","v":1},
  {"t":"Tells McGonagall the question is not who opened the Chamber, but how.","at":"cs10","v":1},
  {"t":"Asks Harry whether there is anything he wants to tell him. Harry says no.","at":"cs12","v":1},
  {"t":"Taught Transfiguration fifty years ago. In the memory he is the only teacher who watches Riddle closely.","at":"cs13","v":1},
  {"t":"Suspended by the governors. Leaving, he says he will only truly have gone when nobody at the school is loyal to him, and that help will be given to those who ask.","at":"cs14","v":1},
  {"t":"Back at the request of the governors. Tells Harry that Voldemort put a little of himself into him the night of the scar.","at":"cs18","v":1},
  {"t":"Makes it clear he does not want Dementors at his school, and can do nothing about it.","at":"pa5","v":1},
  {"t":"Furious when they come onto the Quidditch field. Slows Harry's fall.","at":"pa9","v":1},
  {"t":"Suspected someone close to the Potters was passing information, and offered to be their Secret-Keeper himself.","at":"pa10","v":1},
  {"t":"Believes Harry and Hermione, cannot make anyone else do so, and tells Hermione that three turns should do it.","at":"pa21","v":1},
  {"t":"Says Harry did a noble thing in sparing Pettigrew, and that the dead never truly leave us.","at":"pa22","v":1},
  {"t":"Draws the Age Line, and judges the tournament with the other heads.","at":"gf16","v":1},
  {"t":"Asks Harry calmly whether he put his name in, and accepts the answer.","at":"gf17","v":1},
  {"t":"Reaches the forest edge minutes too late for Mr. Crouch.","at":"gf28","v":1},
  {"t":"Will not tell Harry why he trusts Snape, and asks him not to speak of Neville's parents.","at":"gf30","v":1},
  {"t":"Knew the instant \"Moody\" took Harry away from him that it was not Moody.","at":"gf35","v":1},
  {"t":"A look of something like triumph crosses his face when he hears Voldemort used Harry's blood.","at":"gf36","v":1},
  {"t":"Breaks with Fudge, and starts sending people out that same night.","at":"gf36","v":1},
  {"t":"Tells the school the truth about Cedric against the Ministry's wishes, and says they will soon have to choose between what is right and what is easy.","at":"gf37","v":1},
  {"t":"Stripped of his titles for insisting Voldemort is back, and says he does not care so long as they leave him on the Chocolate Frog cards.","at":"op5","v":1},
  {"t":"Turns up at the hearing with a witness and an armchair, and dismantles the case. Will not meet Harry's eye.","at":"op8","v":1},
  {"t":"Acts within minutes of Harry's dream, through the portraits in his office.","at":"op22","v":1},
  {"t":"Says the D.A. was his. Brings down the Minister and three others with one spell and leaves with Fawkes.","at":"op27","v":1},
  {"t":"Arrives at the Department of Mysteries and rounds up nearly every Death Eater.","at":"op35","v":1},
  {"t":"Duels Voldemort without trying to kill him, and tells him there are worse things than death.","at":"op36","v":1},
  {"t":"Tells Harry that he cared for him too much: he put off the truth year after year to spare him. Sent the Howler to Petunia. Did not make him prefect because he had enough to carry.","at":"op37","v":1},
  {"t":"Heard the prophecy in person, and has known since Harry was a baby what it asked of him.","at":"op37","v":1},
  {"t":"Arrives at Privet Drive with a dead-looking right hand. Tells the Dursleys what he thinks of how they have treated Harry, and of what they have done to their own son.","at":"hb3","v":1},
  {"t":"Wants Harry to confide in Ron and Hermione, and will be giving him private lessons this year.","at":"hb4","v":1},
  {"t":"The lessons are memories: he has spent years collecting everything that can be known about Tom Riddle.","at":"hb10","v":1},
  {"t":"Refused Voldemort a teaching post years ago. No Defense teacher has lasted more than a year since.","at":"hb20","v":1},
  {"t":"Destroyed the ring Horcrux, and paid for it with his hand.","at":"hb23","v":1},
  {"t":"Will not tell Harry why he trusts Snape. Says only that Snape's remorse was real.","at":"hb25","v":1},
  {"t":"Drinks the potion in the cave, which makes him relive something unbearable. He pleads with someone not to hurt them, to hurt him instead.","at":"hb26","v":1},
  {"t":"Freezes Harry to keep him out of it, and is disarmed. Talks to Draco gently, offers to hide him and his family, and almost gets through.","at":"hb27","v":1},
  {"t":"Says Snape's name and one more word. Snape kills him, and he falls from the tower.","at":"hb27","v":1},
  {"t":"His portrait appears in the head's office, asleep.","at":"hb29","v":1},
  {"t":"Buried in a white tomb by the lake.","at":"hb30","v":1},
  {"t":"A friend's obituary tells Harry things he never knew: a jailed father, a dead sister, a brother he was not close to.","at":"dh2","v":1},
  {"t":"His will leaves three odd bequests that make sense only later.","at":"dh7","v":1},
  {"t":"At seventeen, stuck at home as his sister's guardian, he met Gellert Grindelwald. For two months they planned a world in which wizards ruled Muggles for their own good.","at":"dh18","v":1},
  {"t":"His brother says he resented the burden, and that Ariana died because of the quarrel that ended it.","at":"dh28","v":1},
  {"t":"Was dying from the ring's curse all through his last year. Asked Snape to be the one to kill him, when the time came, and so spare Draco.","at":"dh33","v":1},
  {"t":"Told Snape that Harry would have to die, and to tell Harry only at the very end.","at":"dh33","v":1},
  {"t":"Admits it all: he wanted the Hallows, he feared knowing who killed his sister, and he put off facing Grindelwald for years. Never trusted himself with power again.","at":"dh35","v":1},
  {"t":"Had guessed that Harry would survive, and did not say so, because Harry had to choose to go.","at":"dh35","v":1}]},
 {"id":"mcgonagall","kind":"person","g":"f","name":[{"t":"Professor McGonagall","at":"ss1"},{"t":"Minerva McGonagall","at":"ss4"}],"appear":"ss1","tag":[{"t":"Watches Privet Drive as a cat","at":"ss1"},{"t":"Deputy Headmistress of Hogwarts","at":"ss4"},{"t":"Deputy Headmistress, head of Gryffindor","at":"ss9"},{"t":"In St. Mungo's","at":"op31","state":"away"},{"t":"Back at Hogwarts","at":"op38"},{"t":"Acting head of Hogwarts","at":"hb29"}],"rel":["dumbledore","harry","gryffindor","staff","transfiguration","chess","animagus","order","umbridge"],"relAt":{"gryffindor":"ss9"},"facts":[
  {"t":"Can turn herself into a tabby cat. Spends a whole day watching the Dursleys in that shape.","at":"ss1","v":1},
  {"t":"Thinks the Dursleys are the worst sort of Muggles and argues against leaving Harry with them.","at":"ss1","v":1},
  {"t":"Deputy Headmistress. Her name is on Harry's letter.","at":"ss4","v":1},
  {"t":"Meets the first years at the door and runs the Sorting.","at":"ss7","v":1},
  {"t":"Teaches Transfiguration. Strict and clever, and not someone to cross.","at":"ss8","v":1},
  {"t":"Sees Harry's dive for the Remembrall and, in place of punishing him, takes him to the Gryffindor Quidditch captain.","at":"ss9","v":1},
  {"t":"Head of Gryffindor House.","at":"ss9","v":1},
  {"t":"Takes five points from Hermione and gives five each to Harry and Ron after the troll.","at":"ss10","v":1},
  {"t":"Takes fifty points each from Harry, Hermione and Neville for being out of bed, and gives all three detention.","at":"ss15","v":1},
  {"t":"Refuses to believe anyone could steal the Stone.","at":"ss16","v":1},
  {"t":"Her protection for the Stone is a giant chess set that has to be played across.","at":"ss16","v":1},
  {"t":"Gives Harry and Ron detention for the car and takes no points, since term had not begun.","at":"cs5","v":1},
  {"t":"Cancels Quidditch and sets a curfew after the double attack.","at":"cs14","v":1},
  {"t":"Announces that the school will have to close.","at":"cs16","v":1},
  {"t":"Acting head while Dumbledore is away.","at":"cs18","v":1},
  {"t":"Turns into a cat in front of her class and gets no applause, because they are all thinking about the Grim.","at":"pa6","v":1},
  {"t":"Will not sign Harry's Hogsmeade form in place of a guardian.","at":"pa9","v":1},
  {"t":"Confiscates the Firebolt.","at":"pa11","v":1},
  {"t":"In tears when Gryffindor win the Cup.","at":"pa15","v":1},
  {"t":"Appalled to find a teacher using Transfiguration as a punishment.","at":"gf13","v":1},
  {"t":"Teaches the fourth years to dance, and orders Harry to find a partner because champions open the ball.","at":"gf22","v":1},
  {"t":"Shouts at the Minister of Magic for bringing a Dementor into the castle.","at":"gf36","v":1},
  {"t":"Tells Harry to keep his head down with Umbridge, and offers him a biscuit.","at":"op12","v":1},
  {"t":"Is inspected, and does not tolerate interruptions.","at":"op15","v":1},
  {"t":"Vows in front of Umbridge to make Harry an Auror if it is the last thing she does.","at":"op29","v":1},
  {"t":"Hit in the chest by four Stunners at once while running to Hagrid's defense.","at":"op31","v":1},
  {"t":"Points out that Malfoy was in detention with her when Katie was cursed.","at":"hb12","v":1},
  {"t":"Cannot understand how Dumbledore came to trust Snape. Takes charge of the school.","at":"hb29","v":1},
  {"t":"Duels Snape through the corridors, and takes command of the defense.","at":"dh30","v":1},
  {"t":"Screams when she sees Harry carried out.","at":"dh36","v":1}]},
 {"id":"hagrid","kind":"person","g":"m","name":[{"t":"Hagrid","at":"ss1"},{"t":"Rubeus Hagrid","at":"ss4"}],"appear":"ss1","tag":[{"t":"Brings Harry to Privet Drive","at":"ss1"},{"t":"Keeper of Keys and Grounds at Hogwarts","at":"ss4"},{"t":"Taken to Azkaban","at":"cs14","state":"away"},{"t":"Cleared, and back at Hogwarts","at":"cs18"},{"t":"Care of Magical Creatures teacher, and gamekeeper","at":"pa5"},{"t":"In hiding","at":"op31","state":"away"},{"t":"Back at Hogwarts","at":"op38"}],"rel":["harry","dumbledore","fang","fluffy","norbert","umbrella","hut","forest","motorcycle","staff","riddle","aragog","azkaban","buckbeak","comc","hippogriffs","maxime","skrewts","giants","order","grawp","thestrals"],"relAt":{"fluffy":"ss11","riddle":"cs13","aragog":"cs15","giants":"gf23"},"facts":[
  {"t":"Almost twice the height of a normal man, with a wild tangle of black hair and beard.","at":"ss1","v":1},
  {"t":"Carries baby Harry out of the ruined house and flies him to Privet Drive on a borrowed motorcycle. Dumbledore says he would trust him with his life.","at":"ss1","v":1},
  {"t":"Keeper of Keys and Grounds at Hogwarts. Breaks down the door of the hut on the rock to deliver Harry's letter in person.","at":"ss4","v":1},
  {"t":"Expelled from Hogwarts in his third year and had his wand snapped. He is not supposed to do magic.","at":"ss4","v":1},
  {"t":"Carries a pink umbrella that does magic all the same.","at":"ss4","v":1},
  {"t":"Takes Harry shopping in Diagon Alley and collects a small package from vault 713 on Dumbledore's orders.","at":"ss5","v":1},
  {"t":"Buys Harry an owl for his birthday. Has always wanted a dragon.","at":"ss5","v":1},
  {"t":"Meets the first years off the train and takes them across the lake in boats.","at":"ss6","v":1},
  {"t":"Lives in a wooden hut at the edge of the forest with his boarhound, Fang. Has Harry to tea.","at":"ss8","v":1},
  {"t":"Lets slip that the three-headed dog is his, is called Fluffy, and that what it guards is between Dumbledore and Nicolas Flamel.","at":"ss11","v":1},
  {"t":"Whittles Harry a wooden flute for Christmas.","at":"ss12","v":1},
  {"t":"Wins a dragon egg at cards from a stranger in the village pub, and hatches it in his hut.","at":"ss14","v":1},
  {"t":"Takes the detention into the forest to look for an injured unicorn.","at":"ss15","v":1},
  {"t":"Told the stranger, over drinks, that Fluffy goes to sleep to music.","at":"ss16","v":1},
  {"t":"Blames himself for it. Gives Harry an album of wizard photographs of his parents.","at":"ss17","v":1},
  {"t":"Finds Harry in Knockturn Alley, where he was buying something to keep slugs off the school cabbages.","at":"cs4","v":1},
  {"t":"Explains what the word Malfoy used means.","at":"cs7","v":1},
  {"t":"Brings Dumbledore a dead rooster, the second killed this term, and tells him Harry cannot be behind the attacks.","at":"cs12","v":1},
  {"t":"In Riddle's memory he is a big third-year boy hiding a creature in a cupboard, and is blamed for a girl's death.","at":"cs13","v":1},
  {"t":"Arrested by Fudge because of his record and taken to Azkaban. Tells Harry and Ron, hidden in the room, to follow the spiders.","at":"cs14","v":1},
  {"t":"Innocent. He raised Aragog, who never killed anyone.","at":"cs15","v":1},
  {"t":"Released, and arrives at the feast in the small hours.","at":"cs18","v":1},
  {"t":"Made a teacher. Hears the applause and has to wipe his eyes on the tablecloth.","at":"pa5","v":1},
  {"t":"Crushed when his first lesson goes wrong.","at":"pa6","v":1},
  {"t":"Tells the table at the Three Broomsticks how he took Harry out of the ruins, and met Sirius Black there, who lent him his motorcycle.","at":"pa10","v":1},
  {"t":"Goes to pieces over Buckbeak's trial. Could not bear to be sent back to Azkaban.","at":"pa11","v":1},
  {"t":"Tells Harry and Ron he thought they would value a friend above a broomstick or a rat.","at":"pa14","v":1},
  {"t":"Sings his way back to the castle when Buckbeak escapes.","at":"pa21","v":1},
  {"t":"Breeds Blast-Ended Skrewts and sets the fourth years to raising them.","at":"gf13","v":1},
  {"t":"Shows Harry the dragons the night before he is meant to know.","at":"gf19","v":1},
  {"t":"Half giant. His mother was a giantess, who left when he was three. His father, a small wizard, raised him and died in his second year at school.","at":"gf23","v":1},
  {"t":"The newspaper names his mother as the giantess Fridwulfa.","at":"gf24","v":1},
  {"t":"Shuts himself in after the article, until Dumbledore refuses his resignation.","at":"gf24","v":1},
  {"t":"Sent on a mission with Madame Maxime over the summer.","at":"gf36","v":1},
  {"t":"Back in November covered in cuts. He and Madame Maxime reached the giants and lost them to the Death Eaters.","at":"op20","v":1},
  {"t":"Teaches Thestrals, with Umbridge taking notes.","at":"op21","v":1},
  {"t":"Has been hiding his half-brother in the forest.","at":"op30","v":1},
  {"t":"Shrugs off the Aurors' Stunners and escapes into the dark.","at":"op31","v":1},
  {"t":"Hurt that the three have dropped his subject. Aragog is dying.","at":"hb11","v":1},
  {"t":"Buries Aragog behind his hut, with Slughorn giving the eulogy.","at":"hb22","v":1},
  {"t":"His hut is set on fire with Fang inside. Carries Dumbledore's body.","at":"hb28","v":1},
  {"t":"Carries Harry on Sirius's old motorcycle, as he did sixteen years before.","at":"dh4","v":1},
  {"t":"A prisoner in Voldemort's camp, forced to watch.","at":"dh34","v":1},
  {"t":"Made to carry Harry's body out of the forest.","at":"dh36","v":1}]},
 {"id":"quirrell","kind":"person","g":"m","name":"Professor Quirrell","appear":"ss5","tag":[{"t":"A Hogwarts teacher","at":"ss5"},{"t":"Defense Against the Dark Arts teacher","at":"ss8"},{"t":"Died when Voldemort left him","at":"ss17","state":"fallen"}],"rel":["voldemort","snape","harry","troll","stone","staff","followers","dada"],"relAt":{"voldemort":"ss17","troll":"ss17","stone":"ss17","followers":"ss17"},"facts":[
  {"t":"A pale, twitchy young man with a stammer. Harry meets him in the Leaky Cauldron.","at":"ss5","v":1},
  {"t":"Said to have been fine while he studied from books, and to have come back from a year of field experience afraid of everything.","at":"ss5","v":1},
  {"t":"Wears a large purple turban at school.","at":"ss7","v":1},
  {"t":"Teaches Defense Against the Dark Arts. His classroom reeks of garlic, said to be against a vampire he met in Romania. He says the turban was a gift from an African prince.","at":"ss8","v":1},
  {"t":"Runs into the Halloween feast to say there is a troll in the dungeons, and faints.","at":"ss10","v":1},
  {"t":"Harry overhears Snape cornering him in the forest about getting past the three-headed dog.","at":"ss13","v":1},
  {"t":"Heard whimpering in an empty classroom, as if someone is threatening him.","at":"ss15","v":1},
  {"t":"His protection for the Stone is a troll.","at":"ss16","v":1},
  {"t":"The one who was after the Stone all along. The stammer was an act.","at":"ss17","v":1},
  {"t":"Met Voldemort on his travels and now carries him: Voldemort's face is on the back of his head, under the turban.","at":"ss17","v":1},
  {"t":"Let the troll in at Halloween, jinxed Harry's broom, and drank the unicorn blood for his master.","at":"ss17","v":1},
  {"t":"Robbed Gringotts for Voldemort, too late: the vault had been emptied that day.","at":"ss17","v":1},
  {"t":"Burns wherever he touches Harry. Voldemort abandons him and he dies.","at":"ss17","v":1}]},
 {"id":"snape","kind":"person","g":"m","name":[{"t":"Professor Snape","at":"ss7"},{"t":"Severus Snape","at":"ss9"}],"appear":"ss7","tag":[{"t":"A Hogwarts teacher","at":"ss7"},{"t":"Potions master, head of Slytherin","at":"ss8"},{"t":"Defense Against the Dark Arts teacher","at":"hb8"},{"t":"Killed Dumbledore, and fled","at":"hb27","state":"away"},{"t":"Headmaster of Hogwarts","at":"dh12"},{"t":"Killed by Voldemort's snake","at":"dh32","state":"fallen"}],"rel":["harry","quirrell","james","draco","slytherin","staff","potions","dungeons","expelliarmus","lupin","sirius","wolfsbane","marauders","karkaroff","followers","dark_mark","order","occlumency","lily","pensieve","spinners_end","vow","narcissa","bellatrix","pettigrew","prophecy","prince","sectumsempra","eileen","dumbledore","petunia","sword"],"relAt":{"quirrell":"ss13","james":"op28","slytherin":"ss8","sirius":"pa18","marauders":"pa18","followers":"gf30","dark_mark":"gf36","occlumency":"op24","lily":"dh33","pensieve":"op28","narcissa":"hb2","bellatrix":"hb2","pettigrew":"hb2","prophecy":"hb25","prince":"hb28","sectumsempra":"hb28","eileen":"hb30","draco":"hb2","dumbledore":"dh33","petunia":"dh33","sword":"dh19"},"facts":[
  {"t":"A teacher with greasy black hair, a hooked nose and sallow skin. Harry's scar hurts for the first time while looking his way.","at":"ss7","v":1},
  {"t":"Teaches Potions and is said to want the Defense Against the Dark Arts job.","at":"ss7","v":1},
  {"t":"Head of Slytherin, and favors his own house. Teaches in the dungeons.","at":"ss8","v":1},
  {"t":"Fires questions at Harry in the first lesson that no first year could answer, then takes points from him.","at":"ss8","v":1},
  {"t":"Limping. Harry sees Filch bandaging his mangled leg and hears him complain about keeping an eye on three heads at once.","at":"ss11","v":1},
  {"t":"Seen muttering without blinking while Harry's broom bucks. Hermione sets his robes on fire, and the broom steadies.","at":"ss11","v":1},
  {"t":"Referees the Hufflepuff match. Afterwards Harry overhears him pressing Quirrell in the forest.","at":"ss13","v":1},
  {"t":"His protection for the Stone is a logic puzzle with seven bottles.","at":"ss16","v":1},
  {"t":"Was not after the Stone. He was muttering a countercurse at the match and refereed the next one to keep Harry safe.","at":"ss17","v":1},
  {"t":"Hated Harry's father at school. James saved his life, and Dumbledore thinks Snape protected Harry to be even with him.","at":"ss17","v":1},
  {"t":"Catches Harry and Ron after the crash and argues for their expulsion.","at":"cs5","v":1},
  {"t":"Disarms Lockhart with visible pleasure at the duelling club.","at":"cs11","v":1},
  {"t":"Gives Harry a shrewd, calculating look when he speaks to the snake.","at":"cs11","v":1},
  {"t":"Looks at Lupin with loathing at the feast. Everyone knows he wanted the job.","at":"pa5","v":1},
  {"t":"Brews Lupin a potion every month and watches him drink it.","at":"pa8","v":1},
  {"t":"Covers Lupin's class and sets werewolves.","at":"pa9","v":1},
  {"t":"Finds Harry's head was seen in Hogsmeade, turns out his pockets, and is insulted by the map.","at":"pa14","v":1},
  {"t":"Nearly walked into a werewolf at school because of Sirius. Knew Lupin's secret from then on and was forbidden to tell.","at":"pa18","v":1},
  {"t":"Follows Lupin to the Shack under Harry's Cloak, will not listen to a word, and is knocked out by three Disarming Charms at once.","at":"pa19","v":1},
  {"t":"Tells Fudge the children were bewitched by Black, and is promised an Order of Merlin.","at":"pa21","v":1},
  {"t":"When Sirius escapes, lets slip to his house over breakfast that Lupin is a werewolf.","at":"pa22","v":1},
  {"t":"Looks at Hermione's cursed teeth and says he sees no difference.","at":"gf18","v":1},
  {"t":"Finds his office has been broken into, and is sure Harry has been stealing Polyjuice ingredients.","at":"gf25","v":1},
  {"t":"Was part of a Slytherin gang at school who nearly all became Death Eaters. Sirius has never heard him accused of being one.","at":"gf27","v":1},
  {"t":"He was one. Dumbledore told the court that Snape changed sides before Voldemort fell and spied for him at great risk.","at":"gf30","v":1},
  {"t":"Shows Fudge his Dark Mark. Then, pale, leaves on some errand Dumbledore asks of him.","at":"gf36","v":1},
  {"t":"Reports to the Order at Grimmauld Place. Never stays to eat.","at":"op4","v":1},
  {"t":"Told to teach Harry Occlumency. He and Sirius nearly draw wands on each other over it.","at":"op24","v":1},
  {"t":"Harry's Shield Charm rebounds, and he sees scraps of Snape's childhood: a shouting man, a crying woman, a lonely boy.","at":"op26","v":1},
  {"t":"His worst memory: hung upside down by James Potter in front of a crowd after an exam. When Lily Evans stands up for him, he calls her a Mudblood.","at":"op28","v":1},
  {"t":"Catches Harry in the Pensieve, throws him out, and stops the lessons.","at":"op28","v":1},
  {"t":"Gives no sign of understanding when Harry shouts a coded warning in front of Umbridge.","at":"op32","v":1},
  {"t":"Understood it perfectly, and alerted the Order.","at":"op37","v":1},
  {"t":"Tells Bellatrix he has been spying on Dumbledore for Voldemort for sixteen years, and that Dumbledore's great weakness is believing the best of people.","at":"hb2","v":1},
  {"t":"Makes the Unbreakable Vow.","at":"hb2","v":1},
  {"t":"Gets the job he has wanted since he arrived.","at":"hb8","v":1},
  {"t":"Tells Draco he swore to protect him, and is told to stay out of it.","at":"hb15","v":1},
  {"t":"It was Snape who stopped the curse of the ring from killing Dumbledore outright.","at":"hb23","v":1},
  {"t":"He was the eavesdropper at the Hog's Head. He took the first half of the prophecy to Voldemort, and so set him on the Potters.","at":"hb25","v":1},
  {"t":"Dumbledore says he had no idea whom it meant, and that his horror when he found out was why he changed sides.","at":"hb25","v":1},
  {"t":"Comes up the tower stairs, looks at Dumbledore with revulsion, and kills him with the Killing Curse.","at":"hb27","v":1},
  {"t":"Fights his way out with Draco, parrying Harry without hurting him. Says he is the Half-Blood Prince, and will not be called a coward.","at":"hb28","v":1},
  {"t":"Gives Voldemort the true date of Harry's departure.","at":"dh1","v":1},
  {"t":"His curse takes off George's ear.","at":"dh5","v":1},
  {"t":"Made head of Hogwarts.","at":"dh12","v":1},
  {"t":"Sends three students who tried to steal the sword to work with Hagrid, which is hardly a punishment.","at":"dh15","v":1},
  {"t":"Driven out of the castle by McGonagall, Flitwick and Sprout.","at":"dh30","v":1},
  {"t":"Killed on Voldemort's order for the sake of the wand. Gives Harry his memories, and asks him to look at him.","at":"dh32","v":1},
  {"t":"Grew up poor near Lily Evans, was the first to tell her she was a witch, and loved her all his life. Lost her friendship when he called her a Mudblood.","at":"dh33","v":1},
  {"t":"When he learned whom the prophecy threatened, he begged Voldemort to spare her, and then went to Dumbledore and promised anything.","at":"dh33","v":1},
  {"t":"After she died he agreed to protect her son, on condition nobody ever knew. Everything since was that.","at":"dh33","v":1},
  {"t":"Killed Dumbledore at Dumbledore's request. As headmaster he shielded the students as far as he could.","at":"dh33","v":1},
  {"t":"His Patronus is a doe, the same as hers. He sent it to lead Harry to the sword. The curse that hit George was aimed at a Death Eater.","at":"dh33","v":1},
  {"t":"Harry tells Voldemort, in front of everyone, whose man Snape was.","at":"dh36","v":1},
  {"t":"Harry names a son for him.","at":"dh37","v":1}]},
 {"id":"flitwick","kind":"person","g":"m","name":"Professor Flitwick","appear":"ss8","tag":[{"t":"Charms teacher","at":"ss8"}],"rel":["staff","charms","leviosa","keys"],"facts":[
  {"t":"Teaches Charms. So small that he stands on a stack of books to see over his desk.","at":"ss8","v":1},
  {"t":"Sets the class to making feathers fly at Halloween.","at":"ss10","v":1},
  {"t":"His protection for the Stone is a room of winged keys.","at":"ss16","v":1},
  {"t":"Explains the Fidelius Charm to Madam Rosmerta.","at":"pa10","v":1},
  {"t":"Clears the twins' swamp in seconds, leaving one small patch as a memorial.","at":"op38","v":1},
  {"t":"Casts the protections round the castle.","at":"dh30","v":1}]},
 {"id":"sprout","kind":"person","g":"f","name":"Professor Sprout","appear":"ss8","tag":[{"t":"Herbology teacher","at":"ss8"}],"rel":["staff","herbology","snare","greenhouses","mandrakes","willow"],"facts":[
  {"t":"A dumpy little witch who teaches Herbology in the greenhouses.","at":"ss8","v":1},
  {"t":"Her protection for the Stone is Devil's Snare.","at":"ss16","v":1},
  {"t":"Bandages the Whomping Willow and teaches the second years to repot Mandrakes.","at":"cs6","v":1},
  {"t":"Arms the students with Mandrakes and worse.","at":"dh30","v":1}]},
 {"id":"binns","kind":"person","g":"m","name":"Professor Binns","appear":"ss8","tag":[{"t":"History of Magic teacher","at":"ss8"}],"rel":["staff","ghosts","history"],"sub":"Ghost","facts":[
  {"t":"The only teacher who is a ghost. Is said to have fallen asleep in the staffroom one day and got up to teach without his body.","at":"ss8","v":1},
  {"t":"His History of Magic lessons are the dullest in the school.","at":"ss8","v":1},
  {"t":"Wakes up enough to tell the class the legend of the Chamber, and insists it is a myth.","at":"cs9","v":1}]},
 {"id":"hooch","kind":"person","g":"f","name":"Madam Hooch","appear":"ss7","tag":[{"t":"A Hogwarts teacher","at":"ss7"},{"t":"Flying teacher, Quidditch referee","at":"ss9"}],"rel":["staff","flying","pitch"],"facts":[
  {"t":"The person to see about playing for a house team.","at":"ss7","v":1},
  {"t":"Teaches the first years to fly. Short gray hair and yellow eyes like a hawk.","at":"ss9","v":1},
  {"t":"Takes Neville to the hospital wing and forbids anyone to fly while she is gone.","at":"ss9","v":1},
  {"t":"Referees the Gryffindor and Slytherin match.","at":"ss11","v":1}]},
 {"id":"filch","kind":"person","g":"m","name":[{"t":"Mr. Filch","at":"ss7"},{"t":"Argus Filch","at":"ss8"}],"appear":"ss7","tag":[{"t":"Caretaker of Hogwarts","at":"ss7"}],"rel":["norris","peeves","staff","snape","decrees"],"facts":[
  {"t":"The caretaker. Keeps a list of things students may not do.","at":"ss7","v":1},
  {"t":"Knows the castle's secret passages better than almost anyone and appears wherever there is trouble. The students all dislike him.","at":"ss8","v":1},
  {"t":"Nearly catches Harry and the others in the trophy room at midnight.","at":"ss9","v":1},
  {"t":"Bandages Snape's leg in the staffroom.","at":"ss11","v":1},
  {"t":"Catches Harry and Hermione coming down from the tower.","at":"ss14","v":1},
  {"t":"Marches the detention down to Hagrid, talking fondly of the days when students were hung up by their wrists.","at":"ss15","v":1},
  {"t":"Harry sees a letter on his desk about a beginners' course in magic by post.","at":"cs8","v":1},
  {"t":"A Squib: born to wizards, with no magic of his own. Sure Harry attacked his cat because Harry knows it.","at":"cs9","v":1},
  {"t":"Delighted with the new regime, which has promised him whips.","at":"op28","v":1}]},
 {"id":"pomfrey","kind":"person","g":"f","name":"Madam Pomfrey","appear":"ss1","tag":[{"t":"Mentioned by Dumbledore","at":"ss1"},{"t":"The Hogwarts nurse","at":"ss9"}],"rel":["staff","hospital","skelegro"],"facts":[
  {"t":"Dumbledore mentions that she admires his earmuffs.","at":"ss1","v":1},
  {"t":"Runs the hospital wing. Mends Neville's wrist in about a minute.","at":"ss9","v":1},
  {"t":"Treats Ron's dragon bite without being told what bit him.","at":"ss14","v":1},
  {"t":"Keeps Harry in bed after the trapdoor and is strict about visitors.","at":"ss17","v":1},
  {"t":"Would rather mend bones than regrow them, and says so about Lockhart.","at":"cs10","v":1},
  {"t":"Looks after Hermione behind curtains, with no questions asked.","at":"cs12","v":1},
  {"t":"Approves of a Defense teacher who knows his remedies.","at":"pa5","v":1},
  {"t":"Tries to keep everyone but the patients out of her ward, with no success.","at":"pa21","v":1},
  {"t":"Shrinks Hermione's teeth.","at":"gf18","v":1},
  {"t":"Has Harry, the real Moody and a great many visitors on her hands.","at":"gf36","v":1},
  {"t":"Says thoughts can leave deeper scars than almost anything.","at":"op38","v":1}]},
 {"id":"pince","kind":"person","g":"f","name":"Madam Pince","appear":"ss12","tag":[{"t":"The Hogwarts librarian","at":"ss12"}],"rel":["staff","library"],"facts":[
  {"t":"Chases Harry out of the library with a feather duster when he hangs about the Restricted Section.","at":"ss12","v":1}]},
 {"id":"ron","kind":"person","g":"m","name":"Ron Weasley","appear":"ss6","tag":[{"t":"On his way to Hogwarts","at":"ss6"},{"t":"First-year Gryffindor","at":"ss7"},{"t":"Second-year Gryffindor","at":"cs5"},{"t":"Third-year Gryffindor","at":"pa5"},{"t":"Fourth-year Gryffindor","at":"gf12"},{"t":"Fifth-year Gryffindor, prefect","at":"op9"},{"t":"Fifth-year Gryffindor, prefect and Keeper","at":"op13"},{"t":"Sixth-year Gryffindor, prefect and Keeper","at":"hb8"},{"t":"On the run","at":"dh4"},{"t":"Nineteen years later","at":"dh37"}],"rel":["harry","hermione","scabbers","fred","george","percy","ginny","mrs_weasley","charlie","gryffindor","chess","arthur","anglia","rons_wand","burrow","errol","pig","pettigrew","krum","padma","lavender","felix","putouter"],"relAt":{"gryffindor":"ss7","pettigrew":"pa19","lavender":"hb14","putouter":"dh7","hermione":"dh31"},"facts":[
  {"t":"Tall and gangly, with red hair, freckles and a long nose. The sixth of his family to go to Hogwarts.","at":"ss6","v":1},
  {"t":"Everything he owns is handed down: Bill's robes, Charlie's wand, Percy's rat.","at":"ss6","v":1},
  {"t":"Grew up in the wizarding world and explains it to Harry, starting with the cards in Chocolate Frogs.","at":"ss6","v":1},
  {"t":"Sorted into Gryffindor like all his brothers.","at":"ss7","v":1},
  {"t":"Agrees to be Harry's second for the midnight duel.","at":"ss9","v":1},
  {"t":"His remark about Hermione having no friends sends her off in tears. He then knocks out the troll with its own club, using the spell she had been correcting him on.","at":"ss10","v":1},
  {"t":"Stays at school for Christmas because his parents are visiting Charlie. Teaches Harry wizard chess.","at":"ss12","v":1},
  {"t":"In the Mirror of Erised he sees himself alone, as Head Boy and Quidditch captain, holding the House Cup.","at":"ss12","v":1},
  {"t":"Bitten by Norbert. His hand swells to twice its size and he ends up in the hospital wing.","at":"ss14","v":1},
  {"t":"Takes charge on the giant chessboard and lets himself be taken so that Harry can give checkmate.","at":"ss16","v":1},
  {"t":"Awarded fifty points for the chess game.","at":"ss17","v":1},
  {"t":"Flies his father's car to Surrey with the twins because Harry has not answered a single letter.","at":"cs3","v":1},
  {"t":"Breaks his wand in the crash.","at":"cs5","v":1},
  {"t":"Gets a Howler from his mother about the car.","at":"cs6","v":1},
  {"t":"Tries to curse Malfoy for what he called Hermione, and ends up belching slugs.","at":"cs7","v":1},
  {"t":"Terrified of spiders, and follows them into the forest anyway.","at":"cs15","v":1},
  {"t":"Cut off from Harry by a rockfall in the tunnel, and digs a way through while he waits.","at":"cs16","v":1},
  {"t":"Given a Special Award for Services to the School, with Harry.","at":"cs18","v":1},
  {"t":"In Egypt for the summer. Makes his first telephone call, by shouting.","at":"pa1","v":1},
  {"t":"Has a new wand.","at":"pa4","v":1},
  {"t":"Stops speaking to Hermione over the Firebolt and then over Scabbers.","at":"pa12","v":1},
  {"t":"Wakes to see Sirius Black slashing his bed curtains.","at":"pa13","v":1},
  {"t":"Dragged under the Whomping Willow by the dog. His leg is broken.","at":"pa17","v":1},
  {"t":"Has to accept that his pet of three years is a grown man.","at":"pa19","v":1},
  {"t":"Given a tiny owl by Sirius.","at":"pa22","v":1},
  {"t":"Idolises Viktor Krum.","at":"gf5","v":1},
  {"t":"His dress robes are secondhand, maroon and trimmed with lace.","at":"gf10","v":1},
  {"t":"Believes Harry entered himself and kept it from him. The two stop speaking for weeks.","at":"gf17","v":1},
  {"t":"After seeing the dragon, says whoever put Harry's name in wants him dead.","at":"gf20","v":1},
  {"t":"Spends the Yule Ball glaring at Hermione and Krum, and accuses her of consorting with the enemy.","at":"gf23","v":1},
  {"t":"The hostage Harry would miss most.","at":"gf26","v":1},
  {"t":"Made a prefect, to everyone's surprise including his own. Asks for a new broom as a reward.","at":"op9","v":1},
  {"t":"Tries out in secret and becomes Gryffindor's Keeper.","at":"op13","v":1},
  {"t":"Falls apart in his first match, with the Slytherins singing a song about him.","at":"op19","v":1},
  {"t":"Saves everything in the final match, and the song changes sides.","at":"op30","v":1},
  {"t":"Hit by a spell that leaves him giggling, and attacked by a brain from the tank, which wraps him in its tentacles.","at":"op35","v":1},
  {"t":"Keeps his place as Keeper by a whisker.","at":"hb11","v":1},
  {"t":"Furious to find Ginny kissing Dean, and stung to learn Hermione once kissed Krum. Takes up with Lavender Brown within the day.","at":"hb14","v":1},
  {"t":"Turns seventeen. Is dosed with love potion and then poisoned, and spends weeks in the hospital wing.","at":"hb18","v":1},
  {"t":"Says Hermione's name in his sleep.","at":"hb19","v":1},
  {"t":"Lets Lavender break up with him.","at":"hb22","v":1},
  {"t":"Tells Harry that he and Hermione are coming with him, wherever it is.","at":"hb30","v":1},
  {"t":"Has dressed the attic ghoul in his pajamas, as himself ill in bed, so that his family is not punished for his absence.","at":"dh6","v":1},
  {"t":"Left the Deluminator.","at":"dh7","v":1},
  {"t":"Splinched in the escape from the Ministry.","at":"dh14","v":1},
  {"t":"Leaves, after a row, with the locket round his neck making everything worse. Regrets it at once and cannot get back.","at":"dh15","v":1},
  {"t":"Returns in time to pull Harry out of the pool. The locket shows him his worst fears, and he destroys it.","at":"dh19","v":1},
  {"t":"Thinks of the basilisk fangs, and gets into the Chamber by copying Harry's hiss. Says the house-elves should be got out, and is kissed.","at":"dh31","v":1},
  {"t":"Married to Hermione, with a daughter and a son.","at":"dh37","v":1}]},
 {"id":"hermione","kind":"person","g":"f","name":"Hermione Granger","appear":"ss6","tag":[{"t":"On her way to Hogwarts","at":"ss6"},{"t":"First-year Gryffindor","at":"ss7"},{"t":"Second-year Gryffindor","at":"cs5"},{"t":"Petrified","at":"cs14","state":"away"},{"t":"Revived","at":"cs18"},{"t":"Third-year Gryffindor","at":"pa5"},{"t":"Fourth-year Gryffindor","at":"gf12"},{"t":"Fifth-year Gryffindor, prefect","at":"op9"},{"t":"Sixth-year Gryffindor, prefect","at":"hb8"},{"t":"On the run","at":"dh4"},{"t":"Nineteen years later","at":"dh37"}],"rel":["harry","ron","neville","gryffindor","alohomora","bluefire","bodybind","polyjuice","lockhart","crookshanks","time_turner","spew","krum","skeeter","winky","da","quibbler","slug_club","eileen","beaded_bag","beedle"],"relAt":{"gryffindor":"ss7","time_turner":"pa21","krum":"gf23","da":"op16","quibbler":"op25","eileen":"hb25","ron":"dh31"},"facts":[
  {"t":"Bushy brown hair, large front teeth and a bossy voice. Nobody else in her family is magic.","at":"ss6","v":1},
  {"t":"Has learned all the set books by heart before term starts.","at":"ss6","v":1},
  {"t":"Sorted into Gryffindor.","at":"ss7","v":1},
  {"t":"The only one to make any progress in the first Transfiguration lesson.","at":"ss8","v":1},
  {"t":"Follows Harry and Ron to stop the midnight duel and gets locked out with them. She is the one who notices the dog is standing on a trapdoor.","at":"ss9","v":1},
  {"t":"Cornered by the troll in the girls' bathroom. Afterwards she lies to the teachers to keep Harry and Ron out of trouble, and the three are friends from then on.","at":"ss10","v":1},
  {"t":"Sets Snape's robes alight at the match to break his eye contact with Harry's broom.","at":"ss11","v":1},
  {"t":"Her parents are dentists.","at":"ss12","v":1},
  {"t":"Finds Nicolas Flamel in an old book she had taken out for light reading.","at":"ss13","v":1},
  {"t":"Loses fifty points and gets detention after Norbert.","at":"ss15","v":1},
  {"t":"Top of the year in the exams. Puts Neville in a Body-Bind, remembers how to beat Devil's Snare, and solves Snape's puzzle.","at":"ss16","v":1},
  {"t":"Awarded fifty points for cool logic.","at":"ss17","v":1},
  {"t":"Thinks Lockhart is wonderful and gets full marks on his quiz.","at":"cs6","v":1},
  {"t":"Called a Mudblood by Malfoy.","at":"cs7","v":1},
  {"t":"Asks Professor Binns about the Chamber in the middle of a lesson, and proposes the Polyjuice Potion.","at":"cs9","v":1},
  {"t":"Brews the potion perfectly and then drinks a cat hair.","at":"cs12","v":1},
  {"t":"Works out what the monster is, runs to the library, and is found Petrified with a small mirror beside her.","at":"cs14","v":1},
  {"t":"A page torn from a library book is still crumpled in her hand, with one word written on it: pipes.","at":"cs16","v":1},
  {"t":"Buys Crookshanks with her birthday money.","at":"pa4","v":1},
  {"t":"Has signed up for every new subject, on a timetable that puts three lessons at nine o'clock.","at":"pa6","v":1},
  {"t":"Notices something about the essay Snape sets, and says nothing.","at":"pa9","v":1},
  {"t":"Reports the Firebolt to McGonagall, sure it came from Sirius Black. Harry and Ron stop talking to her.","at":"pa11","v":1},
  {"t":"Worn out and tearful. Does the research for Buckbeak's defense on top of everything.","at":"pa14","v":1},
  {"t":"Slaps Malfoy across the face, and storms out of Divination for good.","at":"pa15","v":1},
  {"t":"Her Boggart in the exam is McGonagall telling her she has failed everything.","at":"pa16","v":1},
  {"t":"Has known since Snape's essay that Lupin is a werewolf.","at":"pa17","v":1},
  {"t":"Has been using a Time-Turner since September to get to all her lessons. Takes Harry back three hours with it.","at":"pa21","v":1},
  {"t":"Drops Muggle Studies, so that next year's timetable is possible without it.","at":"pa22","v":1},
  {"t":"Shocked by how Winky is treated.","at":"gf9","v":1},
  {"t":"Founds S.P.E.W.","at":"gf14","v":1},
  {"t":"Hit by a curse that makes her front teeth grow past her chin. Lets Madam Pomfrey shrink them to a little smaller than they were.","at":"gf18","v":1},
  {"t":"Drills Harry in the Summoning Charm until two in the morning.","at":"gf20","v":1},
  {"t":"Arrives at the ball with Viktor Krum, hair sleek, and is not recognised at first.","at":"gf23","v":1},
  {"t":"Krum's hostage in the lake.","at":"gf26","v":1},
  {"t":"Sent hate mail after Rita Skeeter's article, including an envelope of undiluted pus that blisters her hands.","at":"gf28","v":1},
  {"t":"Works out how Rita Skeeter gets her stories, and bottles her.","at":"gf37","v":1},
  {"t":"Made a prefect.","at":"op9","v":1},
  {"t":"Knits hats and leaves them in the common room to free house-elves by stealth. The elves stop cleaning the tower.","at":"op13","v":1},
  {"t":"Proposes that Harry teach Defense, and organises it.","at":"op15","v":1},
  {"t":"Forces Rita Skeeter, whose secret she holds, to write Harry's story straight.","at":"op25","v":1},
  {"t":"Tells Harry he has a weakness for saving people and that Voldemort knows it. Then gets them out of Umbridge's office with a made-up weapon.","at":"op32","v":1},
  {"t":"Badly hurt by Dolohov's curse.","at":"op35","v":1},
  {"t":"Ten Outstandings and one Exceeds Expectations.","at":"hb5","v":1},
  {"t":"Confunds McLaggen at the Keeper trials, for Ron's sake.","at":"hb11","v":1},
  {"t":"Sees Ron kissing Lavender, and sets a flock of conjured canaries on him.","at":"hb14","v":1},
  {"t":"Makes it up with Ron after the poisoning.","at":"hb19","v":1},
  {"t":"Finds out who the Prince's mother was.","at":"hb30","v":1},
  {"t":"Will go with Harry.","at":"hb30","v":1},
  {"t":"Has changed her parents' memories so that they believe they are a childless couple who want to live in Australia.","at":"dh6","v":1},
  {"t":"Left a book of fairy tales.","at":"dh7","v":1},
  {"t":"Gets all three away from the wedding and into Muggle London, already packed.","at":"dh9","v":1},
  {"t":"Saves Harry from the snake at Godric's Hollow. Her curse breaks his wand.","at":"dh17","v":1},
  {"t":"Tortured by Bellatrix, and sticks to her lie about the sword.","at":"dh23","v":1},
  {"t":"Goes into Gringotts as Bellatrix Lestrange.","at":"dh26","v":1},
  {"t":"Stabs the cup with a basilisk fang.","at":"dh31","v":1},
  {"t":"Married to Ron.","at":"dh37","v":1}]},
 {"id":"neville","kind":"person","g":"m","name":[{"t":"Neville","at":"ss6"},{"t":"Neville Longbottom","at":"ss7"}],"appear":"ss6","tag":[{"t":"On his way to Hogwarts","at":"ss6"},{"t":"First-year Gryffindor","at":"ss7"},{"t":"Leader of the resistance at Hogwarts","at":"dh29"},{"t":"Professor of Herbology","at":"dh37"}],"rel":["harry","hermione","trevor","gryffindor","remembrall","longbottoms","cruciatus","luna","da","bellatrix","prophecy","gran","sword","nagini","ror"],"relAt":{"gryffindor":"ss7","cruciatus":"gf30","da":"op16","bellatrix":"op25","prophecy":"op37","sword":"dh36","nagini":"dh36","ror":"dh29"},"facts":[
  {"t":"A round-faced boy who keeps losing his toad. Brought up by his grandmother.","at":"ss6","v":1},
  {"t":"Sorted into Gryffindor after a long wait. His family once thought he had no magic at all, until a great-uncle dropped him out of a window and he bounced.","at":"ss7","v":1},
  {"t":"Melts a cauldron in the first Potions lesson and comes out in boils.","at":"ss8","v":1},
  {"t":"Breaks his wrist falling off his broom in the first flying lesson.","at":"ss9","v":1},
  {"t":"Has his legs locked together by Malfoy. Later stands up to him at the match and ends up fighting Crabbe and Goyle on his own.","at":"ss13","v":1},
  {"t":"Caught out of bed trying to warn Harry and Hermione. Loses fifty points and gets detention.","at":"ss15","v":1},
  {"t":"Tries to stop the three leaving the common room, and Hermione puts him in a Body-Bind.","at":"ss16","v":1},
  {"t":"Awarded ten points for standing up to his friends, which are the points that win the House Cup.","at":"ss17","v":1},
  {"t":"Hung from a chandelier by pixies.","at":"cs6","v":1},
  {"t":"Worried about the attacks because everyone knows he is almost a Squib.","at":"cs11","v":1},
  {"t":"Lives in dread of Snape, who threatens to test a potion on his toad.","at":"pa7","v":1},
  {"t":"Wrote the passwords down because Sir Cadogan kept changing them, and lost the list. Banned from Hogsmeade, and gets a Howler from his grandmother.","at":"pa14","v":1},
  {"t":"Badly shaken by the lesson on the Cruciatus Curse. Moody takes him for tea afterwards and lends him a book on water plants.","at":"gf14","v":1},
  {"t":"Takes Ginny to the Yule Ball.","at":"gf23","v":1},
  {"t":"Brought up by his grandmother because his parents were tortured into insanity. He has never told anyone at school.","at":"gf30","v":1},
  {"t":"Has a rare cactus-like plant that squirts Stinksap.","at":"op10","v":1},
  {"t":"Met by chance on the closed ward. His mother gives him an empty sweet wrapper, and he puts it in his pocket.","at":"op23","v":1},
  {"t":"Works harder at the D.A. than anyone after the breakout.","at":"op25","v":1},
  {"t":"Fights on at the Ministry with a broken nose and his father's wand snapped. The last one standing beside Harry.","at":"op35","v":1},
  {"t":"Born at the end of July too. The prophecy could have meant him.","at":"op37","v":1},
  {"t":"Answers the D.A. coin and is hurt in the fight.","at":"hb27","v":1},
  {"t":"Helped out of the hospital wing by Luna for the funeral.","at":"hb30","v":1},
  {"t":"Bruised and cut, and cheerful about it. Has kept Dumbledore's Army going all year from the Room of Requirement.","at":"dh29","v":1},
  {"t":"Harry asks him to make sure the snake is killed.","at":"dh34","v":1},
  {"t":"Refuses Voldemort to his face. Pulls the sword of Gryffindor from the burning Sorting Hat and cuts off the snake's head.","at":"dh36","v":1},
  {"t":"Teaches Herbology at Hogwarts.","at":"dh37","v":1}]},
 {"id":"seamus","kind":"person","g":"m","name":"Seamus Finnigan","appear":"ss7","tag":[{"t":"First-year Gryffindor","at":"ss7"}],"rel":["dean","gryffindor"],"facts":[
  {"t":"Sandy-haired. The Sorting Hat takes nearly a minute over him.","at":"ss7","v":1},
  {"t":"Shares a cauldron with Neville in the first Potions lesson.","at":"ss8","v":1},
  {"t":"Sets fire to his feather in Charms.","at":"ss10","v":1},
  {"t":"His mother believes the Prophet, and so does he. He and Harry stop speaking.","at":"op11","v":1},
  {"t":"Reads the interview, apologises, and joins the D.A.","at":"op26","v":1},
  {"t":"So battered Harry does not know him until he speaks.","at":"dh29","v":1}]},
 {"id":"dean","kind":"person","g":"m","name":"Dean Thomas","appear":"ss7","tag":[{"t":"First-year Gryffindor","at":"ss7"}],"rel":["seamus","gryffindor","ginny","ted"],"relAt":{"ginny":"hb14"},"facts":[
  {"t":"A Black boy, taller than Ron.","at":"ss7","v":1},
  {"t":"Supports a Muggle soccer team, which Ron cannot make sense of.","at":"ss9","v":1},
  {"t":"Good at drawing. Paints a lion on the banner for Harry's first match.","at":"ss11","v":1},
  {"t":"Going out with Ginny, she says, mostly to annoy Ron.","at":"op38","v":1},
  {"t":"Replaces Katie Bell as Chaser. Going out with Ginny.","at":"hb14","v":1},
  {"t":"Dropped by Ginny after one argument too many.","at":"hb22","v":1},
  {"t":"On the run, unable to prove his blood status.","at":"dh15","v":1},
  {"t":"Captured and taken to Malfoy Manor. Rescued by Dobby.","at":"dh23","v":1}]},
 {"id":"lavender","kind":"person","g":"f","name":"Lavender Brown","appear":"ss7","tag":[{"t":"First-year Gryffindor","at":"ss7"}],"rel":["parvati","gryffindor","ron"],"relAt":{"ron":"hb14"},"facts":[
  {"t":"The first new Gryffindor of the year.","at":"ss7","v":1},
  {"t":"A firm believer in Professor Trelawney.","at":"pa6","v":1},
  {"t":"Her pet rabbit dies on the date Trelawney named.","at":"pa8","v":1},
  {"t":"Starts going out with Ron after the Slytherin match, and calls him by a pet name he hates.","at":"hb14","v":1},
  {"t":"Ends it when she sees him leaving the boys' dormitory alone with Hermione.","at":"hb22","v":1}]},
 {"id":"parvati","kind":"person","g":"f","name":"Parvati Patil","appear":"ss9","tag":[{"t":"First-year Gryffindor","at":"ss9"}],"rel":["lavender","gryffindor","padma"],"facts":[
  {"t":"Sticks up for Neville in the flying lesson.","at":"ss9","v":1},
  {"t":"One of the twin girls sorted in September.","at":"ss9","v":1},

  {"t":"Tries to stop the three leaving by keeping them too busy to plan.","at":"dh6","v":1},
  {"t":"Sees Bellatrix's curse miss Ginny by an inch, pushes the girls aside and kills her.","at":"dh36","v":1}]},
 {"id":"ginny","kind":"person","g":"f","name":[{"t":"Ginny Weasley","at":"ss6"},{"t":"Ginny Weasley","at":"cs3"}],"appear":"ss6","tag":[{"t":"Ron's younger sister","at":"ss6"},{"t":"First-year Gryffindor","at":"cs5"},{"t":"Taken into the Chamber","at":"cs16"},{"t":"Safe","at":"cs18"},{"t":"Second-year Gryffindor","at":"pa5"},{"t":"Third-year Gryffindor","at":"gf12"},{"t":"Fourth-year Gryffindor","at":"op10"},{"t":"Fourth-year Gryffindor, Seeker","at":"op21"},{"t":"Fifth-year Gryffindor, Chaser","at":"hb8"},{"t":"Sixth-year Gryffindor","at":"dh29"},{"t":"Nineteen years later","at":"dh37"}],"rel":["ron","mrs_weasley","diary","riddle","chamber","luna","michael","da","slug_club","arnold","harry","dean","sword"],"relAt":{"diary":"cs17","riddle":"cs17","chamber":"cs17","da":"op16","harry":"hb24","dean":"hb14","sword":"dh15"},"facts":[
  {"t":"The youngest Weasley and the only girl, too young for Hogwarts. Runs after the train, half laughing and half crying.","at":"ss6","v":1},
  {"t":"Points Harry out, squealing, when the train comes back.","at":"ss17","v":1},
  {"t":"Starting at Hogwarts this year. Goes scarlet and knocks things over whenever Harry is in the room.","at":"cs3","v":1},
  {"t":"Stands up to Malfoy in the bookshop.","at":"cs4","v":1},
  {"t":"Sorted into Gryffindor.","at":"cs5","v":1},
  {"t":"Very upset by the attack on Mrs. Norris, and looks ill for weeks.","at":"cs9","v":1},
