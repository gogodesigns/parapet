 {"id":"regulus","kind":"person","g":"m","name":"Regulus Black","appear":"op6","tag":[{"t":"Sirius's younger brother, dead","at":"op6","state":"fallen"}],"rel":["sirius","blacks","followers","rab","kreacher","locket","sea_cave"],"relAt":{"rab":"dh10","kreacher":"dh10","locket":"dh10","sea_cave":"dh10"},"facts":[
  {"t":"The good son, in his parents' eyes. Joined the Death Eaters young, got cold feet, and was killed for it some fifteen years ago.","at":"op6","v":1},
  {"t":"R.A.B.: Regulus Arcturus Black.","at":"dh10","v":1},
  {"t":"Turned on Voldemort when he learned about the Horcrux and saw how Kreacher had been used. Swapped the lockets, and was dragged under the lake by the Inferi.","at":"dh10","v":1}]},
 {"id":"phineas","kind":"person","g":"m","name":"Phineas Nigellus","appear":"op6","tag":[{"t":"A former headmaster, in a portrait","at":"op6"}],"rel":["blacks","office","grimmauld","dumbledore","beaded_bag"],"sub":"Portrait","facts":[
  {"t":"Sirius's great-great-grandfather, and by his account the least popular headmaster Hogwarts ever had.","at":"op6","v":1},
  {"t":"Has portraits both in the head's office and at Grimmauld Place, and can carry messages between them. Clever, sarcastic, and bound to serve the present head.","at":"op22","v":1},
  {"t":"Refuses to believe the last of the Blacks is dead.","at":"op37","v":1},
  {"t":"His other portrait travels in Hermione's bag, blindfolded.","at":"dh12","v":1},
  {"t":"Lets slip how the sword was used before.","at":"dh15","v":1},
  {"t":"Told Snape where the tent was.","at":"dh33","v":1}]},
 {"id":"mrs_black","kind":"person","g":"f","name":"Mrs. Black","appear":"op4","tag":[{"t":"Sirius's mother, in a portrait","at":"op4"}],"rel":["sirius","grimmauld","kreacher","blacks"],"sub":"Portrait","facts":[
  {"t":"A life-size portrait in the hall, behind moth-eaten curtains. Any noise sets her screaming about filth and blood traitors, and it cannot be taken down.","at":"op4","v":1}]},
 {"id":"kreacher","kind":"person","g":"m","name":"Kreacher","appear":"op4","tag":[{"t":"The Black family house-elf","at":"op4"}],"rel":["grimmauld","sirius","mrs_black","house_elves","blacks","narcissa","harry","regulus","locket"],"relAt":{"narcissa":"op37","harry":"hb3","regulus":"dh10","locket":"dh10"},"sub":"House-elf","owner":{"id":"harry","at":"hb3"},"facts":[
  {"t":"Very old, with folds of skin and a snout of a nose. Mutters insults under his breath as though nobody could hear.","at":"op4","v":1},
  {"t":"Devoted to his dead mistress. Rescues family relics from the bin and hoards them in his den under the boiler.","at":"op6","v":1},
  {"t":"Sirius cannot free him, since he knows too much about the Order, and treats him with contempt.","at":"op6","v":1},
  {"t":"Goes missing for a while over Christmas.","at":"op24","v":1},
  {"t":"Tells Harry through the fire that Sirius has gone to the Department of Mysteries and will not come back.","at":"op32","v":1},
  {"t":"A lie. When Sirius shouted at him to get out, he took it as leave to go to the nearest Black he respected: Narcissa Malfoy. He told the Malfoys that Harry cared for Sirius above anyone.","at":"op37","v":1},
  {"t":"Wounded Buckbeak that day so Sirius would be upstairs when Harry called.","at":"op37","v":1},
  {"t":"Left to Harry with the house. He would sooner belong to Bellatrix, but the first order he is given, he has to obey.","at":"hb3","v":1},
  {"t":"Sent to work in the Hogwarts kitchens.","at":"hb3","v":1},
  {"t":"Ordered to tail Malfoy, and does it as unhelpfully as he can.","at":"hb19","v":1},
  {"t":"Lent to Voldemort to test the cave's defenses, and left to die there. Came home because Regulus had told him to.","at":"dh10","v":1},
  {"t":"Went back with Regulus, who drank the potion himself and ordered Kreacher to leave with the locket and destroy it. He tried for years.","at":"dh10","v":1},
  {"t":"Given the fake locket as a keepsake of Regulus, he weeps, and is a different elf afterwards.","at":"dh10","v":1},
  {"t":"Leads the house-elves of Hogwarts into the battle, in Regulus's name.","at":"dh36","v":1}]},
 {"id":"doge","kind":"person","g":"m","name":"Elphias Doge","appear":"op3","tag":[{"t":"A member of the Order","at":"op3"}],"rel":["order","dumbledores"],"facts":[
  {"t":"A wheezy-voiced old wizard in the guard that collects Harry.","at":"op3","v":1},
  {"t":"Dumbledore's oldest friend, and author of his obituary.","at":"dh2","v":1},
  {"t":"Defends him at the wedding against every story.","at":"dh8","v":1}]},
 {"id":"vance","kind":"person","g":"f","name":"Emmeline Vance","appear":"op3","tag":[{"t":"A member of the Order","at":"op3"},{"t":"Murdered","at":"hb1","state":"fallen"}],"rel":["order"],"facts":[
  {"t":"A stately witch in an emerald shawl, part of the guard that collects Harry.","at":"op3","v":1},
  {"t":"Found dead not far from the Prime Minister's office.","at":"hb1","v":1}]},
 {"id":"podmore","kind":"person","g":"m","name":"Sturgis Podmore","appear":"op3","tag":[{"t":"A member of the Order","at":"op3"},{"t":"In Azkaban","at":"op14","state":"away"}],"rel":["order","dept_mysteries"],"relAt":{"dept_mysteries":"op14"},"facts":[
  {"t":"Square-jawed, with thick straw-colored hair.","at":"op3","v":1},
  {"t":"Fails to turn up for guard duty.","at":"op10","v":1},
  {"t":"Caught trying to force a top-security door at the Ministry at one in the morning, and given six months in Azkaban.","at":"op14","v":1},
  {"t":"Probably acting under the Imperius Curse.","at":"op26","v":1}]},
 {"id":"hestia","kind":"person","g":"f","name":"Hestia Jones","appear":"op3","tag":[{"t":"A member of the Order","at":"op3"}],"rel":["order"],"facts":[
  {"t":"Pink-cheeked and black-haired, part of the guard that collects Harry.","at":"op3","v":1},
  {"t":"Escorts the Dursleys into hiding.","at":"dh3","v":1}]},
 {"id":"aberforth","kind":"person","g":"m","name":"Aberforth Dumbledore","appear":"op9","tag":[{"t":"Dumbledore's brother","at":"op9"},{"t":"Barman of the Hog's Head","at":"dh28"}],"rel":["dumbledore","order","ariana","dumbledores","barman","hogs_head","mirror2","dobby"],"relAt":{"barman":"dh28","hogs_head":"dh28","mirror2":"dh28","dobby":"dh28"},"facts":[
  {"t":"In an old photograph of the first Order. Moody met him once and thought him a strange man.","at":"op9","v":1},
  {"t":"Never close to his brother, the obituary admits.","at":"dh2","v":1},
  {"t":"Broke Albus's nose at their sister's funeral.","at":"dh8","v":1},
  {"t":"The barman of the Hog's Head. He bought Sirius's mirror from Mundungus, has been watching Harry in it, and sent Dobby.","at":"dh28","v":1},
  {"t":"Ariana's favorite. Thinks Albus dropped people when he had bigger things to do, and tells Harry to save himself.","at":"dh28","v":1},
  {"t":"Fights in the battle.","at":"dh36","v":1}]},
 {"id":"barman","kind":"person","g":"m","name":[{"t":"The grumpy barman","at":"op16"}],"appear":"op16","tag":[{"t":"Keeps the pub nobody respectable drinks in","at":"op16"},{"t":"Aberforth Dumbledore","at":"dh28"}],"rel":["hogs_head","aberforth"],"relAt":{"aberforth":"dh28"},"facts":[
  {"t":"A tall, grumpy old man with a lot of long gray hair and beard. Harry thinks he looks vaguely familiar.","at":"op16","v":1},
  {"t":"Dumbledore's brother.","at":"dh28","v":1}]},
 {"id":"gran","kind":"person","g":"f","name":[{"t":"Neville's grandmother","at":"ss6"},{"t":"Mrs. Longbottom","at":"op23"}],"appear":"ss6","tag":[{"t":"Brought Neville up","at":"ss6"}],"rel":["neville","longbottoms","mungos"],"relAt":{"longbottoms":"op23","mungos":"op23"},"facts":[
  {"t":"Sees Neville onto the train and sighs over the lost toad.","at":"ss6","v":1},
  {"t":"Wears a tall hat topped with a stuffed vulture and carries a big red handbag, as the whole class learns.","at":"pa7","v":1},
  {"t":"Formidable and bony-fingered. Tells Neville he should be proud of his parents, not hide them.","at":"op23","v":1},
  {"t":"Says Neville is at last living up to his father.","at":"op38","v":1}]},
 {"id":"marietta","kind":"person","g":"f","name":[{"t":"The curly-haired friend","at":"op16"},{"t":"Marietta","at":"op18"},{"t":"Marietta Edgecombe","at":"op27"}],"appear":"op16","tag":[{"t":"Cho's friend","at":"op16"},{"t":"Betrayed the D.A.","at":"op27"}],"rel":["cho","da","ravenclaw","umbridge"],"relAt":{"umbridge":"op27"},"facts":[
  {"t":"A curly-haired Ravenclaw who comes to the Hog's Head because Cho makes her, and looks as if she would rather not.","at":"op16","v":1},
  {"t":"Tells Umbridge about the D.A. The word SNEAK breaks out across her face in purple pustules: Hermione jinxed the list they all signed.","at":"op27","v":1},
  {"t":"Her mother works at the Ministry, policing the school's fires.","at":"op27","v":1}]},
 {"id":"zacharias","kind":"person","g":"m","name":"Zacharias Smith","appear":"op16","tag":[{"t":"A Hufflepuff in the D.A.","at":"op16"}],"rel":["da","hufflepuff"],"facts":[
  {"t":"Tall, thin and blond. Demands proof that Voldemort is back before he will sign anything.","at":"op16","v":1}]},
 {"id":"michael","kind":"person","g":"m","name":"Michael Corner","appear":"op16","tag":[{"t":"A Ravenclaw in the D.A.","at":"op16"}],"rel":["da","ravenclaw","ginny"],"facts":[
  {"t":"Ginny's boyfriend. They met at the Yule Ball.","at":"op16","v":1},
  {"t":"Sulks when Gryffindor beat Ravenclaw, and Ginny drops him.","at":"op38","v":1}]},
 {"id":"anthony","kind":"person","g":"m","name":"Anthony Goldstein","appear":"op10","tag":[{"t":"A Ravenclaw prefect","at":"op10"}],"rel":["da","ravenclaw"],"facts":[
  {"t":"Made prefect with Padma Patil.","at":"op10","v":1},
  {"t":"Signs up at the Hog's Head.","at":"op16","v":1}]},
 {"id":"montague","kind":"person","g":"m","name":"Montague","appear":"op19","tag":[{"t":"Slytherin Quidditch captain","at":"op19"}],"rel":["steam","squad","slytherin","cabinet"],"facts":[
  {"t":"Built like a troll, and picks his team to match.","at":"op19","v":1},
  {"t":"Tries to dock points from the twins as a member of the Inquisitorial Squad. They shove him head-first into a cabinet, and he vanishes.","at":"op28","v":1},
  {"t":"Turns up a day later jammed in a toilet on the fourth floor, very confused.","at":"op29","v":1}]},
 {"id":"dawlish","kind":"person","g":"m","name":"Dawlish","appear":"op27","tag":[{"t":"An Auror","at":"op27"}],"rel":["aurors","ministry","fudge"],"facts":[
  {"t":"Tough-looking, with short wiry hair. Comes to help arrest Dumbledore and wakes up on the floor.","at":"op27","v":1},
  {"t":"One of the party sent to seize Hagrid.","at":"op31","v":1}]},
 {"id":"grawp","kind":"person","g":"m","name":"Grawp","appear":"op30","tag":[{"t":"Hagrid's half-brother","at":"op30"}],"rel":["hagrid","giants","forest"],"sub":"Giant","facts":[
  {"t":"A giant, sixteen feet tall, which among giants is small. Hagrid found him being bullied and dragged him home across Europe, which is where the bruises come from.","at":"op30","v":1},
  {"t":"Tied to trees deep in the forest. Hagrid asks Harry and Hermione to keep him company and teach him English if he is sacked.","at":"op30","v":1},
  {"t":"Breaks his ropes looking for Hagrid, and scatters the centaurs.","at":"op33","v":1},
  {"t":"Fights the Death Eaters' giants.","at":"dh32","v":1}]},
 {"id":"marchbanks","kind":"person","g":"f","name":"Griselda Marchbanks","appear":"op15","tag":[{"t":"Head of the examining board","at":"op15"}],"rel":["wizengamot","dumbledore"],"facts":[
  {"t":"Resigns from the Wizengamot in protest at the Ministry's interference in the school.","at":"op15","v":1},
  {"t":"Tiny, stooped and very old. She examined Dumbledore himself, and says he did things with a wand she had never seen.","at":"op31","v":1}]},
 {"id":"bode","kind":"person","g":"m","name":[{"t":"Bode","at":"op7"},{"t":"Broderick Bode","at":"op22"}],"appear":"op7","tag":[{"t":"Works in the Department of Mysteries","at":"op7"},{"t":"Killed in hospital","at":"op25","state":"fallen"}],"rel":["dept_mysteries","ministry","mungos","snare"],"relAt":{"mungos":"op23","snare":"op25"},"facts":[
  {"t":"A sallow, mournful man who shares a lift with Harry and Mr. Weasley.","at":"op7","v":1},
  {"t":"In the closed ward at St. Mungo's, unable to speak. Someone sends him a potted plant for Christmas.","at":"op23","v":1},
  {"t":"The plant was Devil's Snare, and it strangles him.","at":"op25","v":1},
  {"t":"He had been put under the Imperius Curse and sent to fetch something for Voldemort. The protection on it broke his mind.","at":"op26","v":1}]},
 {"id":"rookwood","kind":"person","g":"m","name":"Augustus Rookwood","appear":"gf30","tag":[{"t":"A Death Eater in Azkaban","at":"gf30"},{"t":"A Death Eater, escaped","at":"op25"}],"rel":["followers","dept_mysteries","voldemort"],"relAt":{"dept_mysteries":"op26"},"facts":[
  {"t":"Named by Karkaroff as Voldemort's spy inside the Ministry.","at":"gf30","v":1},
  {"t":"Pockmarked. One of the ten who break out of Azkaban.","at":"op25","v":1},
  {"t":"Used to work in the Department of Mysteries, and corrects Voldemort's plan.","at":"op26","v":1}]},
 {"id":"dolohov","kind":"person","g":"m","name":"Antonin Dolohov","appear":"gf30","tag":[{"t":"A Death Eater in Azkaban","at":"gf30"},{"t":"A Death Eater, escaped","at":"op25"}],"rel":["followers","hermione"],"relAt":{"hermione":"op35"},"facts":[
  {"t":"Named by Karkaroff at his hearing. Already caught by then.","at":"gf30","v":1},
  {"t":"Long, pale, twisted face. Convicted of the murders of Mrs. Weasley's brothers.","at":"op25","v":1},
  {"t":"Hits Hermione across the chest with a silent curse that might have killed her had he been able to speak it.","at":"op35","v":1}]},
 {"id":"thestrals","kind":"creature","name":[{"t":"The carriage horses","at":"op10"},{"t":"Thestrals","at":"op21"}],"appear":"op10","tag":[{"t":"Pull the school carriages","at":"op10"}],"rel":["hagrid","luna","harry","comc"],"sub":"Species","facts":[
  {"t":"Black, fleshless, reptile-headed horses with leathery wings and blank white eyes. Harry has never seen them before, and Ron cannot see them now.","at":"op10","v":1},
  {"t":"Visible only to people who have seen someone die. Thought unlucky, quite wrongly. Hogwarts has a tame herd.","at":"op21","v":1},
  {"t":"Drawn by the smell of blood, and with a perfect sense of direction. Six of them carry the students to London.","at":"op33","v":1},
  {"t":"Carry some of the decoys.","at":"dh4","v":1}]},
 {"id":"prophecy","kind":"magic","name":[{"t":"The weapon","at":"op5"},{"t":"The prophecy","at":"op34"}],"appear":"op5","tag":[{"t":"Something Voldemort did not have last time","at":"op5"},{"t":"Smashed","at":"op35"}],"rel":["voldemort","order","dept_mysteries","harry","trelawney","dumbledore","neville","snape"],"relAt":{"dept_mysteries":"op34","harry":"op34","trelawney":"op37","dumbledore":"op37","neville":"op37","snape":"hb25"},"group":"object","sub":"Record","facts":[
  {"t":"Sirius lets slip that Voldemort is after something he can only get by stealth. The Order is guarding it.","at":"op5","v":1},
  {"t":"A dusty glass sphere on a shelf in a vast hall of them, labelled sixteen years ago with initials, Voldemort's title and Harry's name.","at":"op34","v":1},
  {"t":"Only the people a prophecy is about can lift it from the shelf. Voldemort wanted to hear all of it, and needed Harry to fetch it.","at":"op35","v":1},
  {"t":"Broken in the fight. Nobody hears what it says.","at":"op35","v":1},
  {"t":"It was made to Dumbledore, by Sybill Trelawney, in a room above a pub. He remembers every word.","at":"op37","v":1},
  {"t":"It foretold a boy born at the end of July to parents who had three times defied Voldemort, with a power Voldemort does not know. Voldemort would mark him as his equal, and one of the two must die at the other's hand.","at":"op37","v":1},
  {"t":"Voldemort's spy heard only the beginning. Two boys fitted it. Voldemort chose the half-blood, like himself, and in attacking him gave him the scar.","at":"op37","v":1},
  {"t":"The other boy was Neville Longbottom.","at":"op37","v":1},
  {"t":"Harry is to tell Ron and Hermione.","at":"hb4","v":1},
  {"t":"The spy who carried it to Voldemort was Severus Snape.","at":"hb25","v":1},
  {"t":"Dumbledore knew it would end with Harry letting Voldemort strike.","at":"dh33","v":1}]},
 {"id":"occlumency","kind":"magic","name":"Occlumency","appear":"op24","tag":[{"t":"Closing the mind","at":"op24"}],"rel":["snape","harry","voldemort","scar","dumbledore"],"group":"lore","sub":"Mind magic","holders":[{"id":"snape","at":"op24"},{"id":"voldemort","at":"op24"},{"id":"dumbledore","at":"op24"}],"facts":[
  {"t":"The defense of the mind against being read or influenced. Its opposite, Legilimency, draws feelings and memories out of another person's head.","at":"op24","v":1},
  {"t":"Voldemort is highly skilled at Legilimency. Now that he knows Harry sees into his mind, he may try to use the link the other way.","at":"op24","v":1},
  {"t":"Harry is to clear his mind of emotion every night. He is bad at it, and the lessons leave him weaker.","at":"op24","v":1},
  {"t":"Snape ends the lessons after Harry looks into his Pensieve.","at":"op28","v":1},
  {"t":"Dumbledore says he should have taught Harry himself. He kept away for fear Voldemort would see how close they were and use Harry to get at him.","at":"op37","v":1},
  {"t":"Voldemort is now using it against Harry.","at":"hb4","v":1},
  {"t":"Draco has learned enough to keep Snape out.","at":"hb15","v":1}]},
 {"id":"decrees","kind":"magic","name":"Educational Decrees","appear":"op15","tag":[{"t":"The Ministry's rules for Hogwarts","at":"op15"}],"rel":["umbridge","fudge","ministry","filch"],"group":"lore","sub":"Law","facts":[
  {"t":"An earlier one let the Ministry appoint a teacher if the head could not find one. The newest creates a High Inquisitor with power to inspect staff.","at":"op15","v":1},
  {"t":"Number twenty-four bans every student club, society and team unless the High Inquisitor approves it.","at":"op17","v":1},
  {"t":"Another gives her the last word on all punishments.","at":"op19","v":1},
  {"t":"Teachers are forbidden to tell students anything outside their subject.","at":"op25","v":1},
  {"t":"Possession of The Quibbler becomes an expellable offense, which ensures everybody reads it.","at":"op26","v":1},
  {"t":"Number twenty-eight makes her head.","at":"op28","v":1}]},
 {"id":"blood_quill","kind":"magic","name":"Umbridge's quill","appear":"op13","tag":[{"t":"Writes in the writer's blood","at":"op13"}],"rel":["umbridge","harry"],"group":"object","sub":"Dark object","holders":[{"id":"umbridge","at":"op13"}],"facts":[
  {"t":"A long black quill with a sharp point that needs no ink. Each line Harry writes is cut into the back of his hand and appears on the page in red.","at":"op13","v":1},
  {"t":"After a week the words stay as a scar.","at":"op13","v":1}]},
 {"id":"ears","kind":"magic","name":"Extendable Ears","appear":"op4","tag":[{"t":"For listening at doors","at":"op4"}],"rel":["fred","george","wheezes"],"group":"object","sub":"Joke shop","facts":[
  {"t":"Long flesh-colored strings invented by the twins. One end goes in the ear and the other under the door.","at":"op4","v":1},
  {"t":"Used at St. Mungo's to overhear the Order discussing Harry.","at":"op22","v":1}]},
 {"id":"quibbler","kind":"magic","name":"The Quibbler","appear":"op10","tag":[{"t":"Edited by Luna's father","at":"op10"}],"rel":["luna","skeeter","harry","decrees","xeno"],"relAt":{"skeeter":"op25","harry":"op25","decrees":"op26"},"group":"object","sub":"Magazine","facts":[
  {"t":"Prints things no newspaper would touch, most of them nonsense: secret plots, creatures nobody has seen.","at":"op10","v":1},
  {"t":"Runs Harry's full account of Voldemort's return, written by Rita Skeeter for no fee. It sells out and is reprinted.","at":"op26","v":1},
  {"t":"Stops supporting Harry when Luna is taken.","at":"dh20","v":1}]},
 {"id":"mirror2","kind":"magic","name":[{"t":"Sirius's parcel","at":"op24"},{"t":"The two-way mirror","at":"op38"}],"appear":"op24","tag":[{"t":"A way to reach Sirius","at":"op24"}],"rel":["sirius","harry","aberforth"],"group":"object","sub":"Mirror","holders":[{"id":"harry","at":"op24"}],"relAt":{"aberforth":"dh28"},"facts":[
  {"t":"A badly wrapped package Sirius presses on Harry at Christmas, to use if Snape gives him trouble. Harry puts it away unopened, determined not to be what draws Sirius out.","at":"op24","v":1},
  {"t":"A small square mirror. Sirius and Harry's father used a pair to talk when they were in separate detentions. Harry finds it too late, and breaks it.","at":"op38","v":1},
  {"t":"Harry keeps one shard, and thinks he sees a blue eye in it.","at":"dh2","v":1},
  {"t":"He begs it for help from the cellar.","at":"dh23","v":1},
  {"t":"Aberforth has the other mirror.","at":"dh28","v":1}]},
 {"id":"cabinet","kind":"magic","name":"The Vanishing Cabinet","appear":"op28","tag":[{"t":"On the first floor","at":"op28"},{"t":"A passage into the school","at":"hb27"}],"rel":["montague","fred","george","draco","borgin_burkes","ror"],"group":"object","sub":"Cabinet","relAt":{"draco":"hb27","borgin_burkes":"hb27","ror":"hb27"},"facts":[
  {"t":"An old cabinet the twins push Montague into. He disappears from inside it.","at":"op28","v":1},
  {"t":"One of a pair. Montague, stuck in it, could hear both the school and the shop. Draco realised what that meant, and spent the year repairing it.","at":"hb27","v":1}]},
 {"id":"order","kind":"group","name":"The Order of the Phoenix","appear":"op3","tag":[{"t":"Those who fought Voldemort last time, and will again","at":"op3"}],"rel":["dumbledore","grimmauld","prophecy","followers","potterwatch"],"group":"org","sub":"Secret society","holders":[{"id":"moody","at":"op3"},{"id":"lupin","at":"op3"},{"id":"tonks","at":"op3"},{"id":"kingsley","at":"op3"},{"id":"doge","at":"op3"},{"id":"vance","at":"op3"},{"id":"podmore","at":"op3"},{"id":"hestia","at":"op3"},{"id":"diggle","at":"op3"},{"id":"dumbledore","at":"op4"},{"id":"sirius","at":"op4"},{"id":"arthur","at":"op4"},{"id":"mrs_weasley","at":"op4"},{"id":"bill","at":"op4"},{"id":"charlie","at":"op4"},{"id":"snape","at":"op4"},{"id":"mundungus","at":"op4"},{"id":"mcgonagall","at":"op4"},{"id":"hagrid","at":"op4"},{"id":"aberforth","at":"op9"},{"id":"james","at":"op9"},{"id":"lily","at":"op9"},{"id":"longbottoms","at":"op9"},{"id":"pettigrew","at":"op9"}],"facts":[
  {"t":"Founded and led by Dumbledore. It is working against Voldemort without the Ministry's knowledge.","at":"op4","v":1},
  {"t":"Its jobs for now: persuading people Voldemort is back, tailing known Death Eaters, and keeping a guard on something.","at":"op5","v":1},
  {"t":"Only witches and wizards who have left school may join. Molly Weasley does not want the children told anything.","at":"op5","v":1},
  {"t":"A photograph of the first Order shows how many were killed: whole families, Molly's two brothers, Harry's parents. It also shows Pettigrew, and Frank and Alice Longbottom.","at":"op9","v":1},
  {"t":"Five of its members come to the Department of Mysteries. One does not come back.","at":"op35","v":1},
  {"t":"Snape was the member who understood Harry's warning, checked that Sirius was safe, and raised the alarm.","at":"op37","v":1},
  {"t":"Has left Grimmauld Place for now.","at":"hb3","v":1},
  {"t":"Its members patrol the castle the night Dumbledore is away.","at":"hb27","v":1},
  {"t":"Moves Harry with seven decoys.","at":"dh4","v":1},
  {"t":"Comes to Hogwarts to fight.","at":"dh30","v":1}]},
 {"id":"da","kind":"group","name":[{"t":"The Defense group","at":"op16"},{"t":"Dumbledore's Army","at":"op18"}],"appear":"op16","tag":[{"t":"Harry's secret class","at":"op16"}],"rel":["harry","hermione","ror","umbridge","marietta","neville"],"group":"org","sub":"Student society","holders":[{"id":"harry","at":"op16"},{"id":"hermione","at":"op16"},{"id":"ron","at":"op16"},{"id":"ginny","at":"op16"},{"id":"neville","at":"op16"},{"id":"luna","at":"op16"},{"id":"fred","at":"op16"},{"id":"george","at":"op16"},{"id":"lee","at":"op16"},{"id":"cho","at":"op16"},{"id":"marietta","at":"op16"},{"id":"dean","at":"op16"},{"id":"lavender","at":"op16"},{"id":"parvati","at":"op16"},{"id":"padma","at":"op16"},{"id":"angelina","at":"op16"},{"id":"alicia","at":"op16"},{"id":"katie","at":"op16"},{"id":"colin","at":"op16"},{"id":"dennis","at":"op16"},{"id":"ernie","at":"op16"},{"id":"justin","at":"op16"},{"id":"hannah","at":"op16"},{"id":"susan","at":"op16"},{"id":"anthony","at":"op16"},{"id":"michael","at":"op16"},{"id":"terry","at":"op16"},{"id":"zacharias","at":"op16"},{"id":"seamus","at":"op18"}],"relAt":{"neville":"dh29","ror":"dh29"},"facts":[
  {"t":"Hermione's idea: if the teacher will not teach them to defend themselves, Harry should. About twenty-five students come to hear it and sign a list.","at":"op16","v":1},
  {"t":"Meets in the Room of Requirement and calls itself the D.A., for Dumbledore's Army, since that is the Ministry's worst fear.","at":"op18","v":1},
  {"t":"Hermione makes fake Galleons that grow warm and show the date of the next meeting, so nobody has to be seen passing messages.","at":"op18","v":1},
  {"t":"Works from Disarming up through Stunning and Shield Charms.","at":"op21","v":1},
  {"t":"Reaches the Patronus Charm on the night it is betrayed. Dumbledore says he ordered it himself, because of the name.","at":"op27","v":1},
  {"t":"Hermione calls it with the old coins. Only Neville and Luna come.","at":"hb27","v":1},
  {"t":"Revived under Neville, Ginny and Luna. It answers the coins one more time.","at":"dh29","v":1}]},
 {"id":"squad","kind":"group","name":"The Inquisitorial Squad","appear":"op28","tag":[{"t":"Umbridge's chosen students","at":"op28"}],"rel":["umbridge","draco","slytherin"],"group":"org","sub":"Student squad","holders":[{"id":"draco","at":"op28"},{"id":"pansy","at":"op28"},{"id":"montague","at":"op28"},{"id":"crabbe","at":"op28"},{"id":"goyle","at":"op28"},{"id":"millicent","at":"op32"}],"facts":[
  {"t":"Students supportive of the Ministry, hand-picked by Umbridge. They wear a silver badge and can take points even from prefects.","at":"op28","v":1},
  {"t":"They catch Harry's lookouts, who then hex their way free.","at":"op32","v":1}]},
 {"id":"blacks","kind":"group","name":"The House of Black","appear":"op6","tag":[{"t":"Sirius's family","at":"op6"}],"rel":["sirius","grimmauld","kreacher","malfoys","lestranges","andromeda"],"group":"family","sub":"Family","holders":[{"id":"sirius","at":"op6"},{"id":"regulus","at":"op6"},{"id":"mrs_black","at":"op6"},{"id":"phineas","at":"op6"},{"id":"bellatrix","at":"op6"},{"id":"narcissa","at":"op6"},{"id":"tonks","at":"op6"}],"facts":[
  {"t":"One of the oldest wizarding families, obsessed with pure blood. A tapestry in the drawing room shows the whole tree, with scorch marks where members were disowned.","at":"op6","v":1},
  {"t":"Sirius was burned off at sixteen when he ran away to the Potters. So was his cousin Andromeda, for marrying the Muggle-born Ted Tonks.","at":"op6","v":1},
  {"t":"Related by marriage to almost every pure-blood family there is: the Malfoys, the Lestranges, distantly the Weasleys.","at":"op6","v":1},
  {"t":"With Sirius dead, the line has ended. The house and elf pass to Harry.","at":"hb3","v":1},
  {"t":"Regulus, the son they were proud of, died defying Voldemort.","at":"dh10","v":1}]},
 {"id":"wizengamot","kind":"group","name":"The Wizengamot","appear":"op8","tag":[{"t":"The wizards' high court","at":"op8"}],"rel":["ministry","fudge","bones","dumbledore"],"group":"org","sub":"Court","holders":[{"id":"fudge","at":"op8"},{"id":"bones","at":"op8"},{"id":"umbridge","at":"op8"},{"id":"marchbanks","at":"op15"}],"facts":[
  {"t":"Dumbledore has been voted out as its Chief Warlock for saying Voldemort is back.","at":"op5","v":1},
  {"t":"About fifty witches and wizards in plum-colored robes. All of them sit to try one schoolboy for a Patronus.","at":"op8","v":1}]},
 {"id":"grimmauld","kind":"place","name":"Number twelve, Grimmauld Place","appear":"op3","tag":[{"t":"Headquarters of the Order of the Phoenix","at":"op3"}],"rel":["order","sirius","blacks","kreacher","mrs_black","phineas"],"type":"wizard","parent":"london","facts":[
  {"t":"Harry is shown its address on a scrap of parchment in Dumbledore's writing. Only then does the house appear, squeezing out between numbers eleven and thirteen.","at":"op3","v":1},
  {"t":"Sirius's parents' house: tall, dark and decaying, with snake-shaped fittings and a row of house-elf heads on the stairs. Sirius hates it and cannot leave.","at":"op4","v":1},
  {"t":"Dumbledore is its Secret-Keeper. The summer is spent clearing it of things that bite.","at":"op6","v":1},
  {"t":"Harry's. He would give it to the Order.","at":"hb3","v":1},
  {"t":"The three hide here for a month.","at":"dh9","v":1},
  {"t":"Lost when Yaxley is carried inside its protection.","at":"dh14","v":1}]},
 {"id":"ministry_hq","kind":"place","name":"Ministry headquarters","appear":"op7","tag":[{"t":"Under the streets of London","at":"op7"}],"rel":["ministry","dept_mysteries","fudge","arthur","commission"],"type":"wizard","parent":"london","facts":[
  {"t":"Visitors go down in a broken telephone box. The Atrium is a long hall with a dark polished floor, gilded fireplaces and a golden fountain of a wizard, a witch, a centaur, a goblin and a house-elf.","at":"op7","v":1},
  {"t":"Dumbledore and Voldemort duel in the Atrium, and the fountain is destroyed.","at":"op36","v":1},
  {"t":"A new statue in the Atrium shows a witch and wizard enthroned on carved Muggles.","at":"dh12","v":1}]},
 {"id":"dept_mysteries","kind":"place","name":"The Department of Mysteries","appear":"op7","tag":[{"t":"On level nine","at":"op7"}],"rel":["ministry_hq","prophecy","veil","bode","rookwood"],"relAt":{"prophecy":"op34","rookwood":"op26"},"type":"wizard","parent":"ministry_hq","facts":[
  {"t":"At the end of a bare corridor with a plain black door. Harry passes it on the way to his hearing, and then keeps dreaming about it.","at":"op7","v":1},
  {"t":"Those who work there are called Unspeakables, and nobody knows what they do.","at":"op24","v":1},
  {"t":"Behind the door is a round black room whose walls spin. Beyond are a tank of brains, a room of clocks, a locked door that will not open at all, and a hall of shelved glass spheres.","at":"op34","v":1},
  {"t":"The locked room holds a force more wonderful and terrible than death. Dumbledore says Harry has it in quantity.","at":"op37","v":1}]},
 {"id":"veil","kind":"place","name":"The archway","appear":"op34","tag":[{"t":"In a sunken stone chamber","at":"op34"}],"rel":["dept_mysteries","sirius","luna"],"relAt":{"sirius":"op35"},"type":"wizard","parent":"dept_mysteries","facts":[
  {"t":"An ancient stone arch on a dais, hung with a tattered black curtain that stirs with no wind. Harry and Luna can hear whispering behind it. Hermione cannot.","at":"op34","v":1},
  {"t":"Sirius falls through it and does not come out the other side.","at":"op35","v":1}]},
 {"id":"hogs_head","kind":"place","name":"The Hog's Head","appear":"op16","tag":[{"t":"The other pub in Hogsmeade","at":"op16"}],"rel":["barman","da","hogsmeade","prophecy","aberforth"],"relAt":{"prophecy":"op37","aberforth":"dh28"},"type":"wizard","parent":"hogsmeade","facts":[
  {"t":"Small, dirty and smelling of goats, with customers who keep their hoods up. Chosen for a secret meeting because students never go there.","at":"op16","v":1},
  {"t":"Where Dumbledore interviewed Sybill Trelawney sixteen years ago, and where the first part of the prophecy was overheard.","at":"op37","v":1},
  {"t":"Snape was caught eavesdropping here and thrown out.","at":"hb25","v":1},
  {"t":"A portrait of Ariana upstairs hides the only unwatched way into the school.","at":"dh28","v":1}]},
 {"id":"ror","kind":"place","name":"The Room of Requirement","appear":"op18","tag":[{"t":"Appears when it is truly needed","at":"op18"}],"rel":["da","dobby","harry","prince_book","cabinet","diadem","fiendfyre","neville","hogs_head"],"type":"castle","parent":"hogwarts","relAt":{"cabinet":"hb27","neville":"dh29","hogs_head":"dh28"},"facts":[
  {"t":"On the seventh floor, opposite a tapestry of trolls in tutus. Walk past three times thinking of what you need, and a door appears.","at":"op18","v":1},
  {"t":"For the D.A. it is a hall with cushions, bookcases of defensive magic and Dark detectors. Dobby told Harry about it.","at":"op18","v":1},
  {"t":"It cannot be opened by someone who does not know what the person inside is using it for.","at":"hb21","v":1},
  {"t":"One of its forms is a hiding place the size of a cathedral, piled with centuries of things people wanted lost.","at":"hb24","v":1},
  {"t":"Neville's hideout: hammocks, house banners, and a new passage to the Hog's Head when they needed food.","at":"dh29","v":1},
  {"t":"The room of hidden things is burned out.","at":"dh31","v":1}]},
 {"id":"slughorn","kind":"person","g":"m","name":"Horace Slughorn","appear":"hb4","tag":[{"t":"A retired Potions master","at":"hb4"},{"t":"Potions master","at":"hb8"}],"rel":["dumbledore","slug_club","staff","potions","harry","lily","riddle","horcruxes","felix"],"relAt":{"lily":"hb4","riddle":"hb17","horcruxes":"hb17"},"facts":[
  {"t":"Enormously fat, bald, with a walrus moustache and a taste for velvet and crystallized pineapple. Found squatting in a Muggle house, disguised as an armchair, a week ahead of the Death Eaters.","at":"hb4","v":1},
  {"t":"Taught at Hogwarts for decades and was head of Slytherin. Likes to collect promising students and enjoy their gratitude later. Lily Evans was a favorite.","at":"hb4","v":1},
  {"t":"Agrees to come back once he has met Harry, which was Dumbledore's intention.","at":"hb4","v":1},
  {"t":"Returns as Potions master.","at":"hb8","v":1},
  {"t":"Assumes Harry has inherited his mother's flair.","at":"hb9","v":1},
  {"t":"Taught Tom Riddle, and has doctored his own memory of one conversation with him. He is ashamed of it.","at":"hb17","v":1},
  {"t":"Gives Harry the real memory after Aragog's funeral, drunk and in tears over Lily.","at":"hb22","v":1},
  {"t":"He told a clever, charming sixteen-year-old how a Horcrux is made, thinking the question academic.","at":"hb23","v":1},
  {"t":"Leads his house out, hesitating.","at":"dh30","v":1},
  {"t":"Comes back at the head of reinforcements from the village, and duels Voldemort in emerald pajamas.","at":"dh36","v":1}]},
 {"id":"scrimgeour","kind":"person","g":"m","name":"Rufus Scrimgeour","appear":"hb1","tag":[{"t":"Minister of Magic","at":"hb1"},{"t":"Killed","at":"dh8","state":"fallen"}],"rel":["ministry","aurors","fudge","percy","harry","snitch"],"facts":[
  {"t":"Replaces Fudge. Like an old lion, with a tawny mane, yellowish eyes and a limp. Used to run the Auror office.","at":"hb1","v":1},
  {"t":"Comes to the Burrow at Christmas, using Percy as an excuse, to ask Harry to be seen about the Ministry. Harry says no, since the Ministry is jailing the wrong people for show.","at":"hb16","v":1},
  {"t":"Tries again at the funeral, and gets the same answer.","at":"hb30","v":1},
  {"t":"Has kept Dumbledore's bequests for a month, looking for hidden meanings.","at":"dh7","v":1},
  {"t":"Tortured before he died for Harry's whereabouts, and gave nothing away.","at":"dh11","v":1}]},
 {"id":"muggle_pm","kind":"person","g":"m","name":"The Muggle Prime Minister","appear":"hb1","tag":[{"t":"Would rather not know","at":"hb1"}],"rel":["fudge","scrimgeour","kingsley"],"facts":[
  {"t":"Each new one is visited once by the Minister of Magic. This one has been told that the year's disasters are a wizards' war.","at":"hb1","v":1},
  {"t":"His excellent new secretary is Kingsley Shacklebolt, placed there to guard him.","at":"hb1","v":1}]},
 {"id":"greyback","kind":"person","g":"m","name":"Fenrir Greyback","appear":"hb6","tag":[{"t":"A name Draco uses as a threat","at":"hb6"},{"t":"The most savage werewolf alive","at":"hb16"}],"rel":["werewolves","followers","lupin","bill","draco","snatchers"],"relAt":{"lupin":"hb16","bill":"hb29"},"facts":[
  {"t":"Draco tells Mr. Borgin he is a family friend who will be dropping in.","at":"hb6","v":1},
  {"t":"A werewolf who positions himself near victims before the full moon and prefers children. He bit Lupin as a small boy, to punish his father.","at":"hb16","v":1},
  {"t":"Has promised his kind prey in return for serving Voldemort.","at":"hb16","v":1},
  {"t":"Comes into the castle with the Death Eaters, uninvited by Draco.","at":"hb27","v":1},
  {"t":"Attacks Bill Weasley while in human form.","at":"hb29","v":1},
  {"t":"Catches the three with a gang of Snatchers.","at":"dh23","v":1},
  {"t":"Brought down in the battle.","at":"dh36","v":1}]},
 {"id":"marvolo","kind":"person","g":"m","name":"Marvolo Gaunt","appear":"hb10","tag":[{"t":"Voldemort's grandfather, dead","at":"hb10","state":"fallen"}],"rel":["gaunts","morfin","merope","ring","locket","salazar"],"facts":[
  {"t":"Squat and ape-like, living in filth, and prouder of his blood than of anything else. Shows a Ministry official his ring and his daughter's locket as proof of descent from Slytherin.","at":"hb10","v":1},
  {"t":"Sent to Azkaban for six months for attacking the official. Came home to find his daughter gone and died soon after.","at":"hb10","v":1}]},
 {"id":"morfin","kind":"person","g":"m","name":"Morfin Gaunt","appear":"hb10","tag":[{"t":"Voldemort's uncle","at":"hb10"},{"t":"Died in Azkaban","at":"hb17","state":"fallen"}],"rel":["gaunts","marvolo","merope","ring","riddle"],"relAt":{"riddle":"hb17"},"facts":[
  {"t":"Filthy, with eyes that look in different directions. Speaks mostly Parseltongue and nails snakes to the door. Jailed for hexing the Muggle his sister loved.","at":"hb10","v":1},
  {"t":"Years later a boy who looks like that Muggle visits him. He wakes without his father's ring, and with a clear memory of murdering the Riddles, which he boasts of to the Ministry.","at":"hb17","v":1},
  {"t":"The memory was planted. He died in prison for his nephew's crime.","at":"hb17","v":1}]},
 {"id":"merope","kind":"person","g":"f","name":"Merope Gaunt","appear":"hb10","tag":[{"t":"Voldemort's mother, dead","at":"hb10","state":"fallen"}],"rel":["gaunts","marvolo","morfin","riddle_sr","riddle","locket"],"facts":[
  {"t":"A defeated girl of eighteen, kept as a drudge and bullied until she could hardly do magic. In love with the squire's son who rides past.","at":"hb10","v":1},
  {"t":"Once her father and brother were in prison she won him, probably with a love potion, and they eloped. Dumbledore thinks she stopped dosing him and hoped he would stay. He did not.","at":"hb10","v":1},
  {"t":"Sold Slytherin's locket in London for ten Galleons. Gave birth in an orphanage on New Year's Eve, named the boy for his father and hers, and died within the hour.","at":"hb13","v":1}]},
 {"id":"riddle_sr","kind":"person","g":"m","name":"Tom Riddle senior","appear":"hb10","tag":[{"t":"Voldemort's father, a Muggle, dead","at":"hb10","state":"fallen"}],"rel":["riddles","merope","hangleton","riddle"],"facts":[
  {"t":"Handsome, rich and arrogant. Ran off with the tramp's daughter, to the village's amazement, and came home months later saying he had been hoodwinked.","at":"hb10","v":1},
  {"t":"Murdered with his parents by his sixteen-year-old son.","at":"hb17","v":1}]},
 {"id":"ogden","kind":"person","g":"m","name":"Bob Ogden","appear":"hb10","tag":[{"t":"Worked for Magical Law Enforcement","at":"hb10"}],"rel":["ministry","gaunts"],"facts":[
  {"t":"A short, plump man in thick glasses. His memory of calling on the Gaunts is the first Dumbledore shows Harry.","at":"hb10","v":1}]},
 {"id":"mrs_cole","kind":"person","g":"f","name":"Mrs. Cole","appear":"hb13","tag":[{"t":"Matron of the orphanage","at":"hb13"}],"rel":["orphanage","riddle"],"facts":[
  {"t":"Sharp, harassed and fond of gin. Tells Dumbledore the boy frightens the other children, and that nasty things happen that nobody can pin on him.","at":"hb13","v":1}]},
 {"id":"hepzibah","kind":"person","g":"f","name":"Hepzibah Smith","appear":"hb20","tag":[{"t":"A rich old witch, poisoned","at":"hb20","state":"fallen"}],"rel":["hokey","hcup","locket","riddle","helga"],"facts":[
  {"t":"Very fat, very vain, and charmed by the young man from Borgin and Burkes. Shows him her two greatest treasures: a cup that came down from Helga Hufflepuff, her ancestor, and Slytherin's locket.","at":"hb20","v":1},
  {"t":"Dead two days later. The treasures were gone, and so was the shop assistant.","at":"hb20","v":1}]},
 {"id":"hokey","kind":"person","g":"f","name":"Hokey","appear":"hb20","tag":[{"t":"Hepzibah Smith's house-elf","at":"hb20"}],"rel":["hepzibah","house_elves"],"sub":"House-elf","facts":[
  {"t":"Tiny and very old. Convicted of poisoning her mistress's cocoa by accident, because she remembered doing it.","at":"hb20","v":1}]},
 {"id":"burke","kind":"person","g":"m","name":"Caractacus Burke","appear":"hb13","tag":[{"t":"Co-founder of Borgin and Burkes","at":"hb13"}],"rel":["borgin_burkes","locket","merope"],"facts":[
  {"t":"Bought Slytherin's locket from a pregnant, desperate young witch for a fraction of its worth, and was pleased with himself.","at":"hb13","v":1}]},
 {"id":"mclaggen","kind":"person","g":"m","name":"Cormac McLaggen","appear":"hb7","tag":[{"t":"A seventh-year Gryffindor","at":"hb7"}],"rel":["slug_club","gteam","hermione","gryffindor"],"facts":[
  {"t":"Large, wiry-haired and well connected. In the Slug Club for his uncle's sake.","at":"hb7","v":1},
  {"t":"Tries out for Keeper and misses his last save by going the wrong way. Hermione had Confunded him.","at":"hb11","v":1},
  {"t":"Takes Hermione to Slughorn's party. She spends it hiding from him.","at":"hb15","v":1},
  {"t":"Fills in as Keeper, lectures everyone, grabs a Beater's bat to demonstrate and cracks Harry's skull.","at":"hb19","v":1}]},
 {"id":"romilda","kind":"person","g":"f","name":"Romilda Vane","appear":"hb7","tag":[{"t":"A fourth-year Gryffindor","at":"hb7"}],"rel":["harry","gryffindor"],"facts":[
  {"t":"Bold, dark-eyed, and keen to be seen with the Chosen One.","at":"hb7","v":1},
  {"t":"Gives Harry a box of Chocolate Cauldrons spiked with love potion.","at":"hb15","v":1}]},
 {"id":"prince","kind":"person","g":"m","name":[{"t":"The Half-Blood Prince","at":"hb9"}],"appear":"hb9","tag":[{"t":"A name in an old textbook","at":"hb9"},{"t":"Severus Snape","at":"hb28"}],"rel":["prince_book","harry","sectumsempra","snape","eileen"],"relAt":{"snape":"hb28","eileen":"hb30"},"facts":[
  {"t":"Wrote his title inside the back cover of an old Potions book, and filled every margin with corrections that work better than the printed instructions.","at":"hb9","v":1},
  {"t":"Invented spells too: one to hoist people into the air by the ankle, one to fill nearby ears with buzzing, one to glue the tongue to the roof of the mouth.","at":"hb12","v":1},
  {"t":"The book is nearly fifty years old. Lupin has never heard the name.","at":"hb16","v":1},
  {"t":"Some of his spells are for enemies.","at":"hb24","v":1},
  {"t":"Snape. He shouts it at Harry as he flees.","at":"hb28","v":1},
  {"t":"His mother was a witch named Eileen Prince and his father a Muggle. Half a Prince.","at":"hb30","v":1}]},
 {"id":"eileen","kind":"person","g":"f","name":"Eileen Prince","appear":"hb25","tag":[{"t":"A Hogwarts student, long ago","at":"hb25"},{"t":"Snape's mother","at":"hb30"}],"rel":["snape","prince"],"relAt":{"snape":"hb30","prince":"hb30"},"facts":[
  {"t":"Hermione finds her in an old school newspaper as captain of the Gobstones team, and wonders whether the Prince could be a girl.","at":"hb25","v":1},
  {"t":"Married a Muggle, Tobias Snape, and had a son.","at":"hb30","v":1}]},
 {"id":"rab","kind":"person","name":"R.A.B.","appear":"hb28","tag":[{"t":"Signed the note in the locket","at":"hb28"},{"t":"Regulus Black","at":"dh10"}],"rel":["locket","voldemort","sea_cave","regulus"],"relAt":{"regulus":"dh10"},"facts":[
  {"t":"Whoever reached the cave before Dumbledore. The note, addressed to the Dark Lord, says the writer has taken the real Horcrux, means to destroy it, and expects to be dead soon.","at":"hb28","v":1},
  {"t":"Sirius's brother.","at":"dh10","v":1}]},
 {"id":"carrows","kind":"person","name":[{"t":"The brother and sister","at":"hb27"},{"t":"Amycus and Alecto","at":"hb28"},{"t":"Amycus and Alecto Carrow","at":"dh12"}],"appear":"hb27","tag":[{"t":"Death Eaters","at":"hb27"},{"t":"Teachers at Hogwarts, in charge of discipline","at":"dh12"}],"rel":["followers","tower_ast","staff"],"relAt":{"staff":"dh12"},"facts":[
  {"t":"A lumpy, lopsided man with a wheezy giggle and his stocky little sister. They urge Draco on at the top of the tower.","at":"hb27","v":1},
  {"t":"Put on the Hogwarts staff.","at":"dh12","v":1},
  {"t":"He teaches the Dark Arts as a subject, and she teaches that Muggles are animals. Students are made to practise the Cruciatus Curse on those in detention.","at":"dh29","v":1},
  {"t":"Both end the night tied up in a net in Ravenclaw Tower.","at":"dh30","v":1}]},
 {"id":"inferi","kind":"creature","name":"Inferi","appear":"hb3","tag":[{"t":"Corpses made to obey","at":"hb3"}],"rel":["voldemort","sea_cave"],"sub":"Species","facts":[
  {"t":"A Ministry leaflet on household security warns about them.","at":"hb3","v":1},
  {"t":"Dead bodies bewitched to do a Dark wizard's bidding. Voldemort made an army of them last time.","at":"hb4","v":1},
  {"t":"Hundreds lie under the black lake in the cave. They rise when the water is touched, and they fear light and warmth.","at":"hb26","v":1}]},
 {"id":"arnold","kind":"creature","name":[{"t":"Ginny's Pygmy Puff","at":"hb6"},{"t":"Arnold","at":"hb7"}],"appear":"hb6","tag":[{"t":"Ginny's pet","at":"hb6"}],"rel":["ginny","wheezes"],"sub":"Pygmy Puff","owner":{"id":"ginny","at":"hb6"},"attrs":{"Kind":"Pygmy Puff"},"facts":[
  {"t":"A purple ball of fluff from the twins' shop that rides on her shoulder.","at":"hb6","v":1}]},
 {"id":"horcruxes","kind":"magic","name":"Horcruxes","appear":"hb17","tag":[{"t":"A word Slughorn will not discuss","at":"hb17"},{"t":"How Voldemort cannot die","at":"hb23"}],"rel":["voldemort","riddle","slughorn","diary","ring","locket","hcup","nagini","dumbledore","diadem","fiendfyre","harry"],"relAt":{"voldemort":"hb23","riddle":"hb23","diary":"hb23","ring":"hb23","locket":"hb23","hcup":"hb23","nagini":"hb23","harry":"dh33"},"group":"lore","sub":"Dark magic","facts":[
  {"t":"In the doctored memory, Riddle asks Slughorn what he knows about them and is shouted out of the room.","at":"hb17","v":1},
  {"t":"An object in which a wizard has hidden a piece of his soul. While it survives, he cannot truly die, even if his body is destroyed.","at":"hb23","v":1},
  {"t":"The soul is split by committing murder. It is the foulest magic there is, and banned even from the Restricted Section.","at":"hb23","v":1},
  {"t":"Riddle asked what would happen with more than one, and named seven as the most magical number. Dumbledore believes he meant to make six, with the seventh part staying in his body.","at":"hb23","v":1},
  {"t":"Two are gone: the diary, and a ring. Dumbledore's list of the rest is a locket, a cup, something of Ravenclaw's or Gryffindor's, and perhaps the snake.","at":"hb23","v":1},
  {"t":"They are why he survived the night at Godric's Hollow, and they must all be destroyed before he can be killed.","at":"hb23","v":1},
  {"t":"Hermione's books say very few things destroy one, and basilisk venom is among them. A Horcrux can also make itself felt on anyone who keeps it close.","at":"dh6","v":1},
  {"t":"Voldemort takes stock: ring, locket, cup, snake, and one at Hogwarts.","at":"dh27","v":1},
  {"t":"There was a seventh piece that Voldemort never meant to make. It has been in Harry since he was a baby.","at":"dh33","v":1},
  {"t":"Diary, ring, locket, cup, diadem, the piece in Harry, the snake. All gone.","at":"dh36","v":1}]},
 {"id":"ring","kind":"magic","name":[{"t":"Dumbledore's ring","at":"hb4"},{"t":"Marvolo Gaunt's ring","at":"hb10"}],"appear":"hb4","tag":[{"t":"On Dumbledore's damaged hand","at":"hb4"},{"t":"A Horcrux, destroyed","at":"hb23"}],"rel":["dumbledore","marvolo","morfin","riddle","horcruxes","stone_res","peverells"],"relAt":{"marvolo":"hb10","morfin":"hb17","riddle":"hb17","horcruxes":"hb23","stone_res":"dh22","peverells":"dh22"},"group":"object","sub":"Ring","facts":[
  {"t":"A clumsy gold ring set with a cracked black stone, on a hand that looks burned to the bone. Dumbledore will not yet say how the hand was hurt.","at":"hb4","v":1},
  {"t":"Marvolo Gaunt's heirloom. The stone is engraved with what he calls the Peverell coat of arms.","at":"hb10","v":1},
  {"t":"Riddle took it from his uncle the night he killed his father, and wore it at school.","at":"hb17","v":1},
  {"t":"He made it a Horcrux and hid it in the ruin of the Gaunt house. Dumbledore found it there last summer and broke it. A terrible curse on it withered his hand, and only Snape's quick work kept it from doing worse.","at":"hb23","v":1},
  {"t":"Its stone is the Resurrection Stone.","at":"dh22","v":1}]},
 {"id":"locket","kind":"magic","name":"Slytherin's locket","appear":"hb10","tag":[{"t":"A Gaunt heirloom","at":"hb10"},{"t":"A Horcrux","at":"hb23"},{"t":"Missing. The one in the cave was a fake","at":"hb28"},{"t":"Was at Grimmauld Place all along","at":"dh10"},{"t":"Taken from Umbridge","at":"dh13"},{"t":"Destroyed","at":"dh19"}],"rel":["salazar","merope","burke","hepzibah","riddle","horcruxes","sea_cave","rab","regulus","kreacher","umbridge","sword","ron"],"relAt":{"burke":"hb13","hepzibah":"hb20","riddle":"hb20","horcruxes":"hb23","sea_cave":"hb26","rab":"hb28","regulus":"dh10","kreacher":"dh10","umbridge":"dh11","sword":"dh19","ron":"dh19"},"group":"object","sub":"Locket","facts":[
  {"t":"A heavy gold locket marked with a serpentine S. Merope Gaunt wears it round her neck.","at":"hb10","v":1},
  {"t":"She sold it to Burke for next to nothing.","at":"hb13","v":1},
  {"t":"Hepzibah Smith paid a fortune for it. Riddle's eyes flash red when he holds it, and it vanishes when she dies.","at":"hb20","v":1},
  {"t":"Dumbledore is sure Voldemort made it a Horcrux.","at":"hb23","v":1},
  {"t":"At the bottom of a basin of potion on an island in a cave lake, there is a locket.","at":"hb26","v":1},
  {"t":"It is not Slytherin's: smaller, unmarked, with a folded note inside signed R.A.B.","at":"hb28","v":1},
  {"t":"The real one is the locket nobody could open when the house was cleaned out two summers ago. Kreacher saved it.","at":"dh10","v":1},
  {"t":"Stolen by Mundungus and taken by Umbridge.","at":"dh11","v":1},
  {"t":"Worn in turns. It beats like a second heart, and whoever has it on grows gloomy and suspicious.","at":"dh14","v":1},
  {"t":"Tries to strangle Harry in the pool. Opened, it speaks to Ron in Voldemort's voice. Ron stabs it.","at":"dh19","v":1}]},
 {"id":"hcup","kind":"magic","name":"Hufflepuff's cup","appear":"hb20","tag":[{"t":"Hepzibah Smith's treasure","at":"hb20"},{"t":"A Horcrux, whereabouts unknown","at":"hb23"},{"t":"Taken from Gringotts","at":"dh26"},{"t":"Destroyed","at":"dh31"}],"rel":["helga","hepzibah","riddle","horcruxes","bellatrix","gringotts"],"relAt":{"riddle":"hb20","horcruxes":"hb23","bellatrix":"dh26","gringotts":"dh26"},"group":"object","sub":"Cup","facts":[
  {"t":"A small golden cup with two fine handles and a badger engraved on it, said to have powers of its own. Stolen when its owner was killed.","at":"hb20","v":1},
  {"t":"Dumbledore believes it is one of the Horcruxes.","at":"hb23","v":1},
  {"t":"In the Lestrange vault, on a high shelf, among treasure that burns and multiplies when touched.","at":"dh26","v":1},
  {"t":"Stabbed with a basilisk fang by Hermione.","at":"dh31","v":1}]},
 {"id":"vow","kind":"magic","name":"The Unbreakable Vow","appear":"hb2","tag":[{"t":"A promise that kills if broken","at":"hb2"}],"rel":["snape","narcissa","bellatrix","draco"],"relAt":{"draco":"hb2"},"group":"spell","sub":"Binding magic","holders":[{"id":"snape","at":"hb2"},{"id":"narcissa","at":"hb2"}],"facts":[
  {"t":"Two people clasp hands and a third seals each promise with a tongue of flame from a wand.","at":"hb2","v":1},
  {"t":"Snape swears to Narcissa Malfoy to watch over Draco, protect him from harm, and carry out his task if he seems likely to fail. Bellatrix is the witness.","at":"hb2","v":1},
  {"t":"Whoever breaks one dies.","at":"hb16","v":1}]},
 {"id":"felix","kind":"magic","name":"Felix Felicis","appear":"hb9","tag":[{"t":"Liquid luck","at":"hb9"}],"rel":["slughorn","harry","ron","prince_book"],"relAt":{"ron":"hb14"},"group":"potion","sub":"Potion","holders":[{"id":"harry","at":"hb9"}],"facts":[
  {"t":"The color of molten gold. For a few hours everything the drinker tries goes right. Fiendish to brew, toxic in quantity and banned in competitions.","at":"hb9","v":1},
  {"t":"Slughorn offers a tiny vial as a prize, and Harry wins it using the Prince's notes.","at":"hb9","v":1},
  {"t":"Harry lets Ron think he has slipped him some before a match. Ron plays brilliantly on nothing at all.","at":"hb14","v":1},
  {"t":"Harry takes a mouthful and simply knows to go to Hagrid's. By the end of the night he has the memory.","at":"hb22","v":1},
  {"t":"He leaves the rest for Ron, Hermione and Ginny on the night he goes with Dumbledore.","at":"hb25","v":1},
  {"t":"It is why nobody on their side was killed in the fight.","at":"hb29","v":1}]},
 {"id":"amortentia","kind":"magic","name":"Love potions","appear":"hb6","tag":[{"t":"Infatuation in a bottle","at":"hb6"}],"rel":["wheezes","slughorn","romilda","merope"],"relAt":{"romilda":"hb15"},"group":"potion","sub":"Potion","facts":[
  {"t":"The twins sell a range of them, and they work.","at":"hb6","v":1},
  {"t":"The strongest is Amortentia, with a mother-of-pearl sheen and spiralling steam. It smells different to each person, of whatever attracts them most.","at":"hb9","v":1},
  {"t":"It cannot make love, only obsession. Voldemort was conceived under one.","at":"hb10","v":1},
  {"t":"Ron eats chocolates soaked in one that has had months to strengthen.","at":"hb18","v":1}]},
 {"id":"prince_book","kind":"magic","name":"The Prince's Potions book","appear":"hb9","tag":[{"t":"An old copy of Advanced Potion-Making","at":"hb9"}],"rel":["prince","harry","slughorn","hermione","snape","ror"],"relAt":{"snape":"hb28","ror":"hb24"},"group":"object","sub":"Textbook","holders":[{"id":"harry","at":"hb9"}],"facts":[
  {"t":"Harry had not bought the book, so Slughorn lends him a tattered one from a cupboard. Its handwritten notes make him top of the class.","at":"hb9","v":1},
  {"t":"Hermione distrusts it on principle. Ginny reminds him what happened last time he took advice from a book.","at":"hb9","v":1},
  {"t":"After one of its spells nearly kills Malfoy, Harry hides it in the Room of Requirement, behind a cupboard, and marks the spot with a bust wearing an old wig and tiara.","at":"hb24","v":1}]},
 {"id":"sectumsempra","kind":"magic","name":"Sectumsempra","appear":"hb21","tag":[{"t":"For enemies","at":"hb21"}],"rel":["prince","harry","draco","snape"],"relAt":{"draco":"hb24","snape":"hb28"},"group":"spell","sub":"Curse","holders":[{"id":"harry","at":"hb24"},{"id":"snape","at":"hb28"}],"facts":[
  {"t":"A word in the margin of the Prince's book, with no explanation beyond who it is for.","at":"hb21","v":1},
  {"t":"Harry uses it on Malfoy in a bathroom fight without knowing what it does. It slashes him open as if with a sword.","at":"hb24","v":1},
  {"t":"Snape arrives in moments and closes the wounds with a muttered, song-like countercurse.","at":"hb24","v":1},
  {"t":"Snape's own invention.","at":"hb28","v":1},
  {"t":"Costs George an ear.","at":"dh5","v":1}]},
 {"id":"levicorpus","kind":"magic","name":"Levicorpus","appear":"hb12","tag":[{"t":"Dangles the victim by the ankle","at":"hb12"}],"rel":["prince","harry","ron","james"],"relAt":{"james":"hb12"},"group":"spell","sub":"Jinx","holders":[{"id":"harry","at":"hb12"}],"facts":[
  {"t":"Harry tries it from the Prince's margin and wakes Ron upside down in mid-air.","at":"hb12","v":1},
  {"t":"It is the spell Harry saw his father use on Snape. Lupin says it was all the rage in their day.","at":"hb12","v":1}]},
 {"id":"nonverbal","kind":"magic","name":"Nonverbal spells","appear":"hb9","tag":[{"t":"Magic without speaking","at":"hb9"}],"rel":["snape","dada"],"group":"lore","sub":"Technique","facts":[
  {"t":"Sixth years are expected to cast without saying the words, so that an opponent has no warning.","at":"hb9","v":1},
  {"t":"Snape blocks every curse Harry throws before he can finish it, and tells him to learn to keep his mouth shut and his mind closed.","at":"hb28","v":1}]},
 {"id":"apparition","kind":"magic","name":"Apparition","appear":"gf4","tag":[{"t":"Vanishing and reappearing","at":"gf4"}],"rel":["dumbledore","harry","hogwarts"],"group":"lore","sub":"Travel","facts":[
  {"t":"How adult wizards travel. It takes a license and can go wrong.","at":"gf4","v":1},
  {"t":"Dumbledore takes Harry along by the arm. It feels like being forced through a tight rubber tube.","at":"hb3","v":1},
  {"t":"Sixth years are taught it in the Great Hall by a Ministry instructor, with the castle's protections lifted for an hour at a time.","at":"hb18","v":1},
  {"t":"Hermione passes the test. Ron fails by half an eyebrow.","at":"hb22","v":1},
  {"t":"Harry brings a helpless Dumbledore back from the cave by himself.","at":"hb26","v":1}]},
 {"id":"necklace","kind":"magic","name":"The opal necklace","appear":"hb12","tag":[{"t":"Cursed","at":"hb12"}],"rel":["borgin_burkes","katie","draco","rosmerta"],"relAt":{"rosmerta":"hb27"},"group":"object","sub":"Dark object","facts":[
  {"t":"On display at Borgin and Burkes with a card saying it has claimed the lives of nineteen Muggle owners.","at":"cs4","v":1},
  {"t":"Katie Bell is carrying it to the castle in a parcel when she touches it through a hole in her glove. She is lifted screaming into the air.","at":"hb12","v":1},
  {"t":"It was meant for someone at the school. Harry is sure Malfoy is behind it.","at":"hb12","v":1},
  {"t":"Draco had Madam Rosmerta, under the Imperius Curse, give it to a student to deliver to Dumbledore.","at":"hb27","v":1}]},
 {"id":"slug_club","kind":"group","name":"The Slug Club","appear":"hb7","tag":[{"t":"Slughorn's favorites","at":"hb7"}],"rel":["slughorn"],"group":"org","sub":"Dining club","holders":[{"id":"harry","at":"hb7"},{"id":"ginny","at":"hb7"},{"id":"mclaggen","at":"hb7"},{"id":"blaise","at":"hb7"},{"id":"neville","at":"hb7"},{"id":"hermione","at":"hb11"}],"facts":[
  {"t":"Students with famous relatives or obvious promise, invited to lunch on the train and to little suppers through the year.","at":"hb7","v":1},
  {"t":"Its Christmas party fills his office with former members, a vampire and a writer or two.","at":"hb15","v":1}]},
 {"id":"gaunts","kind":"group","name":"The Gaunts","appear":"hb10","tag":[{"t":"The last of Slytherin's line","at":"hb10"}],"rel":["salazar","marvolo","morfin","merope","riddle","ring","locket","gaunt_house","peverells"],"group":"family","sub":"Family","holders":[{"id":"marvolo","at":"hb10"},{"id":"morfin","at":"hb10"},{"id":"merope","at":"hb10"},{"id":"riddle","at":"hb10"}],"relAt":{"peverells":"dh22"},"facts":[
  {"t":"An ancient wizarding family, famous for instability and violence after generations of marrying their cousins. The gold was gone long before Marvolo, and nothing was left but pride and two heirlooms.","at":"hb10","v":1},
  {"t":"Parselmouths, all of them.","at":"hb10","v":1},
  {"t":"Descended from the second Peverell brother.","at":"dh35","v":1}]},
 {"id":"spinners_end","kind":"place","name":"Spinner's End","appear":"hb2","tag":[{"t":"Snape's house","at":"hb2"}],"rel":["snape","narcissa","bellatrix","pettigrew"],"type":"muggle","facts":[
  {"t":"The last street of brick terraces in a run-down mill town, beside a dirty river. The sitting room is walled with books. Wormtail is living there as Snape's servant.","at":"hb2","v":1},
  {"t":"Where Snape grew up, near Lily and Petunia Evans.","at":"dh33","v":1}]},
 {"id":"gaunt_house","kind":"place","name":"The Gaunt house","appear":"hb10","tag":[{"t":"A hovel in a copse","at":"hb10"}],"rel":["gaunts","ring"],"type":"muggle","parent":"hangleton","facts":[
  {"t":"Half hidden in trees outside Little Hangleton, with moss on the walls and a dead snake nailed to the door.","at":"hb10","v":1},
  {"t":"Where Riddle hid the ring, and where Dumbledore found it.","at":"hb23","v":1}]},
 {"id":"orphanage","kind":"place","name":"The orphanage","appear":"hb13","tag":[{"t":"Where Tom Riddle grew up","at":"hb13"}],"rel":["riddle","mrs_cole","merope"],"type":"muggle","parent":"london","facts":[
  {"t":"A grim, square, spotlessly clean building behind railings in London. Riddle keeps a box of things taken from other children in his wardrobe.","at":"hb13","v":1}]},
 {"id":"sea_cave","kind":"place","name":"The cave","appear":"hb26","tag":[{"t":"Where Riddle once took two orphans","at":"hb26"}],"rel":["riddle","inferi","locket","dumbledore","rab","regulus"],"relAt":{"rab":"hb28","regulus":"dh10"},"type":"muggle","facts":[
  {"t":"On a seaside outing, Riddle led two children into a cave. They were never quite right afterwards.","at":"hb13","v":1},
  {"t":"In a cliff face that can only be reached by sea. The entrance must be paid in blood. Inside is a vast black lake, a tiny boat on a chain, and an island with a stone basin of glowing green potion.","at":"hb26","v":1},
  {"t":"The potion cannot be scooped out or vanished, only drunk. Dumbledore drinks every cup, begging Harry to stop.","at":"hb26","v":1},
  {"t":"Regulus died here.","at":"dh10","v":1}]},
 {"id":"tomb","kind":"place","name":"The white tomb","appear":"hb30","tag":[{"t":"Dumbledore's grave","at":"hb30"}],"rel":["dumbledore","lake","elder_wand"],"type":"grounds","parent":"hogwarts","facts":[
  {"t":"White marble, beside the lake. He is the first head to be buried at the school.","at":"hb30","v":1},
  {"t":"Split open by Voldemort.","at":"dh24","v":1}]},
 {"id":"yaxley","kind":"person","g":"m","name":"Yaxley","appear":"dh1","tag":[{"t":"A Death Eater inside the Ministry","at":"dh1"}],"rel":["followers","ministry","thicknesse","umbridge","commission"],"facts":[
  {"t":"Brutal-faced. Has put the head of Magical Law Enforcement under the Imperius Curse.","at":"dh1","v":1},
  {"t":"Now head of that department himself.","at":"dh12","v":1},
  {"t":"Grabs hold of Hermione as she Disapparates and is carried inside the protection round Grimmauld Place.","at":"dh13","v":1}]},
 {"id":"thicknesse","kind":"person","g":"m","name":"Pius Thicknesse","appear":"dh1","tag":[{"t":"Head of Magical Law Enforcement, under the Imperius Curse","at":"dh1"},{"t":"Minister of Magic, as Voldemort's puppet","at":"dh11"}],"rel":["ministry","yaxley","voldemort"],"facts":[
  {"t":"Made Minister after Scrimgeour is killed. Voldemort stays in the shadows, so that nobody is sure whom to resist.","at":"dh11","v":1},
  {"t":"Brought down in the battle, by Percy among others.","at":"dh36","v":1}]},
 {"id":"burbage","kind":"person","g":"f","name":"Charity Burbage","appear":"dh1","tag":[{"t":"Muggle Studies teacher, murdered","at":"dh1","state":"fallen"}],"rel":["staff","voldemort","nagini"],"facts":[
  {"t":"Wrote in the Prophet that Muggle-borns are not thieves of magic. Hung in the air over the Malfoys' table, killed, and given to the snake.","at":"dh1","v":1}]},
 {"id":"ariana","kind":"person","g":"f","name":"Ariana Dumbledore","appear":"dh2","tag":[{"t":"Dumbledore's sister, died young","at":"dh2","state":"fallen"}],"rel":["dumbledore","aberforth","kendra","dumbledores","grindelwald"],"relAt":{"grindelwald":"dh18"},"facts":[
  {"t":"Died as a girl, not long after her mother. Her brother's old friend writes of it only as a tragedy.","at":"dh2","v":1},
  {"t":"Gossip says she was never seen, never went to school, and was kept locked in the cellar because she was a Squib.","at":"dh8","v":1},
  {"t":"The truth: at six she was attacked by three Muggle boys who had seen her doing magic. She would not use it afterwards, and it turned inward and burst out of her when she was upset.","at":"dh28","v":1},
  {"t":"Hidden at home so that she would not be locked up in St. Mungo's. At fourteen, in one of her fits, she killed her mother by accident.","at":"dh28","v":1},
  {"t":"Killed in a three-way fight between her brothers and Grindelwald. Nobody knows whose spell it was.","at":"dh28","v":1}]},
 {"id":"kendra","kind":"person","g":"f","name":"Kendra Dumbledore","appear":"dh2","tag":[{"t":"Dumbledore's mother, dead","at":"dh2","state":"fallen"}],"rel":["dumbledore","aberforth","ariana","dumbledores"],"facts":[
  {"t":"Moved the family to Godric's Hollow after her husband was jailed. Died just as Albus left school.","at":"dh2","v":1},
  {"t":"Killed in an accident by the daughter she was protecting.","at":"dh28","v":1}]},
 {"id":"bathilda","kind":"person","g":"f","name":"Bathilda Bagshot","appear":"dh2","tag":[{"t":"A famous historian of magic","at":"dh2"},{"t":"Dead","at":"dh17","state":"fallen"}],"rel":["dumbledores","godrics","grindelwald","skeeter","nagini"],"relAt":{"grindelwald":"dh18","nagini":"dh17"},"facts":[
  {"t":"Author of the school's history textbook and an old neighbor of the Dumbledores. Rita Skeeter got a great deal out of her.","at":"dh2","v":1},
  {"t":"Knew the Potters, too. Lily writes that she drops in with stories about Dumbledore.","at":"dh10","v":1},
  {"t":"A tiny, bent old woman who beckons to Harry and Hermione outside the ruined house.","at":"dh16","v":1},
  {"t":"She has been dead for some time. Voldemort's snake is hiding in the body, waiting for Harry.","at":"dh17","v":1},
  {"t":"Grindelwald was her great-nephew. She introduced him to Albus.","at":"dh18","v":1}]},
 {"id":"xeno","kind":"person","g":"m","name":"Xenophilius Lovegood","appear":"dh8","tag":[{"t":"Luna's father, editor of The Quibbler","at":"dh8"},{"t":"Arrested","at":"dh21","state":"away"}],"rel":["luna","quibbler","hallows","lovegood_house"],"facts":[
  {"t":"Slightly cross-eyed, with white candyfloss hair, in egg-yolk yellow robes. Wears an odd triangular symbol on a chain, which makes Viktor Krum want to hit him.","at":"dh8","v":1},
  {"t":"His magazine has been backing Harry all year. Now he is strangely unwilling to help.","at":"dh20","v":1},
  {"t":"Believes in the Deathly Hallows and explains them. Then admits the Death Eaters took Luna because of what he printed, and that he has sent for them.","at":"dh21","v":1}]},
 {"id":"muriel","kind":"person","g":"f","name":"Auntie Muriel","appear":"dh8","tag":[{"t":"Ron's great-aunt","at":"dh8"}],"rel":["weasleys","doge"],"facts":[
  {"t":"A hundred and seven, rude to everyone, and full of old gossip about the Dumbledores.","at":"dh8","v":1},
  {"t":"The Weasleys go into hiding at her house.","at":"dh24","v":1}]},
 {"id":"ted","kind":"person","g":"m","name":"Ted Tonks","appear":"op6","tag":[{"t":"Tonks's father","at":"op6"},{"t":"Killed by Snatchers","at":"dh22","state":"fallen"}],"rel":["tonks","andromeda","dean"],"relAt":{"dean":"dh15"},"facts":[
  {"t":"A Muggle-born. Andromeda Black was disowned for marrying him.","at":"op6","v":1},
  {"t":"Fair-haired and big-bellied. Patches Harry up after the crash.","at":"dh5","v":1},
  {"t":"On the run, since he will not register as Muggle-born. Camps for a night within earshot of the tent.","at":"dh15","v":1},
  {"t":"His death is reported on the secret radio program.","at":"dh22","v":1}]},
 {"id":"andromeda","kind":"person","g":"f","name":"Andromeda Tonks","appear":"op6","tag":[{"t":"Tonks's mother","at":"op6"}],"rel":["tonks","ted","blacks","bellatrix","narcissa","teddy"],"facts":[
  {"t":"Sirius's favorite cousin, burned off the family tree.","at":"op6","v":1},
  {"t":"So like her sister Bellatrix that Harry starts, until he sees her kinder eyes.","at":"dh5","v":1},
  {"t":"Left to bring up her grandson.","at":"dh36","v":1}]},
 {"id":"teddy","kind":"person","g":"m","name":"Teddy Lupin","appear":"dh25","tag":[{"t":"Son of Lupin and Tonks","at":"dh25"}],"rel":["lupin","tonks","harry","andromeda"],"facts":[
  {"t":"Born in the spring and named for Tonks's father. His hair changes color already. Lupin asks Harry to be godfather.","at":"dh25","v":1},
  {"t":"Nineteen years on he is forever at the Potters' for dinner, and is seen kissing Bill and Fleur's daughter at the station.","at":"dh37","v":1}]},
 {"id":"gregorovitch","kind":"person","g":"m","name":"Gregorovitch","appear":"gf18","tag":[{"t":"A foreign wandmaker","at":"gf18"},{"t":"Murdered","at":"dh14","state":"fallen"}],"rel":["krum","ollivander","voldemort","elder_wand"],"relAt":{"voldemort":"dh14","elder_wand":"dh24"},"facts":[
  {"t":"Made Viktor Krum's wand.","at":"gf18","v":1},
  {"t":"Krum says he retired some years ago.","at":"dh8","v":1},
  {"t":"Voldemort hunts him down abroad, takes a memory from him of a young, golden-haired thief, and kills him.","at":"dh14","v":1},
  {"t":"He once had the Elder Wand, and let it be known that he was studying it.","at":"dh24","v":1}]},
 {"id":"scabior","kind":"person","g":"m","name":"Scabior","appear":"dh23","tag":[{"t":"A Snatcher","at":"dh23"}],"rel":["snatchers","greyback"],"facts":[
  {"t":"Leads the gang that catches Harry, Ron and Hermione, with Greyback.","at":"dh23","v":1}]},
 {"id":"rowle","kind":"person","g":"m","name":"Thorfinn Rowle","appear":"dh9","tag":[{"t":"A Death Eater","at":"dh9"}],"rel":["followers","dolohov"],"facts":[
  {"t":"A huge blond man. He and Dolohov walk into a café on Tottenham Court Road minutes after the three arrive, dressed as workmen.","at":"dh9","v":1},
  {"t":"Tortured by Voldemort for letting Harry get away.","at":"dh9","v":1}]},
 {"id":"travers","kind":"person","g":"m","name":"Travers","appear":"gf30","tag":[{"t":"A Death Eater","at":"gf30"}],"rel":["followers"],"facts":[
  {"t":"One of the names Karkaroff gave.","at":"gf30","v":1},
  {"t":"Comes to the Lovegood house, sure it is another false alarm.","at":"dh21","v":1},
  {"t":"Meets \"Bellatrix\" in Diagon Alley and insists on walking her to the bank.","at":"dh26","v":1}]},
 {"id":"cresswell","kind":"person","g":"m","name":"Dirk Cresswell","appear":"dh15","tag":[{"t":"A Muggle-born wizard on the run","at":"dh15"},{"t":"Killed by Snatchers","at":"dh22","state":"fallen"}],"rel":["ted","dean","goblins"],"facts":[
  {"t":"Head of the Goblin Liaison Office until he was arrested. Escaped on the way to Azkaban and is travelling with Ted Tonks.","at":"dh15","v":1}]},
 {"id":"cattermoles","kind":"person","name":"Reg and Mary Cattermole","appear":"dh12","tag":[{"t":"A Ministry couple","at":"dh12"}],"rel":["ministry_hq","commission","ron"],"facts":[
  {"t":"Ron takes Reg's shape for the day. Reg works in Magical Maintenance, and his wife is due before the commission that morning.","at":"dh12","v":1},
  {"t":"Mary is being asked which witch or wizard she stole her wand from. Harry gets her out and tells her to take her children abroad.","at":"dh13","v":1}]},
 {"id":"helena","kind":"person","g":"f","name":[{"t":"The Grey Lady","at":"dh31"},{"t":"Helena Ravenclaw","at":"dh31"}],"appear":"dh31","tag":[{"t":"The Ravenclaw ghost","at":"dh31"}],"rel":["ravenclaw","rowena","baron","diadem","ghosts","riddle"],"relAt":{"riddle":"dh31"},"sub":"Ghost","facts":[
  {"t":"Tall, long-haired and proud. In life she was Rowena Ravenclaw's daughter.","at":"dh31","v":1},
  {"t":"Stole her mother's diadem to make herself cleverer, and ran away with it. The man her dying mother sent after her killed her in a rage, and then himself. He is the Bloody Baron.","at":"dh31","v":1},
  {"t":"She had hidden the diadem in a hollow tree in Albania. Centuries later she told that to a charming, sympathetic student named Tom Riddle.","at":"dh31","v":1}]},
 {"id":"gringotts_dragon","kind":"creature","name":"The Gringotts dragon","appear":"dh26","tag":[{"t":"Guards the deepest vaults","at":"dh26"},{"t":"Free","at":"dh26","state":"away"}],"rel":["gringotts","dragons","griphook"],"sub":"Dragon","attrs":{"Kind":"Dragon"},"facts":[
  {"t":"Pale and flaking from years underground, half blind, chained by the legs, and trained to fear the sound of clankers.","at":"dh26","v":1},
  {"t":"Harry frees it, and the three ride it out through the roof of the bank.","at":"dh26","v":1},
  {"t":"It flies north for hours and comes down to drink at a lake, where they jump.","at":"dh27","v":1}]},
 {"id":"hallows","kind":"magic","name":[{"t":"The triangular mark","at":"dh8"},{"t":"The Deathly Hallows","at":"dh21"}],"appear":"dh8","tag":[{"t":"A sign nobody will explain","at":"dh8"},{"t":"Three objects that master Death","at":"dh21"}],"rel":["xeno","beedle","elder_wand","stone_res","cloak","peverells","grindelwald","dumbledore"],"relAt":{"beedle":"dh16","elder_wand":"dh21","stone_res":"dh21","cloak":"dh21","peverells":"dh22","grindelwald":"dh18","dumbledore":"dh35"},"group":"lore","sub":"Legend","facts":[
  {"t":"A triangle enclosing a circle, with a line down the middle. Luna's father wears it. Krum knows it as the mark Grindelwald carved on a wall at Durmstrang.","at":"dh8","v":1},
  {"t":"Drawn in ink in Hermione's book of tales, and carved on a very old grave at Godric's Hollow.","at":"dh16","v":1},
  {"t":"From a children's story: three brothers cheat Death, who gives each a gift. The eldest takes a wand that cannot lose, the second a stone that calls back the dead, the youngest Death's own cloak.","at":"dh21","v":1},
  {"t":"Believers say the three objects are real, and that whoever unites them is master of Death. The line is the wand, the circle the stone, the triangle the cloak.","at":"dh21","v":1},
  {"t":"Harry becomes convinced they are real, that the brothers were the Peverells, and that he already owns one.","at":"dh22","v":1},
  {"t":"They are real, and dangerous. Dumbledore was obsessed with them as a young man, and held two at the end.","at":"dh35","v":1}]},
 {"id":"elder_wand","kind":"magic","name":"The Elder Wand","appear":"dh21","tag":[{"t":"A wand that cannot be beaten","at":"dh21"},{"t":"In Voldemort's hand","at":"dh24"},{"t":"Harry's, and put away","at":"dh36"}],"rel":["hallows","peverells","gregorovitch","grindelwald","dumbledore","voldemort","draco","harry","tomb"],"relAt":{"gregorovitch":"dh24","grindelwald":"dh24","dumbledore":"dh24","voldemort":"dh24","draco":"dh36","harry":"dh36","tomb":"dh24"},"group":"object","sub":"Hallow","holders":[{"id":"gregorovitch","at":"dh24"},{"id":"grindelwald","at":"dh24"},{"id":"dumbledore","at":"dh24"},{"id":"voldemort","at":"dh24"},{"id":"draco","at":"dh36"},{"id":"harry","at":"dh36"}],"facts":[
  {"t":"The first Hallow, made of elder. It has gone by many names and can be traced through history by the murders done for it.","at":"dh21","v":1},
  {"t":"Ollivander confirms it exists. A wand changes allegiance when its master is beaten, and this one more ruthlessly than most.","at":"dh24","v":1},
  {"t":"Gregorovitch had it. Grindelwald stole it from him. Dumbledore won it from Grindelwald in their duel. Voldemort breaks open Dumbledore's tomb and takes it.","at":"dh24","v":1},
  {"t":"It does not work for Voldemort any better than his old wand. He concludes that its master must be the man who killed Dumbledore.","at":"dh32","v":1},
  {"t":"He is wrong. Dumbledore's death was arranged, so Snape never defeated him. Draco Malfoy disarmed Dumbledore on the tower, and Harry took Draco's own wand from him by force at the manor.","at":"dh36","v":1},
  {"t":"So the wand is Harry's, and will not kill its master. Voldemort's curse rebounds.","at":"dh36","v":1},
  {"t":"Harry uses it once, to mend his own wand, and means to put it back in the tomb. If he dies undefeated, its power ends.","at":"dh36","v":1}]},
 {"id":"stone_res","kind":"magic","name":"The Resurrection Stone","appear":"dh21","tag":[{"t":"Calls back the dead","at":"dh21"},{"t":"Dropped in the forest","at":"dh34"}],"rel":["hallows","peverells","ring","snitch","harry","dumbledore"],"relAt":{"ring":"dh22","snitch":"dh34","harry":"dh34","dumbledore":"dh35"},"group":"object","sub":"Hallow","holders":[{"id":"harry","at":"dh34"}],"facts":[
  {"t":"The second Hallow. In the story it brings back a lost love as a sad shade, and drives its owner to kill himself to join her.","at":"dh21","v":1},
  {"t":"Harry realises it is the cracked stone in Marvolo Gaunt's ring, which carried the Peverell arms.","at":"dh22","v":1},
  {"t":"Dumbledore hid it in the Snitch. Harry turns it over on his way into the forest, and his parents, Sirius and Lupin walk with him. He lets it fall there.","at":"dh34","v":1},
  {"t":"Dumbledore put on the ring, forgetting it was a Horcrux, because he hoped to see his family and say he was sorry. That is how his hand was cursed.","at":"dh35","v":1}]},
 {"id":"snitch","kind":"magic","name":"Dumbledore's Snitch","appear":"dh7","tag":[{"t":"Left to Harry in Dumbledore's will","at":"dh7"}],"rel":["dumbledore","harry","scrimgeour","stone_res"],"relAt":{"stone_res":"dh34"},"group":"object","sub":"Bequest","holders":[{"id":"harry","at":"dh7"}],"facts":[
  {"t":"The Snitch Harry caught in his first match. Snitches remember the first touch of skin, and the Minister hopes it will open for him.","at":"dh7","v":1},
  {"t":"Harry caught that one in his mouth. Pressed to his lips, it shows a line of writing saying that it opens at the close.","at":"dh7","v":1},
  {"t":"It opens when he tells it he is about to die.","at":"dh34","v":1}]},
 {"id":"beedle","kind":"magic","name":"The Tales of Beedle the Bard","appear":"dh7","tag":[{"t":"Left to Hermione","at":"dh7"}],"rel":["hermione","dumbledore","hallows"],"group":"object","sub":"Book","holders":[{"id":"hermione","at":"dh7"}],"facts":[
  {"t":"An old book of wizard fairy tales, in runes. Ron grew up on them. Hermione and Harry have never heard of them.","at":"dh7","v":1},
  {"t":"One of them is the tale of the three brothers.","at":"dh21","v":1}]},
 {"id":"diadem","kind":"magic","name":"Ravenclaw's diadem","appear":"dh29","tag":[{"t":"Lost for centuries","at":"dh29"},{"t":"A Horcrux, destroyed","at":"dh31"}],"rel":["rowena","helena","horcruxes","ror","riddle","albania"],"relAt":{"ror":"dh31","riddle":"dh31","albania":"dh31"},"group":"object","sub":"Diadem","facts":[
  {"t":"A circlet said to make its wearer wiser. Nobody alive has seen it. A marble copy sits on Rowena Ravenclaw's statue in her house's common room.","at":"dh29","v":1},
  {"t":"Riddle fetched it from Albania, made it a Horcrux, and hid it at Hogwarts on the night he came to ask for a job, in the room where everything is hidden.","at":"dh31","v":1},
  {"t":"It is the tarnished tiara Harry put on a bust last year to mark where he had hidden his Potions book.","at":"dh31","v":1},
  {"t":"Burned by cursed fire, and destroyed.","at":"dh31","v":1}]},
 {"id":"fiendfyre","kind":"magic","name":"Fiendfyre","appear":"dh31","tag":[{"t":"Fire that hunts","at":"dh31"}],"rel":["horcruxes","crabbe","ror","diadem"],"group":"spell","sub":"Cursed fire","facts":[
  {"t":"One of the few things that can destroy a Horcrux, and far too dangerous to use on purpose.","at":"dh31","v":1},
  {"t":"Crabbe sets it loose in the Room of Requirement without knowing how to stop it. It takes the shapes of serpents and dragons and devours everything in the room, him included.","at":"dh31","v":1}]},
 {"id":"taboo","kind":"magic","name":"The Taboo","appear":"dh20","tag":[{"t":"On Voldemort's name","at":"dh20"}],"rel":["voldemort","snatchers","order"],"group":"lore","sub":"Jinx","facts":[
  {"t":"The name itself has been jinxed. Saying it breaks protective spells and summons Snatchers, which is a quick way to find the only people who dare.","at":"dh20","v":1},
  {"t":"Harry says it.","at":"dh22","v":1}]},
 {"id":"trace","kind":"magic","name":"The Trace","appear":"dh4","tag":[{"t":"How the Ministry detects under-age magic","at":"dh4"}],"rel":["ministry","harry"],"group":"lore","sub":"Law","facts":[
