<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Spoiler-safe reading companions for long fantasy series. Set the last chapter you read and see only what you've reached. First guide: the Empyrean.">
<meta name="theme-color" content="#E8EAED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parapet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" media="(prefers-color-scheme: light)">
<link rel="icon" href="/icons/icon-192-dark.png" sizes="192x192" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-dark.png">
<meta property="og:title" content="Parapet">
<meta property="og:description" content="Spoiler-safe reading companions. Look anything up, spoil nothing.">
<meta property="og:image" content="/icons/icon-512-dark.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Parapet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an app shell. Desktop: a sticky sidebar holds your place in the series and the sections; the reading area sits beside it.
   Phone: your place sits on top, the sections move to a bottom tab bar, and entries open as bottom sheets. Same archive palette and faces as before. */
:root{
  --paper:#E8EAED; --sheet:#F7F7F5; --ink:#191C24; --muted:#5A606C; --rule:#C6CAD1; --rule-soft:#D9DCE1;
  --seal:#8E2434; --seal-ink:#FFFFFF; --brass:#86672A; --link:#2A3A8C; --ok:#2E6B47; --warn:#9A5B12;
  --seal-soft:#F1E1E4; --brass-soft:#F1EADB; --link-soft:#E3E6F4; --ok-soft:#DFEDE4;
  --scrim:rgba(14,16,22,.45); --hatch:rgba(25,28,36,.09); --shadow:0 1px 2px rgba(25,28,36,.06),0 4px 16px rgba(25,28,36,.06);
  --shadow-lg:0 12px 40px rgba(14,16,22,.18);
  --glass:rgba(247,247,245,.74); --glass-edge:rgba(255,255,255,.7); --glass-on:rgba(25,28,36,.07); --float:0 10px 30px rgba(14,16,22,.16),0 1px 3px rgba(14,16,22,.08);
  --f-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --f-body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-sm:8px; --r:14px; --r-lg:22px;
  /* one gap for the floating tab bar on all three sides; on iPhones it tucks just above the home indicator */
  --bar-gap:max(14px, calc(env(safe-area-inset-bottom,0px) - 14px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101218; --sheet:#191C24; --ink:#E8E5DD; --muted:#9BA1AD; --rule:#2D313C; --rule-soft:#242833;
  --seal:#CB4B5E; --seal-ink:#14090B; --brass:#CDA95F; --link:#9AA7FF; --ok:#6CC08F; --warn:#E3A452;
  --seal-soft:#33191F; --brass-soft:#2E2718; --link-soft:#1F2440; --ok-soft:#16291E;
  --scrim:rgba(0,0,0,.6); --hatch:rgba(232,229,221,.07); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --glass:rgba(25,28,36,.72); --glass-edge:rgba(255,255,255,.09); --glass-on:rgba(232,229,221,.1); --float:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101218; --sheet:#191C24; --ink:#E8E5DD; --muted:#9BA1AD; --rule:#2D313C; --rule-soft:#242833;
  --seal:#CB4B5E; --seal-ink:#14090B; --brass:#CDA95F; --link:#9AA7FF; --ok:#6CC08F; --warn:#E3A452;
  --seal-soft:#33191F; --brass-soft:#2E2718; --link-soft:#1F2440; --ok-soft:#16291E;
  --scrim:rgba(0,0,0,.6); --hatch:rgba(232,229,221,.07); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --glass:rgba(25,28,36,.72); --glass-edge:rgba(255,255,255,.09); --glass-on:rgba(232,229,221,.1); --float:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.code{font-family:var(--f-mono);font-size:.72rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-block:16px 6px;min-width:0}
/* phones: Safari's top edge blur reaches a little past the status bar, so the title starts lower */
@media (max-width:959px){.side{padding-top:20px}}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand > div,.brand > button{min-width:0}
.brand .brand-sub{color:var(--muted);font-size:.85rem;line-height:1.2}
/* theme switch: light, dark, or follow the device */
.themesw{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule-soft);flex:none}
.themesw button{width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.themesw button:hover{color:var(--ink)}
.themesw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.themesw svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand .mark{width:48px;height:48px;border-radius:14px;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.brand .mark svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1}
main{min-width:0;padding-bottom:calc(var(--bar-gap) + 100px)}

/* sticky search bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);padding-block:10px;display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;padding:0 16px 0 44px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;font-size:1rem;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--link-soft)}
.chip{display:inline-flex;align-items:center;gap:8px;height:46px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:0 14px 0 12px;font-size:.92rem;white-space:nowrap;flex:none}
.topbar.io .chip{display:none}
.topbar.io.show-chip .chip{display:inline-flex;animation:chipin .2s ease-out}
@keyframes chipin{from{opacity:0;transform:scale(.92)}}
@media (prefers-reduced-motion:reduce){.topbar.io.show-chip .chip{animation:none}}
.chip .dot{width:9px;height:9px;transform:rotate(45deg);background:var(--seal);flex:none;border-radius:1px}
.chip b{font-weight:700}

/* your place */
.place{grid-template-columns:minmax(0,1fr);background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r-lg);padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.books{display:flex;gap:4px;padding:4px;background:var(--paper);border-radius:999px}
.bk{flex:1;min-width:0;border:0;background:transparent;border-radius:999px;padding:6px 2px;font-size:.78rem;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:32px;display:flex;align-items:center;justify-content:center;gap:4px}
.bk.done{color:var(--ink)}
.bk.done::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none}
.bk.cur{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.bk:hover{color:var(--ink)}
.place h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.15}
.place h2 em{font-style:normal;color:var(--seal)}
.track{display:grid;gap:3px;align-items:center}
.tick{appearance:none;background:none;border:0;padding:0;height:30px;display:flex;align-items:center;cursor:pointer;position:relative}
.tick::before{content:"";display:block;width:100%;height:6px;background:var(--ink);border-radius:3px;transition:height .15s ease}
.tick.future::before{background:var(--rule)}
.tick.now::before{height:10px;background:linear-gradient(90deg,var(--seal) 0 var(--fill,100%),var(--rule) var(--fill,100%) 100%)}
.tick:hover::before,.tick:focus-visible::before{height:12px}
@media (prefers-reduced-motion:reduce){.tick::before{transition:none}}
.track-legend{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;margin-top:-4px}
.place-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--rule-soft)}
.place-foot .meta{font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.place-foot .meta b{color:var(--ink);font-weight:700}

/* series: one numbered step per book, released or not */
.series{display:grid;gap:10px}
.series-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.82rem}
.nums{display:flex;align-items:center}
.nums .ln{flex:1;min-width:6px;height:2px;background:var(--rule);border-radius:1px}
.nums .ln.done{background:var(--ink)}
.nums.many .ln{min-width:3px}
.nums.many .num{width:30px;height:30px;font-size:.8rem}
.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;padding:0;font-size:.86rem;font-weight:700;font-variant-numeric:tabular-nums;
  border:1.5px solid var(--rule);background:var(--sheet);color:var(--muted)}
.num svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
button.num:hover{border-color:var(--ink);color:var(--ink)}
.num.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.num.cur{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.num.up{border-style:dashed;background:transparent}
.bookpick,.brow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--rule-soft);background:var(--sheet);border-radius:var(--r);min-height:60px}
.bookpick:hover,button.brow:hover{border-color:var(--ink)}
.bp-t{flex:1;min-width:0;display:grid}
.bp-t strong{font-size:1.05rem}
.bp-t small{color:var(--muted);font-size:.86rem}
.bp-c{display:inline-flex;align-items:center;gap:2px;color:var(--link);font-size:.9rem;font-weight:500;white-space:nowrap}
.bp-c svg,.brow > svg{width:18px;height:18px}
.booklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.brow[aria-current="true"]{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal)}
.brow.off{background:transparent;border-style:dashed;color:var(--muted)}
.brow.off strong{color:var(--muted)}
.soon{border:1px dashed var(--rule);border-radius:var(--r);padding:14px 16px;color:var(--muted);font-size:.94rem}

/* nav: bottom tab bar on phones */
.nav{position:fixed;z-index:15;left:calc(var(--bar-gap) + env(safe-area-inset-left,0px));right:calc(var(--bar-gap) + env(safe-area-inset-right,0px));bottom:var(--bar-gap);
  max-width:520px;margin-inline:auto;padding:6px;border-radius:32px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--float);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.navi{border:0;background:none;border-radius:26px;transition:background-color .18s ease,color .18s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px 2px;color:var(--muted);font-size:.72rem;font-weight:500;min-width:0}
.navi .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.navi .n{display:none}
.navi[aria-current="page"]{color:var(--seal);background:var(--glass-on)}
.navi[aria-current="page"] svg{stroke-width:2.1}
.navi.sec{display:none}
.navi.more.on{color:var(--seal);background:var(--glass-on)}

/* desktop */
@media (min-width:960px){
  .app{grid-template-columns:300px minmax(0,1fr);gap:40px}
  .side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;max-height:100dvh;overflow-y:auto;padding-block:24px;
    grid-template-rows:auto auto 1fr;gap:20px;scrollbar-width:thin}
  main{padding-bottom:48px}
  .topbar{padding-block:24px 14px}
  .chip,.topbar.io.show-chip .chip{display:none}
  .nav{position:static;display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:0;align-self:start;border-radius:0;box-shadow:none;max-width:none;margin:0;-webkit-backdrop-filter:none;backdrop-filter:none}
  .navi{border-radius:12px}
  .navi,.navi.sec{display:flex;flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 12px;font-size:.98rem;color:var(--ink)}
  .navi .lbl{flex:1;text-align:left}
  .navi .n{display:inline;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .navi svg{color:var(--muted)}
  .navi:hover{background:var(--sheet)}
  .navi[aria-current="page"]{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
  .navi[aria-current="page"] svg{color:var(--seal)}
  .navi.more{display:none}
}

/* view header */
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap;margin:8px 0 18px}
.vh h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,4.5vw,2.3rem);line-height:1.05}
.vh p{color:var(--muted);max-width:52ch}
.count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,264px),1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0;
  box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--rule)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.card-h{display:flex;gap:12px;align-items:center;min-width:0}
.card-h .ct{flex:1;min-width:0}
.card h3{font-size:1.1rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.card .sub{font-size:.88rem;color:var(--muted);line-height:1.3;margin-top:2px}
.card .lede{font-size:.95rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;line-height:1;flex:none;font-weight:700;font-size:.95rem;letter-spacing:.02em;background:var(--seal-soft);color:var(--seal)}
.av{position:relative}
.gx{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--sheet);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 1px var(--rule)}
.gx svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.av.lg .gx{width:22px;height:22px;right:-2px;bottom:-2px}
.av.lg .gx svg{width:14px;height:14px}
.toggle.setting{margin-top:14px;border-top:1px solid var(--rule-soft);padding-top:14px}
.toggle.setting small{display:block;margin-top:2px;font-size:.86rem;line-height:1.35}
.av.lg{width:56px;height:56px;font-size:1.15rem}
.av.dragon{border:3px solid var(--sheet);box-shadow:0 0 0 1px var(--rule)}
.av.dragon svg{width:70%;height:70%}
.av.dragon.nocolor{background:var(--paper);color:var(--muted)}
.av.signet{border-radius:12px;background:var(--brass-soft);color:var(--brass)}
.av.loc{border-radius:12px;background:var(--link-soft);color:var(--link)}
.av.gryphon{background:var(--brass-soft);color:var(--brass)}
.av.gryphon svg{width:54%;height:54%;stroke-width:1.6}
.av svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.status{display:inline-flex;align-items:center;line-height:1.25;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--paper);color:var(--muted);flex:none}
.status.fallen{background:var(--seal-soft);color:var(--seal)}
.status.venin{background:var(--seal-soft);color:var(--seal);box-shadow:inset 0 0 0 1px var(--seal)}
.status.away{background:var(--brass-soft);color:var(--brass)}
.status.alive{background:var(--ok-soft);color:var(--ok)}
.sealcount{display:inline-flex;align-items:center;gap:6px}
.sealcount i{width:7px;height:7px;border-radius:50%;background:var(--seal);display:inline-block}
.later{margin-top:16px;color:var(--muted);font-size:.92rem;display:flex;align-items:center;gap:8px}
.later svg{width:16px;height:16px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--rule);border-radius:var(--r);background:var(--sheet)}

/* places */
.pgroup{margin-bottom:28px}
.pgroup-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.pg-t{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.pgroup-h .count{flex:none}
.pgroup-h h3{font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.inlink{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;text-underline-offset:2px;font:inherit}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:.88rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* sheets: bottom on phones, side drawer on desktop */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow:auto;overscroll-behavior:contain;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:8px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  box-shadow:var(--shadow-lg);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.panel::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--rule);margin:4px auto 12px}
@media (min-width:860px){
  .overlay{align-items:stretch;justify-content:flex-end;padding:12px}
  .panel{max-width:480px;max-height:none;height:100%;border-radius:var(--r-lg);padding:24px 28px 28px;animation:left .24s cubic-bezier(.2,.8,.2,1)}
  .panel::before{display:none}
}
@keyframes up{from{transform:translateY(32px);opacity:.5}}
@keyframes left{from{transform:translateX(32px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}

.panel-h .kind{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;font-size:.86rem;color:var(--muted)}
.x{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:50%;width:40px;height:40px;flex:none;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:0 0 20px}
.attrs div{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px;padding:10px 12px;min-width:0}
.attrs dt{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.attrs dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.facts-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.facts{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.fact{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.fact:last-child{border-bottom:0}
.fact .b{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);background:var(--sheet);border:1px solid var(--rule-soft);border-radius:6px;padding:2px 6px;margin-top:2px;min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.fact.peeked p{color:var(--seal)}
.sealed{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border:1px dashed var(--rule);border-radius:12px;
  background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px);color:var(--muted);font-size:.9rem}
.sealed svg{width:16px;height:16px;color:var(--seal)}

.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}

.vchip.ok{color:var(--ok)}.vchip.no{color:var(--warn)}

/* progress sheet */
.seg{display:flex;gap:4px;padding:4px;background:var(--sheet);border:1px solid var(--rule-soft);border-radius:999px;margin-bottom:12px}
.seg button{flex:1;min-width:0;border:0;background:none;border-radius:999px;min-height:40px;padding:0 8px;font-size:.9rem;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.part{border:1px solid var(--rule-soft);border-radius:var(--r);background:var(--sheet);overflow:hidden}
.part.sel{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal)}
.part label{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;cursor:pointer}
.part input{margin-top:4px;accent-color:var(--seal);width:18px;height:18px}
.part strong{display:block;font-size:1.02rem}
.part small{display:block;color:var(--muted);font-size:.88rem;line-height:1.35;margin-top:2px}

.chpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 14px 44px}

.sheet-foot{position:sticky;bottom:0;background:var(--paper);box-shadow:0 32px 0 var(--paper);padding-block:14px;margin-top:14px;border-top:1px solid var(--rule-soft);z-index:1}
.textbtns{display:flex;gap:4px 16px;flex-wrap:wrap;margin-top:12px}
.textbtn{background:none;border:0;padding:6px 0;color:var(--link);font-weight:500;font-size:.92rem;min-height:36px}

/* more sheet (phones) */
.morelist{display:grid;gap:8px}
.morelist button{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 16px;border:1px solid var(--rule-soft);background:var(--sheet);border-radius:var(--r);font-size:1.02rem;font-weight:500;text-align:left}
.morelist button .n{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.morelist button[aria-current="page"]{border-color:var(--seal);color:var(--seal)}

/* timeline */
/* scene vignettes: self-contained pictures, each with its own time-of-day palette */
.sc{display:block;width:100%;height:100%}
.sc .k1{fill:var(--s1)}.sc .k2{fill:var(--s2)}.sc .f1{fill:var(--g1)}.sc .f2{fill:var(--g2)}.sc .f3{fill:var(--g3)}.sc .lt{fill:var(--lt)}.sc .ac{fill:var(--ac)}
.p-night{--s1:#0F1630;--s2:#34407A;--g1:#222C57;--g2:#161D3D;--g3:#0A0E20;--lt:#F4D58A;--ac:#8FA3FF}
.p-dusk{--s1:#3B2B5C;--s2:#E08A5B;--g1:#6A4470;--g2:#3F2A4D;--g3:#1E1630;--lt:#FFD9A0;--ac:#FFB07A}
.p-day{--s1:#6FA9DC;--s2:#DDEBF2;--g1:#8FB59A;--g2:#5B8B71;--g3:#2B5243;--lt:#FFF4C2;--ac:#D9622B}
.p-snow{--s1:#7F97B8;--s2:#E9EEF5;--g1:#D6DEEA;--g2:#93A5BF;--g3:#46566F;--lt:#FFE9A8;--ac:#B33A4A}
.p-storm{--s1:#1B262E;--s2:#52646F;--g1:#3A4A55;--g2:#25313A;--g3:#11181D;--lt:#E6F0F5;--ac:#9FD0FF}
.p-ember{--s1:#240C11;--s2:#B23A2A;--g1:#6A2420;--g2:#3B141B;--g3:#1A090C;--lt:#FFC857;--ac:#FF7A3D}
.la{display:block;width:100%;height:100%;color:var(--ink)}
.la *{stroke-linejoin:round}
.la .w{fill:var(--sheet);stroke:currentColor;stroke-width:2}
.la .k{fill:currentColor;stroke:currentColor;stroke-width:2}
.la .a{fill:var(--seal);stroke:currentColor;stroke-width:2}
.la .t{fill:var(--rule-soft)}
.la rect.t{stroke:currentColor;stroke-width:2;fill:transparent;opacity:.6}
.intro{min-height:calc(100dvh - 48px);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:18px;max-width:440px;margin:0 auto;width:100%}
.intro-art{display:grid;place-items:center;min-height:0}
.intro-art svg{max-height:46dvh;width:100%;height:auto}
.intro-t{text-align:center;display:grid;gap:10px;justify-items:center}
.intro-t .h-lede{max-width:34ch}
.intro-dots{display:flex;justify-content:center;gap:2px}
.intro-dots button{width:28px;height:28px;border:0;background:none;padding:0;position:relative;cursor:pointer}

.nowcard .plate{display:block;aspect-ratio:4/3;border-radius:12px}
.hub-hero{display:grid;gap:18px}

.tile:hover{border-color:var(--ink)}
.bookgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:grid;grid-template-rows:auto 1fr;text-align:left;padding:0;border:1px solid var(--rule-soft);border-radius:var(--r);background:var(--sheet);color:var(--ink);font:inherit;cursor:pointer;overflow:hidden}

.ob-art{aspect-ratio:21/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--rule-soft)}
.thumb{display:block;flex:none;width:76px;aspect-ratio:4/3;border-radius:10px;overflow:hidden}
.pick.two .thumb{width:56px}
.pitchcard{display:grid;background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r);overflow:hidden}

@media (min-width:640px){.pitchcard{grid-template-columns:220px 1fr;align-items:stretch}.pitchcard .plate{aspect-ratio:auto;min-height:132px}.pitchcard p{align-self:center}}
.reel-books{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.reel-books button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer}
.reel-books button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

@media (max-width:959px){.reel-books{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}.reel-books::-webkit-scrollbar{display:none}.reel-books button{flex:none}}
@media (max-width:520px){.reel-nav{grid-template-columns:1fr 1fr}.reel-dots{grid-column:1/-1;grid-row:1}.reel-nav>span{display:block}}
.tl-book{display:flex;align-items:baseline;gap:10px;margin:28px 0 14px}
.tl-book:first-of-type{margin-top:0}
.tl-book h3{font-family:var(--f-display);font-weight:400;font-size:1.45rem}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:2px;background:var(--rule-soft);border-radius:1px}
.tl li{position:relative;padding-left:30px}
.tl li::before{content:"";position:absolute;left:1px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--paper)}

/* glossary */
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin:0}
.gl div{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r);padding:14px 16px;min-width:0}
.gl dt{font-weight:700;font-size:1.05rem;margin-bottom:4px}
.gl dd{margin:0;color:var(--ink)}
.gl dd + dd{margin-top:8px;padding-top:8px;border-top:1px solid var(--rule-soft)}

/* bonds */
.graph-box{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}

.g-node{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}

.g-hit:hover .g-name{fill:var(--link)}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:28px;height:8px}

/* bonds */
/* dragon filters: one button, the options open as a list */
.vh.vh-tool{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px}

.foot-split{justify-content:space-between}
.foot-main{margin-left:auto}

/* family tile */

.legend{margin:0 0 18px}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.box{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r);padding:18px;min-width:0}
.box h4{margin:0 0 10px;font-size:1.05rem}
.box ul{margin:0;padding-left:18px;display:grid;gap:6px}
.box li{font-size:.95rem}
pre{margin:0;overflow-x:auto;background:var(--paper);border:1px solid var(--rule-soft);border-radius:12px;padding:12px;font-family:var(--f-mono);font-size:.76rem;line-height:1.5}
.ec{list-style:none;padding:0!important}
.ec li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.ec .s{font-size:.66rem;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:999px;height:fit-content;margin-top:2px}
.ec .s.done{color:var(--ok);background:var(--ok-soft)}.ec .s.open{color:var(--warn);background:var(--brass-soft)}
/* Threshing Day */
.stories{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.story{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--rule-soft);background:var(--sheet);border-radius:var(--r);cursor:pointer}
.story:hover{border-color:var(--ink)}
.story:has(input:checked){border-color:var(--seal);box-shadow:0 0 0 1px var(--seal)}
.story .st{flex:1;min-width:0;display:grid;gap:2px}
.story .st strong{font-size:1.02rem}
.story small{font-size:.86rem}
.story input{width:22px;height:22px;accent-color:var(--seal);flex:none}
.tdline{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:500;margin-top:2px}
.tdline svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tdline.ok{color:var(--ok)}.tdline.wait{color:var(--warn)}
.tdchip{display:inline-block;font-family:var(--f-mono);font-size:.66rem;font-weight:700;letter-spacing:.04em;line-height:1;padding:3px 5px;border-radius:5px;background:var(--brass-soft);color:var(--brass);vertical-align:1px;text-transform:none}
.fact .b.td{background:var(--brass-soft);border-color:transparent;color:var(--brass)}
.tdnote{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:10px 14px;border:1px dashed var(--rule);border-radius:12px;background:transparent;color:var(--muted);font-size:.9rem;text-align:left}
.tdnote:hover{border-color:var(--ink);color:var(--ink)}
.tdnote > span:nth-child(2){flex:1}
.tdnote svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.comp-note,.comp-kin{display:block;margin-top:4px;font-weight:400;font-size:.92rem}
.comp-note{color:var(--muted)}
.attrs dt .tdchip{margin-left:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--rule-soft)}
.toggle:first-of-type{border-top:0}
.toggle input{width:20px;height:20px;accent-color:var(--seal);flex:none}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.stats div{font-variant-numeric:tabular-nums}
.stats b{font-size:1.7rem;font-family:var(--f-display);font-weight:400;display:block;line-height:1}
.editor-banner{background:var(--seal);color:var(--seal-ink);padding:10px 14px;border-radius:var(--r);margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-weight:500}
.editor-banner button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:4px 12px;min-height:34px}


footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--rule-soft);color:var(--muted);font-size:.85rem;max-width:72ch}
#toast{position:fixed;left:50%;bottom:calc(var(--bar-gap) + 86px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;z-index:30;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);text-align:center}
@media (min-width:960px){#toast{bottom:24px}}

/* ---------- HOME LAYER: first run, library and series pages ---------- */
body.home-open{overflow:hidden}
.home{position:fixed;inset:0;z-index:18;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 20px) calc(16px + env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) calc(16px + env(safe-area-inset-left,0px))}
.home-in{max-width:1040px;margin:0 auto;display:grid;gap:22px;animation:home-in .32s cubic-bezier(.2,.8,.2,1)}
.home-in.narrow{max-width:560px}
@keyframes home-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.home-in{animation:none}}
.home-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.home-bar h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1}
.home-bar .hb-sub{color:var(--muted);font-size:.85rem;line-height:1.2}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 8px;border:1px solid var(--rule-soft);background:var(--sheet);border-radius:999px;font-weight:500;font-size:.95rem}
.backbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(180deg)}
.brandbtn{background:none;border:0;padding:0;text-align:left;border-radius:8px;display:block}
.brandbtn:hover h1{color:var(--seal)}
.h-display{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,7vw,3rem);line-height:1.04;text-wrap:balance}
.h-lede{font-size:1.06rem;line-height:1.55;color:var(--ink);max-width:62ch}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.h-sec h3{font-family:var(--f-display);font-weight:400;font-size:1.45rem}

/* typographic covers: our own, never the publishers' art */
.cover{--cv:#3B3F4A;--cv2:#23262E;--cvi:#F3EFE6;position:relative;display:grid;place-items:center;aspect-ratio:3/4;width:100%;border-radius:10px 14px 14px 10px;
  background:linear-gradient(135deg,var(--cv),var(--cv2));color:var(--cvi);overflow:hidden;box-shadow:var(--shadow);flex:none}
.cover::before{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--cvi) 38%,transparent);border-radius:6px 9px 9px 6px}

.cv-in{position:relative;display:grid;justify-items:center;gap:8px;padding:18px 14px;text-align:center}

.nowlist{display:grid;gap:14px}
#homeIn h2[tabindex="-1"]:focus{outline:none}
.cv-r{width:26px;height:1px;background:currentColor;opacity:.6}
.cover.sm{width:64px;border-radius:6px 9px 9px 6px}.cover.sm::before{inset:4px}.cover.sm::after{width:4px}
.cover.sm .cv-in{padding:6px;gap:4px}.cover.sm .cv-t{font-size:.6rem}.cover.sm .cv-r{display:none}.cover.sm .cv-in svg{width:46%}
.c-empyrean{--cv:#8E2434;--cv2:#4E121C;--cvi:#F4E9D8}
.c-hp{--cv:#2E3A6E;--cv2:#161C3C}.c-acotar{--cv:#2F5D4A;--cv2:#153126}.c-asoiaf{--cv:#4A5868;--cv2:#222B36}
.c-lotr{--cv:#7A5B22;--cv2:#3A2A0C}.c-tog{--cv:#1F5F6B;--cv2:#0D2F36}

/* library */
.nowcard{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:18px;align-items:center;background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.now-t{display:grid;gap:8px;min-width:0}
.now-t h4{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.05}
.now-bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}.now-bar i{display:block;height:100%;background:var(--seal);border-radius:3px}
.now-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
@media (min-width:720px){.nowcard{grid-template-columns:150px minmax(0,1fr);padding:24px;gap:26px}}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:960px){.shelf{grid-template-columns:repeat(5,minmax(0,1fr))}}
.scard{display:grid;gap:10px;align-content:start;text-align:left;background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r);padding:12px;min-width:0;transition:transform .15s,box-shadow .15s,border-color .15s}
.scard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--rule)}
.scard strong{font-size:1rem;line-height:1.2}
.scard small{color:var(--muted);font-size:.84rem;line-height:1.3}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--brass-soft);color:var(--brass);width:max-content;max-width:100%}
.pill.live{background:var(--ok-soft);color:var(--ok)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* series page */
.sp{display:grid;gap:22px}
.sp-hero{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr);gap:18px;align-items:end}
.sp-hero .meta{color:var(--muted);font-size:.95rem}
@media (min-width:720px){.sp-hero{grid-template-columns:190px minmax(0,1fr);gap:30px}.sp{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start;column-gap:36px}.sp > .wide{grid-column:1/-1}}
.vibes{display:flex;flex-wrap:wrap;gap:8px}
.vibes span{font-size:.88rem;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule-soft)}
.why{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.why li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r);padding:14px 16px}
.why b{display:block}.why span{color:var(--muted);font-size:.95rem}
.why .n{font-family:var(--f-display);font-size:1.5rem;line-height:1;color:var(--seal);min-width:1.1em}
.infobox{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.infobox dl{margin:0;display:grid;gap:8px}.infobox dt{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.infobox dd{margin:0}
.order{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:o}
.order li{counter-increment:o;display:flex;gap:10px;align-items:baseline}.order li::before{content:counter(o);font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:1.2em}
.order li.xt::before{content:"+"}
.note{font-size:.9rem;color:var(--muted)}

/* first run */
.ob{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 48px);display:grid;grid-template-rows:auto 1fr auto;gap:18px}
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.ob-dots{display:flex;gap:6px}.ob-dots i{width:22px;height:4px;border-radius:2px;background:var(--rule)}.ob-dots i.on{background:var(--seal)}
.ob-body{display:grid;gap:16px;align-content:start}
.ob-foot{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 4px;background:linear-gradient(to top,var(--paper) 72%,transparent)}
.ob-foot .btn{flex:1;min-height:52px;font-size:1rem}.ob-foot .btn.ghost{flex:0 0 auto}
.demo{background:var(--sheet);border:1px solid var(--rule-soft);border-radius:var(--r-lg);padding:16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.demo-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.demo-h b{font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);font-size:1.2rem;line-height:1;display:grid;place-items:center}
.stepper button:disabled{opacity:.35}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--rule-soft);background:var(--paper);transition:background .3s,border-color .3s,opacity .3s}
.drow .dav{width:36px;height:36px;border-radius:50%;background:var(--seal-soft);color:var(--seal);display:grid;place-items:center;flex:none}
.drow .dav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drow .dt{display:grid;gap:5px;min-width:0}.drow .dt b{font-size:.95rem}
.drow .bars{display:grid;gap:5px}.drow .bars i{display:block;height:6px;border-radius:3px;background:var(--rule)}.drow .bars i + i{width:62%}
.drow .dc{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);border:1px solid var(--rule-soft);border-radius:6px;padding:2px 6px}
.drow.shut{border-style:dashed;border-color:var(--rule);background:transparent}
.drow.shut .dav{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--rule)}
.drow.shut .dt b{color:var(--muted);font-weight:500}.drow.shut .bars{display:none}
.drow.just{animation:unseal .5s cubic-bezier(.2,.8,.2,1)}
@keyframes unseal{from{transform:scale(.98);background:var(--seal-soft)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.drow.just{animation:none}}
.pick{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--rule-soft);background:var(--sheet);border-radius:var(--r);min-height:64px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;flex:none}
.opt[aria-checked="true"] .rd{border-color:var(--seal)}.opt[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--seal)}
.opt b{display:block}.opt small{color:var(--muted);font-size:.9rem}
.opt.sr{grid-template-columns:64px 1fr}
.opt.sr.tba .cover{opacity:.85}
.pick.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pick.two .opt{grid-template-columns:44px 1fr;gap:10px;padding:10px;min-height:0}.pick.two .cover.sm{width:44px}.pick.two .cover.sm .cv-t{display:none}
.pick.two .opt b{font-size:.9rem;line-height:1.2}.pick.two .opt small{font-size:.8rem}
.nw{white-space:nowrap}
.where-sub{display:grid;gap:10px;padding:14px 16px;border:1px solid var(--rule-soft);border-radius:var(--r);background:var(--sheet)}
.where-sub label{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.where-sub select{width:100%;height:48px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink);padding:0 12px;font-size:1rem}
.bookseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bookseg button{min-height:48px;padding:6px 8px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);font-size:.9rem;font-weight:500;line-height:1.15}
.bookseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.side-links{display:none}
@media (min-width:960px){.side-links{display:grid;gap:2px;margin-top:6px;padding-top:10px;border-top:1px solid var(--rule-soft)}
  .side-links button{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:.92rem;text-align:left}
  .side-links button:hover{background:var(--sheet);color:var(--ink)}
  .side-links svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}}
.morelist .sep{height:1px;background:var(--rule-soft);margin:6px 0}

/* Splash: shown on every open. Pure CSS timing, so it always clears even if the script fails; tap to skip */
.splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#F1EADB;color:#191C24;
  animation:splash-out .42s cubic-bezier(.4,0,.2,1) 1.15s forwards;-webkit-user-select:none;user-select:none;cursor:default}
.splash-in{display:grid;justify-items:center;gap:14px;padding:24px;text-align:center}
.splash-mark{width:min(30vw,128px);height:min(30vw,128px);color:#8E2434;animation:splash-mark .7s cubic-bezier(.2,.8,.2,1) both}
.splash-mark svg{width:100%;height:100%;display:block}
.splash-word{font-family:var(--f-display);font-size:clamp(2rem,8vw,2.6rem);line-height:1;letter-spacing:.01em;animation:splash-up .6s cubic-bezier(.2,.8,.2,1) .18s both}
.splash-bar{width:44px;height:2px;border-radius:2px;background:#8E2434;transform-origin:center;animation:splash-bar .55s cubic-bezier(.2,.8,.2,1) .35s both}
.splash-sub{font-size:.95rem;color:#5A606C;animation:splash-up .6s cubic-bezier(.2,.8,.2,1) .42s both}
.splash.gone{animation:splash-out .2s ease forwards}
.no-splash .splash{display:none}
@keyframes splash-mark{from{opacity:0;transform:scale(.86) translateY(6px)}to{opacity:1;transform:none}}
@keyframes splash-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes splash-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes splash-out{to{opacity:0;visibility:hidden}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .splash{background:#101218;color:#E8E5DD}
  :root:not([data-theme="light"]) .splash-mark,:root:not([data-theme="light"]) .splash-bar{color:#CB4B5E;background-color:transparent}
  :root:not([data-theme="light"]) .splash-bar{background:#CB4B5E}:root:not([data-theme="light"]) .splash-sub{color:#9BA1AD}}
:root[data-theme="dark"] .splash{background:#101218;color:#E8E5DD}
:root[data-theme="dark"] .splash-mark{color:#CB4B5E}:root[data-theme="dark"] .splash-bar{background:#CB4B5E}:root[data-theme="dark"] .splash-sub{color:#9BA1AD}
@media (prefers-reduced-motion: reduce){.splash{animation-delay:.6s;animation-duration:.2s}.splash-mark,.splash-word,.splash-bar,.splash-sub{animation:none}}

<script>
const GUIDE_DATA={};
GUIDE_DATA.empyrean=(function(){
/* ---------- DATA ----------
   Positions are chapters, written as 'fw14', 'if3', 'os0' (os0 = Onyx Storm prologue).
   Books checked against the text so far: Fourth Wing, Iron Flame, Onyx Storm, and the companion Threshing Day (v:1 = checked).
   Every entry is cited to a chapter. Entries from Threshing Day also carry td: the story they come from;
   they open only when the reader has marked that story read and reached the chapter. */
const BOOKS=[{"id":"fw","name":"Fourth Wing","abbr":"FW","first":1,"last":39},{"id":"if","name":"Iron Flame","abbr":"IF","first":1,"last":66},{"id":"os","name":"Onyx Storm","abbr":"OS","first":0,"last":66}];

const BEATS=[
 {"b":"fw","t":"Conscription Day","hint":"Candidates are lining up to cross the parapet.","s":"Violet Sorrengail, raised to be a scribe, is ordered by her mother into the Riders Quadrant. She crosses the parapet with a borrowed balance trick and a dagger, makes a friend in Rhiannon, and an enemy in Jack Barlowe.","ch":[1,2]},
 {"b":"fw","t":"First formation","hint":"The survivors are being sorted into wings and squads.","s":"Survivors are sorted into wings. Xaden Riorson, son of the rebellion's leader, moves Dain's squad into his own Fourth Wing, putting Violet under him. Dragons land on the walls and burn cadets who try to run.","ch":[3,4]},
 {"b":"fw","t":"Challenges","hint":"Classes and sparring on the mat have begun.","s":"Battle Brief teaches the war with Poromiel. Imogen breaks Violet's arm on the mat. Violet wins her challenges with poisons slipped into breakfast, and Xaden starts teaching her to fight, calling her Violence.","ch":[5,9]},
 {"b":"fw","t":"The Gauntlet","hint":"The class is practicing the climb up to the Vale.","s":"Aurelie falls to her death in practice. On the day, Violet gets up the Gauntlet using her own dagger and a rope, and Xaden rules it allowed.","ch":[10,11]},
 {"b":"fw","t":"Presentation","hint":"The dragons are walking the flight field.","s":"Unbonded dragons inspect the class, burning two of Violet's squadmates. A small golden feathertail turns up that no one expected.","ch":[12,12]},
 {"b":"fw","t":"The Threshing","hint":"The first-years have gone into the Vale.","s":"Violet defends the golden feathertail from Jack, Oren and Tynan. Tairn, a legendary black, bonds her, and so does the feathertail, Andarna. Tairn turns out to be mated to Xaden's Sgaeyl, which ties Violet's life to Xaden's.","ch":[13,16]},
 {"b":"fw","t":"Flight training","hint":"New riders are learning to stay in the saddle.","s":"Violet learns to fly. A mind reader is killed in public. Seven unbonded cadets attack her at night, and Andarna stops time to save her. Xaden kills the attackers, and Amber Mavis is executed for planning it.","ch":[17,20]},
 {"b":"fw","t":"Channeling","hint":"Riders are waiting for their dragons' power to reach them.","s":"Liam tells Violet about the marked ones. Tairn starts channeling, Xaden teaches her to shield, and they kiss. Jack nearly kills her in a challenge, and leadership takes an interest in Andarna.","ch":[21,24]},
 {"b":"fw","t":"Squad Battle","hint":"Squads are competing for a chance to visit the front.","s":"Without their leaders, the squad steals the map from General Sorrengail's office and wins the Squad Battle.","ch":[25,25]},
 {"b":"fw","t":"Montserrat","hint":"The squad's prize trip has begun.","s":"The squad shadows riders at Montserrat, where Violet sees Mira. Gryphons attack when the wards fail, and Xaden flies in to get Violet out.","ch":[26,27]},
 {"b":"fw","t":"War Games","hint":"The wings are fighting over a practice fort.","s":"Jack stabs Liam in the air. Violet's signet finally manifests as lightning, and Jack falls in the collapse of a tower.","ch":[28,29]},
 {"b":"fw","t":"Lightning","hint":"Violet is learning what her signet can do.","s":"Violet and Xaden sleep together. She learns what his scars mean, finds a letter from her father, and on Reunification Day walks the parapet to tell Xaden she loves him.","ch":[30,32]},
 {"b":"fw","t":"Athebyne","hint":"The quadrant has been called out before dawn.","s":"War Games send Xaden's squad of marked ones, with Violet, to Athebyne beyond the wards. Gryphon fliers reveal Xaden has been arming them, venin are real, and the outpost is empty.","ch":[33,35]},
 {"b":"fw","t":"Resson","hint":"The squad must choose whether to fight.","s":"They defend the trading post of Resson from venin and wyvern. Soleil, Deigh and Liam die. Violet kills two venin, and their wyvern fall with them, but a poisoned blade brings her down.","ch":[36,37]},
 {"b":"fw","t":"Aretia","hint":"Violet is badly hurt.","s":"Xaden flies Violet to Aretia, the rebel city being quietly rebuilt. She agrees to fight with the rebellion but won't trust Xaden with her heart, and the person who mended her is her brother Brennan, alive.","ch":[38,39]},
 {"b":"if","ch":[1,2],"t":"Aretia","hint":"Violet has just woken up somewhere unfamiliar.","s":"Violet wakes in Aretia, mended by her brother Brennan, and meets the Assembly that runs the revolution. They need a luminary to forge more venin-killing daggers, and Aretia has a dormant wardstone no one knows how to wake. The Resson survivors vote to go back to Basgiath."},
 {"b":"if","ch":[3,7],"t":"Back at Basgiath","hint":"The survivors are heading back for graduation.","s":"Xaden graduates and is posted to Samara. A new vice commandant, Major Varrish, arrives, Rhiannon becomes squad leader, and Violet starts secretly researching how wards were made."},
 {"b":"if","ch":[8,11],"t":"New blood","hint":"A new class of candidates is crossing the parapet.","s":"Liam's sister Sloane and a prince under a false name join the squad. Varrish's dragon Solas burns cadets on Conscription Day, Nadine is killed by a first-year sent for Violet, and Violet kills him."},
 {"b":"if","ch":[12,13],"t":"Samara","hint":"Violet is flying to see Xaden at his posting.","s":"At Samara, Xaden explains the daggers' alloy and how outposts strengthen the wards. Back at Basgiath, Varrish and Carr punish Violet by making her strike lightning until she nearly burns out."},
 {"b":"if","ch":[14,17],"t":"Survival course","hint":"The squad has just been taken in the night.","s":"A survival exercise uses a new elixir that cuts riders off from their dragons, and a squad leader burns saving an infantry cadet. Jesinia starts lending Violet books off the record."},
 {"b":"if","ch":[18,21],"t":"Secrets","hint":"Violet's research is about to cause a fight.","s":"Xaden is furious about Violet's research. Tairn humbles Varrish in front of the quadrant, Mira explains how the wards stretch, and another Resson survivor dies. Dain tells Violet who carved Xaden's scars."},
 {"b":"if","ch":[22,25],"t":"Interrogation","hint":"The squad has been taken for interrogation training.","s":"Interrogation training turns into torture when Varrish brings in Dain, who refuses him. The squad escapes, leaflets about a fallen Poromish city appear, and Jack Barlowe returns from the dead."},
 {"b":"if","ch":[26,31],"t":"The drop","hint":"Violet has heard that Samara was attacked.","s":"Xaden is wounded defending Samara. Violet meets the fliers he arms, including his ex, Cat, tells her squad the truth, and survives another assassination attempt, saved by Jack."},
 {"b":"if","ch":[32,34],"t":"The vault","hint":"The squad is planning a theft.","s":"With Aaric's royal blood, the squad steals the journals of Warrick and Lyra from the royal vault. Then Nolon drugs Violet and Varrish takes her."},
 {"b":"if","ch":[35,36],"t":"The brig","hint":"Violet has been captured.","s":"Varrish tortures Violet for days. Dain sees Resson in her memories and turns on him, Xaden arrives, and Violet kills Varrish. Her mother tells her what she traded for Violet's life, and half the quadrant deserts to Aretia."},
 {"b":"if","ch":[37,39],"t":"The Assembly","hint":"The deserters are arriving in Aretia.","s":"Andarna wakes from her long sleep with a wing that can't carry a rider. Mira arrives with riders of her own, and the first attempt to wake Aretia's wardstone fails."},
 {"b":"if","ch":[40,42],"t":"Cordyn","hint":"Violet has slipped off to Poromiel.","s":"In Cordyn, Viscount Tecarus tests Violet against a captive venin. She kills it, and Aretia wins the luminary at the price of training a hundred flier cadets."},
 {"b":"if","ch":[43,44],"t":"Medaro Pass","hint":"Riders and fliers are climbing the cliffs together.","s":"Riders and fliers climb the secret Medaro Pass. A flier falls, riderless wyvern attack in the clouds, and Violet kills them by striking down into the cloud."},
 {"b":"if","ch":[45,50],"t":"Riders and fliers","hint":"The fliers are settling into Aretia.","s":"Trissa teaches runes, Cat cheats in a challenge, and Violet learns about Cat's old betrothal to Xaden. Drifts merge into squads, Dain helps translate, and Pavis falls to seven venin."},
 {"b":"if","ch":[51,56],"t":"Raising the wards","hint":"Violet is translating Warrick's journal again.","s":"Violet finds the journal means dragons' breath, not riders' blood. Solas kills Visia and Andarna kills him, Sloane turns out to be a siphon, Xaden reveals his second signet, and Aretia's wards stop a horde at the cliffs."},
 {"b":"if","ch":[57,58],"t":"Athebyne","hint":"Navarre has asked for a meeting.","s":"Melgren asks for help at Samara and is refused. Brennan confronts their mother, who gives Violet Lyra's journal and a warning. Violet realizes the real target is Basgiath."},
 {"b":"if","ch":[59,62],"t":"Solstice","hint":"The riders are flying back to Navarre.","s":"At Basgiath, Jack, secretly venin, kills his own dragon and breaks the wardstone. The horde comes at dawn, and Sawyer loses a leg."},
 {"b":"if","ch":[63,66],"t":"The seventh","hint":"The battle for Basgiath is underway.","s":"The wards need a seventh breed, and Andarna is it. Lilith gives her life to power the stone and the wards rise. Xaden kills the venin leader but drew power from the ground to do it."},
 {"b":"os","ch":[0,2],"t":"The morning after","hint":"The battle for Basgiath has just ended.","s":"Violet hides the red rings in Xaden's eyes, proof he channeled to win, and vows to find a cure. Two weeks later, venin disguised as scribes feed on the wounded and try to free Jack, and a silver-haired venin woman watches Violet and vanishes."},
 {"b":"os","ch":[3,8],"t":"The Senarium","hint":"Violet has been summoned before Navarre's nobles.","s":"Violet is put on a task force to find Andarna's kind. Her friends secretly change Basgiath's wardstone so fliers can wield inside it, which saves the alliance with Poromiel. Xaden is restored as Duke of Tyrrendor, and General Aetos, now in command of Basgiath, punishes Violet through her squad."},
 {"b":"os","ch":[9,11],"t":"A village in flames","hint":"The squad has been sent to Samara.","s":"Against orders, the squad defends a village near Samara. A venin named Theophanie hurls Tairn into a mountain with a tornado, names Andarna's kind as irids, and asks Violet to choose her as a teacher. Garrick's hidden second signet is revealed."},
 {"b":"os","ch":[12,18],"t":"Father's book","hint":"Violet is researching how the venin were beaten before.","s":"Xaden teaches Signet Sparring and keeps slipping. Dain smuggles out the book Violet's father hid, and its password points to a merchant on Deverelli. Prince Halden arrives, and the king of Deverelli offers an audience for a gem stranded in occupied land."},
 {"b":"os","ch":[19,21],"t":"The citrine","hint":"A small riot is flying into venin territory.","s":"In drained Anca, Aura panics and burns Captain Grady to death, then a wyvern kills her. The gem is there, with a note: Theophanie expected them. Violet refuses the Senarium's new commander, chooses her own squad, and flies south over the sea, where magic fades."},
 {"b":"os","ch":[22,27],"t":"The merchant isle","hint":"The squad has landed where no magic works.","s":"On Deverelli, riders are cut off from their dragons. Violet passes an old merchant's test and inherits six books her father wrote. At court the king executes Halden's guard for theft and turns on the squad. Xaden kills with power stored in alloy, and Violet buys an alliance with Andarna's eggshell."},
 {"b":"os","ch":[28,32],"t":"Trial by combat","hint":"The squad is back at Basgiath, briefly.","s":"A cadet who channels is executed on the sparring mat. Aaric reveals himself and takes Halden's place. On Unnbriel, the isle of Dunne, Violet wins a knife duel against an opponent who turns out to be the queen, and the queen's price for an army is dragon eggs."},
 {"b":"os","ch":[33,37],"t":"Family dinner","hint":"The squad has reached a city of pale stone.","s":"On Hedotis, Xaden finds the mother who left him. A dinner with the island's rulers turns into a poisoning; Garrick stops breathing and Violet answers poison with poison, then trades antidotes for an alliance."},
 {"b":"os","ch":[38,39],"t":"The festival","hint":"Crowds are waiting for the squad.","s":"On Zehyllna every guest must accept a gift from the god of luck. One of them is an arrow, and Trager dies with his gryphon. Aaric wins the isle's promise of forty thousand troops."},
 {"b":"os","ch":[40,43],"t":"Andarna's kind","hint":"The squad is searching unmapped isles.","s":"The irids find the squad. Andarna was left behind as a test of humans, and Violet failed it. There is no cure for Xaden, and the irids refuse to help. Ridoc learns the truth about Xaden, and news comes that Suniva has fallen and its queen is dead."},
 {"b":"os","ch":[44,49],"t":"Holding on","hint":"The squad is home, and the front is moving.","s":"Aretia's wards are failing. Xaden opens Tyrrendor to Poromish refugees and counts the days since he last channeled. A first-year manifests shadow, and Sawyer flies again."},
 {"b":"os","ch":[50,55],"t":"The temple","hint":"Violet and Xaden have woken from the same nightmare.","s":"Violet learns she walks in dreams. A horde tests Aretia, Theophanie attacks Dunne's temple, and an irid fires the wardstone, then takes Andarna away. Violet learns her parents once tried to give her to Dunne, and Xaden tells Mira he is venin."},
 {"b":"os","ch":[56,60],"t":"The ransom","hint":"Garrick has just arrived, badly hurt.","s":"Theophanie holds Mira at Draithus and demands a trade. She cuts Mira's throat anyway; Sloane siphons Dain's power to Brennan and Mira lives. Theophanie turns out to be a storm wielder."},
 {"b":"os","ch":[61,64],"t":"The battle for Draithus","hint":"The fight has split across the field, the pass and the city.","s":"Rhiannon's riders hold the Medaro Pass. Quinn dies defending civilians. Netted and grounded, Violet kills Theophanie with a stone dagger from Aaric under cover of Xaden's shadow storm, and Andarna comes back."},
 {"b":"os","ch":[65,66],"t":"Twelve hours","hint":"Xaden has been summoned away from the battle.","s":"A traitor and a Sage everyone thought dead trap Sgaeyl, and Xaden channels fully to save her. Violet wakes in Aretia twelve hours later, married, with no memory of it. Xaden is gone, and riders, dragons and eggs are missing."}
];

/* Threshing Day: n 0 is the essay, 1–13 the stories. line = chapter after which the whole story is spoiler-free. */
const STORIES=[
 {"n":0,"kind":"essay","t":"Trial by Fire","who":"Colonel Thadeus Palme","year":null,"line":"fw4","s":"A retired professor of Dragonkind advises whoever takes the job next: how to prepare cadets for the Threshing, why groups get burned, and why someone should finally write down how riders bonded."},
 {"n":1,"t":"Brennan","who":"brennan","dragon":"marbh","year":624,"line":"fw6","s":"On the morning of his Threshing, Brennan's scribe father slips into the valley to see him off. Brennan climbs a tree to watch for his dragon, and the one he least wanted dares him to reach its seat without touching the ground."},
 {"n":2,"t":"Mira","who":"mira","dragon":"teine","year":627,"line":"fw6","s":"With Brennan at the front of the Tyrrish rebellion, Mira waits in a treetop for the green she picked at Presentation. He tests her with pain and with her place in the family, and she doesn't move."},
 {"n":3,"t":"Xaden","who":"xaden","dragon":"sgaeyl","year":631,"line":"if48","s":"Xaden leads the first ten marked ones into the valley. When a prince holds a knife to Garrick's throat, Xaden kills him, and Sgaeyl, who watched all of it, cleans up and chooses him."},
 {"n":4,"t":"Garrick","who":"garrick","dragon":"chradh","year":631,"line":"if33","s":"Leaving Xaden alone with Sgaeyl, Garrick follows a voice that has been calling him all day, past Masen's bonding, to a brown he first takes for a boulder."},
 {"n":5,"t":"Dain","who":"dain","dragon":"cath","year":632,"line":"fw35","s":"Colonel Aetos corners Dain before the Threshing to warn him about the marked ones and steer him toward a green. Dain catches a falling second-year, then jumps for the red instead."},
 {"n":6,"t":"Bodhi","who":"bodhi","dragon":"cuir","year":632,"line":"if48","s":"Bodhi gives the marked ones in his year a shaky pep talk, and Xaden shadows him into the forest with news of which dragon is waiting. Tired of choices being made for him, Bodhi runs at the wrong one."},
 {"n":7,"t":"Imogen","who":"imogen","dragon":"glane","year":632,"line":"os63","s":"Imogen walks in furious and dodging Garrick, while an orange already in her head starts channeling before they've flown. Imogen knows exactly who that orange really is."},
 {"n":8,"t":"Rhiannon","who":"rhiannon","dragon":"feirge","year":633,"line":"fw16","s":"A voice has been calling Rhiannon since dawn. She stops to shield a burned squadmate from an orange, and the green she's been looking for arrives to back her up."},
 {"n":9,"t":"Sawyer","who":"sawyer","dragon":"sliseag","year":633,"line":"fw16","s":"On his second try, Sawyer teams up with Trina. She is chosen first, and then a red tells Sawyer why he was passed over the year before."},
 {"n":10,"t":"Ridoc","who":"ridoc","dragon":"aotrom","year":633,"line":"fw16","s":"Queasy and soaked, Ridoc tries to turn down a young brown for being too much like himself, then has to win him back."},
 {"n":11,"t":"Liam","who":"liam","dragon":"deigh","year":633,"line":"if48","s":"Liam whittles a figure of his dragon and waits where he was told to. Xaden stops by to check on him and gets teased about Violet."},
 {"n":12,"t":"Sloane","who":"sloane","dragon":"thoirt","year":634,"line":"if54","s":"Grieving Liam and determined never to wield, Sloane wants no dragon at all. Imogen, Dain and a red with a family tie change her mind."},
 {"n":13,"t":"Aaric","who":"aaric","dragon":"molvic","year":634,"line":"os64","s":"The prince hiding under a false name hunts the blue who never bonds, and tells him exactly what he means to do."}
