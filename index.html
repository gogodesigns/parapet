 {"id":"navarre","kind":"place","type":"realm","parent":"continent","name":"Navarre","appear":"fw1","tag":[{"t":"The kingdom Basgiath serves","at":"fw1"}],"rel":["basgiath","tyrrendor","morraine","deaconshire","poromiel"],"facts":[
  {"t":"The larger of the two kingdoms, with six provinces. Rich in ore, timber and game.","at":"fw2","v":1},
  {"t":"Its wards block every kind of magic except what dragons channel. They spread out from the Vale, which is why its borders are roughly round.","at":"fw5","v":1},
  {"t":"Its official histories are copies. Almost nothing older than four hundred years survives in the original, besides the Unification scrolls.","at":"fw35","v":1},
  {"t":"Its leaders know the venin are attacking Poromiel and do nothing, because the metal that kills venin is what powers the wards.","at":"fw35","v":1},
  {"t":"Six provinces: Calldyr, Deaconshire, Elsum, Luceras, Morraine and Tyrrendor.","at":"if21","v":1},
  {"t":"Its wards fall when Jack breaks Basgiath's wardstone, and rise again on solstice.","at":"if64","v":1},
  {"t":"The Senarium votes against weakening the wards for fliers.","at":"os6","v":1},
  {"t":"Signs the alliance once the wardstone has been changed.","at":"os7","v":1},
  {"t":"Close to war with Tyrrendor over the refugees.","at":"os55","v":1}]},
 {"id":"poromiel","kind":"place","type":"realm","parent":"continent","name":"Poromiel","appear":"fw1","tag":[{"t":"Navarre's old enemy","at":"fw1"},{"t":"Allied with Navarre","at":"os7"}],"rel":["navarre","krovla","braevick","cygnisen","resson","draithus"],"facts":[
  {"t":"The kingdom Navarre is at war with. Plains and marshland, known for textiles, grain and gems that boost minor magic.","at":"fw2","v":1},
  {"t":"Its riders, called fliers, bond gryphons rather than dragons.","at":"fw5","v":1},
  {"t":"Has been fighting the venin for years with no wards to shelter behind. Its border raids are hunts for the metal that kills them.","at":"fw35","v":1},
  {"t":"Queen Maraya has named Viscount Tecarus her heir.","at":"if41","v":1},
  {"t":"A venin once killed its King Grethwild.","at":"if61","v":1},
  {"t":"Walks out of peace talks at Basgiath.","at":"os1","v":1},
  {"t":"Returns to the talks once fliers can wield inside the wards.","at":"os7","v":1},
  {"t":"Its queen dies when Suniva falls.","at":"os43","v":1}]},
 {"id":"tyrrendor","kind":"place","type":"province","parent":"navarre","name":"Tyrrendor","appear":"fw1","tag":[{"t":"Navarre's southern province","at":"fw1"},{"t":"Ruled by its duke again","at":"os6"}],"rel":["aretia","xaden","bodhi","dralor"],"facts":[
  {"t":"Home of most of the marked ones. Its leaders' rebellion failed.","at":"fw1","v":1},
  {"t":"Navarre's southernmost and largest province, bordering Krovla. Last to join the kingdom, it tried to break away centuries later.","at":"fw2","v":1},
  {"t":"Supplies most of Navarre's conscripts, and has seen protests over conscription.","at":"fw25","v":1},
  {"t":"The Cliffs of Dralor give it a natural defense, which made its rebellion nearly succeed.","at":"fw34","v":1},
  {"t":"Its seat on the king's council passed from House Riorson to House Lewellen after the rebellion.","at":"if48","v":1},
  {"t":"Hasn't had a crown in over six hundred years.","at":"if49","v":1},
  {"t":"Xaden is restored as its duke.","at":"os6","v":1},
  {"t":"Opens its border to Poromish refugees.","at":"os46","v":1},
  {"t":"Halts talladium shipments to Navarre.","at":"os55","v":1}]},
 {"id":"morraine","kind":"place","type":"province","parent":"navarre","name":"Morraine","appear":"fw3","tag":[{"t":"Navarrian province","at":"fw3"}],"rel":["navarre"],"facts":[
  {"t":"A province on Navarre's north coast, on the Emerald Sea.","at":"fw3","v":1}]},
 {"id":"deaconshire","kind":"place","type":"province","parent":"navarre","name":"Deaconshire","appear":"fw25","tag":[{"t":"Navarrian province","at":"fw25"}],"rel":["nadine","tyrrendor"],"facts":[
  {"t":"A Navarrian province that borders Tyrrendor. Nadine grew up near the border.","at":"fw25","v":1}]},
 {"id":"krovla","kind":"place","type":"province","parent":"poromiel","name":"Krovla","appear":"fw2","tag":[{"t":"Poromish province","at":"fw2"}],"rel":["tyrrendor","athebyne","resson"],"facts":[
  {"t":"The Poromish province across the border from Tyrrendor. The Barrens lie beyond it.","at":"fw2","v":1},
  {"t":"Cordyn lies on its southern coast; Draithus is its second-largest city.","at":"if40","v":1}]},
 {"id":"braevick","kind":"place","type":"province","parent":"poromiel","name":"Braevick","appear":"fw2","tag":[{"t":"Poromish province","at":"fw2"}],"rel":["chakir"],"facts":[
  {"t":"A Poromish province. Gryphons from Braevick attack the village of Chakir.","at":"fw5","v":1},
  {"t":"Venin have spread across the Dunness River into it. Its city Zolya falls.","at":"if25","v":1}]},
 {"id":"cygnisen","kind":"place","type":"province","parent":"poromiel","name":"Cygnisen","appear":"fw2","tag":[{"t":"Poromish province","at":"fw2"}],"rel":["rhiannon"],"facts":[
  {"t":"A Poromish province. Rhiannon's village sits near its border.","at":"fw5","v":1}]},
 {"id":"barrens","kind":"place","type":"terrain","parent":"continent","name":"The Barrens","appear":"fw2","tag":[{"t":"Desert beyond Krovla","at":"fw2"}],"rel":["krovla"],"facts":[
  {"t":"A desert beyond Krovla, at the southern tip of the Continent.","at":"fw2","v":1},
  {"t":"In the old fables, the venin's homeland.","at":"fw31","v":1},
  {"t":"The venin drained its magic and then spread outward.","at":"fw35","v":1},
  {"t":"Painted red on Aretia's war map: venin territory since the Great War.","at":"if2","v":1}]},
 {"id":"esben","kind":"place","type":"terrain","parent":"continent","name":"Esben Mountains","appear":"fw2","tag":[{"t":"Eastern border range","at":"fw2"}],"rel":["montserrat","chakir"],"facts":[
  {"t":"The mountains forming Navarre's eastern border.","at":"fw2","v":1},
  {"t":"The wards falter over them when Chakir is attacked.","at":"fw5","v":1},
  {"t":"Under a treaty, Navarre and Krovla share the airspace over one strip of them.","at":"fw11","v":1}]},
 {"id":"dralor","kind":"place","type":"terrain","parent":"tyrrendor","name":"Cliffs of Dralor","appear":"fw2","tag":[{"t":"Tyrrendor's cliffs","at":"fw2"}],"rel":["tyrrendor","athebyne"],"facts":[
  {"t":"Thousand-foot cliffs that wall off Tyrrendor.","at":"fw2","v":1},
  {"t":"The route to Athebyne skirts them.","at":"fw34","v":1},
  {"t":"Over twelve thousand feet high in places, too high for gryphons to fly.","at":"if43","v":1},
  {"t":"Aretia's ward ends just short of the edge.","at":"if56","v":1},
  {"t":"The squad dives down the cliffs past refugees on the pass.","at":"os58","v":1}]},
 {"id":"emerald","kind":"place","type":"terrain","parent":"continent","name":"Emerald Sea","appear":"fw2","tag":[{"t":"Western sea","at":"fw2"}],"rel":["tyrrendor","morraine"],"facts":[
  {"t":"The sea west of Tyrrendor, along Navarre's coast.","at":"fw2","v":1}]},
 {"id":"arctile","kind":"place","type":"terrain","parent":"continent","name":"Arctile Ocean","appear":"fw2","tag":[{"t":"Southern ocean","at":"fw2"}],"rel":["tyrrendor"],"facts":[
  {"t":"The ocean south of Tyrrendor.","at":"fw2","v":1}]},
 {"id":"iakobos","kind":"place","type":"terrain","parent":"navarre","name":"Iakobos River","appear":"fw7","tag":[{"t":"River below Basgiath","at":"fw7"}],"rel":["basgiath"],"facts":[
  {"t":"The river below the college. Violet gathers poison ingredients near it.","at":"fw7","v":1}]},
 {"id":"calldyr","kind":"place","type":"city","parent":"navarre","name":"Calldyr","appear":"fw21","tag":[{"t":"Navarrian city","at":"fw21"}],"rel":["navarre"],"facts":[
  {"t":"Where the rebellion's leaders were executed. A death roll lists the names.","at":"fw21","v":1},
  {"t":"The king's seat, and also the name of one of Navarre's six provinces.","at":"if21","v":1}]},
 {"id":"aretia","kind":"place","type":"city","parent":"tyrrendor","name":"Aretia","appear":"fw21","tag":[{"t":"Burned rebel capital","at":"fw21"},{"t":"Being quietly rebuilt","at":"fw39"},{"t":"Under its own ward","at":"if56"},{"t":"Its ward weakening","at":"if65"}],"rel":["tyrrendor","xaden","brennan","riorson","amari"],"facts":[
  {"t":"Tyrrendor's capital. Burned after the rebellion.","at":"fw21","v":1},
  {"t":"Xaden grounds his power by picturing a hillside near its ruins.","at":"fw22","v":1},
  {"t":"The rebellion ended with the Battle of Aretia. Its anniversary, July 1, is celebrated as Reunification Day.","at":"fw31","v":1},
  {"t":"Being rebuilt in secret, with green roofs. No one advertises it, and nobles never wanted the scorched land.","at":"fw39","v":1},
  {"t":"Home of the Assembly. Outside Navarre's wards, with a dormant wardstone.","at":"if2","v":1},
  {"t":"Takes in the riders who desert Basgiath.","at":"if36","v":1},
  {"t":"Its valley becomes a hatching ground again when the first dragon hatches there.","at":"if43","v":1},
  {"t":"Families of the revolution arrive under offers of sanctuary.","at":"if45","v":1},
  {"t":"Its wards rise just before a wyvern horde reaches the cliffs.","at":"if56","v":1},
  {"t":"Its wards will weaken over time, Lilith warns.","at":"if57","v":1},
  {"t":"Its wards are failing.","at":"os45","v":1},
  {"t":"A horde tests its walls.","at":"os51","v":1},
  {"t":"Its wardstone is fired by an irid.","at":"os52","v":1}]},
 {"id":"riorson","kind":"place","type":"landmark","parent":"aretia","name":"Riorson House","appear":"fw39","tag":[{"t":"The Riorson fortress","at":"fw39"}],"rel":["xaden","violet"],"facts":[
  {"t":"The Riorson family's stone fortress above Aretia. Stone doesn't burn, so it survived.","at":"fw39","v":1},
  {"t":"Where Violet wakes after Resson, in Xaden's room.","at":"fw39","v":1},
  {"t":"A fortress carved into the mountain, never breached by an army.","at":"if1","v":1},
  {"t":"The Assembly meets in the great hall, by a throne that was Tyrrendor's.","at":"if48","v":1},
  {"t":"Xaden used to wait on its roof for his father to come home.","at":"if51","v":1},
  {"t":"Where Violet wakes after Draithus.","at":"os66","v":1}]},
 {"id":"amari","kind":"place","type":"landmark","parent":"aretia","name":"Temple of Amari","appear":"fw39","tag":[{"t":"Temple in Aretia","at":"fw39"}],"rel":["aretia"],"facts":[
  {"t":"Aretia's best-known landmark, with distinctive columns Violet recognizes from drawings.","at":"fw39","v":1}]},
 {"id":"dunnetemple","kind":"place","type":"landmark","parent":"aretia","name":"Temple of Dunne","appear":"os51","tag":[{"t":"Temple outside Aretia","at":"os51"}],"rel":["theophanie","violet"],"facts":[
  {"t":"Aaric asks Violet to protect it.","at":"os51","v":1},
  {"t":"Its attendants bleach their hair. Theophanie attacks it.","at":"os52","v":1},
  {"t":"Its high priestess owes Xaden a favor.","at":"os55","v":1},
  {"t":"A dagger carved from its stone kills Theophanie.","at":"os64","v":1},
  {"t":"Its head priestess blesses Violet's marriage.","at":"os66","v":1}]},
 {"id":"tirvainne","kind":"place","type":"city","parent":"navarre","name":"Tirvainne","appear":"fw21","tag":[{"t":"Where Liam and Xaden were fostered","at":"fw21"}],"rel":["liam","xaden"],"facts":[
  {"t":"Where Liam and Xaden were fostered after their parents' executions.","at":"fw21","v":1}]},
 {"id":"chakir","kind":"place","type":"city","parent":"navarre","name":"Chakir","appear":"fw5","tag":[{"t":"Village attacked through the wards","at":"fw5"}],"rel":["esben","braevick"],"facts":[
  {"t":"A village by the Esben Mountains. Gryphons kill thirty-seven people there when the wards falter.","at":"fw5","v":1}]},
 {"id":"sumerton","kind":"place","type":"city","parent":"navarre","name":"Sumerton","appear":"fw11","tag":[{"t":"Southern border village","at":"fw11"}],"rel":["markham"],"facts":[
  {"t":"Marks one end of the shared airspace strip over the Esben Mountains.","at":"fw11","v":1},
  {"t":"Raided: village ransacked, convoy looted, storage caves broken into. It never comes up in Battle Brief.","at":"fw21","v":1}]},
 {"id":"cranston","kind":"place","type":"city","parent":"navarre","name":"Cranston","appear":"fw26","tag":[{"t":"Border village","at":"fw26"}],"rel":["mira"],"facts":[
  {"t":"Where Mira took a gryphon's claws when the wards went down. The attack was never reported to cadets.","at":"fw26","v":1}]},
 {"id":"basgiath","kind":"place","type":"grounds","parent":"navarre","name":"Basgiath War College","appear":"fw1","tag":[{"t":"Where the story is set","at":"fw1"}],"rel":["lilith","aetos","vale","archives","parapet","gauntlet"],"facts":[
  {"t":"Navarre's war college, split into the Riders, Scribe, Healer and Infantry quadrants.","at":"fw1","v":1},
  {"t":"Commanded by General Lilith Sorrengail.","at":"fw1","v":1},
  {"t":"The Riders Quadrant is the only one that takes volunteers, and most who fail there die.","at":"fw1","v":1},
  {"t":"The quadrant has four wings, each with three sections of squads.","at":"fw3","v":1},
  {"t":"Has its own forge and luminary.","at":"if1","v":1},
  {"t":"Its wards fall when Jack kills Baide in the ward chamber.","at":"if59","v":1},
  {"t":"Attacked at dawn on solstice by a horde of wyvern and venin.","at":"if61","v":1},
  {"t":"Its wards rise again, powered by Lilith and fired by seven dragons.","at":"if64","v":1},
  {"t":"Venin get inside and feed on the wounded.","at":"os2","v":1},
  {"t":"Its wardstone is changed so fliers can wield.","at":"os7","v":1}]},
 {"id":"parapet","kind":"place","type":"grounds","parent":"basgiath","name":"The parapet","appear":"fw1","tag":[{"t":"Entry to the Riders Quadrant","at":"fw1"}],"rel":["basgiath"],"facts":[
  {"t":"A stone bridge about eighteen inches wide and two hundred feet up. Candidates must cross it to enter the quadrant.","at":"fw1","v":1},
  {"t":"This year, 67 candidates die on it.","at":"fw3","v":1},
  {"t":"Violet walks it again, barefoot and in a dress, to reach Xaden on Reunification Day.","at":"fw32","v":1}]},
 {"id":"archives","kind":"place","type":"grounds","parent":"basgiath","name":"The Archives","appear":"fw1","tag":[{"t":"Scribe Quadrant","at":"fw1"}],"rel":["violet","jesinia","basgiath"],"facts":[
  {"t":"The Scribe Quadrant's archive, where Violet trained before conscription.","at":"fw1","v":1},
  {"t":"Violet runs errands there as a rider. The air is kept low to prevent fires.","at":"fw18","v":1},
  {"t":"Has no books at all on wyvern or venin.","at":"fw18","v":1},
  {"t":"Violet's mental grounding place.","at":"fw22","v":1},
  {"t":"Missing whole subjects, like folklore about wyvern. Jesinia thinks it's deliberate.","at":"if16","v":1}]},
 {"id":"vale","kind":"place","type":"grounds","parent":"basgiath","name":"The Vale","appear":"fw3","tag":[{"t":"Where the dragons live","at":"fw3"}],"rel":["basgiath","gauntlet","tairn","andarna"],"facts":[
  {"t":"The valley behind Basgiath where the dragons live. Navarre's wards radiate from it.","at":"fw3","v":1},
  {"t":"The Threshing happens in a forested valley there, every October 1.","at":"fw13","v":1},
  {"t":"The hatching grounds Basgiath was built to protect, and the venin's real target.","at":"if58","v":1}]},
 {"id":"gauntlet","kind":"place","type":"grounds","parent":"basgiath","name":"The Gauntlet","appear":"fw4","tag":[{"t":"Obstacle cliff","at":"fw4"}],"rel":["vale"],"facts":[
  {"t":"An obstacle course built into the cliff guarding the Vale.","at":"fw4","v":1},
  {"t":"Five climbs, with spinning logs and posts, swinging balls and a near-vertical ramp. Times decide the order at Presentation.","at":"fw10","v":1}]},
 {"id":"montserrat","kind":"place","type":"outpost","parent":"navarre","name":"Montserrat","appear":"fw26","tag":[{"t":"Eastern outpost","at":"fw26"}],"rel":["mira","esben"],"facts":[
  {"t":"An outpost in the Esben Mountains, built for siege and called the safest post on the border.","at":"fw26","v":1},
  {"t":"Gryphons attack it while the squad is visiting and the wards go down.","at":"fw27","v":1}]},
 {"id":"eltuval","kind":"place","type":"outpost","parent":"navarre","name":"Eltuval","appear":"fw33","tag":[{"t":"Southeastern outpost","at":"fw33"}],"rel":["dain"],"facts":[
  {"t":"The northernmost outpost in Fourth Wing's War Games region. Dain picks it for Second Squad.","at":"fw33","v":1},
  {"t":"Where Fourth Wing's headquarters is moved without telling Xaden.","at":"fw36","v":1}]},
 {"id":"athebyne","kind":"place","type":"outpost","parent":"navarre","name":"Athebyne","appear":"fw2","tag":[{"t":"Border outpost","at":"fw2"}],"rel":["resson","aetos","dralor"],"facts":[
  {"t":"An outpost on the Krovla–Tyrrendor border, near where trades with Poromiel take place under the Resson agreement.","at":"fw2","v":1},
  {"t":"Letters on General Sorrengail's desk say raids around it are stretching the wing thin, and it may be abandoned.","at":"fw25","v":1},
  {"t":"Lies beyond the wards. Xaden's squad is posted there for War Games.","at":"fw33","v":1},
  {"t":"A square mountainside fort meant for about two hundred people. The squad finds it completely empty.","at":"fw35","v":1},
  {"t":"Attacked by fliers; two reach the armory.","at":"if9","v":1},
  {"t":"Where Melgren meets the revolution's leaders.","at":"if57","v":1}]},
 {"id":"resson","kind":"place","type":"outpost","parent":"poromiel","name":"Resson","appear":"fw2","tag":[{"t":"Poromish trading post","at":"fw2"},{"t":"Site of the battle","at":"fw36"}],"rel":["athebyne","liam","deigh","soleil"],"facts":[
  {"t":"Gives its name to the trade agreement between the kingdoms.","at":"fw2","v":1},
  {"t":"A walled trading post in the valley below Athebyne. It has changed hands eleven times.","at":"fw34","v":1},
  {"t":"Over three hundred people live there. The venin attacking it seem to be after something near its clock tower.","at":"fw36","v":1},
  {"t":"Where Soleil, Deigh and Liam die.","at":"fw36","v":1}]},
 {"id":"draithus","kind":"place","type":"city","parent":"poromiel","name":"Draithus","appear":"fw11","tag":[{"t":"Poromish city","at":"fw11"},{"t":"Under siege","at":"os56"}],"rel":["theophanie","mira"],"facts":[
  {"t":"Marks one end of the shared airspace strip over the Esben Mountains.","at":"fw11","v":1},
  {"t":"The fliers at Resson patrol from it, an hour southeast of Athebyne.","at":"fw35","v":1},
  {"t":"Krovla's second-largest city. Riderless wyvern patrol as far as its edge.","at":"if42","v":1},
  {"t":"The last Poromish stronghold before the Cliffs of Dralor. Xaden kills a venin outside it.","at":"if52","v":1},
  {"t":"Overflowing with refugees and short of supplies.","at":"os44","v":1},
  {"t":"Theophanie holds Mira in the field north of it.","at":"os56","v":1},
  {"t":"Its new wards end at the city.","at":"os65","v":1}]},
 {"id":"samara","kind":"place","type":"outpost","parent":"navarre","name":"Samara","appear":"if6","tag":[{"t":"Xaden's posting","at":"if6"}],"rel":["xaden"],"facts":[
  {"t":"The easternmost outpost of the Southern Wing, near where Krovla meets Braevick.","at":"if6","v":1},
  {"t":"High in the Esben Mountains, twice the size of other outposts. Its lieutenants fight in a pit for passes.","at":"if12","v":1},
  {"t":"Holds one of the biggest stores of alloy powering the wards.","at":"if20","v":1},
  {"t":"Attacked by fliers; Xaden is badly wounded.","at":"if27","v":1},
  {"t":"Melgren foresees the venin overrunning it on solstice, and asks Aretia for help. Aretia says no.","at":"if57","v":1},
  {"t":"The horde massed outside it turns out to be a feint.","at":"if58","v":1},
  {"t":"A wyvern smashes its west wall.","at":"os9","v":1},
  {"t":"The venin's push is centered on it.","at":"os13","v":1}]},
 {"id":"newhall","kind":"place","type":"city","name":"Newhall","appear":"os9","tag":[{"t":"Village near Samara","at":"os9"}],"rel":["theophanie"],"facts":[
  {"t":"A small village on the Stonewater River, half an hour from Samara. Maren's family fled there.","at":"os9","v":1},
  {"t":"Raided by the venin as a trap for Violet.","at":"os10","v":1}]},
 {"id":"anca","kind":"place","type":"city","name":"Anca","appear":"if38","tag":[{"t":"Drained by the venin","at":"if38"},{"t":"Drained and empty","at":"os19"}],"rel":[],"facts":[
  {"t":"Near Zolya; the venin take it, drain it, and pull back.","at":"if38","v":1},
  {"t":"Holds the Amelian Citrine.","at":"os17","v":1},
  {"t":"Drained and deserted. Grady and Aura die there.","at":"os19","v":1}]},
 {"id":"medaro","kind":"place","type":"outpost","name":"Medaro Pass","appear":"if43","tag":[{"t":"Secret path up the cliffs","at":"if43"},{"t":"The refugees' road","at":"os46"}],"rel":["rhiannon"],"parent":"dralor","facts":[
  {"t":"A hidden trail up the Cliffs of Dralor, built to kill gryphons. Riders and fliers climb it together.","at":"if43","v":1},
  {"t":"Poromish refugees climb it into Tyrrendor.","at":"os46","v":1},
  {"t":"Rhiannon's riders hold its mouth against wyvern.","at":"os61","v":1}]},
 {"id":"isles","kind":"place","type":"region","name":"The Isle Kingdoms","appear":"if16","tag":[{"t":"Island kingdoms","at":"if16"}],"rel":["deverelli","hedotis","zehyllna"],"facts":[
  {"t":"Navarre's allies in the Great War.","at":"if16","v":1},
  {"t":"Unification ended travel to them.","at":"if21","v":1},
  {"t":"Five large islands and thirteen smaller ones.","at":"if38","v":1},
  {"t":"Navarre cut off most of them centuries ago when they sided with Poromiel.","at":"os13","v":1},
  {"t":"Hundreds more lie unmapped.","at":"os40","v":1}]},
 {"id":"deverelli","kind":"place","type":"isle","parent":"isles","name":"Deverelli","appear":"if41","tag":[{"t":"An isle kingdom","at":"if41"},{"t":"Allied, for a price","at":"os27"}],"rel":["halden","isles"],"facts":[
  {"t":"Its silk is prized in Cordyn; Poromiel traded with it until recently.","at":"if41","v":1},
  {"t":"The last isle Navarre dealt with.","at":"os14","v":1},
  {"t":"Has no magic. Riders are cut off from their dragons.","at":"os22","v":1},
  {"t":"Ruled by King Courtlyn. It stays neutral and profits from others' wars.","at":"os26","v":1},
  {"t":"Allies with the riders in exchange for an irid eggshell.","at":"os27","v":1}]},
 {"id":"hedotis","kind":"place","type":"isle","parent":"isles","name":"Hedotis","appear":"os28","tag":[{"t":"Major isle","at":"os28"},{"t":"Allied","at":"os37"}],"rel":["xaden","isles"],"facts":[
  {"t":"Ruled by a triumvirate. Has no port.","at":"os33","v":1},
  {"t":"Allies with the riders through family ties to Tyrrendor's duke.","at":"os37","v":1}]},
 {"id":"zehyllna","kind":"place","type":"isle","parent":"isles","name":"Zehyllna","appear":"os28","tag":[{"t":"Major isle","at":"os28"},{"t":"Allied","at":"os39"}],"rel":["isles","molvic"],"facts":[
  {"t":"An archipelago with a trickle of magic: enough to hear a bond, not enough to wield.","at":"os37","v":1},
  {"t":"Guests must accept a gift from the god of luck.","at":"os38","v":1},
  {"t":"Promises an advance party, then forty thousand troops.","at":"os39","v":1},
  {"t":"Its advance party reaches Draithus.","at":"os62","v":1}]},
 {"id":"zolya","kind":"place","type":"city","parent":"braevick","name":"Zolya","appear":"if1","tag":[{"t":"Poromish city","at":"if1"},{"t":"Fallen to the venin","at":"if25"}],"rel":["cliffsbane"],"facts":[
  {"t":"A major city in Braevick, home of the fliers' academy.","at":"if2","v":1},
  {"t":"Falls to the venin; leaflets blaming dragons appear at Basgiath.","at":"if25","v":1}]},
 {"id":"cliffsbane","kind":"place","type":"landmark","parent":"zolya","name":"Cliffsbane Academy","appear":"if2","tag":[{"t":"Flier academy","at":"if2"}],"rel":["zolya","cat"],"facts":[
  {"t":"Where Poromiel trains its fliers.","at":"if2","v":1},
  {"t":"Many of its cadets take shelter in Cordyn after Zolya falls.","at":"if40","v":1},
  {"t":"Fliers bond by jumping from its cliffs onto passing gryphons.","at":"if43","v":1}]},
 {"id":"cordyn","kind":"place","type":"city","parent":"krovla","name":"Cordyn","appear":"if29","tag":[{"t":"Tecarus's city","at":"if29"}],"rel":["tecarus"],"facts":[
  {"t":"Viscount Tecarus's city on Krovla's southern coast.","at":"if32","v":1},
  {"t":"Its marble palace overlooks turquoise water. Tecarus keeps an arena for testing venin.","at":"if41","v":1},
  {"t":"The squad stops at Tecarus's palace on the way south.","at":"os21","v":1}]},
 {"id":"pavis","kind":"place","type":"city","parent":"poromiel","name":"Pavis","appear":"if50","tag":[{"t":"Taken by the venin","at":"if50"}],"rel":["draithus"],"facts":[
  {"t":"A town an hour east of Draithus. Seven venin take it, and Nyra Voldaren dies defending it.","at":"if50","v":1},
  {"t":"Theophanie watches the squad fly over it.","at":"os43","v":1}]},
 {"id":"pelham","kind":"place","type":"outpost","parent":"navarre","name":"Pelham","appear":"if26","tag":[{"t":"Outpost","at":"if26"}],"rel":[],"facts":[

/* ---------- DATA: Harry Potter ----------
   Positions are chapters: 'ss4' = Sorcerer's Stone, chapter 4. Books written into the guide so far: Sorcerer's Stone, Chamber of Secrets, Prisoner of Azkaban, Goblet of Fire, Order of the Phoenix, Half-Blood Prince, Deathly Hallows.

const BOOKS=[{"id":"ss","name":"Sorcerer's Stone","abbr":"SS","first":1,"last":17},{"id":"cs","name":"Chamber of Secrets","abbr":"CS","first":1,"last":18},{"id":"pa","name":"Prisoner of Azkaban","abbr":"PA","first":1,"last":22},{"id":"gf","name":"Goblet of Fire","abbr":"GF","first":1,"last":37},{"id":"op","name":"Order of the Phoenix","abbr":"OP","first":1,"last":38},{"id":"hb","name":"Half-Blood Prince","abbr":"HBP","first":1,"last":30},{"id":"dh","name":"Deathly Hallows","abbr":"DH","first":1,"last":37,"epi":37}];

const BEATS=[
 {"b":"ss","t":"The night on Privet Drive","hint":"An ordinary street is about to have some very odd visitors.","s":"Mr. Dursley spends a day noticing owls, cloaks and whispers about people called Potter. That night Albus Dumbledore puts out the street lamps on Privet Drive, Professor McGonagall confirms that Voldemort has killed Lily and James Potter and somehow failed to kill their son, and Hagrid arrives on a flying motorcycle with the baby. Harry is left on his aunt and uncle's doorstep with a letter and a scar.","ch":[1,1]},
 {"b":"ss","t":"The letters","hint":"Harry is nearly eleven, and someone is very keen to write to him.","s":"Ten years on, Harry sleeps in a cupboard and is blamed for every odd thing that happens near him, including a zoo snake's escape. Letters addressed to him begin to arrive, and his uncle goes to greater and greater lengths to stop him reading one, ending in a hut on a rock at sea. At midnight on Harry's birthday Hagrid breaks the door down, tells him he is a wizard, and tells him the truth about his parents.","ch":[2,4]},
 {"b":"ss","t":"Into the wizarding world","hint":"There is a school list to buy, and a train to catch.","s":"Hagrid takes Harry through the Leaky Cauldron into Diagon Alley, where he finds he is rich and famous, buys a wand with an unsettling twin, and watches Hagrid collect a small package from a vault at Gringotts. A month later he walks through a barrier at King's Cross, meets the Weasleys, and shares a compartment with Ron. He also meets Hermione, Neville and Draco Malfoy, whose friendship he refuses.","ch":[5,6]},
 {"b":"ss","t":"First weeks at Hogwarts","hint":"The first weeks of term, and a rule broken at midnight.","s":"The Sorting Hat puts Harry in Gryffindor with Ron, Hermione and Neville, and Malfoy in Slytherin. Lessons begin, and Professor Snape takes against Harry at once. Harry's first time on a broom earns him a place as Gryffindor Seeker. A midnight duel that turns out to be a trap sends Harry, Ron, Hermione and Neville running into a forbidden corridor, where a three-headed dog stands on a trapdoor.","ch":[7,9]},
 {"b":"ss","t":"Halloween and the first match","hint":"A feast is interrupted, and Harry plays his first game.","s":"A troll gets into the castle at Halloween. Harry and Ron go to warn Hermione and end up fighting it, and the three become friends. Harry notices Snape limping from a bitten leg. In his first Quidditch match his broom tries to throw him; Hermione is sure Snape is jinxing it and sets his robes on fire, and Harry wins. Hagrid lets slip that the dog is called Fluffy and that what it guards concerns someone named Nicolas Flamel.","ch":[10,11]},
 {"b":"ss","t":"Christmas and the Mirror","hint":"The castle empties for the holidays, and a name needs finding.","s":"Harry is given an Invisibility Cloak that was his father's. Exploring at night, he finds the Mirror of Erised and sees his family in it, until Dumbledore explains what it does and moves it. After weeks in the library the three learn that Nicolas Flamel made the Sorcerer's Stone, which gives gold and endless life. Snape referees the next match, Harry ends it in minutes, and then overhears Snape threatening Quirrell in the forest.","ch":[12,13]},
 {"b":"ss","t":"The dragon and the forest","hint":"Hagrid has a secret that is growing fast.","s":"Hagrid wins a dragon egg from a stranger and hatches it. Harry and Hermione get Norbert away to Charlie Weasley's friends but are caught coming back, with Neville and Malfoy, and Gryffindor loses a hundred and fifty points. Their detention is in the forest, where something is killing unicorns. Harry meets a hooded figure drinking the blood, and the centaur Firenze leads him to understand that it is Voldemort, waiting for the Stone.","ch":[14,15]},
 {"b":"ss","t":"Under the trapdoor","hint":"Exams are over, and Dumbledore has been called away.","s":"Harry realises the stranger with the egg was after the secret of getting past Fluffy. With Dumbledore gone, he, Ron and Hermione go through the trapdoor and past each teacher's defense, losing Ron at the chessboard and sending Hermione back at the potions. In the last room is Quirrell, with Voldemort living on the back of his head. The Mirror gives Harry the Stone, Quirrell cannot touch him, and Dumbledore arrives in time. The Stone is destroyed, and Gryffindor wins the House Cup.","ch":[16,17]},
 {"b":"cs","t":"A warning and a rescue","hint":"Harry has had a silent summer, and a visitor is waiting in his bedroom.","s":"Harry spends the summer cut off from his friends. On the night of an important Dursley dinner party a house-elf named Dobby appears, warns him that terrible things will happen at Hogwarts this year, admits to stopping his letters, and wrecks the party to keep him home. The Ministry blames Harry for the magic, the Dursleys lock him in, and Ron, Fred and George break him out in their father's flying car and take him to the Burrow.","ch":[1,3]},
 {"b":"cs","t":"Back to school the hard way","hint":"There are books to buy, and a train that will not wait.","s":"A Floo powder mishap drops Harry in a Dark Arts shop, where he overhears Lucius Malfoy selling things he should not own. At the bookshop the celebrated Gilderoy Lockhart announces he is the new Defense Against the Dark Arts teacher, and Mr. Malfoy and Mr. Weasley come to blows. On the first of September the barrier at King's Cross will not let Harry and Ron through, so they fly the car to Hogwarts, crash into the Whomping Willow and are nearly expelled.","ch":[4,5]},
 {"b":"cs","t":"A voice in the walls","hint":"Lessons begin with a teacher who mostly talks about himself.","s":"Lockhart turns out to be useless, Ron's broken wand keeps backfiring, and Draco Malfoy buys his way onto the Slytherin team and calls Hermione a foul name. Harry begins to hear a cold voice nobody else can hear. After Nearly Headless Nick's deathday party at Halloween he follows it to a corridor where a message on the wall says the Chamber of Secrets has been opened, and Filch's cat hangs stiff beside it.","ch":[6,8]},
 {"b":"cs","t":"The legend and the attacks","hint":"Everyone wants to know what the Chamber is, and who opened it.","s":"The school learns the legend: Salazar Slytherin built a hidden chamber holding a monster that only his heir can control, to rid the school of Muggle-borns. The three suspect Malfoy and start brewing Polyjuice Potion to question him in disguise. A Bludger breaks Harry's arm, Dobby admits he was behind it, and a first year is found Petrified. At a duelling club Harry speaks to a snake, and when a classmate and a ghost are attacked next, half the school decides Harry is the heir.","ch":[9,11]},
 {"b":"cs","t":"Disguises and a diary","hint":"It is nearly Christmas, and the potion is nearly ready.","s":"Harry meets Dumbledore's phoenix. At Christmas he and Ron become Crabbe and Goyle for an hour and learn that Malfoy is not the heir, though the Chamber was opened once before, fifty years ago, and someone died. Hermione's dose goes wrong. Then Harry finds a blank diary in a flooded bathroom. Its owner, Tom Riddle, answers when written to, and shows him a memory in which the culprit caught fifty years ago was Hagrid.","ch":[12,13]},
 {"b":"cs","t":"Follow the spiders","hint":"The diary goes missing, and the attacks have not stopped.","s":"The diary is stolen from Harry's dormitory. Hermione and a Ravenclaw prefect are Petrified, Hagrid is taken to Azkaban as a precaution, and Dumbledore is suspended by the school governors. Following Hagrid's hint, Harry and Ron trail the spiders into the forest to Aragog, the giant spider Hagrid raised. Aragog says Hagrid never opened the Chamber, the real monster is something spiders dread, and the girl who died was found in a bathroom.","ch":[14,15]},
 {"b":"cs","t":"Into the Chamber","hint":"A note in a Petrified hand, and a second message on the wall.","s":"A page in Hermione's hand names the monster: a basilisk, moving through the pipes. Then Ginny Weasley is taken into the Chamber. Harry and Ron find the entrance in Moaning Myrtle's bathroom, Lockhart shows himself a fraud and wipes his own memory, and Harry goes on alone. Tom Riddle is waiting: a memory kept in the diary, which made Ginny open the Chamber, and the boy who became Voldemort. With the phoenix, the Sorting Hat and Gryffindor's sword, Harry kills the basilisk and destroys the diary. Ginny lives, Hagrid and Dumbledore return, and Dobby is freed.","ch":[16,18]},
 {"b":"pa","t":"A bad summer and a black dog","hint":"Harry turns thirteen, and a relative is coming to stay.","s":"Harry gets birthday cards for the first time. Then Vernon's sister Marge visits and insults his parents until he loses his temper and she swells up like a balloon. He walks out, glimpses a huge black dog, and is picked up by the Knight Bus, where he learns that Sirius Black, a mass murderer, has escaped from Azkaban. The Minister himself lets Harry off and settles him at the Leaky Cauldron, where he overhears that Black is thought to be coming for him.","ch":[1,4]},
 {"b":"pa","t":"Dementors on the train","hint":"The school has new guards and two new teachers.","s":"A Dementor, one of the guards of Azkaban, searches the train, and Harry collapses hearing a woman scream. The shabby new Defense teacher, Professor Lupin, drives it off. At school the Divination teacher sees a death omen in Harry's cup, Hagrid's first lesson as a teacher ends with Malfoy slashed by a hippogriff, and Lupin's first lesson, on a shape-shifting Boggart, is the best anyone has had.","ch":[5,7]},
 {"b":"pa","t":"Halloween and the storm","hint":"Everyone else is off to the village.","s":"Left behind on the first Hogsmeade visit, Harry has tea with Lupin and watches Snape bring him a smoking potion. That night the Fat Lady's portrait is found slashed: Sirius Black has been inside the castle. At the Quidditch match the Dementors pour onto the field, Harry falls from his broom, Hufflepuff win, and the Nimbus is smashed by the Whomping Willow.","ch":[8,9]},
 {"b":"pa","t":"The map and the Patronus","hint":"Fred and George have an early Christmas present.","s":"The twins give Harry the Marauder's Map, which shows every passage and person in the castle. He slips into Hogsmeade and overhears the teachers: Sirius Black was his father's best friend and his own godfather, and betrayed the Potters to Voldemort before killing a friend named Peter Pettigrew and twelve Muggles. A Firebolt arrives with no card and is confiscated on Hermione's word, and Lupin begins teaching Harry the Patronus Charm. Scabbers vanishes, leaving blood and cat hair.","ch":[10,12]},
 {"b":"pa","t":"Break-ins and a final","hint":"The Firebolt is back, and so is someone else.","s":"Harry wins the Ravenclaw match and drives off what turn out to be Malfoy and friends dressed as Dementors. That night Ron wakes to find Sirius Black over his bed with a knife. Harry is nearly caught in Hogsmeade, and Lupin takes the map away. Hagrid loses Buckbeak's case and the hippogriff is sentenced to death. Hermione hits Malfoy and walks out of Divination, and Gryffindor win the Quidditch Cup.","ch":[13,15]},
 {"b":"pa","t":"Under the willow","hint":"Exams end, and Buckbeak's appeal is at sunset.","s":"Professor Trelawney goes rigid and foretells that Voldemort's servant will return to him that night. As the three leave Hagrid's, a black dog drags Ron down a tunnel under the Whomping Willow to the Shrieking Shack. The dog is Sirius Black. Lupin arrives and takes his side, and the story comes out: Lupin is a werewolf, his three school friends became Animagi to keep him company, and the traitor was Peter Pettigrew, who has spent twelve years as Ron's rat. Harry stops them killing him.","ch":[16,19]},
 {"b":"pa","t":"Three turns","hint":"There is a full moon tonight.","s":"Lupin transforms, Pettigrew escapes, and Dementors close in on Harry and Sirius until a silver stag drives them away. Sirius is caught and condemned to the Dementor's Kiss. Dumbledore sends Harry and Hermione three hours back with her Time-Turner. They rescue Buckbeak, Harry finds that the stag was his own Patronus, and Sirius flies away free. Lupin resigns once his secret is out, and Sirius writes to say that the Firebolt came from him.","ch":[20,22]},
 {"b":"gf","t":"The house on the hill","hint":"An old gardener sees a light where there should be none.","s":"In the village of Little Hangleton an old gardener, Frank Bryce, overhears a plan being made in the abandoned Riddle House by a man called Wormtail and something small with a high cold voice. A woman from the Ministry is already dead, and the plan needs Harry Potter. Frank is discovered and killed. Hundreds of miles away Harry wakes with his scar burning. The Weasleys invite him to the Quidditch World Cup and collect him through the Dursleys' fireplace.","ch":[1,4]},
 {"b":"gf","t":"The World Cup","hint":"A hundred thousand wizards are heading for one field.","s":"Harry meets the two eldest Weasley brothers, travels by Portkey to the World Cup, and watches Ireland win while Bulgaria's Viktor Krum catches the Snitch. That night masked followers of Voldemort torment a Muggle family, and someone fires his sign, the Dark Mark, into the sky with Harry's lost wand. A house-elf named Winky is found holding it, and her master, the Ministry official Barty Crouch, dismisses her on the spot.","ch":[5,10]},
 {"b":"gf","t":"A tournament announced","hint":"There will be no Quidditch at school this year. Something else is coming.","s":"Dumbledore announces the Triwizard Tournament, a dangerous contest between three schools, open only to those of seventeen. The new Defense teacher is the scarred ex-Auror Mad-Eye Moody, who turns Malfoy into a ferret and shows the class the three Unforgivable Curses. Hermione, appalled to learn the castle is run by unpaid house-elves, founds a society to free them. Delegations arrive from Beauxbatons and Durmstrang.","ch":[11,15]},
 {"b":"gf","t":"Four champions","hint":"The Goblet will choose one champion from each school.","s":"The Goblet of Fire names Viktor Krum, Fleur Delacour and Cedric Diggory, and then a fourth: Harry, who did not enter and cannot withdraw. Most of the school, Ron included, think he cheated. Moody suspects someone wants him dead. A reporter, Rita Skeeter, starts inventing stories about him. Warned by Hagrid that the first task is dragons, Harry tells Cedric, summons his broom and outflies a Hungarian Horntail. Ron comes round.","ch":[16,20]},
 {"b":"gf","t":"Elves, a ball and a scoop","hint":"The next task is months off, but there is to be dancing.","s":"Dobby turns out to be working in the Hogwarts kitchens, for wages, alongside a wretched Winky. Harry needs a partner for the Yule Ball and finds that Cho Chang is going with Cedric. Hermione arrives with Viktor Krum and quarrels with Ron. Harry overhears Hagrid telling Madame Maxime that his mother was a giantess, and so, somehow, does Rita Skeeter, who prints it. Hagrid has to be coaxed out of hiding.","ch":[21,24]},
 {"b":"gf","t":"Under the lake","hint":"A golden egg that screams, and a hint about bathing.","s":"Opened underwater, the egg tells the champions that something dear will be taken into the lake for an hour. Harry spots Mr. Crouch's name on the Marauder's Map in Snape's office at night, and Moody borrows the map. Dobby supplies gillyweed, and Harry stays below to see every hostage safe. Sirius, hiding near the village, tells them Crouch once sent his own son to Azkaban. Weeks later Crouch staggers out of the forest raving about his son and Voldemort, and vanishes before Dumbledore arrives.","ch":[25,28]},
 {"b":"gf","t":"Memories and a maze","hint":"Harry has another dream, and takes it to the headmaster.","s":"In Dumbledore's office Harry falls into the Pensieve and watches old trials: Karkaroff buying his freedom with names, Snape cleared on Dumbledore's word, and Crouch condemning his own son with the couple who tortured Neville's parents into madness. The third task is a maze. Krum, bewitched, attacks Cedric. Harry and Cedric reach the Cup together and agree to take it at the same moment.","ch":[29,31]},
 {"b":"gf","t":"The graveyard","hint":"The Cup is not what it seems.","s":"The Cup is a Portkey to a graveyard. Wormtail kills Cedric at once, binds Harry to a headstone, and with his master's father's bone, his own hand and Harry's blood gives Voldemort a body again. Voldemort summons his Death Eaters and duels Harry in front of them. Their wands, which share a core, lock together, and echoes of Voldemort's victims pour out, Harry's parents among them, shielding him long enough to reach Cedric's body and the Cup.","ch":[32,34]},
 {"b":"gf","t":"Who believes it","hint":"Harry is back, and someone leads him away from the crowd.","s":"Moody takes Harry aside and reveals that he arranged all of it. He is not Moody: under Polyjuice Potion he is Barty Crouch's son, smuggled out of Azkaban years ago and now his father's murderer. Before he can testify, a Dementor brought by the Minister destroys him, and Fudge refuses to accept that Voldemort is back. Dumbledore begins gathering allies without the Ministry. Hermione traps Rita Skeeter, an unregistered Animagus, and Harry gives his prize money to Fred and George.","ch":[35,37]},
 {"b":"op","t":"Dementors in Little Whinging","hint":"A month of silence, and a hot evening in an alley.","s":"Harry has had no real news all summer. Two Dementors attack him and Dudley near Privet Drive, and he drives them off with a Patronus. His neighbor Mrs. Figg turns out to be a Squib who has been watching him for Dumbledore. The Ministry expels him, then suspends the expulsion pending a hearing. A Howler tells Aunt Petunia to remember something, and she insists Harry stays. Days later a guard of witches and wizards flies him to London.","ch":[1,3]},
 {"b":"op","t":"Headquarters and a hearing","hint":"A house that is not on any map.","s":"Number twelve, Grimmauld Place, Sirius's gloomy family home, is the headquarters of the Order of the Phoenix, Dumbledore's secret society against Voldemort. The Ministry is denying Voldemort's return and painting Harry and Dumbledore as liars, and Percy Weasley has sided with it. Voldemort is after something he did not have last time. At a full criminal trial Dumbledore gets Harry cleared, without once looking at him. Ron and Hermione are made prefects.","ch":[4,9]},
 {"b":"op","t":"The Ministry comes to school","hint":"There is a new teacher in pink at the staff table.","s":"Harry meets Luna Lovegood and finds he can now see the skeletal horses that pull the school carriages. The new Defense teacher is Dolores Umbridge from the Minister's office, who teaches theory only. When Harry says in class that Voldemort is back, she gives him detentions writing lines with a quill that cuts the words into his hand. Ron becomes Gryffindor's Keeper. An Order member is sent to Azkaban for trying to get through a door at the Ministry.","ch":[10,14]},
 {"b":"op","t":"A secret class","hint":"Umbridge gets a new title, and Hermione has an idea.","s":"Umbridge is made High Inquisitor, with power to inspect and sack teachers. Since she will not teach them to defend themselves, Hermione persuades Harry to do it. Some twenty-five students sign up at a pub in Hogsmeade. A decree bans all student groups two days later, so they meet in secret in the Room of Requirement and call themselves Dumbledore's Army.","ch":[15,18]},
 {"b":"op","t":"Through the snake's eyes","hint":"A Quidditch match, a late return, and a dream that is not a dream.","s":"Umbridge bans Harry and the twins from Quidditch for life. Hagrid returns, battered, from a failed mission to the giants. Just before Christmas Cho Chang kisses Harry. That night he dreams he is a snake attacking Mr. Weasley in a dark corridor, and it is true: Mr. Weasley is found just in time. Harry fears Voldemort is possessing him. At St. Mungo's the three meet Neville visiting his parents.","ch":[19,23]},
 {"b":"op","t":"Closing the mind","hint":"Extra lessons with the last teacher Harry would choose.","s":"Snape is told to teach Harry Occlumency, to shut Voldemort out of his mind. It goes badly, and Harry keeps dreaming of a door in the Department of Mysteries. Ten Death Eaters break out of Azkaban. Harry gives an interview about Voldemort's return to The Quibbler, and the school starts to believe him. Umbridge sacks Professor Trelawney, and Dumbledore installs the centaur Firenze in her place. Then the D.A. is betrayed. Dumbledore takes the blame and escapes arrest.","ch":[24,27]},
 {"b":"op","t":"The High Inquisitor's school","hint":"The school has lost its headmaster.","s":"Umbridge becomes Headmistress and gives a squad of Slytherins power over the other students. Fred and George wage war on her and leave school in style. Harry looks into Snape's Pensieve and sees his own father, at fifteen, tormenting Snape for fun. Hagrid reveals a giant half-brother hidden in the forest. During the O.W.L. exams Umbridge tries to seize Hagrid by night, and Professor McGonagall is badly hurt. In his last exam Harry sees Sirius being tortured.","ch":[28,31]},
 {"b":"op","t":"The Department of Mysteries","hint":"Harry has to know whether what he saw is real.","s":"Kreacher tells Harry that Sirius has gone to the Ministry. Umbridge catches them and is led into the forest, where the centaurs carry her off. Harry, Ron, Hermione, Ginny, Neville and Luna fly to London on Thestrals. In the Hall of Prophecy Harry finds a glass sphere with his name on it, and Death Eaters step out of the dark: the vision was bait. The six fight until the Order arrives. The prophecy is smashed, and Bellatrix Lestrange kills Sirius. Dumbledore duels Voldemort in the Atrium, and the Minister sees him at last.","ch":[32,36]},
 {"b":"op","t":"What was foretold","hint":"Dumbledore has put off a conversation for five years.","s":"Dumbledore tells Harry everything: why he must return to the Dursleys each summer, how Kreacher deceived him, and the prophecy made before he was born, that the one with the power to defeat Voldemort would be marked by him as an equal, and that in the end one of the two must kill the other. The Ministry admits the truth and Umbridge leaves. Harry learns that Sirius will not come back, even as a ghost.","ch":[37,38]},
 {"b":"hb","t":"Two ministers and a vow","hint":"Even the Muggles have noticed something is wrong.","s":"The war is in the open: bridges fall, people are murdered, and Fudge has been replaced as Minister by Rufus Scrimgeour. Narcissa Malfoy, whose son Draco has been given a task by Voldemort that she believes will kill him, goes to Snape for help, and Snape swears an Unbreakable Vow to protect Draco and finish the task himself if Draco cannot. Dumbledore, one hand blackened and dead, collects Harry from Privet Drive. Sirius has left Harry everything, including the house and Kreacher.","ch":[1,3]},
 {"b":"hb","t":"A new Potions master","hint":"Dumbledore needs Harry's help with a spot of recruitment.","s":"Dumbledore uses Harry to tempt an old colleague, Horace Slughorn, out of hiding and back to teach. At the Burrow, Fleur Delacour is engaged to Bill. In a half-shuttered Diagon Alley Harry follows Draco Malfoy to Borgin and Burkes and becomes sure he has joined the Death Eaters. On the train Malfoy catches him eavesdropping and breaks his nose. At the feast it emerges that Slughorn will teach Potions: Snape has finally been given Defense Against the Dark Arts.","ch":[4,8]},
 {"b":"hb","t":"The Prince and the Gaunts","hint":"A battered old textbook, and lessons of a different kind.","s":"A secondhand Potions book, crammed with handwritten improvements by someone calling himself the Half-Blood Prince, makes Harry the star of Slughorn's class and wins him a vial of liquid luck. Dumbledore begins showing Harry memories of Voldemort's past: his mother's family, the Gaunts, last heirs of Slytherin, and the eleven-year-old Tom Riddle in a London orphanage, already cruel and already collecting trophies. A cursed necklace meant for someone else nearly kills Katie Bell.","ch":[9,13]},
 {"b":"hb","t":"Luck and a foggy memory","hint":"Quidditch, a Christmas party, and too many people kissing the wrong people.","s":"Ron starts going out with Lavender Brown, and Hermione stops speaking to him. At Slughorn's party Harry overhears Snape offering to help Malfoy with whatever he is doing, and Malfoy refusing. Lupin is living among werewolves as a spy. The Minister asks Harry to be seen supporting the Ministry and is refused. Dumbledore shows Harry a memory Slughorn has tampered with, in which the young Riddle asks him about something called Horcruxes, and sets Harry to get the real one.","ch":[14,17]},
 {"b":"hb","t":"Poison and persuasion","hint":"Ron's birthday does not go as planned.","s":"Ron eats love-potion chocolates meant for Harry and then drinks poisoned mead meant for Dumbledore. Harry saves him with a bezoar. Harry sets Kreacher and Dobby to follow Malfoy, who is spending his days in the Room of Requirement. More memories show Riddle acquiring a cup of Hufflepuff's and a locket of Slytherin's, and asking for a teaching job. After Aragog's funeral, with the help of the luck potion, Harry gets Slughorn to hand over the true memory.","ch":[18,22]},
 {"b":"hb","t":"Horcruxes","hint":"The memory is in a small glass bottle.","s":"Voldemort split his soul and hid the pieces in objects, Horcruxes, so that he cannot die while they exist. Dumbledore believes he made six: the diary and a ring are destroyed, and four remain. Harry uses one of the Prince's unknown spells on Malfoy and nearly kills him. He and Ginny get together. Then he learns from Professor Trelawney that it was Snape who carried the prophecy to Voldemort. Dumbledore still trusts Snape, and has found another Horcrux.","ch":[23,25]},
 {"b":"hb","t":"The cave and the tower","hint":"Dumbledore will take Harry with him, on one condition.","s":"In a sea cave Dumbledore drinks a potion that leaves him barely alive in order to reach a locket. They return to find the Dark Mark over the school. On the Astronomy Tower Draco Malfoy disarms Dumbledore: he has let Death Eaters into the castle through a pair of Vanishing Cabinets, and his task is to kill the headmaster. He cannot do it. Snape arrives and does. Harry, frozen and invisible, sees it all. Snape, fleeing, tells him he is the Half-Blood Prince. The locket is a fake, left by someone signing as R.A.B.","ch":[26,28]},
 {"b":"hb","t":"The lament","hint":"The phoenix is singing in the grounds.","s":"Bill Weasley has been savaged by the werewolf Greyback, and Fleur makes plain she will marry him regardless. Tonks and Lupin admit what they feel. Dumbledore is buried in a white tomb by the lake. Harry ends things with Ginny to keep her safe, refuses the Minister again, and decides not to come back to school: he will hunt the remaining Horcruxes. Ron and Hermione tell him they are coming too.","ch":[29,30]},
 {"b":"dh","t":"Leaving Privet Drive","hint":"Harry is about to turn seventeen, and the protection on his home ends when he does.","s":"Voldemort, at Malfoy Manor, learns from Snape exactly when Harry will be moved, and takes Lucius Malfoy's wand for the job. Harry reads troubling things about Dumbledore's family. The Dursleys go into hiding, and Dudley surprises him. The Order flies seven Harrys out at once, six of them friends under Polyjuice Potion, straight into an ambush. Hedwig and Mad-Eye Moody are killed and George loses an ear. Harry's wand acts on its own against Voldemort.","ch":[1,5]},
 {"b":"dh","t":"A will and a wedding","hint":"There is a wedding to get ready for, and Mrs. Weasley is keeping three people very busy.","s":"Hermione has hidden her parents abroad with altered memories, and Ron has arranged a stand-in. The Minister delivers Dumbledore's bequests: a Deluminator for Ron, a book of children's tales for Hermione, and for Harry the first Snitch he ever caught and a sword the Ministry will not hand over. At Bill and Fleur's wedding Harry hears old rumors about Dumbledore's sister. Then a Patronus brings word that the Ministry has fallen and the Minister is dead.","ch":[6,8]},
 {"b":"dh","t":"Kreacher's story","hint":"The three need somewhere to go, quickly.","s":"Attacked in a Muggle café within minutes of fleeing, the three hide at Grimmauld Place. There Harry works out that R.A.B. was Sirius's brother Regulus. Kreacher tells the story: Regulus turned against Voldemort, took the locket Horcrux from the cave, and died there, leaving an order Kreacher could never carry out. The locket was stolen by Mundungus Fletcher and taken from him by Dolores Umbridge. Lupin offers to join them, and Harry sends him back to his pregnant wife.","ch":[9,11]},
 {"b":"dh","t":"Into the Ministry","hint":"A month of watching a row of public toilets in Whitehall.","s":"With Voldemort's puppet as Minister, Snape is made head of Hogwarts and Muggle-borns are being tried for stealing magic. Disguised as Ministry workers, the three get in, find Umbridge running the trials with the locket round her neck, take it, and free the prisoners. In the escape a Death Eater follows them to Grimmauld Place, so they cannot go back. They are left in a tent with a Horcrux they have no means of destroying.","ch":[12,14]},
 {"b":"dh","t":"Winter on the run","hint":"Months in a tent, taking turns to wear the locket.","s":"They learn that the sword of Gryffindor can destroy Horcruxes, and that the one in Gringotts is a fake. Ron, worn down by hunger and the locket, walks out. Harry and Hermione go to Godric's Hollow at Christmas, see his parents' grave, and are lured into a trap: the old historian Bathilda Bagshot is dead, and Voldemort's snake is inside her. They barely escape, and Harry's wand is broken. A stolen book reveals that the young Dumbledore was the close friend of the Dark wizard Grindelwald.","ch":[15,18]},
 {"b":"dh","t":"The doe and the three brothers","hint":"A light among the trees.","s":"A silver doe leads Harry to the real sword at the bottom of a frozen pool. Ron, guided back by the Deluminator, saves him from drowning and destroys the locket. Luna's father explains the sign Dumbledore left in Hermione's book: the Deathly Hallows, three legendary objects, an unbeatable wand, a stone that recalls the dead, and a cloak of invisibility. Then he tries to hand them over to get his kidnapped daughter back. Harry becomes sure Voldemort is hunting the wand, and they are caught by Snatchers.","ch":[19,22]},
 {"b":"dh","t":"The cellar and the cottage","hint":"A swollen face, and a house Harry has heard of.","s":"The three are taken to Malfoy Manor. Draco will not quite identify them. Bellatrix, terrified to see the sword, tortures Hermione to find out whether her Gringotts vault has been opened. Dobby arrives to rescue the prisoners, and is killed by her knife as they escape. Harry buries him by hand at Bill and Fleur's cottage, and decides to go on with the Horcruxes and leave the wand to Voldemort, who takes it from Dumbledore's tomb. Lupin's son is born.","ch":[23,25]},
 {"b":"dh","t":"A bank and a way in","hint":"There is something in the Lestranges' vault that Bellatrix badly wants safe.","s":"With the goblin Griphook's help, and Hermione disguised as Bellatrix, they break into Gringotts and take Hufflepuff's cup. Griphook makes off with the sword, and they escape on the back of the vault's dragon. Voldemort now knows what they are hunting, and Harry sees in his mind that the last Horcrux is at Hogwarts. In Hogsmeade they are saved by the barman of the Hog's Head, Dumbledore's brother Aberforth, who tells them how his sister died, and shows them a passage into the school.","ch":[26,28]},
 {"b":"dh","t":"The battle","hint":"Neville Longbottom is waiting at the other end of the passage.","s":"Neville and the D.A. have been resisting Snape's regime from the Room of Requirement. The Order arrives, the teachers drive Snape out, and the castle prepares to fight. The Horcrux is Ravenclaw's lost diadem, which Harry once saw in the Room of Requirement. Ron and Hermione destroy the cup with basilisk fangs, and the diadem is consumed in a fire that kills Crabbe. Fred Weasley is killed. In the Shrieking Shack Voldemort has Snape killed for the wand, and Snape, dying, gives Harry his memories.","ch":[29,32]},
 {"b":"dh","t":"The forest and after","hint":"A flask of memories, and a walk to the headmaster's office.","s":"The memories show that Snape loved Harry's mother all his life, served Dumbledore for her sake, and killed him by Dumbledore's own arrangement. They also show that a piece of Voldemort's soul lives in Harry, who must let Voldemort kill him. He walks into the forest and does. He wakes somewhere between, speaks with Dumbledore, and chooses to return. Neville kills the snake. Because the wand's true allegiance had passed from Dumbledore to Draco to Harry, Voldemort's last curse rebounds, and he dies.","ch":[33,36]},
 {"b":"dh","t":"A September morning","hint":"Many years have gone by.","s":"Nineteen years on, Harry and Ginny see their children onto the Hogwarts Express, alongside Ron and Hermione and theirs. Draco Malfoy nods from along the platform. Harry tells his younger son, who is afraid of being sorted into Slytherin, that he is named after two headmasters, and that one of them was a Slytherin and the bravest man he knew. The scar has not hurt in all that time.","ch":[37,37]}
];
