  {"t":"Sends Harry a singing valentine.","at":"cs13","v":1},
  {"t":"Tries to tell Harry and Ron something and is interrupted. That evening a second message says her skeleton will lie in the Chamber forever.","at":"cs16","v":1},
  {"t":"Had been pouring her heart into the diary since the summer. Under its control she opened the Chamber, set the basilisk on four people and wrote the messages.","at":"cs17","v":1},
  {"t":"Wakes when the diary is destroyed. Dumbledore says older and wiser wizards have been fooled by Voldemort, and there is to be no punishment.","at":"cs17","v":1},
  {"t":"Badly affected by the Dementor on the train.","at":"pa5","v":1},
  {"t":"Has already agreed to go to the ball with Neville when Harry needs a partner.","at":"gf22","v":1},
  {"t":"No longer tongue-tied around Harry. She has a boyfriend.","at":"op16","v":1},
  {"t":"Takes Harry's place as Seeker.","at":"op21","v":1},
  {"t":"Reminds Harry sharply that she is the one person he knows who has been possessed by Voldemort.","at":"op23","v":1},
  {"t":"Breaks her ankle at the Ministry.","at":"op35","v":1},
  {"t":"Cannot stand Fleur.","at":"hb5","v":1},
  {"t":"Invited to the Slug Club for a hex Slughorn saw her cast on the train.","at":"hb7","v":1},
  {"t":"On the team as a Chaser. Going out with Dean Thomas.","at":"hb11","v":1},
  {"t":"Breaks up with Dean.","at":"hb22","v":1},
  {"t":"Plays Seeker in the final, wins it, and runs straight at Harry.","at":"hb24","v":1},
  {"t":"Had never really given up on Harry. Accepts why he is ending it, and does not cry.","at":"hb30","v":1},
  {"t":"Gives Harry a birthday kiss to remember her by.","at":"dh7","v":1},
  {"t":"Tries to steal the sword from Snape's office with Neville and Luna.","at":"dh15","v":1},
  {"t":"Comes back to fight, though under age.","at":"dh29","v":1},
  {"t":"Married to Harry.","at":"dh37","v":1}]},
 {"id":"bill","kind":"person","g":"m","name":"Bill Weasley","appear":"ss6","tag":[{"t":"The eldest Weasley brother","at":"ss6"},{"t":"Scarred by Greyback","at":"hb29"},{"t":"Married to Fleur","at":"dh8"}],"rel":["ron","charlie","egypt","fleur","order","greyback","shell_cottage"],"relAt":{"fleur":"hb5","greyback":"hb29"},"facts":[
  {"t":"Left Hogwarts already. Was Head Boy, and now works for Gringotts in Africa.","at":"ss6","v":1},
  {"t":"A curse breaker for Gringotts in Egypt. Shows the family round the tombs.","at":"pa1","v":1},
  {"t":"Not what Harry expected: tall, long-haired, with a fang earring and dragon-hide boots.","at":"gf5","v":1},
  {"t":"Comes with his mother to watch the third task as Harry's family. Fleur keeps looking at him.","at":"gf31","v":1},
  {"t":"Goes to tell his father that night.","at":"gf36","v":1},
  {"t":"Has taken a desk job at Gringotts to work for the Order, and is giving Fleur Delacour English lessons.","at":"op4","v":1},
  {"t":"Engaged to Fleur Delacour, to his mother's dismay.","at":"hb5","v":1},
  {"t":"His face is torn up by Fenrir Greyback. He will not be a true werewolf, but nobody knows what he will be. He wakes with a liking for rare steak.","at":"hb29","v":1},
  {"t":"Marries Fleur.","at":"dh8","v":1},
  {"t":"Secret-Keeper for Shell Cottage. Warns Harry about making bargains with goblins.","at":"dh24","v":1}]},
 {"id":"charlie","kind":"person","g":"m","name":"Charlie Weasley","appear":"ss6","tag":[{"t":"Studies dragons in Romania","at":"ss6"}],"rel":["ron","bill","norbert","romania","horntail","order"],"facts":[
  {"t":"The second Weasley brother. Was Quidditch captain at school and now studies dragons in Romania.","at":"ss6","v":1},
  {"t":"Wood says he could have played for England, and that Harry might turn out better.","at":"ss10","v":1},
  {"t":"Agrees to take Norbert, and sends friends to collect him from the top of the tallest tower at midnight.","at":"ss14","v":1},
  {"t":"Stocky, weather-beaten and freckled, with a shiny burn on one arm.","at":"gf5","v":1},
  {"t":"One of the keepers who bring four dragons from Romania for the first task.","at":"gf19","v":1},
  {"t":"Stays in Romania, recruiting foreign wizards.","at":"op4","v":1}]},
 {"id":"nick","kind":"person","g":"m","name":"Nearly Headless Nick","appear":"ss7","tag":[{"t":"The Gryffindor ghost","at":"ss7"},{"t":"Petrified","at":"cs11","state":"away"},{"t":"Revived","at":"cs18"}],"rel":["gryffindor","ghosts","baron","patrick"],"sub":"Ghost","facts":[
  {"t":"Sir Nicholas de Mimsy-Porpington, a ghost in a ruff. His head is attached by a strip of skin, and he will swing it aside to show how.","at":"ss7","v":1},
  {"t":"Has not eaten in nearly four hundred years.","at":"ss7","v":1},
  {"t":"Happy to point new Gryffindors the right way.","at":"ss8","v":1},
  {"t":"Died on the thirty-first of October, 1492, after forty-five blows from a blunt axe that never quite finished the job.","at":"cs8","v":1},
  {"t":"Holds a party in the dungeons for his five-hundredth deathday, with rotten food and a musical-saw orchestra.","at":"cs8","v":1},
  {"t":"Found black and smoky, floating motionless beside Justin. A ghost cannot die twice, and nobody knows what could do that to one.","at":"cs11","v":1},
  {"t":"Explains that he became a ghost because he was afraid of what came next. Sirius will not have.","at":"op38","v":1}]},
 {"id":"baron","kind":"person","g":"m","name":"The Bloody Baron","appear":"ss7","tag":[{"t":"The Slytherin ghost","at":"ss7"}],"rel":["slytherin","ghosts","peeves","helena"],"sub":"Ghost","relAt":{"helena":"dh31"},"facts":[
  {"t":"Thin and blank-eyed, in robes stained with silver blood. Nobody knows how they got that way.","at":"ss7","v":1},
  {"t":"The only one who can control Peeves.","at":"ss7","v":1},
  {"t":"Killed the woman he loved, Helena Ravenclaw, and then himself. He has worn chains ever since.","at":"dh31","v":1}]},
 {"id":"friar","kind":"person","g":"m","name":"The Fat Friar","appear":"ss7","tag":[{"t":"The Hufflepuff ghost","at":"ss7"}],"rel":["hufflepuff","ghosts"],"sub":"Ghost","facts":[
  {"t":"A cheerful little monk who hopes the new students will be in his old house.","at":"ss7","v":1}]},
 {"id":"peeves","kind":"person","g":"m","name":"Peeves","appear":"ss7","tag":[{"t":"The Hogwarts poltergeist","at":"ss7"}],"rel":["filch","baron","ghosts"],"sub":"Poltergeist","facts":[
  {"t":"A little man with a wide mouth and wicked dark eyes who floats about dropping things on people.","at":"ss7","v":1},
  {"t":"Listens to nobody, not even the prefects.","at":"ss8","v":1},
  {"t":"Shouts for Filch when he catches students out of bed.","at":"ss9","v":1},
  {"t":"Harry gets past him under the Cloak by pretending to be the Bloody Baron.","at":"ss16","v":1},
  {"t":"Tells Dumbledore, with glee, who attacked the portrait.","at":"pa8","v":1},
  {"t":"Salutes the twins, and takes their parting order seriously.","at":"op29","v":1},
  {"t":"Sees Umbridge off the premises with a walking stick and a sock full of chalk.","at":"op38","v":1},
  {"t":"Sings a victory song.","at":"dh36","v":1}]},
 {"id":"fatlady","kind":"person","g":"f","name":[{"t":"The portrait at Gryffindor Tower","at":"ss7"},{"t":"The Fat Lady","at":"ss9"}],"appear":"ss7","tag":[{"t":"Guards Gryffindor Tower","at":"ss7"}],"rel":["gryffindor","tower","cadogan"],"sub":"Portrait","facts":[
  {"t":"A portrait of a very large woman in a pink silk dress. She swings open for whoever gives the password.","at":"ss7","v":1},
  {"t":"Goes visiting at night, which can leave people locked out.","at":"ss9","v":1},
  {"t":"Her canvas is slashed to ribbons. She is found hiding in a map of Argyll, very distressed.","at":"pa8","v":1},
  {"t":"Restored, and comes back on condition that she has security trolls.","at":"pa14","v":1}]},
 {"id":"griphook","kind":"person","g":"m","name":"Griphook","appear":"ss5","tag":[{"t":"A goblin at Gringotts","at":"ss5"}],"rel":["goblins","gringotts","sword","gringotts_dragon"],"sub":"Goblin","relAt":{"sword":"dh15"},"facts":[
  {"t":"Takes Harry and Hagrid down to the vaults in a cart.","at":"ss5","v":1},
  {"t":"On the run. Knows the sword Snape sent to Gringotts is a copy.","at":"dh15","v":1},
  {"t":"Lies for Harry at Malfoy Manor: says the sword is the fake.","at":"dh23","v":1},
  {"t":"Will get them into Gringotts, for the sword as payment. To a goblin, a thing belongs to its maker.","at":"dh24","v":1},
  {"t":"Takes the sword and leaves them in the vault.","at":"dh26","v":1}]},
 {"id":"firenze","kind":"person","g":"m","name":"Firenze","appear":"ss15","tag":[{"t":"A centaur of the forest","at":"ss15"},{"t":"Divination teacher","at":"op27"}],"rel":["centaurs","ronan","bane","forest","harry","divination","staff"],"sub":"Centaur","relAt":{"divination":"op27","staff":"op27"},"facts":[
  {"t":"Younger than the other two, with white-blond hair and a palomino body.","at":"ss15","v":1},
  {"t":"Drives off the hooded figure and carries Harry on his back, which the others think beneath a centaur.","at":"ss15","v":1},
  {"t":"Tells Harry what unicorn blood does, and lets him work out who would be desperate enough to drink it.","at":"ss15","v":1},
  {"t":"Agrees to teach for Dumbledore, and is cast out by his herd for it with a hoofprint on his chest. Holds classes in a ground-floor room made to look like a forest clearing.","at":"op27","v":1}]},
 {"id":"ronan","kind":"person","g":"m","name":"Ronan","appear":"ss15","tag":[{"t":"A centaur of the forest","at":"ss15"}],"rel":["centaurs","firenze","bane","forest"],"sub":"Centaur","facts":[
  {"t":"Red-haired, with a chestnut body. Answers Hagrid's questions by remarking on how bright Mars is.","at":"ss15","v":1}]},
 {"id":"bane","kind":"person","g":"m","name":"Bane","appear":"ss15","tag":[{"t":"A centaur of the forest","at":"ss15"}],"rel":["centaurs","firenze","ronan","forest"],"sub":"Centaur","facts":[
  {"t":"Black-haired and wilder-looking. Furious that Firenze let a human ride him, and says centaurs should not interfere with what the planets have foretold.","at":"ss15","v":1},
  {"t":"Tells Hagrid the herd's patience with humans in the forest is over.","at":"op30","v":1},
  {"t":"Among those who carry Umbridge away.","at":"op33","v":1}]},
 {"id":"voldemort","kind":"person","g":"m","name":[{"t":"Voldemort","at":"ss1"}],"appear":"ss1","tag":[{"t":"Vanished the night he attacked Harry","at":"ss1"},{"t":"Still out there, without a body","at":"ss17"},{"t":"Regaining strength","at":"gf1"},{"t":"Returned, with a body","at":"gf32"},{"t":"Dead","at":"dh36","state":"fallen"}],"rel":["harry","james","lily","quirrell","dumbledore","followers","stone","riddle","diary","parseltongue","nagini","pettigrew","bertha","hangleton","riddles","priori","crouch_jr","dark_mark","prophecy","occlumency","bellatrix","gaunts","merope","riddle_sr","horcruxes","ring","locket","hcup","draco","inferi","sea_cave","malfoy_manor","elder_wand","thicknesse","snape"],"relAt":{"quirrell":"ss17","stone":"ss15","riddle":"cs17","diary":"cs17","parseltongue":"cs18","pettigrew":"gf1","bertha":"gf1","hangleton":"gf32","riddles":"gf33","priori":"gf34","crouch_jr":"gf35","prophecy":"op5","occlumency":"op24","dumbledore":"op36","gaunts":"hb10","merope":"hb10","riddle_sr":"hb10","horcruxes":"hb23","ring":"hb23","locket":"hb23","hcup":"hb23","draco":"hb2","sea_cave":"hb26","elder_wand":"dh24","snape":"dh33"},"facts":[
  {"t":"A wizard who has terrorised the wizarding world for eleven years. Most people will only call him You-Know-Who.","at":"ss1","v":1},
  {"t":"Kills Lily and James Potter, turns on their baby son, and cannot kill him. His power breaks and he vanishes.","at":"ss1","v":1},
  {"t":"Had been gathering followers and killing those who stood against him. Hogwarts was one of the few safe places left.","at":"ss4","v":1},
  {"t":"Hagrid does not believe he is dead: he thinks he is out there somewhere, too weak to carry on.","at":"ss4","v":1},
  {"t":"His wand is yew, thirteen and a half inches, with a feather from the same phoenix as Harry's.","at":"ss5","v":1},
  {"t":"Firenze lets Harry understand that it is Voldemort in the forest, living on unicorn blood until he can get the Stone.","at":"ss15","v":1},
  {"t":"Has no body of his own. Lives as a face on the back of Quirrell's head.","at":"ss17","v":1},
  {"t":"Wants the Stone to make himself a new body. Leaves Quirrell to die when the plan fails.","at":"ss17","v":1},
  {"t":"Dumbledore says he is not gone and may find another way back.","at":"ss17","v":1},
  {"t":"Was once Tom Riddle, a Hogwarts prefect and Slytherin's heir. He made his new name out of the old one because he would not keep his Muggle father's.","at":"cs17","v":1},
  {"t":"Dumbledore says he is the last living descendant of Salazar Slytherin, and is thought to be hiding in the forests of Albania.","at":"cs18","v":1},
  {"t":"A small, weak thing that has to be carried and fed, with a wand and a voice. Needs Harry in particular, and has a servant in place to deliver him.","at":"gf1","v":1},
  {"t":"Reborn from a cauldron: tall, skeletal, chalk-white, red-eyed, with slits for nostrils.","at":"gf32","v":1},
  {"t":"Wanted Harry's blood so that the protection Harry's mother left would run in his own veins. He can touch Harry now.","at":"gf33","v":1},
  {"t":"Had gone further than anyone toward making himself immortal, which is why the rebounding curse did not kill him.","at":"gf33","v":1},
  {"t":"Summons the Death Eaters and notes exactly who came, who is in prison, who is dead, and who stayed away.","at":"gf33","v":1},
  {"t":"His wand locks with Harry's. For a moment he looks afraid.","at":"gf34","v":1},
  {"t":"Had meant to return in secret, and Harry spoiled it. Lying low while the Ministry does his work for him.","at":"op5","v":1},
  {"t":"Harry begins to feel his moods, and sees through the eyes of his snake.","at":"op21","v":1},
  {"t":"Realises the link runs both ways.","at":"op24","v":1},
  {"t":"Sends Harry a false vision of Sirius to draw him to the Department of Mysteries.","at":"op31","v":1},
  {"t":"Comes to the Ministry himself. Fails to kill Dumbledore, fails to hold Harry, and is seen by the Minister before he vanishes.","at":"op36","v":1},
  {"t":"Never heard the whole prophecy. He chose Harry over a pure-blood boy, and by trying to kill him made him the one.","at":"op37","v":1},
  {"t":"Fighting openly now.","at":"hb1","v":1},
  {"t":"Has been shutting Harry out of his mind since the Ministry, so the scar no longer hurts.","at":"hb4","v":1},
  {"t":"Came back to Hogwarts ten years after leaving, features already blurred and waxy, to ask for a teaching job. Dumbledore thinks he came to hide something or find something.","at":"hb20","v":1},
  {"t":"Split his soul into seven. He wanted objects worthy of it, things from the school's founders.","at":"hb23","v":1},
  {"t":"What he does not understand, and Harry has, is love.","at":"hb23","v":1},
  {"t":"Has learned that his wand and Harry's will not fight each other, and borrows another.","at":"dh1","v":1},
  {"t":"Flies without a broom.","at":"dh4","v":1},
  {"t":"Takes the Ministry, through a puppet.","at":"dh8","v":1},
  {"t":"Searching abroad for a wandmaker, then for a thief.","at":"dh14","v":1},
  {"t":"Left his snake at Godric's Hollow in case Harry came.","at":"dh17","v":1},
  {"t":"Takes the Elder Wand from Dumbledore's tomb.","at":"dh24","v":1},
  {"t":"Learns the cup is gone, and understands for the first time that the Horcruxes are being hunted. He had felt nothing when the others were destroyed.","at":"dh27","v":1},
  {"t":"Has Snape killed.","at":"dh32","v":1},
  {"t":"Kills Harry in the forest, as he thinks.","at":"dh34","v":1},
  {"t":"The mangled, whimpering thing in the place between is what is left of his soul. Nothing can be done for it.","at":"dh35","v":1},
  {"t":"Offered a last chance to feel remorse. His own Killing Curse rebounds from the wand that will not serve him, and he dies like anyone.","at":"dh36","v":1}]},
 {"id":"flamel","kind":"person","g":"m","name":"Nicolas Flamel","appear":"ss6","tag":[{"t":"An alchemist","at":"ss6"},{"t":"Maker of the Sorcerer's Stone","at":"ss13"}],"rel":["dumbledore","perenelle","stone","elixir"],"relAt":{"stone":"ss13"},"facts":[
  {"t":"Named on Dumbledore's Chocolate Frog card as his partner in alchemy.","at":"ss6","v":1},
  {"t":"Hagrid lets his name slip in connection with what the three-headed dog is guarding.","at":"ss11","v":1},
  {"t":"The only known maker of the Sorcerer's Stone. Six hundred and sixty-five last year, living quietly in Devon with his wife.","at":"ss13","v":1},
  {"t":"Agrees with Dumbledore that the Stone must be destroyed. He and his wife have enough Elixir left to set their affairs in order, and then they will die.","at":"ss17","v":1}]},
 {"id":"perenelle","kind":"person","g":"f","name":"Perenelle Flamel","appear":"ss13","tag":[{"t":"Wife of Nicolas Flamel","at":"ss13"}],"rel":["flamel","stone"],"facts":[
  {"t":"Six hundred and fifty-eight years old.","at":"ss13","v":1},
  {"t":"Will die with her husband once the Elixir runs out.","at":"ss17","v":1}]},
 {"id":"grindelwald","kind":"person","g":"m","name":[{"t":"Grindelwald","at":"ss6"},{"t":"Gellert Grindelwald","at":"dh18"}],"appear":"ss6","tag":[{"t":"A Dark wizard","at":"ss6"},{"t":"Killed in his cell","at":"dh23","state":"fallen"}],"rel":["dumbledore","hallows","bathilda","ariana","elder_wand","nurmengard","gregorovitch"],"relAt":{"bathilda":"dh18","ariana":"dh18","elder_wand":"dh24","gregorovitch":"dh14"},"facts":[
  {"t":"Defeated by Dumbledore in 1945, according to a Chocolate Frog card.","at":"ss6","v":1},
  {"t":"Went to Durmstrang, which expelled him. He left a symbol carved on its wall.","at":"dh8","v":1},
  {"t":"The golden-haired thief. As a youth he spent a summer at Godric's Hollow with his great-aunt and became Albus Dumbledore's closest friend.","at":"dh18","v":1},
  {"t":"Fled the country after Ariana died. Rose to power abroad under a slogan the two of them had coined, and was beaten by Dumbledore in 1945.","at":"dh18","v":1},
  {"t":"Old and toothless in his own prison. Laughs at Voldemort, says he never had the wand, and is killed.","at":"dh23","v":1},
  {"t":"He had it for decades.","at":"dh24","v":1}]},
 {"id":"fudge","kind":"person","g":"m","name":"Cornelius Fudge","appear":"ss5","tag":[{"t":"Minister of Magic","at":"ss5"},{"t":"Minister of Magic","at":"cs14"},{"t":"Minister of Magic, in denial","at":"gf36"},{"t":"Minister of Magic, forced to admit the truth","at":"op38"},{"t":"Sacked. Now an adviser","at":"hb1"}],"rel":["ministry","dumbledore","dementors","umbridge","wizengamot"],"facts":[
  {"t":"Got the job because Dumbledore would not take it. Hagrid calls him a bungler who sends Dumbledore owls every morning asking for advice.","at":"ss5","v":1},
  {"t":"A portly little man in a pinstriped cloak and a lime-green bowler. Takes Hagrid away because, he says, the Ministry has to be seen to be doing something.","at":"cs14","v":1},
  {"t":"Waits at the Leaky Cauldron in person for Harry and is all smiles: nobody is sent to Azkaban for blowing up an aunt.","at":"pa3","v":1},
  {"t":"Was first on the scene twelve years ago and still dreams about the crater in the street.","at":"pa10","v":1},
  {"t":"Ready to have Sirius Kissed that night, without a hearing.","at":"pa21","v":1},
  {"t":"Hosts the Bulgarian minister in the Top Box and cannot make himself understood.","at":"gf8","v":1},
  {"t":"Would sooner suspect Madame Maxime than think about Voldemort.","at":"gf29","v":1},
  {"t":"Brings a Dementor that silences the only witness. Will not believe Voldemort is back, calls Harry unstable, and tells Dumbledore the Ministry will not follow him.","at":"gf36","v":1},
  {"t":"Convinced Dumbledore is after his job. Leans on the Daily Prophet to make Harry a joke.","at":"op4","v":1},
  {"t":"Moves the hearing at the last minute and tries it as a criminal case.","at":"op8","v":1},
  {"t":"Fears Dumbledore is training students as a private army.","at":"op14","v":1},
  {"t":"Comes to arrest Dumbledore in person and is knocked out.","at":"op27","v":1},
  {"t":"Sees Voldemort in his own Atrium.","at":"op36","v":1},
  {"t":"Forced out within a fortnight of the Ministry battle. Kept on to brief the Muggle Prime Minister.","at":"hb1","v":1}]},
 {"id":"ollivander","kind":"person","g":"m","name":"Mr. Ollivander","appear":"ss5","tag":[{"t":"Wandmaker","at":"ss5"},{"t":"Missing","at":"hb6","state":"away"},{"t":"Voldemort's prisoner","at":"dh5"},{"t":"Rescued","at":"dh23"}],"rel":["ollivanders","wand_harry","harry","elder_wand","gregorovitch"],"facts":[
  {"t":"An old man with pale, silvery eyes who remembers every wand he has ever sold.","at":"ss5","v":1},
  {"t":"Says the wand chooses the wizard. Tries wand after wand on Harry before one answers.","at":"ss5","v":1},
  {"t":"Tells Harry he expects great things of him, since the wand's brother did great things too, terrible as they were.","at":"ss5","v":1},
  {"t":"Called in to check the champions' wands before the tournament.","at":"gf18","v":1},
  {"t":"His shop stands empty. No sign of a struggle, and nobody knows whether he went or was taken.","at":"hb6","v":1},
  {"t":"Being tortured for the reason Harry's wand beat Voldemort's.","at":"dh5","v":1},
  {"t":"Explains that a wand can be won, and confirms what Voldemort is looking for.","at":"dh24","v":1}]},
 {"id":"malkin","kind":"person","g":"f","name":"Madam Malkin","appear":"ss5","tag":[{"t":"Robe-maker","at":"ss5"}],"rel":["malkins"],"facts":[
  {"t":"A squat, smiling witch in mauve who fits Harry for his school robes.","at":"ss5","v":1}]},
 {"id":"tom","kind":"person","g":"m","name":"Tom","appear":"ss5","tag":[{"t":"Landlord of the Leaky Cauldron","at":"ss5"}],"rel":["leaky"],"facts":[
  {"t":"Bald and toothless. The first to recognise Harry in the pub.","at":"ss5","v":1},
  {"t":"Gives Harry room eleven for the rest of the summer.","at":"pa3","v":1}]},
 {"id":"diggle","kind":"person","g":"m","name":"Dedalus Diggle","appear":"ss1","tag":[{"t":"A wizard","at":"ss1"}],"rel":["leaky","order"],"facts":[
  {"t":"McGonagall blames him for the shooting stars over Kent on the night Voldemort fell.","at":"ss1","v":1},
  {"t":"An excitable man in a top hat who shakes Harry's hand in the Leaky Cauldron. Harry remembers him bowing to him once in a shop.","at":"ss5","v":1},
  {"t":"In the guard that collects Harry.","at":"op3","v":1},
  {"t":"Escorts the Dursleys into hiding.","at":"dh3","v":1}]},
 {"id":"doris","kind":"person","g":"f","name":"Doris Crockford","appear":"ss5","tag":[{"t":"A witch","at":"ss5"}],"rel":["leaky"],"facts":[
  {"t":"Comes back to shake Harry's hand again and again in the Leaky Cauldron.","at":"ss5","v":1}]},
 {"id":"hedwig","kind":"creature","name":[{"t":"Harry's owl","at":"ss5"},{"t":"Hedwig","at":"ss6"}],"appear":"ss5","tag":[{"t":"Harry's snowy owl","at":"ss5"},{"t":"Killed","at":"dh4","state":"fallen"}],"rel":["harry","hagrid","eeylops","owls"],"sub":"Owl","owner":{"id":"harry","at":"ss5"},"attrs":{"Kind":"Snowy owl"},"facts":[
  {"t":"A snowy owl, bought by Hagrid as Harry's eleventh birthday present.","at":"ss5","v":1},
  {"t":"Harry picks her name out of one of his school books.","at":"ss6","v":1},
  {"t":"Brings Harry his first post at school: an invitation to tea from Hagrid.","at":"ss8","v":1},
  {"t":"Carries the letters between the three and Charlie Weasley about Norbert.","at":"ss14","v":1},
  {"t":"Padlocked in her cage for the summer.","at":"cs1","v":1},
  {"t":"Rides to school in the car.","at":"cs5","v":1},
  {"t":"Carries Harry's letters to Sirius.","at":"gf2","v":1},
  {"t":"Offended when Harry uses a school owl so that she will not be recognised.","at":"gf18","v":1},
  {"t":"Arrives hurt. Someone has stopped her and searched her post.","at":"op17","v":1},
  {"t":"Hit by a Killing Curse during the flight from Privet Drive.","at":"dh4","v":1}]},
 {"id":"scabbers","kind":"creature","name":"Scabbers","appear":"ss6","tag":[{"t":"Ron's rat","at":"ss6"},{"t":"Missing","at":"pa12"},{"t":"Found","at":"pa17"},{"t":"Peter Pettigrew","at":"pa19"}],"rel":["ron","percy","goyle","crookshanks","pettigrew"],"sub":"Rat","owner":{"id":"ron","at":"ss6"},"attrs":{"Kind":"Rat"},"relAt":{"pettigrew":"pa19"},"facts":[
  {"t":"A fat gray rat who sleeps most of the time. He was Percy's before he was Ron's.","at":"ss6","v":1},
  {"t":"Ron tries a spell to turn him yellow. Nothing happens.","at":"ss6","v":1},
  {"t":"Sinks his teeth into Goyle's knuckle on the train.","at":"ss6","v":1},
  {"t":"Comes along in the flying car, shut in Ron's pocket.","at":"cs5","v":1},
  {"t":"Sits on Ron's shoulder in the newspaper photograph of the Weasleys in Egypt.","at":"pa1","v":1},
  {"t":"Thin and off-color since the summer. The shop witch is surprised a common rat has lived so long, and notes his missing toe.","at":"pa4","v":1},
  {"t":"Vanishes, leaving blood on Ron's sheets and ginger hairs on the floor.","at":"pa12","v":1},
  {"t":"Found hiding in a milk jug at Hagrid's, and fights to get away.","at":"pa17","v":1},
  {"t":"Not a rat. Lupin and Sirius force him back into his own shape: Peter Pettigrew.","at":"pa19","v":1}]},
 {"id":"trevor","kind":"creature","name":"Trevor","appear":"ss6","tag":[{"t":"Neville's toad","at":"ss6"}],"rel":["neville"],"sub":"Toad","owner":{"id":"neville","at":"ss6"},"attrs":{"Kind":"Toad"},"facts":[
  {"t":"Keeps escaping. Neville loses him on the platform and again on the train, and Hagrid finds him in the boats.","at":"ss6","v":1},
  {"t":"Makes a break for it on the night Neville tries to stop the three leaving.","at":"ss16","v":1}]},
 {"id":"norris","kind":"creature","name":"Mrs. Norris","appear":"ss8","tag":[{"t":"Filch's cat","at":"ss8"},{"t":"Petrified","at":"cs8","state":"away"},{"t":"Revived","at":"cs18"}],"rel":["filch"],"sub":"Cat","owner":{"id":"filch","at":"ss8"},"attrs":{"Kind":"Cat"},"facts":[
  {"t":"Scrawny and dust-colored, with bulging lamp-like eyes. She patrols the corridors alone and fetches Filch at the first sign of a broken rule.","at":"ss8","v":1},
  {"t":"Ron wants to kick her, just once, when she passes them under the Cloak.","at":"ss16","v":1},
  {"t":"Found hanging stiff by her tail from a torch bracket, under the writing on the wall, above a flooded floor.","at":"cs8","v":1}]},
 {"id":"fang","kind":"creature","name":"Fang","appear":"ss8","tag":[{"t":"Hagrid's boarhound","at":"ss8"}],"rel":["hagrid","hut","forest"],"sub":"Dog","owner":{"id":"hagrid","at":"ss8"},"attrs":{"Kind":"Boarhound"},"facts":[
  {"t":"An enormous black boarhound who looks fierce and mostly drools on people.","at":"ss8","v":1},
  {"t":"Goes into the forest with the detention. Hagrid admits he is a coward, and he bolts with Malfoy.","at":"ss15","v":1},
  {"t":"Goes into the forest with Harry and Ron and is no help at all.","at":"cs15","v":1},
  {"t":"Stunned defending Hagrid.","at":"op31","v":1}]},
 {"id":"fluffy","kind":"creature","name":[{"t":"The three-headed dog","at":"ss9"},{"t":"Fluffy","at":"ss11"}],"appear":"ss9","tag":[{"t":"Guards a trapdoor on the third floor","at":"ss9"}],"rel":["hagrid","corridor","trapdoor","flute","stone","snape"],"relAt":{"hagrid":"ss11","flute":"ss16","snape":"ss11"},"sub":"Three-headed dog","owner":{"id":"hagrid","at":"ss11"},"attrs":{"Kind":"Three-headed dog"},"facts":[
  {"t":"A monstrous dog with three heads that fills a locked corridor from floor to ceiling. It is standing on a trapdoor.","at":"ss9","v":1},
  {"t":"Something has savaged Snape's leg, and he grumbles about watching three heads at once.","at":"ss11","v":1},
  {"t":"Belongs to Hagrid, who bought him from a Greek man in a pub and lent him to Dumbledore as a guard.","at":"ss11","v":1},
  {"t":"Hagrid says that only he and Dumbledore know how to get past him.","at":"ss14","v":1},
  {"t":"Falls asleep to music. Hagrid told a stranger so.","at":"ss16","v":1},
  {"t":"Already asleep beside a harp when the three arrive. Harry keeps him under with a flute.","at":"ss16","v":1}]},
 {"id":"norbert","kind":"creature","name":"Norbert","appear":"ss14","tag":[{"t":"Hagrid's baby dragon","at":"ss14"},{"t":"Sent to Romania","at":"ss14","state":"away"}],"rel":["hagrid","charlie","dragons","hut","romania","tower_ast"],"sub":"Dragon","owner":{"id":"hagrid","at":"ss14"},"attrs":{"Kind":"Norwegian Ridgeback"},"facts":[
  {"t":"A Norwegian Ridgeback, hatched from a black egg that Hagrid kept in his fire.","at":"ss14","v":1},
  {"t":"Three times as long within a week. Eats rats by the crate, and bites Ron hard enough to put him in the hospital wing.","at":"ss14","v":1},
  {"t":"Smuggled up the tallest tower in a crate under the Invisibility Cloak and flown off by Charlie Weasley's friends.","at":"ss14","v":1}]},
 {"id":"boa","kind":"creature","name":"The boa constrictor","appear":"ss2","tag":[{"t":"Escaped from the zoo","at":"ss2"}],"rel":["harry","dudley","zoo","parseltongue"],"sub":"Snake","attrs":{"Kind":"Boa constrictor"},"relAt":{"parseltongue":"cs11"},"facts":[
  {"t":"A zoo snake big enough to wrap twice round a car. It was bred in captivity and has never seen Brazil, where its kind comes from.","at":"ss2","v":1},
  {"t":"Winks at Harry and seems to follow what he says. When the glass vanishes it slides out past Dudley and off towards the exit.","at":"ss2","v":1}]},
 {"id":"troll","kind":"creature","name":"The mountain troll","appear":"ss10","tag":[{"t":"Knocked out in the girls' bathroom","at":"ss10"}],"rel":["quirrell","harry","ron","hermione","bathroom","trolls"],"relAt":{"quirrell":"ss17"},"sub":"Troll","attrs":{"Kind":"Mountain troll"},"facts":[
  {"t":"Twelve feet tall, with granite-gray skin, a tiny head and a wooden club. It can be smelled before it is seen.","at":"ss10","v":1},
  {"t":"Gets into the castle at Halloween. Harry and Ron lock it in a room without knowing Hermione is inside.","at":"ss10","v":1},
  {"t":"Harry sticks his wand up its nose, and Ron drops its own club on its head.","at":"ss10","v":1},
  {"t":"Harry suspects it was let in as a distraction.","at":"ss11","v":1},
  {"t":"Quirrell let it in. He has a gift with trolls.","at":"ss17","v":1}]},
 {"id":"owls","kind":"creature","name":"Owls","appear":"ss1","tag":[{"t":"How wizards send post","at":"ss1"}],"rel":["hedwig","eeylops","errol","hermes","pig"],"sub":"Species","facts":[
  {"t":"Seen flying by daylight all over Britain on the day after Voldemort falls.","at":"ss1","v":1},
  {"t":"Wizards send their letters by owl. Hagrid has one in his coat pocket to report back to Dumbledore.","at":"ss4","v":1},
  {"t":"An owl that delivers a newspaper expects to be paid.","at":"ss5","v":1},
  {"t":"A first year may bring an owl, a cat or a toad.","at":"ss5","v":1},
  {"t":"At school the owls sweep into the Great Hall at breakfast and drop the post on their owners.","at":"ss8","v":1}]},
 {"id":"goblins","kind":"creature","name":"Goblins","appear":"ss5","tag":[{"t":"Run the wizards' bank","at":"ss5"}],"rel":["griphook","gringotts"],"sub":"Species","relAt":{"griphook":"dh15"},"facts":[
  {"t":"Short, with clever faces, pointed beards and very long fingers and feet. They run Gringotts.","at":"ss5","v":1},
  {"t":"Hagrid says nobody sensible would cross them.","at":"ss5","v":1},
  {"t":"They hold that the maker of a thing is its true owner, and that wizards who pass goblin work down their families are thieves.","at":"dh24","v":1}]},
 {"id":"dragons","kind":"creature","name":"Dragons","appear":"ss5","tag":[{"t":"Rumoured to guard the deepest vaults","at":"ss5"}],"rel":["norbert","charlie","hagrid","romania","horntail"],"sub":"Species","facts":[
  {"t":"Said to guard the high-security vaults under Gringotts. Hagrid has wanted one since he was a boy.","at":"ss5","v":1},
  {"t":"Charlie Weasley studies them in Romania.","at":"ss6","v":1},
  {"t":"Breeding them has been against wizard law since 1709. Tame ones are too hard to hide from Muggles, and too dangerous.","at":"ss14","v":1},
  {"t":"Two kinds live wild in Britain, the Common Welsh Green and the Hebridean Black. The Ministry has to keep Muggles from remembering them.","at":"ss14","v":1},
  {"t":"Four nesting mothers are brought for the first task: a Swedish Short-Snout, a Welsh Green, a Chinese Fireball and a Hungarian Horntail.","at":"gf19","v":1}]},
 {"id":"trolls","kind":"creature","name":"Trolls","appear":"ss10","tag":[{"t":"Huge and very stupid","at":"ss10"}],"rel":["troll","quirrell"],"relAt":{"quirrell":"ss16"},"sub":"Species","facts":[
  {"t":"Enormously strong and not at all clever.","at":"ss10","v":1},
  {"t":"A second, bigger troll guards one of the chambers under the trapdoor. Someone has already knocked it out.","at":"ss16","v":1}]},
 {"id":"unicorns","kind":"creature","name":"Unicorns","appear":"ss5","tag":[{"t":"Their hair goes into wands","at":"ss5"}],"rel":["forest","firenze","voldemort","ollivander"],"relAt":{"voldemort":"ss15"},"sub":"Species","facts":[
  {"t":"Their tail hair is one of the three cores Mr. Ollivander uses.","at":"ss5","v":1},
  {"t":"Something in the forest is killing them. Their blood is silvery and shines in the moonlight.","at":"ss15","v":1},
  {"t":"Too fast and too powerful to be caught easily. Hagrid has never known one hurt before.","at":"ss15","v":1},
  {"t":"Drinking the blood will keep anyone alive, even at the point of death, at the price of a cursed half-life.","at":"ss15","v":1}]},
 {"id":"centaurs","kind":"creature","name":"Centaurs","appear":"ss15","tag":[{"t":"Stargazers of the forest","at":"ss15"}],"rel":["firenze","ronan","bane","forest","umbridge","grawp"],"sub":"Species","facts":[
  {"t":"Human to the waist and horse below. A herd lives in the forest.","at":"ss15","v":1},
  {"t":"They read the future in the planets and seldom give a straight answer about anything nearer than the moon.","at":"ss15","v":1},
  {"t":"They banish Firenze for serving humans.","at":"op27","v":1},
  {"t":"They resent being used as a threat, and draw the line at harming foals. Umbridge they take.","at":"op33","v":1},
  {"t":"Charge out of the forest to join the last fight.","at":"dh36","v":1}]},
 {"id":"squid","kind":"creature","name":"The giant squid","appear":"ss16","tag":[{"t":"Lives in the lake","at":"ss16"}],"rel":["lake"],"sub":"Squid","facts":[
  {"t":"Basks in the shallows on warm days and lets students tickle its tentacles.","at":"ss16","v":1}]},
 {"id":"alohomora","kind":"magic","name":"Alohomora","appear":"ss9","tag":[{"t":"Opens locked doors","at":"ss9"}],"rel":["hermione","corridor"],"group":"spell","sub":"Charm","holders":[{"id":"hermione","at":"ss9"}],"facts":[
  {"t":"Hermione uses it on a locked door to get away from Filch, which is how the four find the three-headed dog.","at":"ss9","v":1},
  {"t":"Used again on the same door on the way to the trapdoor.","at":"ss16","v":1}]},
 {"id":"leviosa","kind":"magic","name":"Wingardium Leviosa","appear":"ss10","tag":[{"t":"Makes things fly","at":"ss10"}],"rel":["flitwick","ron","hermione","troll","charms"],"group":"spell","sub":"Charm","holders":[{"id":"hermione","at":"ss10"},{"id":"ron","at":"ss10"}],"facts":[
  {"t":"The spell Flitwick's class learns for making things fly: a swish and a flick of the wand, and the words said exactly right.","at":"ss10","v":1},
  {"t":"Hermione is the only one to get her feather off the desk in class. Ron gets it right that evening on a troll's club.","at":"ss10","v":1}]},
 {"id":"bluefire","kind":"magic","name":[{"t":"Hermione's blue fire","at":"ss11"},{"t":"Bluebell flames","at":"ss16"}],"appear":"ss11","tag":[{"t":"Hermione's portable fire","at":"ss11"}],"rel":["hermione","snape","snare"],"group":"spell","sub":"Charm","holders":[{"id":"hermione","at":"ss11"}],"facts":[
  {"t":"A bright blue fire Hermione can conjure and carry around in a jam jar.","at":"ss11","v":1},
  {"t":"She uses it to set Snape's robes alight at the Quidditch match.","at":"ss11","v":1},
  {"t":"Drives back the Devil's Snare.","at":"ss16","v":1}]},
 {"id":"broomjinx","kind":"magic","name":"The broom jinx","appear":"ss11","tag":[{"t":"Cast on Harry's broom","at":"ss11"}],"rel":["harry","snape","quirrell","nimbus"],"relAt":{"quirrell":"ss17"},"group":"spell","sub":"Jinx","holders":[{"id":"quirrell","at":"ss17"}],"facts":[
  {"t":"During his first match Harry's broom bucks and rolls as if trying to throw him. Hagrid says only powerful Dark magic can interfere with a broom.","at":"ss11","v":1},
  {"t":"A jinx like it needs unbroken eye contact. Hermione sees Snape staring and muttering and is sure it is him.","at":"ss11","v":1},
  {"t":"Quirrell was the one casting it. Snape was muttering the countercurse, and Hermione broke Quirrell's concentration by knocking him over on her way past.","at":"ss17","v":1}]},
 {"id":"leglocker","kind":"magic","name":"Leg-Locker Curse","appear":"ss13","tag":[{"t":"Sticks the legs together","at":"ss13"}],"rel":["draco","neville","hermione","ron"],"group":"spell","sub":"Curse","holders":[{"id":"draco","at":"ss13"}],"facts":[
  {"t":"Malfoy uses it on Neville, who has to hop all the way up to Gryffindor Tower. The words are Locomotor Mortis.","at":"ss13","v":1},
  {"t":"Ron and Hermione practise it in secret, ready to use on Snape if he tries to hurt Harry during the match.","at":"ss13","v":1}]},
 {"id":"bodybind","kind":"magic","name":"Full Body-Bind","appear":"ss16","tag":[{"t":"Petrificus Totalus","at":"ss16"}],"rel":["hermione","neville"],"group":"spell","sub":"Curse","holders":[{"id":"hermione","at":"ss16"}],"facts":[
  {"t":"Snaps the arms and legs together and leaves the victim rigid as a board, able to move only the eyes.","at":"ss16","v":1},
  {"t":"Hermione casts it on Neville when he tries to block the portrait hole.","at":"ss16","v":1}]},
 {"id":"livingdeath","kind":"magic","name":"Draught of Living Death","appear":"ss8","tag":[{"t":"A very powerful sleeping potion","at":"ss8"}],"rel":["snape","potions"],"group":"potion","sub":"Potion","facts":[
  {"t":"Made from powdered asphodel root and an infusion of wormwood. One of the questions Snape throws at Harry in his first lesson.","at":"ss8","v":1},
  {"t":"The first potion set by Slughorn. Harry's is perfect.","at":"hb9","v":1}]},
 {"id":"bezoar","kind":"magic","name":"Bezoar","appear":"ss8","tag":[{"t":"A stone that saves you from most poisons","at":"ss8"}],"rel":["snape","potions"],"group":"potion","sub":"Antidote","facts":[
  {"t":"Taken from the stomach of a goat.","at":"ss8","v":1},
  {"t":"Harry remembers it from the Prince's notes and forces one down Ron's throat when he is poisoned.","at":"hb18","v":1}]},
 {"id":"aconite","kind":"magic","name":"Monkshood and wolfsbane","appear":"ss8","tag":[{"t":"One plant with two names","at":"ss8"}],"rel":["snape","potions"],"group":"potion","sub":"Plant","facts":[
  {"t":"Both are names for aconite. Snape asks Harry the difference between them, and there is none.","at":"ss8","v":1}]},
 {"id":"boilcure","kind":"magic","name":"The cure for boils","appear":"ss8","tag":[{"t":"The first potion the class brews","at":"ss8"}],"rel":["snape","neville","seamus","potions"],"group":"potion","sub":"Potion","facts":[
  {"t":"A simple cure for boils, made with dried nettles, crushed snake fangs, horned slugs and porcupine quills.","at":"ss8","v":1},
  {"t":"Neville adds the quills before taking the cauldron off the fire. The cauldron melts and he breaks out in boils himself.","at":"ss8","v":1}]},
 {"id":"elixir","kind":"magic","name":"Elixir of Life","appear":"ss13","tag":[{"t":"Makes the drinker immortal","at":"ss13"}],"rel":["stone","flamel","perenelle","voldemort"],"relAt":{"voldemort":"ss15"},"group":"potion","sub":"Potion","holders":[{"id":"flamel","at":"ss13"},{"id":"perenelle","at":"ss13"}],"facts":[
  {"t":"Produced by the Sorcerer's Stone. It is what has kept Nicolas Flamel and his wife alive for more than six centuries.","at":"ss13","v":1},
  {"t":"It would give Voldemort back his full strength.","at":"ss15","v":1},
  {"t":"The Flamels have a little stored, enough to put things in order before they die.","at":"ss17","v":1}]},
 {"id":"snare","kind":"magic","name":"Devil's Snare","appear":"ss16","tag":[{"t":"A strangling plant","at":"ss16"}],"rel":["sprout","hermione","bluefire","chambers","bode"],"group":"potion","sub":"Plant","facts":[
  {"t":"A mass of creepers that breaks a fall and then winds tighter round anyone who struggles.","at":"ss16","v":1},
  {"t":"Likes dark and damp, and shrinks from fire and light. It is Professor Sprout's contribution to the Stone's defenses.","at":"ss16","v":1},
  {"t":"Sent to a patient at St. Mungo's disguised as a harmless pot plant.","at":"op25","v":1}]},
 {"id":"bottles","kind":"magic","name":"Snape's seven bottles","appear":"ss16","tag":[{"t":"A test of logic, not magic","at":"ss16"}],"rel":["snape","hermione","chambers"],"group":"potion","sub":"Puzzle","facts":[
  {"t":"Seven bottles on a table between a wall of purple fire and a wall of black fire: three of poison, two of nettle wine, one potion to go on and one to go back.","at":"ss16","v":1},
  {"t":"A verse of clues identifies which is which. Hermione works it out, pointing out that plenty of great wizards have no logic at all.","at":"ss16","v":1},
  {"t":"The smallest bottle holds barely enough for one, so Harry goes on alone.","at":"ss16","v":1}]},
 {"id":"putouter","kind":"magic","name":[{"t":"The Put-Outer","at":"ss1"},{"t":"The Deluminator","at":"dh7"}],"appear":"ss1","tag":[{"t":"Puts out street lamps","at":"ss1"}],"rel":["dumbledore","privet","ron"],"group":"object","sub":"Device","holders":[{"id":"dumbledore","at":"ss1"},{"id":"ron","at":"dh7"}],"relAt":{"ron":"dh7"},"facts":[
  {"t":"Looks like a silver cigarette lighter. Each click takes the light out of the nearest lamp, and one more click sends them all back.","at":"ss1","v":1},
  {"t":"Dumbledore uses it to darken Privet Drive before Harry is brought there.","at":"ss1","v":1},
  {"t":"Dumbledore's own invention. He leaves it to Ron.","at":"dh7","v":1},
  {"t":"It does more than put out lights. Ron hears Hermione's voice come out of it, and a ball of light from it takes him to where they are.","at":"dh19","v":1},
  {"t":"Dumbledore expected that Ron might need a way back.","at":"dh35","v":1}]},
 {"id":"motorcycle","kind":"magic","name":"The flying motorcycle","appear":"ss1","tag":[{"t":"Borrowed from Sirius Black","at":"ss1"}],"rel":["hagrid","sirius","harry"],"group":"object","sub":"Vehicle","holders":[{"id":"sirius","at":"ss1"},{"id":"hagrid","at":"ss1"}],"facts":[
  {"t":"A huge motorcycle that drops out of the sky onto Privet Drive with Hagrid and baby Harry on it.","at":"ss1","v":1},
  {"t":"Ten years on, Harry dreams about it and is shouted at for saying so.","at":"ss2","v":1},
  {"t":"Rebuilt by Mr. Weasley with a sidecar and a few extras. Wrecked in the ambush.","at":"dh4","v":1}]},
 {"id":"umbrella","kind":"magic","name":"Hagrid's pink umbrella","appear":"ss4","tag":[{"t":"Does magic it should not","at":"ss4"}],"rel":["hagrid","dudley","ollivander"],"group":"object","sub":"Wand, perhaps","holders":[{"id":"hagrid","at":"ss4"}],"facts":[
  {"t":"Hagrid lights a fire with it and uses it to give Dudley a pig's tail. He asks Harry not to mention it at school.","at":"ss4","v":1},
  {"t":"Speeds up the boat back from the rock.","at":"ss5","v":1},
  {"t":"Mr. Ollivander remembers that Hagrid's wand was snapped when he was expelled, and asks whether he still uses the pieces. Hagrid grips the umbrella tightly and says no.","at":"ss5","v":1}]},
 {"id":"wand_harry","kind":"magic","name":"Harry's wand","appear":"ss5","tag":[{"t":"Holly and phoenix feather","at":"ss5"},{"t":"Broken","at":"dh17"},{"t":"Mended","at":"dh36"}],"rel":["harry","ollivander","voldemort","priori","fawkes"],"group":"object","sub":"Wand","holders":[{"id":"harry","at":"ss5"}],"relAt":{"fawkes":"gf36"},"facts":[
  {"t":"Eleven inches, holly, with a phoenix feather at its core. Red and gold sparks fly from it the moment Harry picks it up.","at":"ss5","v":1},
  {"t":"The phoenix whose feather it holds gave only one other. That feather is in the yew wand that killed his parents and scarred him.","at":"ss5","v":1},
  {"t":"Stolen at the World Cup and used to cast the Dark Mark.","at":"gf9","v":1},
  {"t":"Will not fight its brother. Joined to Voldemort's by a thread of light, it forces his to disgorge its past spells.","at":"gf34","v":1},
  {"t":"Turns in Harry's hand and fires on Voldemort without any spell from him.","at":"dh4","v":1},
  {"t":"Snapped by a rebounding curse.","at":"dh17","v":1},
  {"t":"It had taken in something of Voldemort's power in the graveyard, and knew him.","at":"dh35","v":1},
  {"t":"Repaired with the Elder Wand.","at":"dh36","v":1}]},
 {"id":"scar","kind":"magic","name":"Harry's scar","appear":"ss1","tag":[{"t":"The mark Voldemort left","at":"ss1"}],"rel":["harry","voldemort","quirrell","occlumency"],"relAt":{"quirrell":"ss17","occlumency":"op24"},"group":"object","sub":"Curse scar","holders":[{"id":"harry","at":"ss1"}],"facts":[
  {"t":"A thin cut on the forehead, shaped like a bolt of lightning. Dumbledore could remove it and chooses not to, saying scars can be useful.","at":"ss1","v":1},
  {"t":"The only thing Harry likes about how he looks. He has been told it comes from the car crash.","at":"ss2","v":1},
  {"t":"What is left when a powerful, evil curse touches you. It is how the wizarding world knows him on sight.","at":"ss4","v":1},
  {"t":"Burns for a second at the first feast.","at":"ss7","v":1},
  {"t":"Blinds him with pain when the hooded figure comes towards him in the forest, and keeps prickling in the weeks after.","at":"ss15","v":1},
  {"t":"It hurts when Voldemort is near. In September he was a few feet away, under a turban.","at":"ss17","v":1},
  {"t":"Hurts for the first time away from school, hundreds of miles from anyone.","at":"gf2","v":1},
  {"t":"Dumbledore thinks it hurts when Voldemort is near, or feeling a surge of hatred. The failed curse connected them.","at":"gf30","v":1},
  {"t":"Flickers with Voldemort's moods now, almost daily.","at":"op18","v":1},
  {"t":"A channel between two minds. Harry sees through it best when he is asleep.","at":"op24","v":1},
  {"t":"Quiet since the Ministry.","at":"hb4","v":1},
  {"t":"Open to Voldemort again, in flashes, whenever he is angry or triumphant.","at":"dh5","v":1},
  {"t":"Harry finds that grief, like love, lets him close his mind.","at":"dh24","v":1},
  {"t":"It has not hurt for nineteen years.","at":"dh37","v":1}]},
 {"id":"hat","kind":"magic","name":"The Sorting Hat","appear":"ss7","tag":[{"t":"Chooses each student's house","at":"ss7"}],"rel":["mcgonagall","harry","gryffindor","slytherin","hufflepuff","ravenclaw","hall","office","sword","neville"],"group":"object","sub":"Enchanted hat","relAt":{"neville":"dh36"},"facts":[
  {"t":"A patched, frayed, filthy wizard's hat. A rip near the brim opens like a mouth, and it sings about the four houses before the Sorting.","at":"ss7","v":1},
  {"t":"Each first year puts it on, and it looks into their head and calls out a house.","at":"ss7","v":1},
  {"t":"Speaks privately to Harry and takes his wishes into account.","at":"ss7","v":1},
  {"t":"Kept on a shelf in Dumbledore's office.","at":"cs12","v":1},
  {"t":"Fawkes drops it at Harry's feet in the Chamber. The sword comes out of it.","at":"cs17","v":1},
  {"t":"Sings a new song every year.","at":"gf12","v":1},
  {"t":"Its song this year breaks with custom to warn the houses to stand together.","at":"op11","v":1},
  {"t":"Set alight on Neville's head. The sword comes out of it again.","at":"dh36","v":1}]},
 {"id":"remembrall","kind":"magic","name":"Remembrall","appear":"ss9","tag":[{"t":"Glows red when you have forgotten something","at":"ss9"}],"rel":["neville","draco","harry"],"group":"object","sub":"Device","holders":[{"id":"neville","at":"ss9"}],"facts":[
  {"t":"A glass ball the size of a large marble, full of white smoke. Neville's grandmother sends him one.","at":"ss9","v":1},
  {"t":"Malfoy flies off with it during the flying lesson. Harry's catch, inches from the ground, is what gets him onto the Quidditch team.","at":"ss9","v":1}]},
 {"id":"nimbus","kind":"magic","name":"Nimbus Two Thousand","appear":"ss5","tag":[{"t":"The newest racing broom","at":"ss5"},{"t":"Harry's broom","at":"ss10"},{"t":"Destroyed","at":"pa9"}],"rel":["harry","mcgonagall","wood","broomjinx"],"relAt":{"harry":"ss10","mcgonagall":"ss10","wood":"ss10"},"group":"object","sub":"Racing broom","holders":[{"id":"harry","at":"ss10"}],"facts":[
  {"t":"On show in a Diagon Alley window as the fastest broom yet made.","at":"ss5","v":1},
  {"t":"One arrives for Harry by owl, with a note from McGonagall telling him not to open it at the table. Sleek mahogany, with a tail of straight twigs.","at":"ss10","v":1},
  {"t":"Blown into the Whomping Willow during the Hufflepuff match and broken beyond repair.","at":"pa9","v":1}]},
 {"id":"cloak","kind":"magic","name":"The Invisibility Cloak","appear":"ss12","tag":[{"t":"Makes the wearer invisible","at":"ss12"},{"t":"Perhaps the third Hallow","at":"dh21"},{"t":"The third Hallow","at":"dh35"}],"rel":["harry","james","dumbledore","norbert","hallows","peverells"],"relAt":{"dumbledore":"ss17","hallows":"dh21","peverells":"dh22"},"group":"object","sub":"Cloak","holders":[{"id":"james","at":"ss12"},{"id":"harry","at":"ss12"}],"facts":[
  {"t":"Silvery gray and fluid, like water woven into cloth. Ron says they are very rare.","at":"ss12","v":1},
  {"t":"Arrives on Christmas morning with an unsigned note saying Harry's father left it with the sender, and to use it well.","at":"ss12","v":1},
  {"t":"Harry first uses it to get into the Restricted Section at night.","at":"ss12","v":1},
  {"t":"Hides Norbert's crate on the way up the tower, and is then left behind at the top.","at":"ss14","v":1},
  {"t":"Returned to Harry's bed, neatly folded, with a note of three words.","at":"ss15","v":1},
  {"t":"Dumbledore sent it. Harry's father mostly used it for raiding the kitchens.","at":"ss17","v":1},
  {"t":"Harry and Ron wear it to Hagrid's hut and hear his arrest from a corner.","at":"cs14","v":1},
  {"t":"No use against Dementors, who do not need eyes.","at":"pa10","v":1},
  {"t":"Slips in Hogsmeade, and Malfoy sees Harry's head.","at":"pa14","v":1},
  {"t":"Left at the foot of the Willow. Snape finds it and uses it.","at":"pa19","v":1},
  {"t":"Moody's eye sees straight through it.","at":"gf25","v":1},
  {"t":"Harry is under it, frozen, on the tower.","at":"hb27","v":1},
  {"t":"Ordinary Invisibility Cloaks fade with age. Harry's is as good as when his father had it.","at":"dh21","v":1},
  {"t":"The true Cloak of the tale, handed down from Ignotus Peverell. Dumbledore borrowed it to examine it.","at":"dh35","v":1}]},
 {"id":"mirror","kind":"magic","name":"The Mirror of Erised","appear":"ss12","tag":[{"t":"Shows your deepest desire","at":"ss12"}],"rel":["harry","ron","dumbledore","stone","quirrell"],"relAt":{"stone":"ss17","quirrell":"ss17"},"group":"object","sub":"Mirror","facts":[
  {"t":"As tall as the ceiling, in a gold frame on clawed feet, with an inscription that only makes sense read backwards. Harry finds it in an unused classroom.","at":"ss12","v":1},
  {"t":"Harry sees his family in it. Ron sees himself outshining his brothers.","at":"ss12","v":1},
  {"t":"It shows the deepest wish of whoever looks, neither knowledge nor truth. People have wasted away in front of it, and Dumbledore has it moved.","at":"ss12","v":1},
  {"t":"The last of the Stone's defenses, and Dumbledore's own. Only someone who wants to find the Stone, and not to use it, can get it out.","at":"ss17","v":1}]},
 {"id":"stone","kind":"magic","name":[{"t":"The package from vault 713","at":"ss5"},{"t":"The Sorcerer's Stone","at":"ss13"}],"appear":"ss5","tag":[{"t":"Collected by Hagrid for Dumbledore","at":"ss5"},{"t":"Hidden under a trapdoor at Hogwarts","at":"ss9"},{"t":"Destroyed","at":"ss17"}],"rel":["flamel","dumbledore","hagrid","vault713","fluffy","elixir","mirror","voldemort","quirrell","chambers"],"relAt":{"flamel":"ss13","mirror":"ss17","voldemort":"ss15","quirrell":"ss17"},"group":"object","sub":"Legendary substance","holders":[{"id":"flamel","at":"ss13"}],"facts":[
  {"t":"A grubby little parcel in brown paper, the only thing in a high-security vault. Hagrid pockets it and will not say what it is.","at":"ss5","v":1},
  {"t":"Someone breaks into that vault later the same day and finds it empty.","at":"ss8","v":1},
  {"t":"Harry guesses that the parcel is what the three-headed dog is standing guard over.","at":"ss9","v":1},
  {"t":"The Sorcerer's Stone: it turns any metal to pure gold and produces the Elixir of Life. The only one in existence belongs to Nicolas Flamel.","at":"ss13","v":1},
  {"t":"Guarded by Fluffy and by enchantments set by Sprout, Flitwick, McGonagall, Quirrell, Snape and Dumbledore.","at":"ss14","v":1},
  {"t":"Blood-red. It drops into Harry's pocket out of the Mirror, and Quirrell never gets hold of it.","at":"ss17","v":1},
  {"t":"Destroyed afterwards, by agreement between Dumbledore and Flamel.","at":"ss17","v":1}]},
 {"id":"flute","kind":"magic","name":"Hagrid's flute","appear":"ss12","tag":[{"t":"A Christmas present","at":"ss12"}],"rel":["hagrid","harry","fluffy"],"relAt":{"fluffy":"ss16"},"group":"object","sub":"Not magic at all","holders":[{"id":"harry","at":"ss12"}],"facts":[
  {"t":"Roughly carved from wood by Hagrid. It sounds a bit like an owl.","at":"ss12","v":1},
  {"t":"Harry plays it to keep Fluffy asleep, then hands it to Hermione so he can go first.","at":"ss16","v":1}]},
 {"id":"chess","kind":"magic","name":"Wizard chess","appear":"ss12","tag":[{"t":"Chess with living pieces","at":"ss12"}],"rel":["ron","mcgonagall","chambers"],"group":"object","sub":"Game","facts":[
  {"t":"Played like ordinary chess, with pieces that move themselves and argue with the player. Ron's battered old set was his grandfather's and he is very good with it.","at":"ss12","v":1},
  {"t":"McGonagall's defense for the Stone is a board with pieces taller than a man. Crossing means taking the place of three black pieces and winning, and taken pieces are struck down for real.","at":"ss16","v":1}]},
 {"id":"keys","kind":"magic","name":"The winged keys","appear":"ss16","tag":[{"t":"Flitwick's defense","at":"ss16"}],"rel":["flitwick","harry","chambers"],"group":"object","sub":"Enchantment","facts":[
  {"t":"A high chamber full of what look like glittering birds. They are keys, hundreds of them, and the door only opens to one.","at":"ss16","v":1},
  {"t":"Harry spots the right one, big, old-fashioned and silver with a bent wing, and catches it on a broom.","at":"ss16","v":1}]},
 {"id":"transfiguration","kind":"magic","name":"Transfiguration","appear":"ss5","tag":[{"t":"A branch of magic","at":"ss5"},{"t":"Taught by McGonagall","at":"ss8"}],"rel":["mcgonagall","hermione"],"group":"lore","sub":"Subject","facts":[
  {"t":"Mr. Ollivander names it as what James Potter's wand was best at.","at":"ss5","v":1},
  {"t":"Turning one thing into another. McGonagall calls it some of the most complex and dangerous magic taught at Hogwarts. The first task is to turn a match into a needle.","at":"ss8","v":1}]},
 {"id":"charms","kind":"magic","name":"Charms","appear":"ss8","tag":[{"t":"Taught by Flitwick","at":"ss8"}],"rel":["flitwick","leviosa"],"group":"lore","sub":"Subject","facts":[
  {"t":"Taught by Professor Flitwick.","at":"ss8","v":1},
  {"t":"By Halloween the class has moved on to making objects fly.","at":"ss10","v":1},
  {"t":"The practical exam is making a pineapple tap-dance across a desk.","at":"ss16","v":1}]},
 {"id":"potions","kind":"magic","name":"Potions","appear":"ss7","tag":[{"t":"Taught by Snape","at":"ss7"}],"rel":["snape","dungeons","livingdeath","bezoar","boilcure","slughorn","felix"],"group":"lore","sub":"Subject","facts":[
  {"t":"Percy tells Harry it is what Snape teaches, though not the subject he would like to have.","at":"ss7","v":1},
  {"t":"Taught in a cold dungeon lined with pickled animals in jars. No wand-waving: Snape calls it an exact art and expects few of the class to appreciate it.","at":"ss8","v":1},
  {"t":"Gryffindor has it with Slytherin.","at":"ss8","v":1},
  {"t":"Harry throws a firework into a cauldron of Swelling Solution to cover a theft from Snape's stores.","at":"cs11","v":1},
  {"t":"Neville's Shrinking Solution turns out orange, until Hermione whispers the fix.","at":"pa7","v":1},
  {"t":"Snape takes only top-grade students beyond this year.","at":"op12","v":1},
  {"t":"Taught by Slughorn, who accepts lower grades than Snape did.","at":"hb8","v":1}]},
 {"id":"dada","kind":"magic","name":"Defense Against the Dark Arts","appear":"ss5","tag":[{"t":"Quirrell's subject","at":"ss5"}],"rel":["quirrell","snape","lockhart","lupin","moody","umbridge"],"group":"lore","sub":"Subject","relAt":{"snape":"hb8"},"facts":[
  {"t":"What Professor Quirrell teaches.","at":"ss5","v":1},
  {"t":"Snape is known to be after the job.","at":"ss7","v":1},
  {"t":"The class everyone looked forward to. Quirrell's lessons turn out to be a bit of a joke.","at":"ss8","v":1},
  {"t":"Taught this year by Gilderoy Lockhart, mostly through re-enactments of his books.","at":"cs6","v":1},
  {"t":"The job is vacant again.","at":"cs18","v":1},
  {"t":"Taught this year by Professor Lupin.","at":"pa5","v":1},
  {"t":"After Boggarts come Red Caps, Kappas and grindylows. For once, everybody's favorite lesson.","at":"pa8","v":1},
  {"t":"The exam is an obstacle course of creatures, ending with a Boggart in a trunk.","at":"pa16","v":1},
  {"t":"The job falls vacant for the third time in three years.","at":"pa22","v":1},
  {"t":"Taught this year by Mad-Eye Moody, for one year only as a favor to Dumbledore.","at":"gf12","v":1},
  {"t":"He teaches curses the Ministry thinks they are too young to see.","at":"gf14","v":1},
  {"t":"Taught this year by Dolores Umbridge, without wands.","at":"op11","v":1},
  {"t":"Vacant again.","at":"op38","v":1},
  {"t":"Taught this year by Snape.","at":"hb8","v":1},
  {"t":"The post has been jinxed since Voldemort was refused it.","at":"hb20","v":1}]},
 {"id":"herbology","kind":"magic","name":"Herbology","appear":"ss8","tag":[{"t":"Taught by Sprout","at":"ss8"}],"rel":["sprout","greenhouses","snare"],"group":"lore","sub":"Subject","facts":[
  {"t":"Three times a week in the greenhouses behind the castle: how to look after strange plants and fungi and what they are used for.","at":"ss8","v":1},
  {"t":"Second years move up to greenhouse three and more dangerous plants.","at":"cs6","v":1}]},
 {"id":"history","kind":"magic","name":"History of Magic","appear":"ss8","tag":[{"t":"Taught by Binns","at":"ss8"}],"rel":["binns"],"group":"lore","sub":"Subject","facts":[
  {"t":"Names and dates read out in a drone by a ghost.","at":"ss8","v":1},
  {"t":"The one lesson anyone remembers: the day Binns was asked about the Chamber.","at":"cs9","v":1}]},
 {"id":"astronomy","kind":"magic","name":[{"t":"Midnight star lessons","at":"ss8"},{"t":"Astronomy","at":"ss15"}],"appear":"ss8","tag":[{"t":"Stars and planets","at":"ss8"}],"rel":["tower_ast"],"group":"lore","sub":"Subject","facts":[
  {"t":"Every Wednesday at midnight, with telescopes: the names of the stars and how the planets move.","at":"ss8","v":1},
  {"t":"The practical exam is interrupted by a fight on the lawn below.","at":"op31","v":1}]},
 {"id":"flying","kind":"magic","name":"Flying lessons","appear":"ss9","tag":[{"t":"Taught by Madam Hooch","at":"ss9"}],"rel":["hooch","harry","neville","remembrall"],"group":"lore","sub":"Subject","facts":[
  {"t":"First years learn on the school's old brooms. Gryffindor and Slytherin have the lesson together.","at":"ss9","v":1},
  {"t":"The first one ends with Neville in the hospital wing and Harry on the Quidditch team.","at":"ss9","v":1}]},
 {"id":"quidditch","kind":"magic","name":"Quidditch","appear":"ss5","tag":[{"t":"The wizard sport","at":"ss5"}],"rel":["wood","harry","gteam","steam","pitch","nimbus","hooch","lee","worldcup"],"group":"lore","sub":"Sport","facts":[
  {"t":"Played in the air on broomsticks with four balls. Everybody in the wizarding world follows it.","at":"ss5","v":1},
  {"t":"Each Hogwarts house has a team. First years almost never play.","at":"ss5","v":1},
  {"t":"Seven players a side. Three Chasers score through hoops with the Quaffle, ten points a goal, and a Keeper guards the hoops.","at":"ss10","v":1},
  {"t":"Two Beaters with bats keep the two Bludgers, which try to knock players off their brooms, away from their own side.","at":"ss10","v":1},
  {"t":"The Seeker goes after the Golden Snitch, tiny, winged and very fast. Catching it earns a hundred and fifty points and ends the game.","at":"ss10","v":1},
  {"t":"Gryffindor beat Slytherin by a hundred and seventy points to sixty in the first match of the year.","at":"ss11","v":1},
  {"t":"Gryffindor beat Hufflepuff when Harry catches the Snitch within minutes.","at":"ss13","v":1},
  {"t":"With Harry in the hospital wing, Gryffindor lose their last match to Ravenclaw badly.","at":"ss17","v":1},
  {"t":"Cancelled for the rest of the year after the attack on Hermione.","at":"cs14","v":1},
  {"t":"Gryffindor win the Cup by catching the Snitch when exactly enough ahead.","at":"pa15","v":1},
  {"t":"The World Cup final ends Ireland 170, Bulgaria 160.","at":"gf8","v":1},
  {"t":"No house matches this year, because of the tournament.","at":"gf12","v":1},
  {"t":"Gryffindor take the Cup with a reserve Seeker.","at":"op30","v":1},
  {"t":"Gryffindor win the final by enough to take the Cup.","at":"hb24","v":1}]},
 {"id":"gryffindor","kind":"group","name":"Gryffindor","appear":"ss6","tag":[{"t":"One of the four Hogwarts houses","at":"ss6"}],"rel":["mcgonagall","nick","fatlady","tower","gteam","hat","godric"],"relAt":{"mcgonagall":"ss9"},"group":"house","sub":"House","color":"#8E2323","holders":[{"id":"dumbledore","at":"ss6"},{"id":"hermione","at":"ss7"},{"id":"neville","at":"ss7"},{"id":"ron","at":"ss7"},{"id":"harry","at":"ss7"},{"id":"seamus","at":"ss7"},{"id":"dean","at":"ss7"},{"id":"lavender","at":"ss7"},{"id":"percy","at":"ss7"},{"id":"fred","at":"ss7"},{"id":"george","at":"ss7"},{"id":"nick","at":"ss7"},{"id":"parvati","at":"ss9"},{"id":"mcgonagall","at":"ss9"},{"id":"wood","at":"ss9"},{"id":"lee","at":"ss11"},{"id":"angelina","at":"ss11"},{"id":"alicia","at":"ss11"},{"id":"katie","at":"ss11"},{"id":"ginny","at":"cs5"},{"id":"colin","at":"cs6"},{"id":"godric","at":"cs9"},{"id":"dennis","at":"gf12"},{"id":"lily","at":"op28"},{"id":"james","at":"op28"},{"id":"sirius","at":"op28"},{"id":"lupin","at":"op28"},{"id":"pettigrew","at":"op28"}],"facts":[
  {"t":"The house Ron's whole family has been in. Hermione has heard it is the best, and that Dumbledore was in it.","at":"ss6","v":1},
  {"t":"For the brave and daring, according to the Sorting Hat.","at":"ss7","v":1},
  {"t":"Lives in Gryffindor Tower, behind a portrait of a very large woman in pink. The house ghost is Nearly Headless Nick.","at":"ss7","v":1},
  {"t":"Professor McGonagall is head of the house.","at":"ss9","v":1},
  {"t":"Drops from first place to last in one night when three first years lose a hundred and fifty points.","at":"ss15","v":1},
  {"t":"Ends the year on 312 points, then gets 170 more at the feast and takes the House Cup from Slytherin.","at":"ss17","v":1},
  {"t":"Founded by Godric Gryffindor.","at":"cs9","v":1},
  {"t":"Wins the House Cup for the second year running, on four hundred points for Harry and Ron.","at":"cs18","v":1},
  {"t":"Wins the Quidditch Cup for the first time since Charlie Weasley's day.","at":"pa15","v":1},
  {"t":"Takes the House Cup for the third year running.","at":"pa22","v":1},
  {"t":"Harry's parents and their friends were Gryffindors.","at":"op28","v":1},
  {"t":"Its sword comes to a Gryffindor in need for the second time.","at":"dh36","v":1}]},
 {"id":"slytherin","kind":"group","name":"Slytherin","appear":"ss5","tag":[{"t":"One of the four Hogwarts houses","at":"ss5"}],"rel":["snape","baron","draco","steam","hat","voldemort","salazar","slyth_room","squad"],"relAt":{"snape":"ss8","draco":"ss7"},"group":"house","sub":"House","color":"#1F5A3D","holders":[{"id":"voldemort","at":"ss5"},{"id":"draco","at":"ss7"},{"id":"crabbe","at":"ss7"},{"id":"goyle","at":"ss7"},{"id":"millicent","at":"ss7"},{"id":"blaise","at":"ss7"},{"id":"baron","at":"ss7"},{"id":"snape","at":"ss8"},{"id":"pansy","at":"ss9"},{"id":"flint","at":"ss11"},{"id":"higgs","at":"ss11"},{"id":"pucey","at":"ss11"},{"id":"bletchley","at":"ss11"},{"id":"salazar","at":"cs9"},{"id":"riddle","at":"cs17"},{"id":"montague","at":"op19"},{"id":"slughorn","at":"hb4"}],"facts":[
  {"t":"The house the boy in the robe shop expects to be in. Hagrid says every witch or wizard who went bad came out of it, Voldemort included.","at":"ss5","v":1},
  {"t":"For the cunning, who will use any means to get what they want, according to the Sorting Hat.","at":"ss7","v":1},
  {"t":"Has won the House Cup six years running. The house ghost is the Bloody Baron.","at":"ss7","v":1},
  {"t":"Professor Snape is head of the house.","at":"ss8","v":1},
  {"t":"Finishes first on 472 points, and loses the Cup at the feast by ten.","at":"ss17","v":1},
  {"t":"Founded by Salazar Slytherin, who wanted only pure-blood students.","at":"cs9","v":1},
  {"t":"Its common room is in the dungeons.","at":"cs12","v":1},
  {"t":"Sent out of the castle before the battle.","at":"dh30","v":1},
  {"t":"Harry tells his son it would be no disgrace.","at":"dh37","v":1}]},
 {"id":"hufflepuff","kind":"group","name":"Hufflepuff","appear":"ss5","tag":[{"t":"One of the four Hogwarts houses","at":"ss5"}],"rel":["friar","hat","helga","hteam"],"group":"house","sub":"House","color":"#D4A017","holders":[{"id":"hannah","at":"ss7"},{"id":"susan","at":"ss7"},{"id":"justin","at":"ss7"},{"id":"friar","at":"ss7"},{"id":"helga","at":"cs9"},{"id":"ernie","at":"cs11"},{"id":"cedric","at":"pa9"},{"id":"zacharias","at":"op16"}],"facts":[
  {"t":"The boy in the robe shop says he would leave if he were put there. Hagrid says better that than Slytherin.","at":"ss5","v":1},
  {"t":"For the just, loyal and hard-working, according to the Sorting Hat. The house ghost is the Fat Friar.","at":"ss7","v":1},
  {"t":"Finishes third, on 352 points.","at":"ss17","v":1},
  {"t":"Founded by Helga Hufflepuff.","at":"cs9","v":1},
  {"t":"Has a champion, and takes Harry's entry as an attempt to steal its glory.","at":"gf16","v":1}]},
 {"id":"ravenclaw","kind":"group","name":"Ravenclaw","appear":"ss6","tag":[{"t":"One of the four Hogwarts houses","at":"ss6"}],"rel":["hat","rowena","rteam","helena","ravenclaw_tower","diadem"],"group":"house","sub":"House","color":"#27457E","holders":[{"id":"terry","at":"ss7"},{"id":"mandy","at":"ss7"},{"id":"lisa","at":"ss7"},{"id":"rowena","at":"cs9"},{"id":"penelope","at":"cs14"},{"id":"cho","at":"pa13"},{"id":"padma","at":"gf22"},{"id":"luna","at":"op10"},{"id":"anthony","at":"op10"},{"id":"marietta","at":"op16"},{"id":"michael","at":"op16"},{"id":"helena","at":"dh31"}],"facts":[
  {"t":"Ron thinks it would not be too bad to end up there.","at":"ss6","v":1},
  {"t":"For the clever and quick to learn, according to the Sorting Hat.","at":"ss7","v":1},
  {"t":"Finishes second, on 426 points.","at":"ss17","v":1},
  {"t":"Founded by Rowena Ravenclaw.","at":"cs9","v":1}]},
 {"id":"gteam","kind":"group","name":"Gryffindor Quidditch team","appear":"ss9","tag":[{"t":"Captained by Oliver Wood","at":"ss9"}],"rel":["gryffindor","quidditch","wood","harry","pitch"],"group":"team","sub":"Quidditch team","color":"#8E2323","holders":[{"id":"wood","at":"ss9"},{"id":"harry","at":"ss9"},{"id":"fred","at":"ss9"},{"id":"george","at":"ss9"},{"id":"angelina","at":"ss11"},{"id":"alicia","at":"ss11"},{"id":"katie","at":"ss11"},{"id":"ron","at":"op13"},{"id":"ginny","at":"op21"},{"name":"Demelza Robins","at":"hb11"},{"name":"Jimmy Peakes","at":"hb11"},{"name":"Ritchie Coote","at":"hb11"},{"id":"dean","at":"hb14"},{"id":"mclaggen","at":"hb19"}],"facts":[
  {"t":"Flattened by Slytherin in last year's final match. Has not won since Charlie Weasley left.","at":"ss9","v":1},
  {"t":"Takes on Harry as Seeker, kept secret as long as Wood can manage.","at":"ss9","v":1},
  {"t":"Wood in goal, the Weasley twins as Beaters, and Angelina Johnson, Alicia Spinnet and Katie Bell as Chasers.","at":"ss11","v":1},
  {"t":"Beating Hufflepuff puts Gryffindor ahead of Slytherin in the house championship.","at":"ss13","v":1},
  {"t":"Without Harry, loses the last match of the year.","at":"ss17","v":1},
  {"t":"Beats Slytherin in the rain, with a rogue Bludger on Harry all match.","at":"cs10","v":1},
  {"t":"The Hufflepuff match is called off minutes before it starts.","at":"cs14","v":1},
  {"t":"Loses to Hufflepuff when Harry falls.","at":"pa9","v":1},
  {"t":"Beats Ravenclaw.","at":"pa13","v":1},
  {"t":"Beats Slytherin in the final and takes the Cup.","at":"pa15","v":1},
  {"t":"Angelina Johnson is captain, and needs a Keeper.","at":"op12","v":1},
  {"t":"Beats Slytherin, then loses its Seeker and both Beaters to a lifetime ban.","at":"op19","v":1},
  {"t":"Wins the Cup anyway.","at":"op30","v":1},
  {"t":"Harry is captain.","at":"hb5","v":1},
  {"t":"Katie Bell, Ginny Weasley and Demelza Robins as Chasers, two new Beaters, Ron in goal.","at":"hb11","v":1},
  {"t":"Wins the Cup with the captain in detention.","at":"hb24","v":1}]},
 {"id":"steam","kind":"group","name":"Slytherin Quidditch team","appear":"ss11","tag":[{"t":"Captained by Marcus Flint","at":"ss11"}],"rel":["slytherin","quidditch","flint"],"group":"team","sub":"Quidditch team","color":"#1F5A3D","holders":[{"id":"flint","at":"ss11"},{"id":"higgs","at":"ss11"},{"id":"pucey","at":"ss11"},{"id":"bletchley","at":"ss11"},{"id":"draco","at":"cs7"},{"id":"montague","at":"op19"},{"id":"crabbe","at":"op19"},{"id":"goyle","at":"op19"}],"facts":[
  {"t":"Plays rough: Flint nearly knocks Harry off his broom on purpose and gives away a penalty.","at":"ss11","v":1},
  {"t":"Loses the opening match to Gryffindor.","at":"ss11","v":1},
  {"t":"Seven new brooms, and Draco Malfoy as Seeker.","at":"cs7","v":1},
  {"t":"Loses to Gryffindor again.","at":"cs10","v":1},
  {"t":"Loses the final to Gryffindor.","at":"pa15","v":1}]},
 {"id":"potters","kind":"group","name":"The Potters","appear":"ss1","tag":[{"t":"Harry's family","at":"ss1"}],"rel":["harry","james","lily","godrics","voldemort","peverells"],"group":"family","sub":"Family","holders":[{"id":"james","at":"ss1"},{"id":"lily","at":"ss1"},{"id":"harry","at":"ss1"}],"relAt":{"peverells":"dh22"},"facts":[
  {"t":"Lily, James and their son Harry. Voldemort came to their house in Godric's Hollow, and only Harry lived.","at":"ss1","v":1},
  {"t":"They left Harry a vault of gold at Gringotts.","at":"ss5","v":1},
  {"t":"Harry sees generations of them in the Mirror of Erised, some with his eyes, some with his knees.","at":"ss12","v":1},
  {"t":"Descended from Ignotus Peverell.","at":"dh35","v":1}]},
 {"id":"dursleys","kind":"group","name":"The Dursleys","appear":"ss1","tag":[{"t":"Harry's Muggle relatives","at":"ss1"}],"rel":["vernon","petunia","dudley","harry","privet","marge"],"group":"family","sub":"Family","holders":[{"id":"vernon","at":"ss1"},{"id":"petunia","at":"ss1"},{"id":"dudley","at":"ss1"},{"id":"marge","at":"ss2"}],"facts":[
  {"t":"Mr. and Mrs. Dursley and their son Dudley, of number four, Privet Drive. The only family Harry has left.","at":"ss1","v":1},
  {"t":"They treat Harry as a nuisance and have forbidden him to ask questions.","at":"ss2","v":1},
  {"t":"Knew all along what Harry was and told him his parents died in a car crash.","at":"ss4","v":1}]},
 {"id":"weasleys","kind":"group","name":"The Weasleys","appear":"ss6","tag":[{"t":"An old wizarding family","at":"ss6"}],"rel":["ron","mrs_weasley","gryffindor","arthur","burrow","muriel"],"group":"family","sub":"Family","holders":[{"id":"mrs_weasley","at":"ss6"},{"id":"bill","at":"ss6"},{"id":"charlie","at":"ss6"},{"id":"percy","at":"ss6"},{"id":"fred","at":"ss6"},{"id":"george","at":"ss6"},{"id":"ron","at":"ss6"},{"id":"ginny","at":"ss6"},{"id":"arthur","at":"cs3"}],"facts":[
  {"t":"Seven children, all red-haired: Bill, Charlie, Percy, the twins Fred and George, Ron and Ginny.","at":"ss6","v":1},
  {"t":"Not well off. Malfoy sneers that they have more children than they can afford.","at":"ss6","v":1},
  {"t":"Mrs. Weasley knits every one of them a sweater at Christmas, and Harry too.","at":"ss12","v":1},
  {"t":"They live at the Burrow.","at":"cs3","v":1},
  {"t":"Their Gringotts vault holds a small pile of Sickles and one Galleon.","at":"cs4","v":1},
  {"t":"About to gain Fleur Delacour.","at":"hb5","v":1},
  {"t":"Lose Fred.","at":"dh31","v":1}]},
 {"id":"staff","kind":"group","name":"Hogwarts staff","appear":"ss7","tag":[{"t":"Teachers and everyone else who runs the castle","at":"ss7"}],"rel":["hogwarts","dumbledore"],"group":"org","sub":"School","holders":[{"id":"dumbledore","at":"ss7"},{"id":"mcgonagall","at":"ss7"},{"id":"quirrell","at":"ss7"},{"id":"snape","at":"ss7"},{"id":"hagrid","at":"ss7"},{"id":"filch","at":"ss7"},{"id":"hooch","at":"ss7"},{"id":"flitwick","at":"ss8"},{"id":"sprout","at":"ss8"},{"id":"binns","at":"ss8"},{"id":"pomfrey","at":"ss9"},{"id":"pince","at":"ss12"},{"id":"lockhart","at":"cs4"},{"id":"lupin","at":"pa5"},{"id":"trelawney","at":"pa6"},{"id":"moody","at":"gf12"},{"id":"umbridge","at":"op11"},{"id":"grubbly","at":"op11"},{"id":"firenze","at":"op27"},{"id":"slughorn","at":"hb4"},{"id":"burbage","at":"dh1"},{"id":"carrows","at":"dh12"}],"facts":[
  {"t":"Sit at the High Table at the top of the Great Hall.","at":"ss7","v":1},
  {"t":"Each house has a teacher at its head.","at":"ss8","v":1},
  {"t":"Six of them set defenses around the Stone.","at":"ss14","v":1},
  {"t":"Agree, for once, on something: Lockhart can go and face the monster.","at":"cs16","v":1},
  {"t":"The heads of house turn on Snape.","at":"dh30","v":1}]},
 {"id":"ghosts","kind":"group","name":"The Hogwarts ghosts","appear":"ss7","tag":[{"t":"About twenty of them","at":"ss7"}],"rel":["nick","baron","friar","binns","peeves"],"group":"org","sub":"Ghosts","holders":[{"id":"nick","at":"ss7"},{"id":"baron","at":"ss7"},{"id":"friar","at":"ss7"},{"id":"binns","at":"ss8"}],"facts":[
  {"t":"Pearly white and slightly see-through. They drift in through the wall while the first years wait to be sorted.","at":"ss7","v":1},
  {"t":"Each house has its own.","at":"ss7","v":1},
  {"t":"They glide through doors without warning, which does not help anyone find a classroom.","at":"ss8","v":1}]},
 {"id":"ministry","kind":"group","name":"Ministry of Magic","appear":"ss5","tag":[{"t":"The wizards' government","at":"ss5"}],"rel":["fudge","dumbledore","dragons","arthur","hopkirk","committee","dementors","aurors","ministry_hq","wizengamot","decrees","scrimgeour","commission","thicknesse","snatchers"],"group":"org","sub":"Government","holders":[{"id":"fudge","at":"ss5"},{"id":"hopkirk","at":"cs2"},{"id":"arthur","at":"cs3"},{"id":"bertha","at":"gf1"},{"id":"percy","at":"gf5"},{"id":"crouch","at":"gf5"},{"id":"bagman","at":"gf5"},{"id":"amos","at":"gf6"},{"id":"tonks","at":"op3"},{"id":"kingsley","at":"op3"},{"id":"bode","at":"op7"},{"id":"umbridge","at":"op8"},{"id":"bones","at":"op8"},{"id":"dawlish","at":"op27"},{"id":"scrimgeour","at":"hb1"},{"id":"thicknesse","at":"dh1"},{"id":"yaxley","at":"dh1"}],"facts":[
  {"t":"Its main job, as Hagrid puts it, is to keep Muggles from finding out that there are still witches and wizards.","at":"ss5","v":1},
  {"t":"Headed by Cornelius Fudge.","at":"ss5","v":1},
  {"t":"Has to hush up the wild dragons in Britain.","at":"ss14","v":1},
  {"t":"An urgent owl in its name calls Dumbledore to London on the night of the trapdoor.","at":"ss16","v":1},
  {"t":"Can tell when magic is done in a Muggle house with an under-age wizard in it, though not who did it.","at":"cs2","v":1},
  {"t":"Has an office for Muggle objects that have been enchanted.","at":"cs3","v":1},
  {"t":"Has an Accidental Magic Reversal squad for things like inflated aunts.","at":"pa3","v":1},
  {"t":"Lends cars to take Harry to the station.","at":"pa4","v":1},
  {"t":"Blamed in the press for the World Cup riot.","at":"gf10","v":1},
  {"t":"Under Fudge, it will not admit Voldemort has returned.","at":"gf36","v":1},
  {"t":"Its line is that Voldemort has not returned, and that Harry and Dumbledore are attention-seekers or worse.","at":"op4","v":1},
  {"t":"Admits he is back.","at":"op38","v":1},
  {"t":"Scrimgeour replaces Fudge.","at":"hb1","v":1},
  {"t":"Making arrests for the look of it.","at":"hb16","v":1},
  {"t":"Falls to Voldemort in a quiet coup.","at":"dh8","v":1},
  {"t":"Declares Harry wanted for questioning about Dumbledore's death.","at":"dh11","v":1}]},
 {"id":"followers","kind":"group","name":[{"t":"Voldemort's followers","at":"ss4"},{"t":"Death Eaters","at":"gf9"}],"appear":"ss4","tag":[{"t":"Those who took his side","at":"ss4"}],"rel":["voldemort","quirrell","draco","lucius","dark_mark","lestranges","karkaroff","crouch_jr","bellatrix","rookwood","dolohov","greyback","carrows","yaxley","rowle","travers"],"relAt":{"quirrell":"ss17","draco":"ss6","lucius":"cs3","karkaroff":"gf19","crouch_jr":"gf35"},"group":"org","sub":"Dark side","holders":[{"id":"quirrell","at":"ss17"},{"id":"lucius","at":"cs3"},{"id":"pettigrew","at":"pa19"},{"id":"karkaroff","at":"gf19"},{"id":"snape","at":"gf30"},{"id":"lucius","at":"gf33"},{"id":"macnair","at":"gf33"},{"id":"crouch_jr","at":"gf35"},{"id":"regulus","at":"op6"},{"id":"bellatrix","at":"op6"},{"id":"rookwood","at":"op25"},{"id":"dolohov","at":"op25"},{"id":"draco","at":"hb27"},{"id":"greyback","at":"hb27"},{"id":"carrows","at":"hb27"},{"id":"yaxley","at":"dh1"},{"id":"rowle","at":"dh9"},{"id":"travers","at":"dh21"}],"facts":[
  {"t":"Some joined him out of fear and some for a share of his power. No one knew whom to trust.","at":"ss4","v":1},
  {"t":"After he vanished, some came out of a kind of trance and returned.","at":"ss4","v":1},
  {"t":"Malfoy's family were among the first back, saying they had been bewitched. Ron's father does not believe it.","at":"ss6","v":1},
  {"t":"Quirrell served him this year, as the only body he had.","at":"ss17","v":1},
  {"t":"Lucius Malfoy was a leading supporter. He came back saying none of it had been his own doing.","at":"cs3","v":1},
  {"t":"Those in Azkaban believe Pettigrew led their master into a trap. He has been hiding from them as much as from anyone.","at":"pa19","v":1},
  {"t":"They called themselves Death Eaters. A masked, hooded crowd of them marches through the World Cup campsite, and scatters at the sight of the Dark Mark.","at":"gf9","v":1},
  {"t":"Karkaroff gave the court Dolohov, Rosier, Travers, Mulciber and Rookwood, a spy inside the Ministry.","at":"gf30","v":1},
  {"t":"Those who answer the summons in the graveyard include Lucius Malfoy, Macnair, Avery, Nott, and the fathers of Crabbe and Goyle.","at":"gf33","v":1},
  {"t":"Three are missing from their places: one too cowardly to return, one Voldemort believes has left him forever, and one already at Hogwarts.","at":"gf33","v":1},
  {"t":"Ten of the most dangerous escape from Azkaban together.","at":"op25","v":1},
  {"t":"A dozen come to the Department of Mysteries. All but Bellatrix are captured.","at":"op35","v":1},
  {"t":"Behind a bridge collapse and a string of murders.","at":"hb1","v":1},
  {"t":"A group of them enters Hogwarts.","at":"hb27","v":1},
  {"t":"They control the Ministry.","at":"dh8","v":1},
  {"t":"Beaten.","at":"dh36","v":1}]},
 {"id":"dudleys_gang","kind":"group","name":"Dudley's gang","appear":"ss2","tag":[{"t":"Big, stupid, and led by Dudley","at":"ss2"}],"rel":["dudley","piers","harry"],"group":"org","sub":"Gang","holders":[{"id":"dudley","at":"ss2"},{"id":"piers","at":"ss2"},{"name":"Dennis","at":"ss3"},{"name":"Malcolm","at":"ss3"},{"name":"Gordon","at":"ss3"}],"facts":[
  {"t":"They chase Harry at school, which keeps anyone else from making friends with him.","at":"ss2","v":1},
